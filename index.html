// Catches a user who verified/signed in but never finished (or skipped, or had their
// browser closed during) the mobile-number step - without this there was no way to
// ever be re-prompted, since submitVerifyCode() only opens setupMobile once, inline,
// during the signup flow itself.
async function checkMobileProfile(){
  if(!sb || !state.authed) return;
  const { data, error } = await sb.from('user_profiles').select('user_id, phone').eq('user_id', state.customerId).maybeSingle();
  if(error){
    // A transient failure here must NOT be treated the same as "no profile row
    // exists" - that would force setupMobile open on an already-set-up user just
    // because of a flaky connection.
    console.error('checkMobileProfile failed:', error);
    return;
  }
  if(data) state.customerPhone = data.phone || '';
  if(!data && state.sheet!=='verifyEmail' && state.sheet!=='setupMobile'){ openSheet('setupMobile'); }
}

// Resumes a business/delivery signup intent, an item a guest tried to add to
// cart, or a Rent/Book/Checkout sheet a guest tried to open, once auth (and any
// forced setupMobile step) has finished — see enterRole() for the business/
// delivery routing. A pending cart item takes priority and just adds it
// (addToCart() itself now runs with state.authed already true, so it goes
// straight through, closes the sign-in sheet, and toasts); a pending item
// action re-opens the exact same sheet the guest was trying to reach (openRentItem/
// openBookRentalItem/goCheckout all re-check auth themselves and now pass) rather
// than silently dropping them back wherever they started.
function resolvePendingIntent(isFreshSignIn=false){
  const cartItemId = state.pendingCartItemId;
  state.pendingCartItemId = null;
  if(cartItemId && DB.items.some(i=>i.id===cartItemId)){ addToCart(cartItemId); return; }
  const favItemId = state.pendingFavItemId;
  state.pendingFavItemId = null;
  if(favItemId && DB.items.some(i=>i.id===favItemId)){ toggleFavourite(favItemId); return; }
  const itemAction = state.pendingItemAction;
  state.pendingItemAction = null;
  if(itemAction){
    if(itemAction.type==='rent' && DB.items.some(i=>i.id===itemAction.itemId)){ openRentItem(itemAction.itemId); return; }
    if(itemAction.type==='book' && DB.items.some(i=>i.id===itemAction.itemId)){ openBookRentalItem(itemAction.itemId); return; }
    if(itemAction.type==='checkout'){ goCheckout(); return; }
  }
  const intent = state.pendingIntent;
  state.pendingIntent = null;
  if(intent==='business' || intent==='delivery'){ enterRole(intent); return; }
  // A freshly-signed-in user (an actual sign-in just happened - see
  // handlePostAuth() - not merely an already-open session being restored on
  // page load) who's registered a business lands straight on its dashboard
  // instead of the customer view every time they log in, since running their
  // store is presumably why they're here - see goToOwnedBusiness(). Scoped to
  // isFreshSignIn so reloading the app while already signed in never yanks
  // someone back to their business mid-session after they deliberately chose
  // "Back to shopping".
  if(isFreshSignIn && state.role==='customer' && goToOwnedBusiness()) return;
  render();
}

function setFont(px){

// Normally sits just above the bottom nav (see .toast-wrap's CSS bottom), but the
// cart screen's fixed Total/Checkout bar (.cart-checkout-bar) sits in that exact
// spot with a higher z-index - without this, a toast fired while on the cart
// screen would render hidden behind that bar instead of being seen. When it's on
// screen, this measures its actual top edge and floats the toast just above it.
function toast(msg, kind='good'){
  const el = document.getElementById('toast');
  const wrap = document.getElementById('toastWrap');
  el.textContent = (kind==='good'?'✓ ':'⚠ ') + msg;
  el.className = 'toast show ' + kind;
  const checkoutBar = document.querySelector('.cart-checkout-bar');
  if(wrap){
    if(checkoutBar){
      const rect = checkoutBar.getBoundingClientRect();
      wrap.style.bottom = Math.round(window.innerHeight - rect.top + 10) + 'px';
    } else {
      wrap.style.bottom = '';
    }
  }
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=> el.classList.remove('show'), 2400);
}

// Screens visited so far in the current role - lets a swipe-right ("back")
// gesture step back through them (see goBack()/handleSwipeEnd() below).
// Cleared on every role change (switchRole()/enterRole()) and on sign-out, so
// "back" never crosses into a different role's screens or a signed-out
// state - there's simply nothing further back than an empty stack, which is
// exactly what keeps it from ever reaching past Home into a log-out.
let _screenHistory = [];
function go(screen, extra={}){
  if(state.screen && state.screen !== screen){
    _screenHistory.push({ role:state.role, screen:state.screen, activeBizId:state.activeBizId, activeDelId:state.activeDelId, browseBizId:state.browseBizId, storeTab:state.storeTab, homeListingType:state.homeListingType, homeCategory:state.homeCategory, homeSearch:state.homeSearch });
  }
  Object.assign(state, extra);
  state.screen = screen;
  state.drawerOpen = false;
  state.notifOpen = false;
  render();
  window.scrollTo(0,0);
}
// Swipe-right-to-go-back: closes whatever's on top first (an open sheet, then
// the notification dropdown), and only once nothing's open does it step back
// to the previous screen. With an empty history (e.g. already at Home) it
// simply does nothing, rather than continuing on to sign anyone out.
function goBack(){
  if(state.sheet){ closeSheet(); return; }
  if(state.notifOpen){ state.notifOpen = false; render(); return; }
  if(state.drawerOpen){ toggleDrawer(false); return; }
  if(_screenHistory.length){
    const prev = _screenHistory.pop();
    Object.assign(state, prev);
    render();
    window.scrollTo(0,0);
  }
}

/* =================== RENDER ROOT =================== */
function render(){
  saveNavState();
  const app = document.getElementById('app');
  if(!storageReady){ app.innerHTML = `<div class="empty" style="padding-top:40vh;">Loading Maldexpress…</div>`; return; }
  if(state.adminMode) renderAdmin();
  else if(state.role==='business') renderBusiness();
  else if(state.role==='delivery') renderDelivery();
  else if(state.role==='customer') renderCustomer();
  // Custom confirm popup for confirmSwitchRole() below - native window.confirm()
  // doesn't fire inside this sandboxed preview, so a real overlay stands in for
  // it. Appended here (rather than baked into each render*() above) since "Back
  // to shopping" is reachable from several different screens/sheets at once.
  if(_confirmSwitchOpen) app.insertAdjacentHTML('beforeend', confirmSwitchOverlayHTML());
  // Same reasoning, same pattern - see planCompareOverlayHTML() for why this
  // is an overlay rather than a sheet.
  if(_planCompareOpen) app.insertAdjacentHTML('beforeend', planCompareOverlayHTML());
}

async function adminResolveCategoryRequest(reqId, approve){
  const req = DB.categoryRequests.find(r=>r.id===reqId);
  if(!req) return;
  const status = approve ? 'approved' : 'dismissed';
  const nowIso = new Date().toISOString();
  const { error } = await sb.from('category_requests').update({ status, resolved_at: nowIso, resolved_by: state.customerId }).eq('id', reqId);
  if(error){ toast('Failed: '+error.message,'bad'); return; }
  req.status = status; req.resolvedAt = Date.now(); req.resolvedBy = state.customerId;
  if(approve){
    const { error: ccErr } = await sb.from('custom_categories').insert({ name: req.categoryName });
    if(ccErr){ toast('Marked approved but failed to add the category: '+ccErr.message,'bad'); return; }
    if(!DB.customCategories.includes(req.categoryName)) DB.customCategories.push(req.categoryName);
    mergeCustomCategories();
    await graduateApprovedCategory(req);
  }
  toast(approve ? `"${req.categoryName}" added as a category` : 'Dismissed');
  render();
}
// Once a suggested name is approved, the store that asked for it - and
// everything on their profile that was filed under the placeholder "Other"
// while the request was pending - graduates to the real category name, so
// buyers see it under its proper name from here on instead of the generic
// "Other" bucket. Scoped to just that one business, so an unrelated store
// that separately picked the plain "Other" bucket (with no matching name of
// their own) is left alone.
async function graduateApprovedCategory(req){
  const biz = DB.businesses.find(b=>b.id===req.businessId);
  if(!biz) return;
  const bizCats = String(biz.category||'').split(',').map(s=>s.trim()).filter(Boolean);
  const idx = bizCats.indexOf('Other');
  if(idx!==-1 && String(biz.categoryOtherName||'').toLowerCase()===req.categoryName.toLowerCase()){
    if(!bizCats.includes(req.categoryName)) bizCats[idx] = req.categoryName; else bizCats.splice(idx,1);
    biz.category = bizCats.join(', ');
    biz.categoryOtherName = '';
    await sb.from('businesses').update({ category: biz.category, category_other_name: null }).eq('id', biz.id);
  }
  const affectedItems = DB.items.filter(i=>i.businessId===biz.id && i.category==='Other' && String(i.categoryOtherName||'').toLowerCase()===req.categoryName.toLowerCase());
  for(const it of affectedItems){
    it.category = req.categoryName;
    await sb.from('items').update({ category: it.category }).eq('id', it.id);
  }
}

async function adminResolveRequest(reqId, approve){
  const req = DB.proRequests.find(r=>r.id===reqId);
  if(!req) return;
  const status = approve ? 'approved' : 'rejected';
  const nowIso = new Date().toISOString();
  const { error } = await sb.from('pro_upgrade_requests').update({ status, resolved_at: nowIso, resolved_by: state.customerId }).eq('id', reqId);
  if(error){ toast('Failed: '+error.message,'bad'); return; }
  req.status = status; req.resolvedAt = Date.now(); req.resolvedBy = state.customerId;
  if(approve){
    const { error: bizErr } = await sb.from('businesses').update({ tier:'pro', paid_at: nowIso }).eq('id', req.businessId);

    const biz = DB.businesses.find(b=>b.id===req.businessId);

// stores/profiles still picks one, same as tapping "List your business" from

/* =================== SHEETS (bottom popups) =================== */
// _sheetGen guards closeSheet()'s delayed clear below - lots of buttons do
// "closeSheet(); openXxx(...)" back to back (close this sheet, immediately open
// a different one) rather than waiting on the close animation, so without this
// guard the *first* call's 180ms timeout would still fire later and null out
// state.sheet unconditionally, yanking away whatever sheet got opened in the
// meantime a moment after it appeared. Every open/close bumps the generation;
// a pending close only actually clears the sheet if nothing newer has happened.
let _sheetGen = 0;
function openSheet(name, data=null){ _sheetGen++; state.sheet = name; state.sheetData = data; state.sheetClosing = false; render(); const el=document.getElementById('sheetWrap'); if(el) requestAnimationFrame(()=>el.classList.add('show')); }
function closeSheet(){ if(state.sheet==='verifyEmail' || state.sheet==='setupMobile') return; const myGen = ++_sheetGen; const el=document.getElementById('sheetWrap'); if(el){ el.classList.remove('show'); state.sheetClosing = true; setTimeout(()=>{ if(_sheetGen!==myGen) return; state.sheet=null; state.sheetData=null; state.sheetClosing=false; render(); },180);} else { state.sheet=null; render(); } }

function sheetHTML(){
  if(!state.sheet) return '';
  let body = '';
  if(state.sheet==='bizSignup') body = sheetBizSignup();
  else if(state.sheet==='delSignup') body = sheetDelSignup();
  else if(state.sheet==='bizSettings') body = sheetBizSettings();
  else if(state.sheet==='bizBulkImport') body = sheetBizBulkImport();
  else if(state.sheet==='bizUploadPhotos') body = sheetBizUploadPhotos();
  else if(state.sheet==='delSettings') body = sheetDelSettings();
  else if(state.sheet==='custSettings') body = sheetCustSettings();
  else if(state.sheet==='addItem') body = sheetAddItem();

// If "Other" was marked on the category checklist and a name was typed in,
// sends that as a suggestion for the super admin to review (see
// adminCategoryRequestsTab()) - and, if approved, it becomes a normal,
// pickable category everywhere (see mergeCustomCategories()). Does nothing
// if "Other" wasn't marked, nothing was typed, or this business already has
// a pending request on file for that same name.
async function maybeSubmitCategoryRequest(idPrefix, biz){
  const cats = getCatChecklistValue(idPrefix).split(',').map(s=>s.trim());
  const otherName = getCatOtherName(idPrefix);
  if(!cats.includes('Other') || !otherName) return;
  await submitCategoryRequest(biz, otherName);
}
// Shared by the business-level "Other" checklist (see maybeSubmitCategoryRequest()
// above) and the per-item "Other" category field on Add/Edit item - either way
// it's the same suggestion queued for the super admin to review
// (adminCategoryRequestsTab()), deduped per business+name so re-saving a form
// that still has the same pending name on it doesn't pile up duplicates.
async function submitCategoryRequest(biz, otherName){
  if(!biz || !otherName) return;
  const already = DB.categoryRequests.some(r=>r.businessId===biz.id && r.status==='pending' && r.categoryName.toLowerCase()===otherName.toLowerCase());
  if(already) return;
  const req = { id:uid('catreq'), businessId:biz.id, businessName:biz.name, categoryName:otherName, status:'pending', createdAt:Date.now(), resolvedAt:null, resolvedBy:null };
  const { error } = await sb.from('category_requests').insert(toDbRow('categoryRequests', req));
  if(error){ console.error('category request failed:', error); return; }
  DB.categoryRequests.unshift(req);
}
// Renders a business's category as a "markable list" - checkbox pills instead
// of a single-select dropdown, since a store can genuinely fit more than one
// category (Bakery + Café, say). selectedCats can be a comma-joined string
// (how it's stored on the business) or already-split; either works.
// The one checkmark glyph used everywhere something gets checked in the app
// - the category-checklist circles below and every plain .chk-row checkbox
// (see the CSS comment above .chk-row) - so a mark looks the same wherever
// it shows up.
function checkmarkSvg(){
  return `<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 4.8" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
// A plain single checkbox styled as the same thin-line circle used
// throughout the app (see .chk-row) instead of the browser's native box -
// `extra` lets a caller add an onchange handler or similar without this
// needing to know about every use case.
function chkRowHTML(id, checked, labelHtml, extra=''){
  return `<label class="chk-row" for="${id}">
    <input type="checkbox" id="${id}" ${checked?'checked':''} ${extra}>
    <span class="chk-circle">${checkmarkSvg()}</span>
    <span>${labelHtml}</span>
  </label>`;
}
function catChecklistHTML(idPrefix, selectedCats){
  const sel = new Set(String(selectedCats||'').split(',').map(s=>s.trim()).filter(Boolean));
  const otherChecked = sel.has('Other');
  return `<div class="cat-check-list" id="${idPrefix}_wrap">
    ${MARKETPLACE_CATEGORIES.map(c=>{
      const cid = `${idPrefix}_${c.replace(/[^A-Za-z0-9]/g,'')}`;
      const checkedNow = sel.has(c);
      return `<label class="cat-check-item${checkedNow?' checked':''}" for="${cid}">
        <input type="checkbox" id="${cid}" value="${c}" ${checkedNow?'checked':''} onchange="toggleCatCheck(this)">
        <span class="cat-check-circle">${checkmarkSvg()}</span>
        <span>${categoryIcon(c)} ${c}</span>
      </label>`;
    }).join('')}
  </div>
  <div class="field" id="${idPrefix}_otherWrap" style="margin-top:8px;${otherChecked?'':' display:none;'}">
    <label>What kind of business is it?</label>
    <input id="${idPrefix}_otherName" placeholder="e.g. Boat charters" maxlength="40">
    <p class="muted" style="font-size:.78em; margin-top:5px;">We'll pass this along to the Maldexpress team to consider adding as a real category.</p>
  </div>`;
}
function toggleCatCheck(el){
  const item = el.closest('.cat-check-item');
  if(item) item.classList.toggle('checked', el.checked);
  // "Other" reveals a free-text field right below the list for what kind of
  // business it actually is - captured at save time and sent to the super
  // admin as a category request (see submitBizSignup()/saveBizSettings() and
  // adminCategoryRequestsTab()) for them to consider adding as a real,
  // pickable category.
  if(el.value === 'Other'){
    const wrap = el.closest('.cat-check-list');
    const idPrefix = wrap ? wrap.id.replace(/_wrap$/,'') : null;
    const otherWrap = idPrefix ? document.getElementById(idPrefix+'_otherWrap') : null;
    if(otherWrap) otherWrap.style.display = el.checked ? '' : 'none';
  }
}
function getCatChecklistValue(idPrefix){
  const wrap = document.getElementById(idPrefix+'_wrap');
  if(!wrap) return '';
  return [...wrap.querySelectorAll('input:checked')].map(i=>i.value).join(', ');
}
// The free-text name typed in when "Other" is marked (see catChecklistHTML()) -
// empty string if "Other" isn't marked or nothing was typed.

async function startProPayment(method){
  const biz = currentBiz();
  if(method==='bank_transfer'){ openSheet('upgradeBankSlip'); return; }
  toast('Creating your Swipe payment link…');
  try{
    const { data, error } = await sb.functions.invoke('create-swipe-payment', { body: { businessId: biz.id, amount: 500 } });
    if(error || !data || !data.paymentLink){
      // The edge function returns a JSON { error } body on failure - log it so
      // misconfiguration (e.g. a missing secret) is diagnosable from the
      // browser console instead of only showing this generic toast.
      let detail = error?.message || data?.error;
      if(error?.context?.json){ try{ detail = (await error.context.json()).error || detail; }catch(_){} }
      console.error('create-swipe-payment failed:', detail || error || data);
      toast("Swipe payment isn't set up yet — try bank transfer for now",'bad');
      return;
    }
    // The edge function already recorded the pro_upgrade_requests row and
    // registered the reference with SeaFare before returning this link —
    // both must succeed there before a link is ever payable, so there's
    // nothing left to track client-side.
    window.open(data.paymentLink, '_blank');
    closeSheet();
    toast('Complete payment in the new tab — Pro activates automatically once confirmed');
    await loadDB(); render();
  }catch(e){ toast("Swipe payment isn't set up yet — try bank transfer for now",'bad'); }
}

function orderCardBiz(o){

  return `

}
function paymentStatusPill(o){
  if(o.paymentStatus==='awaiting_completion') return `<span class="status-pill wait">Needs completion</span>`;
  if(o.paymentStatus==='paid'||o.paymentStatus==='settled') return `<span class="status-pill ok">Paid ✓</span>`;
  if(o.paymentStatus==='slip_uploaded') return `<span class="status-pill mid">Slip uploaded</span>`;
  if(o.paymentStatus==='cash_collected') return `<span class="status-pill mid">Cash with rider</span>`;
  return `<span class="status-pill wait">Awaiting payment</span>`;
}

const IMAGE_ALLOWED_TYPES = ['image/jpeg','image/png','image/webp','image/gif'];
const IMAGE_MAX_BYTES = 5*1024*1024;
let _itemPhotoFile = null;
function previewItemPhoto(e, previewId='itemPhotoPreview'){
  const f = e.target.files[0]; if(!f) return;
  if(!IMAGE_ALLOWED_TYPES.includes(f.type)){ toast('Please choose a JPEG, PNG, WEBP, or GIF image','bad'); e.target.value=''; return; }
  if(f.size > IMAGE_MAX_BYTES){ toast('Image must be under 5MB','bad'); e.target.value=''; return; }
  _itemPhotoFile = f;
  const reader = new FileReader();
  reader.onload = ()=>{ const img=document.getElementById(previewId); if(img){ img.src=reader.result; img.style.display='block'; } };
  reader.readAsDataURL(f);
}
// Uploaded under a path prefixed with the uploader's own auth.uid() - the
// storage RLS policies check against that same prefix, so no join to
// businesses is needed there. Returns null (photo skipped) rather than
// throwing when there's no backend or no file was chosen.
async function uploadItemPhoto(){
  if(!_itemPhotoFile || !sb) return null;
  const file = _itemPhotoFile;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${state.customerId}/${uid('img')}.${ext}`;
  const { error } = await sb.storage.from('product-images').upload(path, file, { cacheControl:'3600', upsert:false, contentType:file.type });
  if(error){ toast('Photo upload failed: '+error.message, 'bad'); return null; }
  const { data } = sb.storage.from('product-images').getPublicUrl(path);
  return data.publicUrl;
}

// Category dropdown for Add/Edit item. Picking "Other" reveals a text field
// for what it actually is (same "Other" name-capture idea as the business

// The daily-rate rental flow calls this a "Refundable deposit" and a "Pickup
// location" for most goods, but Home & Living rentals (furniture, appliances,
// property) are often really an advance payment rather than something fully
// refundable, and "location" fits better than "pickup location" when the
// item may just be describing where it is rather than somewhere to collect
// it from - so both labels adapt to whatever category is picked. Reads the
// category select directly (rather than being passed a value) since it's
// wired as that select's own onchange handler - see itemCatFieldHTML() -
// which is why the category field is placed above these fields in both Add
// and Edit item.
function updateRentalFieldLabels(idPrefix){
  const catSel = document.getElementById(idPrefix+'_cat');
  if(!catSel) return;
  const isHomeLiving = catSel.value === 'Home & Living';
  const depositLabel = document.getElementById(idPrefix+'_rent_deposit_label');
  if(depositLabel) depositLabel.textContent = isHomeLiving ? 'Deposit / advance payment (MVR, optional)' : 'Refundable deposit (MVR, optional)';
  const pickupLabel = document.getElementById(idPrefix+'_rent_pickup_location_label');
  if(pickupLabel) pickupLabel.textContent = isHomeLiving ? 'Location' : 'Pickup location';
  // The Daily/Monthly rate toggle only makes sense for Home & Living - hide
  // it (and fall back to a daily rate) the moment a different category is
  // picked, so switching away never leaves a "monthly" rate stranded on an
  // item type that's never shown that way anywhere.
  const periodTabs = document.getElementById(idPrefix+'_rentPeriodTabs');
  if(periodTabs){
    periodTabs.style.display = isHomeLiving ? '' : 'none';
    if(!isHomeLiving) setRentRatePeriod(idPrefix, 'day');
  }
}
// Lets a Home & Living rental's rate be typed as a monthly figure instead of
// a daily one (a monthly rent makes far more sense for furniture, appliances,
// or a place to stay than a nightly rate) - see effectiveDailyRate()/
// rentalRateSuffix() for how that figure is then shown to buyers and
// converted for the day-based checkout/booking math underneath.
function setRentRatePeriod(idPrefix, period){
  const periodInput = document.getElementById(idPrefix+'_rent_rate_period');
  if(periodInput) periodInput.value = period;
  const dayTab = document.getElementById(idPrefix+'_rentPeriodTabDay');
  const monthTab = document.getElementById(idPrefix+'_rentPeriodTabMonth');
  if(dayTab) dayTab.classList.toggle('active', period==='day');
  if(monthTab) monthTab.classList.toggle('active', period==='month');
  const label = document.getElementById(idPrefix+'_rent_rate_label');
  if(label) label.textContent = period==='month' ? 'Monthly rate (MVR)' : 'Daily rate (MVR)';
}

async function submitAddItem(){
  const biz = currentBiz(); const t = tierInfo(biz);
  const myCount = DB.items.filter(i=>i.businessId===biz.id).length;
  if(myCount>=t.limit){ toast(`Item limit reached (${t.limit})`,'bad'); return; }
  const name=val('i_name'), cat=val('i_cat')||'General';
  const catOtherName = cat==='Other' ? (val('i_cat_other')||'') : '';
  if(!name){ toast('Enter an item name','bad'); return; }
  const listingType = val('i_listing_type') || 'buy_now';
  let price, stock, startingPrice, bidIncrement, days, discountPercent=0, rentalDeposit=0, rentalRatePeriod='day', rentalFulfillment='pickup', pickupLocation='', rentalAvailability='now', availableFrom='';
  if(listingType==='auction'){
    startingPrice = Number(val('i_start_price'));
    bidIncrement = Number(val('i_bid_increment'));
    days = Number(val('i_duration'));
    if(!startingPrice || startingPrice<=0){ toast('Enter a starting price','bad'); return; }
    if(!bidIncrement || bidIncrement<=0){ toast('Enter a bid increment','bad'); return; }
    if(!days || days<1 || days>5){ toast('Choose a duration up to 5 days','bad'); return; }
    price = startingPrice; stock = 1;
  } else if(listingType==='rental'){
    price = Number(val('i_rent_rate')); stock = Number(val('i_rent_stock')||0);
    rentalDeposit = Number(val('i_rent_deposit')||0);
    rentalRatePeriod = (cat==='Home & Living' && val('i_rent_rate_period')==='month') ? 'month' : 'day';
    if(!price || price<=0){ toast(rentalRatePeriod==='month'?'Enter a monthly rental rate':'Enter a daily rental rate','bad'); return; }
    if(!stock || stock<=0){ toast('Enter units available to rent','bad'); return; }
    // Pickup is the only fulfillment mode offered at creation time now (the
    // pickup/deliver choice was removed from this form) - a seller who wants
    // to deliver instead can still switch it in Edit item afterwards.
    rentalFulfillment = 'pickup';
    pickupLocation = val('i_rent_pickup_location');
    if(!pickupLocation){ toast('Enter a pickup location','bad'); return; }
    rentalAvailability = val('i_rent_availability') || 'now';
    if(rentalAvailability==='soon'){
      availableFrom = val('i_available_from');
      if(!availableFrom){ toast('Enter the date this item will be available from','bad'); return; }
    }
  } else {
    price = Number(val('i_price')); stock = Number(val('i_stock')||0);
    discountPercent = Math.min(90, Math.max(0, Number(val('i_discount')||0)));
    if(!price){ toast('Enter item name and price','bad'); return; }
  }
  const freeDelivery = document.getElementById('i_free_delivery').checked;
  const extraDeliveryFee = Math.max(0, Number(val('i_extra_fee')||0));
  const description = val('i_desc');
  toast('Saving item…');
  const imageUrl = await uploadItemPhoto();
  const item = {id:uid('it'), businessId:biz.id, name, price, stock, category:cat, categoryOtherName:catOtherName, imageUrl, listingType, freeDelivery, extraDeliveryFee, discountPercent, rentalDeposit, rentalRatePeriod, rentalFulfillment, pickupLocation, rentalAvailability, availableFrom, description};
  DB.items.push(item);
  saveDB('items', [item]);
  if(catOtherName) await submitCategoryRequest(biz, catOtherName);
  if(listingType==='auction'){
    const now = Date.now();
    const auction = { id: uid('auc'), itemId:item.id, businessId:biz.id, startingPrice, bidIncrement, startTime:now, endTime: now + days*86400000, currentHighestBid:null, currentHighestBidder:null, status:'active', orderId:null };
    DB.auctions.push(auction);
    if(sb){
      const { error } = await sb.from('auction_listings').insert(toDbRow('auctions', auction));
      if(error){ toast('Item saved but auction setup failed: '+error.message,'bad'); }
    }
  }
  _itemPhotoFile = null;
  closeSheet(); toast(listingType==='auction' ? 'Auction listed!' : 'Item added'); render();
}

async function submitEditItem(itemId){
  const item = DB.items.find(i=>i.id===itemId);
  if(!item) return;
  const name = val('e_name');
  if(!name){ toast('Enter an item name','bad'); return; }
  item.name = name;
  item.category = val('e_cat') || 'General';
  item.categoryOtherName = item.category==='Other' ? (val('e_cat_other')||'') : '';
  if(item.categoryOtherName) await submitCategoryRequest(currentBiz(), item.categoryOtherName);
  item.description = val('e_desc');
  if(item.listingType==='rental'){
    const price = Number(val('e_rent_rate')), stock = Number(val('e_rent_stock')||0);
    if(!price){ toast('Enter a daily rate','bad'); return; }
    const rentalFulfillment = val('e_rent_fulfillment') || 'deliver';
    let pickupLocation = item.pickupLocation || '';
    if(rentalFulfillment==='pickup'){
      pickupLocation = val('e_rent_pickup_location');
      if(!pickupLocation){ toast('Enter a pickup location','bad'); return; }
    }
    const rentalAvailability = val('e_rent_availability') || 'now';
    let availableFrom = item.availableFrom || '';
    if(rentalAvailability==='soon'){
      availableFrom = val('e_available_from');
      if(!availableFrom){ toast('Enter the date this item will be available from','bad'); return; }
    }
    item.price = price; item.stock = stock; item.rentalDeposit = Number(val('e_rent_deposit')||0);
    item.rentalRatePeriod = (item.category==='Home & Living' && val('e_rent_rate_period')==='month') ? 'month' : 'day';
    item.rentalFulfillment = rentalFulfillment; item.pickupLocation = pickupLocation;
    item.rentalAvailability = rentalAvailability; item.availableFrom = availableFrom;
  } else if(item.listingType!=='auction'){
    const price = Number(val('e_price')), stock = Number(val('e_stock')||0);
    if(!price){ toast('Enter a price','bad'); return; }
    item.price = price; item.stock = stock;
    item.discountPercent = Math.min(90, Math.max(0, Number(val('e_discount')||0)));
  }
  const freeDeliveryEl = document.getElementById('e_free_delivery');
  if(freeDeliveryEl) item.freeDelivery = freeDeliveryEl.checked;
  item.extraDeliveryFee = Math.max(0, Number(val('e_extra_fee')||0));
  if(_itemPhotoFile){
    toast('Saving…');
    const url = await uploadItemPhoto();
    if(url) item.imageUrl = url;
  }
  saveDB('items', [item]);
  _itemPhotoFile = null;
  closeSheet(); toast('Item updated'); render();
}

    : `<span class="status-pill ok">Booked ✓</span>`;

    ${bk.note?`<p class="muted" style="font-size:.82em; margin-bottom:8px;">"${bk.note}"</p>`:''}
    ${bk.status==='accepted' && bk.bookingCharge!=null ? `<div class="row between" style="margin-bottom:8px;"><span class="muted">Booking charge</span><strong>${money(bk.bookingCharge)}</strong></div>` : ''}

        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="declineBooking('${bk.id}')">Decline</button>
      </div>` : ''}
    ${bk.status==='accepted' && bk.bookingCharge!=null && bk.chargeStatus!=='collected' ? `<button class="btn btn-good btn-sm" style="width:100%;" onclick="markBookingChargeCollected('${bk.id}')">Mark charge collected</button>` : ''}
  </div>`;

function sheetAcceptBooking(){
  const bk = DB.bookings.find(x=>x.id===state.sheetData);

  return `

  <div class="field"><label>Booking charge (MVR, optional)</label><input type="number" min="0" id="booking_charge_amt" placeholder="0.00"></div>
  <p class="muted" style="font-size:.78em; margin-bottom:10px;">An amount to hold the booking - collect it from the customer yourself (cash or your own transfer), then mark it collected from this booking's card.</p>

async function acceptBooking(id){
  const bk = DB.bookings.find(x=>x.id===id);
  if(bk && bookingOverlapsExisting(bk.itemId, bk.requestedDate, bk.days, bk.id)){
    toast("Can't accept — those dates overlap a booking you've already accepted for this item", 'bad');
    return;
  }
  const charge = Number(val('booking_charge_amt')||0);
  const patch = { status:'accepted', booking_charge: charge>0?charge:null, charge_status: charge>0?'pending':null, decided_at:new Date().toISOString() };
  const { data, error } = await sb.from('rental_bookings').update(patch).eq('id', id).select();
  if(error){ toast('Could not accept booking: '+error.message, 'bad'); return; }
  if(!data || !data.length){ toast("Couldn't update this booking — it may have changed", 'bad'); return; }
  const updated = fromDbRow('bookings', data[0]);
  const idx = DB.bookings.findIndex(bk=>bk.id===id);
  if(idx>=0) DB.bookings[idx] = updated; else DB.bookings.unshift(updated);
  closeSheet(); toast('Booking accepted'); render();
}
async function declineBooking(id){
  const patch = { status:'declined', decided_at:new Date().toISOString() };
  const { data, error } = await sb.from('rental_bookings').update(patch).eq('id', id).select();
  if(error){ toast('Could not decline booking: '+error.message, 'bad'); return; }
  if(!data || !data.length){ toast("Couldn't update this booking — it may have changed", 'bad'); return; }
  const updated = fromDbRow('bookings', data[0]);
  const idx = DB.bookings.findIndex(bk=>bk.id===id);
  if(idx>=0) DB.bookings[idx] = updated; else DB.bookings.unshift(updated);
  toast('Booking declined'); render();
}

function orderDetailBizBody(o){
  const itemsList = o.items.map(it=>`<div class="row between" style="margin-bottom:6px;"><span class="muted">${it.qty}× ${it.name}</span><span>${money(it.price*it.qty)}</span></div>`).join('');
  const payoutAmt = Math.round(o.deliveryPartnerPayout!=null ? o.deliveryPartnerPayout : o.deliveryFee);
  const buyerPaidFee = o.deliveryType!=='free';
  const cashCut = cashCutAmount(o);
  let actionArea = '';
  if(o.paymentStatus==='awaiting_completion'){
    actionArea = `<div class="card tight" style="background:rgba(255,207,92,.1);"><p style="font-size:.85em;">This order was won at auction and is waiting for the customer to choose delivery and payment details.</p></div>`;
  } else if(o.paymentMethod==='transfer'){
    if(o.paymentStatus==='pending_transfer'){
      actionArea = `<div class="card tight" style="background:rgba(255,207,92,.1);"><p style="font-size:.85em;">Waiting for customer to transfer & upload slip.</p></div>`;
    } else if(o.paymentStatus==='slip_uploaded'){
      actionArea = `
        <div class="card tight" style="background:rgba(34,184,200,.12);">
          <p style="font-size:.85em; margin-bottom:8px;">Customer uploaded a transfer slip:</p>
          ${o.slipDataUrl ? `<img src="${o.slipDataUrl}" style="width:100%; border-radius:12px; max-height:220px; object-fit:cover;">` : `<p class="muted" style="font-size:.8em;">(slip image not available)</p>`}
        </div>
        <button class="btn btn-good" style="margin-top:12px;" onclick="approveOrderPayment('${o.id}')">Mark payment received ✓</button>`;
    } else {
      actionArea = `<div class="status-pill ok" style="display:inline-block;">Payment received</div>`;
    }
  } else if(o.paymentMethod==='cash_on_pickup'){
    // A rental paid in cash goes straight to the renter (you) - no rider ever
    // touches it, so this reuses the same approve_order_payment RPC the
    // transfer flow uses instead of the rider cash-collection dance below.
    if(o.paymentStatus==='paid'){
      actionArea = `<div class="status-pill ok" style="display:inline-block;">Payment received</div>`;
    } else {
      actionArea = `<div class="card tight" style="background:rgba(255,207,92,.1);"><p style="font-size:.85em;">Waiting for the customer to pay ${money(o.total)} cash on ${o.rentalFulfillment==='pickup'?'pickup':'delivery'}.</p></div>
        <button class="btn btn-good" style="margin-top:12px;" onclick="approveOrderPayment('${o.id}')">Mark payment received ✓</button>`;
    }
  } else {
    if(o.paymentStatus==='pending_cash'){
      actionArea = `<div class="card tight" style="background:rgba(255,207,92,.1);"><p style="font-size:.85em;">Delivery partner will collect ${money(o.total)} cash from the customer.</p></div>`;
    } else if(o.paymentStatus==='cash_collected'){
      actionArea = cashCut>0
        ? `<div class="card tight" style="background:rgba(34,184,200,.12);"><p style="font-size:.85em;">Rider collected cash. They owe you ${money(o.total-cashCut)} (after their ${money(cashCut)} cut). See Payouts tab once they settle.</p></div>`
        : `<div class="card tight" style="background:rgba(34,184,200,.12);"><p style="font-size:.85em;">Rider collected cash and owes you the full ${money(o.total)} — the delivery fee wasn't charged to the customer, so you pay the rider's ${money(payoutAmt)} separately. See Payouts tab once they settle.</p></div>`;
    } else {
      actionArea = `<div class="status-pill ok" style="display:inline-block;">Settled with rider</div>`;
    }
  }
  // The rider's payout is tracked independently of the buyer's own payment status
  // (payout_status only starts once markDelivered() sets it, or immediately on
  // claim for an "upfront" rental delivery job) - shown as its own note regardless
  // of payment method, so it's never hidden just because a slip hasn't been
  // approved yet, or because this happens to be a cash order. This is a separate
  // pocket the rental's own payment (above) never touches - the customer's rental
  // payment always goes to you in full either way.
  if(o.payoutStatus==='pending'){
    actionArea += `<div class="card tight" style="background:rgba(255,207,92,.1); margin-top:10px;"><p style="font-size:.85em;">You owe ${o.deliveryPersonName||'the delivery partner'} ${money(payoutAmt)} for this delivery. See Payouts tab to mark it paid.</p></div>`;
  } else if(o.payoutStatus==='settled'){
    actionArea += `<div class="status-pill ok" style="display:inline-block; margin-top:10px;">Rider paid ✓</div>`;
  }
  // Rentals have no delivery partner by default - you deliver it yourself. A
  // "deliver"-fulfillment rental can still be handed off to a delivery partner
  // afterwards for a fee you set (see offerRentalDelivery()): once posted, this
  // just shows status until someone claims it or it's delivered; a pickup-mode
  // rental never gets this option at all, since nothing needs delivering.
  if(o.rentalItemId){
    if(o.deliveryPersonId){
      actionArea += o.status!=='delivered'
        ? `<div class="card tight" style="background:rgba(34,184,200,.12); margin-top:10px;"><p style="font-size:.85em;">${o.deliveryPersonName} is delivering this, for ${money(payoutAmt)} ${o.rentalPayoutTiming==='upfront'?'(already paid upfront)':'(due once they mark it delivered)'}.</p></div>`
        : `<div class="status-pill ok" style="display:inline-block; margin-top:10px;">Delivered by ${o.deliveryPersonName} ✓</div>`;
    } else if(o.needsDeliveryPartner){
      actionArea += `<div class="card tight" style="background:rgba(255,207,92,.1); margin-top:10px;"><p style="font-size:.85em;">Waiting for a delivery partner to accept — offering ${money(payoutAmt)}, paid ${o.rentalPayoutTiming==='upfront'?'upfront on acceptance':'after delivery'}.</p></div>`;
    } else if(o.status!=='delivered'){
      actionArea += `<button class="btn btn-outline" style="width:100%; margin-top:10px;" onclick="markRentalFulfilled('${o.id}')">${o.rentalFulfillment==='pickup'?'Mark as picked up':'Mark as delivered'}</button>`;
      if(o.rentalFulfillment==='deliver'){
        actionArea += `
        <div class="glass card tight" style="margin-top:10px;">
          <p class="muted" style="font-size:.82em; margin-bottom:8px;">Rather have a delivery partner drop this off instead of doing it yourself?</p>
          <div class="field" style="margin-bottom:8px;"><label>Delivery fee you're offering (MVR)</label><input type="number" min="0" id="rdel_fee_${o.id}" placeholder="0.00"></div>
          <div class="field" style="margin-bottom:0;">
            <label>When do you pay the rider?</label>
            <div class="tabs">
              <button type="button" class="tab" id="rdel_timingTabUpfront_${o.id}" style="flex:1; text-align:center;" onclick="setRentalDeliveryTiming('${o.id}','upfront')">Upfront</button>
              <button type="button" class="tab active" id="rdel_timingTabAfter_${o.id}" style="flex:1; text-align:center;" onclick="setRentalDeliveryTiming('${o.id}','after')">After delivery</button>
            </div>
          </div>
          <input type="hidden" id="rdel_timing_${o.id}" value="after">
          <button class="btn btn-primary btn-sm" style="width:100%; margin-top:10px;" onclick="offerRentalDelivery('${o.id}')">Send to delivery partners</button>
        </div>`;
      }
    } else {
      actionArea += `<div class="status-pill ok" style="display:inline-block; margin-top:10px;">${o.rentalFulfillment==='pickup'?'Picked up ✓':'Delivered ✓'}</div>`;
    }
  }
  const deliveryLine = o.rentalItemId ? '' : `<div class="row between" style="margin-top:6px;"><span class="muted">Delivery fee (${ZONES[o.zone]?ZONES[o.zone].label:'—'}) → ${o.deliveryPersonName||'—'}${buyerPaidFee?'':' · covered by you, not charged to buyer'}</span><span>${money(payoutAmt)}</span></div>`;
  return `
    <h2>Order #${o.id.slice(-5).toUpperCase()}</h2>
    <p class="muted" style="margin-bottom:12px;">${o.receiverName && o.receiverName!==o.customerName ? `${o.customerName} → ${o.receiverName}` : o.customerName} · ${new Date(o.createdAt).toLocaleString()}</p>
    ${o.deliveryTargetType==='pickup' ? `
    <div class="glass card tight" style="margin-bottom:12px;">
      <p class="muted" style="font-size:.78em; margin-bottom:4px;">📦 Pickup from</p>
      <p style="font-weight:700;">${o.pickupLocation||'—'}</p>
    </div>` : o.receiverName ? `
    <div class="glass card tight" style="margin-bottom:12px;">
      <p class="muted" style="font-size:.78em; margin-bottom:4px;">${o.deliveryTargetType==='boat'?'🚤 Boat delivery':'📍 Receiver'}</p>
      <p style="font-weight:700;">${o.receiverName}</p>
      ${o.receiverPhone?`<p class="muted" style="font-size:.85em; margin-top:2px;">${o.receiverPhone}</p>`:''}
      ${o.receiverAddress?`<p class="muted" style="font-size:.85em; margin-top:2px;">${o.receiverAddress}</p>`:''}
    </div>` : ''}
    <div class="glass card tight">${itemsList}<div class="divider"></div>
      <div class="row between"><span class="muted">Items subtotal</span><span>${money(o.itemsTotal!=null?o.itemsTotal:o.total-(buyerPaidFee?payoutAmt:0))}</span></div>
      ${deliveryLine}
      <div class="row between" style="margin-top:6px;"><strong>Total</strong><strong class="price">${money(o.total)}</strong></div>
    </div>
    <div style="margin-top:14px;">${actionArea}</div>
  `;
}

// Posts a "deliver"-fulfillment rental order to the delivery-partner network for
// a fee the store itself is offering to pay - a purely optional alternative to
// the store delivering it themselves, and entirely separate money from the
// rental payment (which the customer already paid, or will pay, straight to the
// store either way). Once posted, the job shows up for delivery partners same

// Buy-now and rental items only - auctions need their own duration/increment
// setup, so those still go through the usual + button one at a time. A

// can't hand the browser a file to save), so instead this shows the exact

const BULK_IMPORT_HEADERS = ['Name','Price','Stock','Category','Listing type (buy_now or rental)','Free delivery (yes/no)','Extra delivery fee','Discount percent','Rental deposit','Rental fulfillment (pickup or deliver)','Pickup location','Description'];
const BULK_IMPORT_EXAMPLE = ['Coconut Bondi Cake','180','8','Bakery','buy_now','yes','0','0','','','','Freshly baked - ask about flavors'];
const BULK_COLUMN_ALIASES = {
  name:['name','itemname','item'], price:['price'], stock:['stock','qty','quantity'],
  category:['category','cat'], listingtype:['listingtype','listing','type'],
  freedelivery:['freedelivery','delivery'], extradeliveryfee:['extradeliveryfee','extrafee','extradeliverycharge'],
  discountpercent:['discountpercent','discount'], rentaldeposit:['rentaldeposit','deposit'],
  rentalfulfillment:['rentalfulfillment','fulfillment'], pickuplocation:['pickuplocation','pickup'],
  description:['description','desc','details']
};
function sheetBizBulkImport(){
  const csvSample = [BULK_IMPORT_HEADERS.join(','), BULK_IMPORT_EXAMPLE.map(v=>/[,"]/.test(v)?`"${v.replace(/"/g,'""')}"`:v).join(',')].join('\n');
  return `
  <h2>Bulk add items from a spreadsheet</h2>
  <p class="muted" style="font-size:.85em; margin-bottom:10px;">A ready-made file isn't downloadable from here, so copy the header row below into a new spreadsheet (Excel, Google Sheets, Numbers — anything that can save as CSV), fill in a row per item, save it as .csv, then upload it here.</p>
  <div class="field">
    <label>Column headers (tap to select, then copy)</label>
    <textarea readonly rows="3" style="font-family:monospace; font-size:.76em;" onclick="this.select()">${csvSample}</textarea>
    <p class="muted" style="font-size:.78em; margin-top:5px;">The second line is an example row in the same order — replace it (or add more rows after it) with your own items. Only Name and Price are required; leave anything else blank for sensible defaults.</p>
  </div>
  <div class="field" style="margin-top:14px;">
    <input type="file" accept=".csv,text/csv" id="bulkImportFile" style="display:none;" onchange="handleBulkImportFile(event)">
    <label for="bulkImportFile" class="filebtn">📄 Tap to choose a .csv file</label>
  </div>
  <div id="bulkImportPreview"></div>
  <button class="btn btn-outline" style="width:100%; margin-top:14px;" onclick="closeSheet()">Close</button>`;
}
// Minimal CSV parser - handles quoted fields (including embedded commas and
// escaped "" quotes) and both \n and \r\n line endings. Good enough for a
// flat list of items; not meant to handle formulas or multi-sheet exports.
function parseCsv(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else if(c==='"') inQuotes = true;
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && text[i+1]==='\n') i++;
      row.push(field); field='';
      if(row.some(v=>v.trim()!=='')) rows.push(row);
      row = [];
    } else field += c;
  }
  if(field!=='' || row.length){ row.push(field); if(row.some(v=>v.trim()!=='')) rows.push(row); }
  return rows;
}
function normalizeHeader(h){ return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
let _bulkImportStaged = null;
function handleBulkImportFile(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const rows = parseCsv(String(reader.result||''));
    e.target.value = '';
    if(rows.length < 2){ toast('That file has no data rows','bad'); return; }
    const headerRow = rows[0].map(normalizeHeader);
    const colIndex = {};
    Object.keys(BULK_COLUMN_ALIASES).forEach(key=>{
      const idx = headerRow.findIndex(h=>BULK_COLUMN_ALIASES[key].includes(h));
      if(idx>=0) colIndex[key] = idx;
    });
    if(colIndex.name===undefined || colIndex.price===undefined){
      toast('Could not find a "Name" and "Price" column in that file','bad'); return;
    }
    const biz = currentBiz(); const t = tierInfo(biz);
    const remaining = Math.max(0, t.limit - DB.items.filter(i=>i.businessId===biz.id).length);
    const items = [], skipped = [];
    for(let r=1; r<rows.length; r++){
      const row = rows[r];
      const get = key => colIndex[key]!==undefined ? (row[colIndex[key]]||'').trim() : '';
      const name = get('name'); const price = Number(get('price'));
      if(!name || !price || price<=0){ skipped.push(`Row ${r+1}: needs a name and a price`); continue; }
      if(items.length >= remaining){ skipped.push(`Row ${r+1}: over your ${t.limit}-item plan limit`); continue; }
      const listingType = /rent/i.test(get('listingtype')) ? 'rental' : 'buy_now';
      const freeStr = get('freedelivery').toLowerCase();
      const freeDelivery = freeStr==='' ? true : ['yes','y','true','1'].includes(freeStr);
      items.push({
        id: uid('it'), businessId: biz.id, name, price,
        stock: Math.max(0, Number(get('stock')||0) || 0),
        category: get('category') || 'General',
        imageUrl: null, listingType, freeDelivery,
        extraDeliveryFee: Math.max(0, Number(get('extradeliveryfee')||0) || 0),
        discountPercent: listingType==='buy_now' ? Math.min(90, Math.max(0, Number(get('discountpercent')||0) || 0)) : 0,
        rentalDeposit: listingType==='rental' ? Math.max(0, Number(get('rentaldeposit')||0) || 0) : 0,
        rentalFulfillment: listingType==='rental' ? (/deliv/i.test(get('rentalfulfillment')) ? 'deliver' : 'pickup') : 'deliver',
        pickupLocation: get('pickuplocation'), rentalAvailability:'now', availableFrom:'',
        description: get('description')
      });
    }
    _bulkImportStaged = items;
    const box = document.getElementById('bulkImportPreview');
    if(box) box.innerHTML = `
      <div class="card tight" style="margin-top:12px; background:rgba(61,220,151,.1); border:1px solid rgba(61,220,151,.3);">
        <p style="font-size:.9em;">${items.length} item${items.length===1?'':'s'} ready to add${skipped.length?`, ${skipped.length} row${skipped.length===1?'':'s'} skipped`:''}.</p>
        ${skipped.length? `<p class="muted" style="font-size:.78em; margin-top:6px;">${skipped.slice(0,5).join(' · ')}${skipped.length>5?` · +${skipped.length-5} more`:''}</p>`:''}
      </div>
      ${items.length? `<button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="confirmBulkImport()">Add ${items.length} item${items.length===1?'':'s'}</button>`:''}
    `;
  };
  reader.readAsText(f);
}
function confirmBulkImport(){
  if(!_bulkImportStaged || !_bulkImportStaged.length) return;
  const items = _bulkImportStaged;
  DB.items.push(...items);
  saveDB('items', items);
  _bulkImportStaged = null;
  closeSheet();
  toast(`${items.length} item${items.length===1?'':'s'} added — add photos for them anytime from Store settings`);
  render();
}

async function uploadMissingPhoto(itemId, e){
  const f = e.target.files[0]; if(!f) return;

}

// The delivery partner is always paid the zone's flat fee (deliveryPartnerPayout),
// regardless of the item's free-delivery checkbox - falls back to deliveryFee for
// pre-feature rows that predate delivery_partner_payout.
function payoutAmountFor(o){ return o.deliveryPartnerPayout!=null ? o.deliveryPartnerPayout : o.deliveryFee; }
// What a cash-collecting rider deducts from the cash in hand before remitting the
// rest to the business. On a normal (buyer-pays) order the buyer's payment already
// includes the fee, so the rider keeps it as their cut. On a free-delivery order
// the buyer was never charged a fee, so there's nothing to deduct - the rider
// remits everything they collected, and is paid separately via payout_status.
function cashCutAmount(o){ return o.deliveryType==='free' ? 0 : payoutAmountFor(o); }
function renderDelHome(d){

        <!-- Most rentals (rentalItemId set) never show up here - the renter handles
             their own pickup/delivery. The exception: a "deliver"-fulfillment rental
             the store has explicitly posted (needsDeliveryPartner) for a fee it's
             offering out of its own pocket - see offerRentalDelivery(). -->
        ${DB.orders.filter(o=>!o.deliveryPersonId && o.status!=='delivered' && o.paymentStatus!=='awaiting_completion' && (!o.rentalItemId || o.needsDeliveryPartner)).map(o=>`
          <div class="glass card">
            <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3><span class="price">Earn ${money(payoutAmountFor(o))}</span></div>

            ${o.rentalItemId?`<p class="muted" style="font-size:.78em; margin-top:2px;">${o.rentalPayoutTiming==='upfront'?'Paid upfront when you accept':'Paid once you mark it delivered'}</p>`:''}

// A genuine partial update naming only the two columns actually changing - NOT
// saveDB('orders', [o]), which upserts every column on the row (via toDbRow) and so
// would need UPDATE privilege on total/payment_status/payout_status/
// delivery_partner_payout too, even though their values never change here. The
// "rider update assigned or open orders" RLS policy (delivery_person_id IS NULL to
// claim; must be the assignee after) is what actually gates who can do this.
// A rental delivery job goes through claim_rental_job instead - an "upfront"
// job also needs payout_status flipped to 'pending' right at claim time, and
// that has to be computed server-side (from the store's own timing choice)
// rather than trusted as a plain column a rider could set to anything.
async function claimJob(id){
  const order = DB.orders.find(o=>o.id===id);
  if(order && order.rentalItemId){
    const updated = await callOrderRpc('claim_rental_job', { p_order_id: id }, id,
      'This job may have already been accepted by someone else');
    if(!updated) return;
    toast('Job accepted'); render();
    return;
  }
  const d = currentDel();
  const { data, error } = await sb.from('orders')
    .update({ delivery_person_id: d.id, delivery_person_name: d.name })
    .eq('id', id).select();
  if(error){ toast('Could not accept job: '+error.message, 'bad'); return; }
  if(!data || !data.length){ toast('This job may have already been accepted by someone else', 'bad'); return; }
  const updated = fromDbRow('orders', data[0]);
  const idx = DB.orders.findIndex(o=>o.id===id);
  if(idx>=0) DB.orders[idx] = updated; else DB.orders.unshift(updated);
  toast('Job accepted'); render();
}

// A free-delivery order (buyer wasn't charged the zone fee) always creates a
// payout obligation once delivered, regardless of payment method - a
// buyer-pays order never needs this, since the buyer's own payment already
// covers the fee either way (kept as the rider's cash cut, or already in the
// store's account from the transfer).
async function markDelivered(id){
  const updated = await callOrderRpc('mark_delivered', { p_order_id: id }, id,
    "Couldn't mark this delivered — it may already be marked delivered");
  if(!updated) return;

// Cash orders show the cash-collected/settled state via paymentStatusPill AND,
// when this was also a free-delivery order, the separate store-owes-payout state -
// a free-delivery cash order has two independent settlements (rider remits the
// cash they collected; store pays the rider's fee separately) so both matter.
// Buyer-pays transfer orders show nothing extra here (no gap to track); a
// free-delivery transfer order shows only the payout state, since there's no
// cash leg for the rider at all.
function riderPayoutPill(o){
  // A rental delivery job's paymentStatus describes the customer's rental
  // payment to the store, not anything the rider is owed or collecting - never
  // fall back to paymentStatusPill() for one of these, or it'd misleadingly
  // read like the rider still needs to collect cash from the customer.
  if(o.rentalItemId){
    if(o.payoutStatus==='settled') return `<span class="status-pill ok">Paid by store ✓</span>`;
    if(o.payoutStatus==='pending') return `<span class="status-pill mid">Store owes you</span>`;
    return `<span class="status-pill wait">Rental delivery</span>`;
  }
  const parts = [];
  if(o.paymentMethod==='cash_to_delivery') parts.push(paymentStatusPill(o));
  if(o.payoutStatus==='settled') parts.push(`<span class="status-pill ok">Paid by store ✓</span>`);
  else if(o.payoutStatus==='pending') parts.push(`<span class="status-pill mid">Store owes you</span>`);
  if(!parts.length) parts.push(paymentStatusPill(o));
  return parts.join(' ');
}

const MARKETPLACE_CATEGORIES = ['Grocery','Bakery','Café','Fashion','Electronics','Beauty & Personal Care','Home & Living','Health & Wellness','Sports & Outdoors','Toys & Games','Books & Stationery','Automotive','Pet Supplies','Hardware','Collectibles','Other'];
const CATEGORY_ICONS = { Grocery:'🛒', Bakery:'🍞', 'Café':'☕', Fashion:'👗', Electronics:'📱', 'Beauty & Personal Care':'💄', 'Home & Living':'🏠', 'Health & Wellness':'💊', 'Sports & Outdoors':'⚽', 'Toys & Games':'🧸', 'Books & Stationery':'📚', Automotive:'🚗', 'Pet Supplies':'🐾', Hardware:'🔧', Collectibles:'🏺', Other:'🏷️', General:'🏷️' };

// DB.customCategories) so an approved category shows up as a normal
// pickable category everywhere a category is chosen, not just remembered on
// whichever one business first suggested it.
function mergeCustomCategories(){
  DB.customCategories.forEach(name=>{
    if(name && !MARKETPLACE_CATEGORIES.includes(name)){

const FEATURED_GRADIENTS = [

const CATEGORY_ART_GLYPHS = {
  Grocery:['🛒','🍎','🥦'], Bakery:['🍞','🥐','🧁'], 'Café':['☕','🍵','🥤'],
  Fashion:['👗','👕','👜'], Electronics:['📱','💻','🎧'], 'Beauty & Personal Care':['💄','🧴','💅'],
  'Home & Living':['🏠','🛋️','🪴'], 'Health & Wellness':['💊','🩹','🌿'], 'Sports & Outdoors':['⚽','🏄','🚴'],
  'Toys & Games':['🧸','🎲','🪁'], 'Books & Stationery':['📚','📖','✏️'], Automotive:['🚗','🛵','🔧'],
  'Pet Supplies':['🐾','🐶','🐱'], Hardware:['🔧','🔨','🪛'], Collectibles:['🏺','🖼️','🪆'],
  Other:['🏷️','🛍️','📦'], General:['🏷️','🛍️','📦'],

// Small deterministic string hash - so the same item always lands on the same
// placeholder tile below (stable across re-renders) instead of a new random
// one flickering in on every redraw.
function hashStr(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }
// Stand-in "picture" for an item with no real uploaded photo yet - a gradient
// tint (reusing FEATURED_GRADIENTS above) plus a glyph related to the item's
// own category, chosen deterministically per item so a grid of un-photographed
// items reads as a varied, related set of tiles rather than a wall of
// identical bags/boxes. Real uploaded photos always take priority - every card
// goes through itemThumbHTML() below, which is what actually decides between
// a real <img> and this.
function itemArtHTML(item){
  const pool = CATEGORY_ART_GLYPHS[item && item.category] || CATEGORY_ART_GLYPHS.General;
  const h = hashStr((item && (item.id || item.name)) || 'x');
  const glyph = pool[h % pool.length];
  const grad = FEATURED_GRADIENTS[Math.floor(h / pool.length) % FEATURED_GRADIENTS.length];
  return `<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:${grad};">${glyph}</div>`;
}

// The "Maldexpress" wordmark slides up and fades out as the Home screen is
// scrolled (the hamburger/bell either side stay put, since the header itself is
// sticky) - a direct style update on scroll rather than a render(), both because
// scroll fires far too often to re-render on and because a render would wipe
// mid-scroll state anyway. Harmless to call when #homeLogo isn't on screen
// (any screen but Home) - it's a no-op lookup miss.
// NOTE: html,body both end up with a computed overflow-y:auto (a side effect of
// the overflow-x:hidden anti-sideways-scroll rule above - setting only one axis
// forces the other to 'auto' per the CSS overflow spec), and since html also
// gets height:100%, the browser does NOT propagate body's scrolling to the
// window/viewport the way it normally would - body becomes its own scroll box.
// So the page's real scroll position lives on document.body.scrollTop, not
// window.scrollY (which stays 0), and the 'scroll' event fires on body itself,
// which doesn't bubble to window - only a listener on body (or a capturing one
// higher up) ever sees it. Reading every possible source and listening on both
// body and window keeps this working regardless of which one actually scrolls.
function updateHomeLogoScroll(){
  const el = document.getElementById('homeLogo');
  if(!el) return;
  const y = Math.min(document.body.scrollTop || document.documentElement.scrollTop || window.scrollY || 0, 40);

// keyboard as normal - that's just the browser's native focus behavior, no
// extra code needed for it. Listens on `document` with capture:true because
// scroll events fired on an inner scrolling element (like an open sheet,
// which scrolls itself rather than the page) don't bubble - capture still
// sees them on the way down regardless of that.

      </div>
      ${ended ? (
        wonByMe ? `<p class="muted" style="font-size:.85em;">🎉 You won this auction for ${money(auction.currentHighestBid)}. Check My Orders.</p>`
        : auction.currentHighestBidder ? `<p class="muted" style="font-size:.85em;">Auction ended — sold for ${money(auction.currentHighestBid)}.</p>`
        : `<p class="muted" style="font-size:.85em;">Auction ended with no bids.</p>`
      ) : `

// The cart can hold items from any number of stores at once - it's grouped by
// business (see groupCartLinesByBusiness()) for display in the cart list and at
// checkout, where each store gets its own card, its own account details, and its
// own "place order" so one store's payment never gets mixed up with another's.
function groupCartLinesByBusiness(lines){
  const groups = []; const byBiz = {};
  for(const l of lines){
    const bizId = l.it.businessId;
    if(!byBiz[bizId]){
      const biz = DB.businesses.find(b=>b.id===bizId);
      byBiz[bizId] = { biz, lines: [] };
      groups.push(byBiz[bizId]);
    }
    byBiz[bizId].lines.push(l);
  }
  return groups;
}
// Signing in is required to add anything to the cart (same bar as checkout/renting/
// bidding) - browsing stays open to everyone, but this is the first point that
// actually needs an account, so it opens sign-in right here rather than letting a
// guest fill a cart they'll only be asked to sign in for at checkout. The item they
// were adding is remembered (state.pendingCartItemId) and actually added once they
// finish signing in or signing up — see resolvePendingIntent().
function addToCart(itemId){
  if(sb && !state.authed){ state.pendingCartItemId = itemId; openSheet('signIn', {intent:'cart'}); return; }
  const item = DB.items.find(i=>i.id===itemId);
  if(!item) return;
  state.cart[itemId] = (state.cart[itemId]||0)+1;
  closeSheet();
  toast('Added to cart');
  render();
}
function changeQty(itemId, d){ state.cart[itemId] = Math.max(0,(state.cart[itemId]||0)+d); if(state.cart[itemId]===0) delete state.cart[itemId]; render(); }

// Cart line selection: a check circle in front of every card, ON by default (so an
// untouched cart still checks out as a whole exactly like before) - absence from
// state.cartSelected means selected; only an explicit false means deselected. This
// is what lets a buyer deselect an item to leave it in the cart for later while
// checking out the rest.
function isCartItemSelected(itemId){
  return !state.cartSelected || state.cartSelected[itemId] !== false;
}
function toggleCartSelected(itemId){
  if(!state.cartSelected) state.cartSelected = {};
  state.cartSelected[itemId] = !isCartItemSelected(itemId);
  render();
}
function cartCheckoutLines(lines){
  return lines.filter(l=>isCartItemSelected(l.it.id));
}
// The check circle next to a store's name in the cart (see renderCustCart()) marks
// or unmarks every item from that store in one tap - already-all-selected flips
// everything off, anything else flips everything on, same explicit true/false
// convention as toggleCartSelected() so isCartItemSelected() reads it correctly.
function toggleStoreSelected(bizId){
  const entries = Object.entries(state.cart);
  const storeLines = entries.map(([id,qty])=>{ const it=DB.items.find(i=>i.id===id); return {it,qty}; }).filter(x=>x.it && x.it.businessId===bizId);
  if(!storeLines.length) return;
  if(!state.cartSelected) state.cartSelected = {};
  const allSelected = storeLines.every(l=>isCartItemSelected(l.it.id));
  for(const l of storeLines) state.cartSelected[l.it.id] = !allSelected;
  render();
}

function renderCustCart(){

      `).join('') : `<div class="empty"><span class="ic">🛒</span>Your cart is empty</div>`}
    </div>
  `, checkoutBar);
}
// A cart is already restricted to one business. The buyer always picks a zone
// below regardless of this - it only decides whether that zone's flat fee is
// ALSO added to their total. If even one line requires the buyer to pay for
// delivery, the fee is charged for the whole order (one delivery, one flat
// fee); only a cart where every line has free_delivery checked skips it.
function cartBuyerPaysFee(lines){
  return lines.some(l=>l.it.freeDelivery===false);
}
// Separate from the flat zone fee above and from the free-delivery checkbox - a
// seller-set surcharge (eg. for a bulky/fragile item) that's always charged to the
// buyer when set, on top of whatever the zone fee works out to, and goes to the
// business rather than the delivery partner. Summed per distinct item in the cart
// (not multiplied by qty) since it's a per-listing handling charge, not a per-unit one.
function cartExtraFee(lines){
  return lines.reduce((s,l)=>s+(l.it.extraDeliveryFee||0), 0);
}
// Multi-store checkout: one shared delivery destination (below) but a separate
// card per store, since each store has its own account to pay and its own order.

function sheetCheckout(){

  const lines = cartCheckoutLines(allLines); // only the selected lines (see toggleCartSelected()), or the whole cart if everything's selected
  const groups = groupCartLinesByBusiness(lines);

  ${deliveryTargetFieldsHTML()}

    </select>

  ${groups.length>1 ? `<p class="muted" style="font-size:.8em; margin:16px 4px 10px;">Your cart has items from ${groups.length} stores — pay and place each store's order separately below.</p>` : ''}
  ${groups.map(g=>storeCheckoutCardHTML(g)).join('')}`;

// One store's slice of checkout: its own items/totals, its own account details (or

// Per-store payment method toggle - direct DOM show/hide (like setDeliveryTarget())

// Reads + validates whichever half of deliveryTargetFieldsHTML() is showing.
// Returns null (after toasting the problem) if anything required is still empty -
// every submit function below must bail out when this returns null.
function readDeliveryTargetFields(){
  const deliveryTargetType = val('c_delivery_target') || 'person';
  if(deliveryTargetType==='boat'){
    const receiverName = val('c_boat_name'), receiverPhone = val('c_boat_phone'), receiverAddress = val('c_boat_location');
    if(!receiverName || !receiverPhone || !receiverAddress){ toast('Enter the boat name, contact phone, and harbor location','bad'); return null; }
    return { deliveryTargetType, receiverName, receiverPhone, receiverAddress };
  }
  const receiverName = val('c_recv_name'), receiverPhone = val('c_recv_phone'), receiverAddress = val('c_recv_address');
  if(!receiverName || !receiverPhone || !receiverAddress){ toast("Enter the receiver's name, phone, and address",'bad'); return null; }
  return { deliveryTargetType, receiverName, receiverPhone, receiverAddress };
}
// Switches which set of receiver fields is shown/required - a direct DOM toggle
// (mirrors setAddItemListingType() in Add Item) rather than a full render(), so any
// receiver details already typed for the other option aren't wiped by switching back.
function setDeliveryTarget(type){
  document.getElementById('c_delivery_target').value = type;
  document.getElementById('deliverTabPerson').classList.toggle('active', type==='person');
  document.getElementById('deliverTabBoat').classList.toggle('active', type==='boat');
  document.getElementById('personFields').classList.toggle('hidden', type!=='person');
  document.getElementById('boatFields').classList.toggle('hidden', type!=='boat');
}
// "I'm receiving this package" (checked by default): pulls the buyer's own
// name/phone (whatever's currently typed in Your name/Phone, not just the stored
// account values) into the receiver fields. Unchecking clears them for someone
// else's details - the receiver's address is never auto-filled either way.
function toggleReceivingSelf(checked){
  const nameEl = document.getElementById('c_recv_name');
  const phoneEl = document.getElementById('c_recv_phone');
  if(checked){
    nameEl.value = val('c_name') || state.customerName;
    phoneEl.value = val('c_phone') || state.customerPhone || '';

    nameEl.value = '';
    phoneEl.value = '';

}
// Zone change affects every store's delivery fee (and so its total) at once, since
// there's one shared delivery destination - updates each store card's numbers in
// place rather than re-rendering the whole sheet (see storeCheckoutCardHTML()).
function refreshCheckoutTotals(){
  const entries = Object.entries(state.cart);
  const allLines = entries.map(([id,qty])=>{ const it=DB.items.find(i=>i.id===id); return {it,qty}; }).filter(x=>x.it);
  const lines = cartCheckoutLines(allLines);
  const groups = groupCartLinesByBusiness(lines);
  for(const g of groups){
    const itemsTotal = g.lines.reduce((s,l)=>s+effectivePrice(l.it)*l.qty,0);
    const buyerPaysFee = cartBuyerPaysFee(g.lines);
    const extraFee = cartExtraFee(g.lines);
    const shownFee = buyerPaysFee ? zoneFee(_selectedZone) : 0;
    const total = itemsTotal+shownFee+extraFee;
    const feeEl = document.getElementById('ck_fee_'+g.biz.id); if(feeEl) feeEl.textContent = buyerPaysFee ? money(shownFee) : 'Free';
    const extraEl = document.getElementById('ck_extra_'+g.biz.id); if(extraEl) extraEl.textContent = money(extraFee);
    const totalEl = document.getElementById('ck_total_'+g.biz.id); if(totalEl) totalEl.textContent = money(total);
    const cashEl = document.getElementById('ck_cash_'+g.biz.id); if(cashEl) cashEl.textContent = money(total);
    const slipNoteEl = document.getElementById('ck_slipnote_'+g.biz.id); if(slipNoteEl) slipNoteEl.textContent = money(total);
    const amtInput = document.getElementById('slipAmount_'+g.biz.id); if(amtInput) amtInput.placeholder = total.toFixed(2);
  }
}

// Renting is a single-item flow (pick a duration, then pickup/deliver + payment),
// not a cart-quantity flow like Buy Now - modeled on sheetCheckout/placeOrder, but
// unlike a normal order a rental never involves the delivery-partner network: no
// zone fee, no delivery_partner_payout, and the renter (the store) picks per item
// whether the customer picks up (rentalFulfillment==='pickup', pickup_location shown
// instead of the deliver-to fields) or the store delivers it themselves
// ('deliver', normal deliver-to-a-person/boat fields collected). Every order-detail/
// payment screen checks o.rentalItemId to skip the delivery-fee/payout UI for these.
let _rentDays = 1;
let _rentWarning = null;
function openRentItem(itemId){
  if(sb && !state.authed){ state.pendingItemAction = {type:'rent', itemId}; openSheet('signIn', {intent:'rent'}); return; }
  _rentDays = 1;
  _rentWarning = null;
  openSheet('rentItem', itemId);
}
// Earliest accepted-booking start date that's today or later, if any - an
// instant rental starting today can never run that far without crossing it.
function nextBookingStart(itemId){
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = itemBookingWindows(itemId).filter(w=>w.start>=today).sort((a,b)=>a.start-b.start)[0];
  return upcoming ? upcoming.start : null;
}
function maxRentDaysAvailable(itemId){
  const start = nextBookingStart(itemId);
  if(!start) return Infinity;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.max(1, Math.round((start-today)/86400000));
}
// The +/- stepper won't count past the point a booking already accepted for
// this item would take over - trying to go further shows a popup instead of
// silently letting the count climb toward a range submitRentItem() would
// just reject anyway.
function changeRentDays(d){
  const item = DB.items.find(i=>i.id===state.sheetData);
  if(!item) return;
  const max = maxRentDaysAvailable(item.id);
  const next = Math.max(1, _rentDays + d);
  if(next > max){
    const start = nextBookingStart(item.id);
    _rentWarning = `This item is only available for ${max} more day${max===1?'':'s'} right now — someone already has it booked starting ${start?fmtDateShort(isoDateStr(start)):'soon'}.`;
    render();
    return;
  }
  _rentDays = next;
  refreshRentTotals();
}
function approveRentWarning(){ _rentWarning = null; render(); }

    <div class="row" style="gap:14px; align-items:center; justify-content:center;">

  </div>
  ${fulfillment==='pickup' ? `
  <div class="glass card tight" style="margin-bottom:14px;">

    <p style="font-weight:700;">${escapeAttr(item.pickupLocation||'Contact the store for details')}</p>
    <p class="muted" style="font-size:.8em; margin-top:6px;">This item is for pickup only — the store doesn't deliver it.</p>

  <div class="glass card tight" style="margin-bottom:14px;">
    <div class="row between"><span class="muted">Rental (<span id="rent_days_label">${_rentDays}</span> day${_rentDays>1?'s':''})</span><span id="rent_days_cost">${money(effectiveDailyRate(item)*_rentDays)}</span></div>
    ${item.rentalDeposit?`<div class="row between" style="margin-top:6px;"><span class="muted">${item.category==='Home & Living'?'Deposit / advance payment':'Refundable deposit'}</span><span>${money(item.rentalDeposit)}</span></div>`:''}

    <div class="stack">
