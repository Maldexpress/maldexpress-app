<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Maldexpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg1:#04222c;
    --bg2:#0a4a5c;
    --bg3:#0f7a8c;
    --lagoon:#22b8c8;
    --coral:#ff8a5c;
    --coral-dk:#e8663a;
    --sand:#f6ecd9;
    --ink:#eafdff;
    --ink-dim:rgba(234,253,255,.68);
    --glass:rgba(255,255,255,.10);
    --glass-brd:rgba(255,255,255,.22);
    --glass-hi:rgba(255,255,255,.18);
    --danger:#ff6b6b;
    --good:#3ddc97;
    --warn:#ffcf5c;
    --radius:22px;
    --fs:16px;
    font-size:var(--fs);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(1200px 800px at 15% -10%, rgba(34,184,200,.35), transparent 60%),
      radial-gradient(900px 700px at 110% 10%, rgba(255,138,92,.20), transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3) 130%);
    background-attachment:fixed;
    overflow-x:hidden;
    font-size:1rem;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-1;
    background-image:
      repeating-linear-gradient(100deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 2px, transparent 2px, transparent 90px),
      repeating-linear-gradient(80deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 2px, transparent 2px, transparent 140px);
    animation: drift 40s linear infinite;
  }
  @keyframes drift{ 0%{background-position:0 0, 0 0;} 100%{background-position:400px 200px, -300px 260px;} }
  h1,h2,h3,.display{font-family:'Fraunces',serif; letter-spacing:.2px;}
  h1{font-size:1.9em; font-weight:700; margin:0;}
  h2{font-size:1.25em; font-weight:600; margin:0 0 .6em;}
  h3{font-size:1.05em; font-weight:600; margin:0;}
  p{margin:0; line-height:1.5;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:1em;}
  a{color:inherit;}

  .glass{
    background:var(--glass);
    border:1px solid var(--glass-brd);
    border-radius:var(--radius);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 8px 32px rgba(0,10,15,.28), inset 0 1px 0 rgba(255,255,255,.15);
  }

  /* ---------- App shell ---------- */
  #app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:92px;}

  /* Landing */
  .landing{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:28px 22px;}
  .landing-mark{text-align:center; margin-bottom:36px;}
  .landing-mark .glyph{font-size:2.6em; display:block; margin-bottom:6px;}
  .landing-mark h1{font-size:2.1em;}
  .landing-mark p{color:var(--ink-dim); margin-top:6px;}
  .role-card{
    padding:20px 20px; margin-bottom:14px; display:flex; align-items:center; gap:16px;
    transition:transform .18s ease, background .18s ease;
  }
  .role-card:active{transform:scale(.98);}
  .role-card .ic{
    width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:1.5em; background:linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.06));
    border:1px solid var(--glass-brd); flex-shrink:0;
  }
  .role-card .txt{flex:1;}
  .role-card .txt small{color:var(--ink-dim); font-size:.85em;}
  .role-card .arrow{color:var(--coral); font-size:1.3em;}

  /* Header */
  .topbar{
    position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
    padding:16px 18px; margin-bottom:6px;
  }
  .topbar .iconbtn{
    width:42px; height:42px; border-radius:14px; border:1px solid var(--glass-brd); background:var(--glass);
    display:flex; align-items:center; justify-content:center; font-size:1.15em; color:var(--ink); flex-shrink:0;
  }
  .topbar .titles{flex:1; min-width:0;}
  .topbar .titles h1{font-size:1.15em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar .titles .sub{font-size:.78em; color:var(--ink-dim);}
  .badge{
    padding:3px 10px; border-radius:999px; font-size:.72em; font-weight:700; letter-spacing:.3px;
    border:1px solid var(--glass-brd);
  }
  .badge.free{background:rgba(255,207,92,.18); color:var(--warn);}
  .badge.pro{background:rgba(61,220,151,.18); color:var(--good);}

  main{padding:0 16px;}
  .section{margin-bottom:20px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .section-head h2{margin:0;}
  .link-btn{color:var(--lagoon); font-size:.9em; font-weight:700; background:none; border:none; padding:4px;}

  /* Cards */
  .card{padding:16px; margin-bottom:12px;}
  .card.tight{padding:14px 16px;}
  .row{display:flex; align-items:center; gap:12px;}
  .row.between{justify-content:space-between;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .muted{color:var(--ink-dim);}
  .price{color:var(--coral); font-weight:800;}

  .item-card{padding:14px; display:flex; gap:12px; align-items:center; margin-bottom:10px;}
  .item-thumb{
    width:56px; height:56px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.5em;
    background:linear-gradient(145deg, rgba(255,138,92,.35), rgba(34,184,200,.25));
    border:1px solid var(--glass-brd);
  }
  .item-info{flex:1; min-width:0;}
  .item-info h3{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{
    width:30px; height:30px; border-radius:10px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--ink); font-size:1.1em;
    display:flex; align-items:center; justify-content:center;
  }

  /* Buttons */
  .btn{
    border:none; border-radius:16px; padding:13px 18px; font-weight:700; font-size:.95em;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005; box-shadow:0 6px 18px rgba(255,138,92,.35);}
  .btn-ghost{background:var(--glass); border:1px solid var(--glass-brd); color:var(--ink);}
  .btn-outline{background:transparent; border:1px solid var(--glass-brd); color:var(--ink);}
  .btn-good{background:linear-gradient(135deg, #4de3a8, #23b47c); color:#04241a;}
  .btn-sm{padding:9px 14px; font-size:.85em; width:auto;}
  .btn[disabled]{opacity:.4; pointer-events:none;}

  .fab{
    position:fixed; right:20px; bottom:110px; z-index:25;
    width:58px; height:58px; border-radius:50%; border:none;
    background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005;
    font-size:1.6em; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 26px rgba(255,138,92,.45); max-width:520px; margin:0 auto;
  }

  /* Bottom nav */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:14px; z-index:30;
    max-width:480px; margin:0 auto; padding:0 20px;
  }
  .bottomnav .bar{
    display:flex; justify-content:space-around; padding:10px 6px; border-radius:24px;
  }
  .navbtn{
    background:none; border:none; color:var(--ink-dim); display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:.68em; font-weight:700; padding:6px 10px; border-radius:14px; flex:1;
  }
  .navbtn .ic{font-size:1.35em;}
  .navbtn.active{color:var(--sand); background:rgba(255,255,255,.12);}

  /* Drawer / menu */
  .overlay{
    position:fixed; inset:0; background:rgba(2,15,20,.55); backdrop-filter:blur(4px); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:78%; max-width:320px; z-index:61;
    padding:26px 18px; transform:translateX(-105%); transition:transform .26s cubic-bezier(.2,.9,.3,1);
    border-radius:0 26px 26px 0; display:flex; flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer .who{padding:8px 6px 18px; border-bottom:1px solid var(--glass-brd); margin-bottom:14px;}
  .drawer .who .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--lagoon),var(--coral)); display:flex;align-items:center;justify-content:center; font-weight:800; margin-bottom:8px;}
  .drawer-item{
    display:flex; align-items:center; gap:12px; padding:13px 10px; border-radius:14px; color:var(--ink); background:none; border:none; width:100%; text-align:left; font-size:.95em; font-weight:600;
  }
  .drawer-item:active{background:var(--glass);}
  .drawer-item .ic{width:22px; text-align:center;}
  .drawer-spacer{flex:1;}

  /* Modal / popup sheets */
  .sheet-wrap{
    position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sheet-wrap.show{opacity:1; pointer-events:auto;}
  .sheet-wrap .backdrop{position:absolute; inset:0; background:rgba(2,12,16,.6); backdrop-filter:blur(3px);}
  .sheet{
    position:relative; width:100%; max-width:520px; max-height:85vh; overflow-y:auto;
    border-radius:26px; padding:24px 20px 26px; transform:scale(.94); opacity:0;
    transition:transform .22s cubic-bezier(.2,.9,.3,1), opacity .18s ease;
  }
  .sheet-wrap.show .sheet{transform:scale(1); opacity:1;}
  .sheet .handle{display:none;}
  .sheet-close{position:absolute; right:16px; top:16px; width:34px; height:34px; border-radius:50%; border:1px solid var(--glass-brd); background:var(--glass); color:var(--ink); font-size:1.1em;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.82em; color:var(--ink-dim); margin-bottom:6px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--glass-brd); background:rgba(255,255,255,.08);
    color:var(--ink); outline:none;
  }
  .field input::placeholder, .field textarea::placeholder{color:rgba(234,253,255,.4);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--lagoon); background:rgba(255,255,255,.13);}
  .field.file{position:relative;}
  .field .filebtn{display:flex; align-items:center; justify-content:center; gap:8px; padding:22px; border:1.5px dashed var(--glass-brd); border-radius:16px; color:var(--ink-dim); font-weight:600;}

  .toast-wrap{position:fixed; top:16px; left:0; right:0; z-index:90; display:flex; justify-content:center; pointer-events:none;}
  .toast{padding:12px 20px; border-radius:16px; font-weight:700; font-size:.9em; display:flex; align-items:center; gap:8px; transform:translateY(-80px); transition:transform .3s ease; max-width:90%;}
  .toast.show{transform:translateY(0);}
  .toast.good{background:rgba(61,220,151,.25); border:1px solid rgba(61,220,151,.5); color:#c6ffe5;}
  .toast.bad{background:rgba(255,107,107,.25); border:1px solid rgba(255,107,107,.5); color:#ffd6d6;}

  .status-pill{padding:4px 11px; border-radius:99px; font-size:.72em; font-weight:800;}
  .status-pill.wait{background:rgba(255,207,92,.2); color:var(--warn);}
  .status-pill.ok{background:rgba(61,220,151,.2); color:var(--good);}
  .status-pill.mid{background:rgba(34,184,200,.22); color:var(--lagoon);}
  .status-pill.bad{background:rgba(255,107,107,.2); color:var(--danger);}

  .acct-box{
    padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.07); border:1px dashed var(--glass-brd); margin-top:10px;
  }
  .acct-box .lbl{font-size:.72em; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.5px;}
  .acct-box .val{font-weight:700; font-size:1.05em; margin-top:2px;}

  .empty{text-align:center; padding:50px 16px; color:var(--ink-dim);}
  .empty .ic{font-size:2.4em; margin-bottom:10px; display:block;}

  .tabs{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
  .tab{padding:9px 16px; border-radius:14px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--ink-dim); font-weight:700; font-size:.85em; white-space:nowrap;}
  .tab.active{background:linear-gradient(135deg, rgba(255,138,92,.9), rgba(232,102,58,.9)); color:#241005; border-color:transparent;}

  .cart-fab{
    position:fixed; left:16px; right:16px; bottom:96px; z-index:24; max-width:488px; margin:0 auto;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between; border-radius:20px;
    background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005; box-shadow:0 10px 26px rgba(255,138,92,.4);
  }

  .slider-row{display:flex; align-items:center; gap:12px;}
  input[type=range]{-webkit-appearance:none; flex:1; height:6px; border-radius:99px; background:var(--glass-brd); outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--coral); border:3px solid var(--sand); cursor:pointer;}
  .fs-demo{font-size:1em; padding:12px; border-radius:14px; background:rgba(255,255,255,.06); text-align:center; margin-top:10px;}

  .hidden{display:none !important;}
  .divider{height:1px; background:var(--glass-brd); margin:14px 0;}

  ::-webkit-scrollbar{width:0; height:0;}
</style>
</head>

<div id="app"></div>

<script>
/* =================== SUPABASE CONFIG =================== */
/* 1. Create a free project at https://supabase.com
   2. Run the SQL in the schema comment near the bottom of this file (Supabase SQL editor)
   3. In Authentication → Providers, make sure Email is on (magic link is enabled by default)
   4. Paste your project URL + anon public key below (Settings → API) */
const SUPABASE_URL = "https://ngoykqdzjpkrdqwhaqjy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nb3lrcWR6anBrcmRxd2hhcWp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1Mjc1MTQsImV4cCI6MjEwNDEwMzUxNH0.0b9P4ZLPbQTkqge99pjF8bya2FAELtDiCoECaF3PI8I";
const sb = (SUPABASE_URL.startsWith('http'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
/* ---- SQL to run once in Supabase → SQL Editor ----
create extension if not exists "pgcrypto";

create table businesses (
  id text primary key,
  owner_id uuid references auth.users(id) not null,
  name text not null,
  owner_name text not null,
  phone text,
  account_number text not null,
  account_name text not null,
  tier text default 'free',
  join_date timestamptz default now(),
  paid_at timestamptz,
  category text
);

create table items (
  id text primary key,
  business_id text references businesses(id) on delete cascade,
  name text not null,
  price numeric not null,
  stock int default 0,
  category text
);

create table delivery_persons (
  id text primary key,
  user_id uuid references auth.users(id) not null,
  name text not null,
  phone text
);

create table orders (
  id text primary key,
  business_id text references businesses(id),
  business_name text,
  customer_id uuid references auth.users(id),
  customer_email text,
  customer_name text,
  customer_phone text,
  items jsonb not null,
  items_total numeric not null,
  delivery_fee numeric not null,
  total numeric not null,
  zone text,
  delivery_person_id text references delivery_persons(id),
  delivery_person_name text,
  payment_method text,
  payment_status text default 'pending_transfer',
  status text default 'placed',
  slip_url text,
  created_at timestamptz default now()
);

alter table businesses enable row level security;
alter table items enable row level security;
alter table delivery_persons enable row level security;
alter table orders enable row level security;

-- Everyone (including logged-out visitors) can browse stores & items
create policy "public read businesses" on businesses for select using (true);
create policy "public read items" on items for select using (true);
create policy "public read delivery" on delivery_persons for select using (true);

-- Only the signed-in owner can create/edit their own store, and only the
-- signed-in rider can create/edit their own delivery profile.
create policy "owner insert business" on businesses for insert with check (auth.uid() = owner_id);
create policy "owner update business" on businesses for update using (auth.uid() = owner_id);
create policy "owner delete business" on businesses for delete using (auth.uid() = owner_id);

create policy "self insert delivery" on delivery_persons for insert with check (auth.uid() = user_id);
create policy "self update delivery" on delivery_persons for update using (auth.uid() = user_id);

-- Items can only be managed by the business's own owner
create policy "owner manage items" on items for all
  using (exists (select 1 from businesses b where b.id = items.business_id and b.owner_id = auth.uid()))
  with check (exists (select 1 from businesses b where b.id = items.business_id and b.owner_id = auth.uid()));

-- Orders: only a signed-in customer can create their own order
create policy "customer insert own order" on orders for insert
  with check (auth.uid() = customer_id);
-- Orders are only readable by the customer who placed them, the business
-- that owns them, or a delivery partner (their own assigned jobs, plus
-- unassigned orders so riders can see jobs to pick up). Updates are
-- restricted the same way (business owner, or assigned/claiming rider).
create policy "customer read own orders" on orders for select
  using (auth.uid() = customer_id);
create policy "business read own orders" on orders for select
  using (exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid()));
create policy "rider read assigned or open orders" on orders for select
  using (
    exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
    or (orders.delivery_person_id is null and exists (select 1 from delivery_persons d where d.user_id = auth.uid()))
  );
create policy "business update own orders" on orders for update
  using (exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid()));
create policy "rider update assigned or open orders" on orders for update
  using (
    orders.delivery_person_id is null
    or exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  )
  with check (
    exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  );

-- Mobile number + password sign-in (set up after a user's first magic-link
-- login). Password auth itself is Supabase's built-in email+password —
-- this table just maps a phone number to the account's email so a
-- not-yet-signed-in visitor can look up which email to authenticate,
-- and enforces phone uniqueness (email uniqueness is already enforced
-- natively by auth.users).
create table user_profiles (
  user_id uuid primary key references auth.users(id) on delete cascade,
  phone text unique not null,
  email text unique not null,
  created_at timestamptz default now()
);
alter table user_profiles enable row level security;
create policy "self read own profile" on user_profiles for select using (auth.uid() = user_id);
create policy "self insert own profile" on user_profiles for insert with check (auth.uid() = user_id);

-- Security-definer lookup so an unauthenticated visitor can resolve a
-- phone number to its account email (only that one field, nothing else)
-- before calling signInWithPassword. Safe to expose to anon.
create or replace function resolve_login_email(p_phone text)
returns text
language sql
security definer
set search_path = public
as $$
  select email from user_profiles where phone = p_phone limit 1;
$$;
grant execute on function resolve_login_email(text) to anon, authenticated;

-- Super Admin: a manually-seeded allowlist (no self-service signup for
-- this — add rows directly in SQL). is_admin() is security-definer so
-- it can be used inside other tables' RLS policies without those
-- tables needing their own read access to `admins`.
create table admins (
  user_id uuid primary key references auth.users(id) on delete cascade,
  created_at timestamptz default now()
);
alter table admins enable row level security;
create policy "admin read own admin row" on admins for select using (auth.uid() = user_id);

create or replace function is_admin()
returns boolean
language sql
security definer
set search_path = public
as $$
  select exists(select 1 from admins where user_id = auth.uid());
$$;
grant execute on function is_admin() to authenticated;

-- Admins can update tier/paid_at on any business (owners can already
-- update their own via the existing "owner update business" policy —
-- Postgres OR's multiple permissive policies for the same command).
create policy "admin update any business" on businesses for update using (is_admin());
-- Admins can also see phone/email for any user who's set up mobile
-- sign-in, useful for cross-checking a business owner's identity.
create policy "admin read all profiles" on user_profiles for select using (is_admin());

-- Pro-tier upgrade requests: bank transfer (needs manual admin
-- approval) or Swipe (auto-approved by the payment webhook, no admin
-- action needed — logged here for visibility).
create table pro_upgrade_requests (
  id text primary key,
  business_id text references businesses(id) on delete cascade,
  payment_method text not null check (payment_method in ('bank_transfer','swipe')),
  status text not null default 'pending' check (status in ('pending','approved','rejected')),
  amount numeric not null default 500,
  slip_url text,
  swipe_reference text,
  swipe_payment_link text,
  created_at timestamptz default now(),
  resolved_at timestamptz,
  resolved_by uuid references auth.users(id)
);
alter table pro_upgrade_requests enable row level security;
create policy "owner insert own upgrade request" on pro_upgrade_requests for insert
  with check (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "owner read own upgrade requests" on pro_upgrade_requests for select
  using (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
-- Lets create-swipe-payment roll back its own just-inserted row if
-- registering the reference with SeaFare fails right after.
create policy "owner delete own upgrade request" on pro_upgrade_requests for delete
  using (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "admin read all upgrade requests" on pro_upgrade_requests for select using (is_admin());
create policy "admin update upgrade requests" on pro_upgrade_requests for update using (is_admin());
--------------------------------------------------- */

function toDbRow(part, o){

  if(part==='items') return { id:o.id, business_id:o.businessId, name:o.name, price:o.price, stock:o.stock, category:o.category };
  if(part==='delivery') return { id:o.id, user_id:o.userId, name:o.name, phone:o.phone };
  if(part==='orders') return { id:o.id, business_id:o.businessId, business_name:o.businessName, customer_id:o.customerId||null, customer_email:o.customerEmail||null, customer_name:o.customerName, customer_phone:o.customerPhone, items:o.items, items_total:o.itemsTotal, delivery_fee:o.deliveryFee, total:o.total, zone:o.zone, delivery_person_id:o.deliveryPersonId, delivery_person_name:o.deliveryPersonName, payment_method:o.paymentMethod, payment_status:o.paymentStatus, status:o.status, slip_url:o.slipDataUrl, created_at:new Date(o.createdAt).toISOString() };
  if(part==='proRequests') return { id:o.id, business_id:o.businessId, payment_method:o.paymentMethod, status:o.status, amount:o.amount, slip_url:o.slipDataUrl, swipe_reference:o.swipeReference, swipe_payment_link:o.swipePaymentLink, created_at:new Date(o.createdAt).toISOString(), resolved_at:o.resolvedAt?new Date(o.resolvedAt).toISOString():null, resolved_by:o.resolvedBy||null };
}
function fromDbRow(part, r){
  if(part==='businesses') return { id:r.id, ownerId:r.owner_id, name:r.name, ownerName:r.owner_name, phone:r.phone, accountNumber:r.account_number, accountName:r.account_name, tier:r.tier, joinDate:new Date(r.join_date).getTime(), paidAt:r.paid_at?new Date(r.paid_at).getTime():null, category:r.category };
  if(part==='items') return { id:r.id, businessId:r.business_id, name:r.name, price:Number(r.price), stock:r.stock, category:r.category };
  if(part==='delivery') return { id:r.id, userId:r.user_id, name:r.name, phone:r.phone };
  if(part==='orders') return { id:r.id, businessId:r.business_id, businessName:r.business_name, customerId:r.customer_id, customerEmail:r.customer_email, customerName:r.customer_name, customerPhone:r.customer_phone, items:r.items, itemsTotal:Number(r.items_total), deliveryFee:Number(r.delivery_fee), total:Number(r.total), zone:r.zone, deliveryPersonId:r.delivery_person_id, deliveryPersonName:r.delivery_person_name, paymentMethod:r.payment_method, paymentStatus:r.payment_status, status:r.status, slipDataUrl:r.slip_url, createdAt:new Date(r.created_at).getTime() };
  if(part==='proRequests') return { id:r.id, businessId:r.business_id, paymentMethod:r.payment_method, status:r.status, amount:Number(r.amount), slipDataUrl:r.slip_url, swipeReference:r.swipe_reference, swipePaymentLink:r.swipe_payment_link, createdAt:new Date(r.created_at).getTime(), resolvedAt:r.resolved_at?new Date(r.resolved_at).getTime():null, resolvedBy:r.resolved_by };
}

async function loadDB(){
  if(!sb){
    toast('Add your Supabase URL & key in the script to connect a real backend', 'bad');
    storageReady = true;
    return;
  }
  try{
    const [b,i,o,d,pr] = await Promise.all([
      sb.from('businesses').select('*'),
      sb.from('items').select('*'),
      sb.from('orders').select('*'),
      sb.from('delivery_persons').select('*'),
      sb.from('pro_upgrade_requests').select('*')
    ]);
    DB.businesses = (b.data||[]).map(r=>fromDbRow('businesses',r));
    DB.items = (i.data||[]).map(r=>fromDbRow('items',r));
    DB.orders = (o.data||[]).map(r=>fromDbRow('orders',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.delivery = (d.data||[]).map(r=>fromDbRow('delivery',r));
    DB.proRequests = (pr.data||[]).map(r=>fromDbRow('proRequests',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
  }catch(e){ console.error(e); toast('Could not reach Supabase — check your config', 'bad'); }
  storageReady = true;
}
async function saveDB(part){
  if(!sb) return;
  try{
    const rows = DB[part].map(o=>toDbRow(part,o));
    const { error } = await sb.from(TABLES[part]).upsert(rows);
    if(error){ console.error(error); toast('Save failed: '+error.message, 'bad'); }
  }catch(e){ console.error(e); toast('Save failed — check connection', 'bad'); }
}

function tierInfo(biz){
  const now = Date.now();
  const trialDaysLeft = 30 - daysBetween(biz.joinDate, now);
  const trialActive = biz.tier==='free' && trialDaysLeft > 0;
  const trialExpired = biz.tier==='free' && trialDaysLeft <= 0;
  const limit = biz.tier==='pro' ? 500 : 10;
  return { trialDaysLeft: Math.max(trialDaysLeft,0), trialActive, trialExpired, limit };
}

async function adminSetTier(bizId, tier){
  const biz = DB.businesses.find(b=>b.id===bizId);
  if(!biz) return;
  const paidAt = tier==='pro' ? Date.now() : null;
  const { error } = await sb.from('businesses').update({ tier, paid_at: paidAt?new Date(paidAt).toISOString():null }).eq('id', bizId);
  if(error){ toast('Failed: '+error.message,'bad'); return; }
  biz.tier = tier; biz.paidAt = paidAt;
  toast(tier==='pro' ? 'Pro granted' : 'Pro revoked');
  render();
}
async function adminResolveRequest(reqId, approve){
  const req = DB.proRequests.find(r=>r.id===reqId);
  if(!req) return;
  const status = approve ? 'approved' : 'rejected';
  const nowIso = new Date().toISOString();
  const { error } = await sb.from('pro_upgrade_requests').update({ status, resolved_at: nowIso, resolved_by: state.customerId }).eq('id', reqId);
  if(error){ toast('Failed: '+error.message,'bad'); return; }
  req.status = status; req.resolvedAt = Date.now(); req.resolvedBy = state.customerId;
  if(approve){
    const { error: bizErr } = await sb.from('businesses').update({ tier:'pro', paid_at: nowIso }).eq('id', req.businessId);
    if(bizErr){ toast('Approved request but failed to grant Pro: '+bizErr.message,'bad'); return; }
    const biz = DB.businesses.find(b=>b.id===req.businessId);
    if(biz){ biz.tier='pro'; biz.paidAt=Date.now(); }
  }
  toast(approve ? 'Approved — Pro granted' : 'Rejected');
  render();
}

async function startProPayment(method){
  const biz = currentBiz();
  if(method==='bank_transfer'){ openSheet('upgradeBankSlip'); return; }
  toast('Creating your Swipe payment link…');
  try{
    const { data, error } = await sb.functions.invoke('create-swipe-payment', { body: { businessId: biz.id, amount: 500 } });
    if(error || !data || !data.paymentLink){
      // The edge function returns a JSON { error } body on failure - log it so
      // misconfiguration (e.g. a missing secret) is diagnosable from the
      // browser console instead of only showing this generic toast.
      let detail = error?.message || data?.error;
      if(error?.context?.json){ try{ detail = (await error.context.json()).error || detail; }catch(_){} }
      console.error('create-swipe-payment failed:', detail || error || data);
      toast("Swipe payment isn't set up yet — try bank transfer for now",'bad');
      return;
    }
    // The edge function already recorded the pro_upgrade_requests row and
    // registered the reference with SeaFare before returning this link —
    // both must succeed there before a link is ever payable, so there's
    // nothing left to track client-side.
    window.open(data.paymentLink, '_blank');
    closeSheet();
    toast('Complete payment in the new tab — Pro activates automatically once confirmed');
    await loadDB(); render();
  }catch(e){ toast("Swipe payment isn't set up yet — try bank transfer for now",'bad'); }
}

  if(_signInMode==='password'){

  }
  return `
  <h2>Sign in</h2>
  <p class="muted">We'll email you a secure sign-in link — no password needed. ${copy}</p>
  <div class="field" style="margin-top:14px;"><label>Email address</label><input id="auth_email" type="email" placeholder="you@example.com"></div>
  <button class="btn btn-primary" onclick="sendMagicLink()">Send sign-in link</button>
  <p class="muted" style="font-size:.78em; margin-top:12px;">Open the link on this device to finish signing in.</p>
  <button class="link-btn" style="margin-top:12px;" onclick="_signInMode='password'; render();">Sign in with mobile & password</button>`;
}
async function sendMagicLink(){
  if(!sb){ toast('Connect Supabase first — see the config note at the top of the script','bad'); return; }
  const email = val('auth_email');
  if(!email || !email.includes('@')){ toast('Enter a valid email','bad'); return; }
  const { error } = await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: window.location.href } });
  if(error){ toast(error.message,'bad'); return; }
  closeSheet();
  toast('Check your email for the sign-in link!');
}
async function signInWithPhonePassword(){
  if(!sb){ toast('Connect Supabase first — see the config note at the top of the script','bad'); return; }
  const phone = val('auth_phone'), pass = val('auth_pass');
  if(!phone || !pass){ toast('Enter your mobile number and password','bad'); return; }
  const { data: email, error: lookupErr } = await sb.rpc('resolve_login_email', { p_phone: phone });
  if(lookupErr || !email){ toast('No account found for that mobile number','bad'); return; }
  const { error } = await sb.auth.signInWithPassword({ email, password: pass });
  if(error){ toast('Incorrect mobile number or password','bad'); return; }
  closeSheet();
  toast('Signed in!');
}
function sheetSetupLogin(){
  return `
  <h2>Set up faster sign-in</h2>
  <p class="muted">Add a mobile number and password so you don't have to wait for a new email link every time you sign in.</p>
  <div class="field" style="margin-top:14px;"><label>Mobile number</label><input id="su_phone" placeholder="7XXXXXX"></div>
  <div class="field"><label>Password</label><input id="su_pass" type="password" placeholder="At least 6 characters"></div>
  <div class="field"><label>Confirm password</label><input id="su_pass2" type="password" placeholder="Re-enter password"></div>
  <button class="btn btn-primary" onclick="submitLoginSetup()">Save & continue</button>
  <p class="muted" style="font-size:.78em; margin-top:12px;">You're signed in as ${state.customerEmail}. This just adds a faster way back in next time.</p>`;
}
async function submitLoginSetup(){
  const phone = val('su_phone'), pass = val('su_pass'), pass2 = val('su_pass2');
  if(!phone){ toast('Enter your mobile number','bad'); return; }
  if(!pass || pass.length<6){ toast('Password must be at least 6 characters','bad'); return; }
  if(pass!==pass2){ toast('Passwords do not match','bad'); return; }
  const { error: passErr } = await sb.auth.updateUser({ password: pass });
  if(passErr){ toast(passErr.message,'bad'); return; }
  const { error: profErr } = await sb.from('user_profiles').insert({ user_id: state.customerId, phone, email: state.customerEmail });
  if(profErr){
    if(profErr.code==='23505' || /duplicate/i.test(profErr.message)) toast('That mobile number is already registered to another account','bad');
    else toast('Could not save: '+profErr.message,'bad');
    return;
  }
  state.sheet = null; state.sheetData = null; render();
  toast('You can now sign in with your mobile number and password!');
}

  if(sb) await sb.auth.signOut();

  const entries = Object.entries(state.cart);
  const lines = entries.map(([id,qty])=>{ const it = DB.items.find(i=>i.id===id); return {itemId:id, name:it.name, price:it.price, qty}; });
  const itemsTotal = lines.reduce((s,l)=>s+l.price*l.qty,0);
  const biz = DB.businesses.find(b=>b.id===bizId);
  const name = val('c_name')||state.customerName; const phone = val('c_phone');
  if(!lines.length){ toast('Your cart is empty','bad'); return; }
  const fee = zoneFee(_selectedZone);
  state.customerName = name;
  const order = {
    id: uid('ord'), businessId: biz.id, businessName: biz.name,
    customerId: state.customerId, customerEmail: state.customerEmail,
    customerName: name, customerPhone: phone, items: lines,
    itemsTotal, deliveryFee: fee, total: itemsTotal+fee, zone:_selectedZone,
    deliveryPersonId:null, deliveryPersonName:null,
    paymentMethod: _selectedPay,
    paymentStatus: _selectedPay==='transfer' ? 'pending_transfer' : 'pending_cash',
    status:'placed', createdAt: Date.now(), slipDataUrl:null
  };
  DB.orders.push(order); saveDB('orders');
  state.cart = {};
  closeSheet();
  go('custOrders');
  toast('Order placed!');
}

function renderCustOrders(){
  if(sb && !state.authed){
    document.getElementById('app').innerHTML = wrapShell('customer','custOrders', `
      ${topbar('My orders')}
      <div style="padding:4px 16px 0;">
        <div class="empty">
          <span class="ic">🔒</span>Sign in with your email to see your orders
          <button class="btn btn-primary" style="margin-top:16px;" onclick="openSheet('signIn')">Sign in</button>
        </div>
      </div>
    `);
    return;
  }
  const mine = sb ? DB.orders.filter(o=>o.customerId===state.customerId) : DB.orders;
  const sorted = mine.sort((a,b)=>b.createdAt-a.createdAt);
  document.getElementById('app').innerHTML = wrapShell('customer','custOrders', `
    ${topbar('My orders')}
    <div style="padding:4px 16px 0;">
      ${sorted.length? sorted.map(o=>custOrderCard(o)).join('') : `<div class="empty"><span class="ic">🧾</span>No orders yet — go browse a store!</div>`}
    </div>
  `);
}
function custOrderCard(o){
  const biz = DB.businesses.find(b=>b.id===o.businessId);
  const showAcct = o.paymentMethod==='transfer' && o.paymentStatus!=='paid';
  return `
  <div class="glass card">
    <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3>${paymentStatusPill(o)}</div>
    <p class="muted" style="font-size:.85em; margin:4px 0 8px;">${o.businessName} · ${money(o.total)}</p>
    ${showAcct ? `
      <div class="acct-box"><div class="lbl">Pay to</div><div class="val">${biz.accountName} · ${biz.accountNumber}</div></div>
      ${o.paymentStatus==='pending_transfer' ? `<button class="btn btn-primary btn-sm" style="width:100%; margin-top:10px;" onclick="openSheet('uploadSlip','${o.id}')">Upload transfer slip</button>` : `<p class="muted" style="font-size:.8em; margin-top:8px;">Slip uploaded — waiting on store to confirm</p>`}
    ` : ''}
    ${o.paymentMethod==='cash_to_delivery' && o.paymentStatus==='pending_cash' ? `<p class="muted" style="font-size:.82em;">Have ${money(o.total)} cash ready for your delivery partner.</p>` : ''}
  </div>`;
}
function sheetUploadSlip(){
  const o = DB.orders.find(x=>x.id===state.sheetData);
  return `
  <h2>Upload transfer slip</h2>
  <p class="muted">Order #${o.id.slice(-5).toUpperCase()} · ${money(o.total)}</p>
  <div class="field" style="margin-top:14px;">
    <label>Slip / screenshot</label>
    <input type="file" accept="image/*" id="slipFile" style="display:none;" onchange="previewSlip(event)">
    <label for="slipFile" class="filebtn">📎 Tap to choose an image</label>
    <img id="slipPreview" style="width:100%; border-radius:14px; margin-top:10px; display:none; max-height:200px; object-fit:cover;">
  </div>
  <button class="btn btn-primary" onclick="submitSlip('${o.id}')">Submit for approval</button>`;
}
let _slipData = null;
function previewSlip(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{ _slipData = reader.result; const img=document.getElementById('slipPreview'); img.src=_slipData; img.style.display='block'; };
  reader.readAsDataURL(f);
}
function submitSlip(id){
  const o = DB.orders.find(x=>x.id===id);
  o.paymentStatus='slip_uploaded'; o.slipDataUrl = _slipData;
  saveDB('orders'); _slipData=null; closeSheet(); toast('Slip submitted — waiting for store approval'); render();
}

/* =================== INIT =================== */
(async function init(){
  await loadDB();
  seedIfEmpty();
  if(sb){
    const { data:{ session } } = await sb.auth.getSession();
    applySession(session);
    if(state.authed){ if(state.adminMode) await checkAdminStatus(); else await checkLoginProfile(); }
    sb.auth.onAuthStateChange((_event, session)=>{
      applySession(session);
      if(state.authed){ if(state.adminMode) checkAdminStatus(); else checkLoginProfile(); }
      render();
    });
  }
  render();
})();
</script>
</body>
</html>
