<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Maldexpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg1:#04222c;
    --bg2:#0a4a5c;
    --bg3:#0f7a8c;
    --lagoon:#22b8c8;
    --coral:#ff8a5c;
    --coral-dk:#e8663a;
    --sand:#f6ecd9;
    --ink:#eafdff;
    --ink-dim:rgba(234,253,255,.68);
    --glass:rgba(255,255,255,.10);
    --glass-brd:rgba(255,255,255,.22);
    --glass-hi:rgba(255,255,255,.18);
    --danger:#ff6b6b;
    --good:#3ddc97;
    --warn:#ffcf5c;
    --radius:22px;
    --fs:16px;
    font-size:var(--fs);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(1200px 800px at 15% -10%, rgba(34,184,200,.35), transparent 60%),
      radial-gradient(900px 700px at 110% 10%, rgba(255,138,92,.20), transparent 55%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3) 130%);
    background-attachment:fixed;
    overflow-x:hidden;
    font-size:1rem;
  }
  body::before{
    content:"";
    position:fixed; inset:0; z-index:-1;
    background-image:
      repeating-linear-gradient(100deg, rgba(255,255,255,.035) 0px, rgba(255,255,255,.035) 2px, transparent 2px, transparent 90px),
      repeating-linear-gradient(80deg, rgba(255,255,255,.02) 0px, rgba(255,255,255,.02) 2px, transparent 2px, transparent 140px);
    animation: drift 40s linear infinite;
  }
  @keyframes drift{ 0%{background-position:0 0, 0 0;} 100%{background-position:400px 200px, -300px 260px;} }
  h1,h2,h3,.display{font-family:'Fraunces',serif; letter-spacing:.2px;}
  h1{font-size:1.9em; font-weight:700; margin:0;}
  h2{font-size:1.25em; font-weight:600; margin:0 0 .6em;}
  h3{font-size:1.05em; font-weight:600; margin:0;}
  p{margin:0; line-height:1.5;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:1em;}
  a{color:inherit;}

  .glass{
    background:var(--glass);
    border:1px solid var(--glass-brd);
    border-radius:var(--radius);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 8px 32px rgba(0,10,15,.28), inset 0 1px 0 rgba(255,255,255,.15);
  }

  /* ---------- App shell ---------- */
  #app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:92px;}

  /* Landing */
  .landing{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:28px 22px;}
  .landing-mark{text-align:center; margin-bottom:36px;}
  .landing-mark h1{font-size:2.1em;}
  .landing-mark p{color:var(--ink-dim); margin-top:6px;}
  .role-card{
    padding:20px 20px; margin-bottom:14px; display:flex; align-items:center; gap:16px;
    transition:transform .18s ease, background .18s ease;
  }
  .role-card:active{transform:scale(.98);}
  .role-card .ic{
    width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:1.5em; background:linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.06));
    border:1px solid var(--glass-brd); flex-shrink:0;
  }
  .role-card .txt{flex:1; min-width:0;}
  .role-card .txt h3{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .role-card .txt small{color:var(--ink-dim); font-size:.85em;}
  .role-card .arrow{color:var(--coral); font-size:1.3em; flex-shrink:0;}

  /* Header */
  .topbar{
    position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
    padding:16px 18px; margin-bottom:6px;
  }
  .topbar .iconbtn{
    width:42px; height:42px; border-radius:14px; border:1px solid var(--glass-brd); background:var(--glass);
    display:flex; align-items:center; justify-content:center; font-size:1.15em; color:var(--ink); flex-shrink:0;
  }
  .topbar .titles{flex:1; min-width:0;}
  .topbar .titles h1{font-size:1.15em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar .titles .sub{font-size:.78em; color:var(--ink-dim);}
  .badge{
    padding:3px 10px; border-radius:999px; font-size:.72em; font-weight:700; letter-spacing:.3px;
    border:1px solid var(--glass-brd);
  }
  .badge.free{background:rgba(255,207,92,.18); color:var(--warn);}
  .badge.pro{background:rgba(61,220,151,.18); color:var(--good);}

  main{padding:0 16px;}
  .section{margin-bottom:20px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .section-head h2{margin:0;}
  .link-btn{color:var(--lagoon); font-size:.9em; font-weight:700; background:none; border:none; padding:4px;}

  /* Cards */
  .card{padding:16px; margin-bottom:12px;}
  .card.tight{padding:14px 16px;}
  .row{display:flex; align-items:center; gap:12px;}
  .row.between{justify-content:space-between;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .muted{color:var(--ink-dim);}
  .price{color:var(--coral); font-weight:800;}

  .item-card{padding:14px; display:flex; gap:12px; align-items:center; margin-bottom:10px;}
  .item-thumb{
    width:56px; height:56px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.5em;
    background:linear-gradient(145deg, rgba(255,138,92,.35), rgba(34,184,200,.25));
    border:1px solid var(--glass-brd); overflow:hidden;
  }
  .item-thumb img{width:100%; height:100%; object-fit:cover;}
  .item-info{flex:1; min-width:0;}
  .item-info h3{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{
    width:30px; height:30px; border-radius:10px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--ink); font-size:1.1em;
    display:flex; align-items:center; justify-content:center;
  }
  .qty-ctrl button:active{transform:scale(.9);}

  /* Buttons */
  .btn{
    border:none; border-radius:16px; padding:13px 18px; font-weight:700; font-size:.95em;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005; box-shadow:0 6px 18px rgba(255,138,92,.35);}
  .btn-ghost{background:var(--glass); border:1px solid var(--glass-brd); color:var(--ink);}
  .btn-outline{background:transparent; border:1px solid var(--glass-brd); color:var(--ink);}
  .btn-good{background:linear-gradient(135deg, #4de3a8, #23b47c); color:#04241a;}
  .btn-sm{padding:9px 14px; font-size:.85em; width:auto;}
  .btn[disabled]{opacity:.4; pointer-events:none;}

  .fab{
    position:fixed; right:20px; bottom:110px; z-index:25;
    width:58px; height:58px; border-radius:50%; border:none;
    background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005;
    font-size:1.6em; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 26px rgba(255,138,92,.45); max-width:520px; margin:0 auto;
  }

  /* Bottom nav */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:14px; z-index:30;
    max-width:480px; margin:0 auto; padding:0 20px;
  }
  .bottomnav .bar{
    display:flex; justify-content:space-around; padding:10px 6px; border-radius:24px;
  }
  .navbtn{
    background:none; border:none; color:var(--ink-dim); display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:.68em; font-weight:700; padding:6px 10px; border-radius:14px; flex:1;
  }
  .navbtn .ic{font-size:1.35em;}
  .navbtn.active{color:var(--sand); background:rgba(255,255,255,.12);}
  .navbtn:active{background:rgba(255,255,255,.12);}

  /* Drawer / menu */
  .overlay{
    position:fixed; inset:0; background:rgba(2,15,20,.55); backdrop-filter:blur(4px); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:78%; max-width:320px; z-index:61;
    padding:26px 18px; transform:translateX(-105%); transition:transform .26s cubic-bezier(.2,.9,.3,1);
    border-radius:0 26px 26px 0; display:flex; flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer .who{padding:8px 6px 18px; border-bottom:1px solid var(--glass-brd); margin-bottom:14px;}
  .drawer .who .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--lagoon),var(--coral)); display:flex;align-items:center;justify-content:center; font-weight:800; margin-bottom:8px;}
  .drawer-item{
    display:flex; align-items:center; gap:12px; padding:13px 10px; border-radius:14px; color:var(--ink); background:none; border:none; width:100%; text-align:left; font-size:.95em; font-weight:600;
  }
  .drawer-item:active{background:var(--glass);}
  .drawer-item .ic{width:22px; text-align:center;}
  .drawer-spacer{flex:1;}

  /* Modal / popup sheets */
  .sheet-wrap{
    position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sheet-wrap.show{opacity:1; pointer-events:auto;}
  .sheet-wrap .backdrop{position:absolute; inset:0; background:rgba(2,12,16,.6); backdrop-filter:blur(3px);}
  .sheet{
    position:relative; width:100%; max-width:520px; max-height:85vh; overflow-y:auto;
    border-radius:26px; padding:24px 20px 26px; transform:scale(.94); opacity:0;
    transition:transform .22s cubic-bezier(.2,.9,.3,1), opacity .18s ease;
  }
  .sheet-wrap.show .sheet{transform:scale(1); opacity:1;}
  .sheet .handle{display:none;}
  .sheet-close{position:absolute; right:16px; top:16px; width:34px; height:34px; border-radius:50%; border:1px solid var(--glass-brd); background:var(--glass); color:var(--ink); font-size:1.1em;}
  .sheet-close:active, .topbar .iconbtn:active{transform:scale(.92);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.82em; color:var(--ink-dim); margin-bottom:6px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--glass-brd); background:rgba(255,255,255,.08);
    color:var(--ink); outline:none;
  }
  .field input::placeholder, .field textarea::placeholder{color:rgba(234,253,255,.4);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--lagoon); background:rgba(255,255,255,.13);}
  .field.file{position:relative;}
  .field .filebtn{display:flex; align-items:center; justify-content:center; gap:8px; padding:22px; border:1.5px dashed var(--glass-brd); border-radius:16px; color:var(--ink-dim); font-weight:600;}

  /* bottom:180px clears not just the .bottomnav but also the taller floating controls
     that can be showing at the same time - .fab (bottom:110px, 58px tall, top edge
     168px) and .cart-fab (bottom:96px, ~48px tall) - so a toast never visually sits on
     top of either while it's up. */
  .toast-wrap{position:fixed; bottom:180px; left:0; right:0; z-index:25; display:flex; justify-content:center; pointer-events:none;}
  .toast{padding:12px 20px; border-radius:16px; font-weight:700; font-size:.9em; display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(80px); transition:transform .3s ease, opacity .3s ease; max-width:90%;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.good{background:rgba(61,220,151,.25); border:1px solid rgba(61,220,151,.5); color:#c6ffe5;}
  .toast.bad{background:rgba(255,107,107,.25); border:1px solid rgba(255,107,107,.5); color:#ffd6d6;}

  .status-pill{padding:4px 11px; border-radius:99px; font-size:.72em; font-weight:800;}
  .status-pill.wait{background:rgba(255,207,92,.2); color:var(--warn);}
  .status-pill.ok{background:rgba(61,220,151,.2); color:var(--good);}
  .status-pill.mid{background:rgba(34,184,200,.22); color:var(--lagoon);}
  .status-pill.bad{background:rgba(255,107,107,.2); color:var(--danger);}

  .acct-box{
    padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.07); border:1px dashed var(--glass-brd); margin-top:10px;
  }
  .acct-box .lbl{font-size:.72em; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.5px;}
  .acct-box .val{font-weight:700; font-size:1.05em; margin-top:2px; word-break:break-all;}

  .empty{text-align:center; padding:50px 16px; color:var(--ink-dim);}
  .empty .ic{font-size:2.4em; margin-bottom:10px; display:block;}

  .tabs{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
  .tab{padding:9px 16px; border-radius:14px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--ink-dim); font-weight:700; font-size:.85em; white-space:nowrap;}
  .tab.active{background:linear-gradient(135deg, rgba(255,138,92,.9), rgba(232,102,58,.9)); color:#241005; border-color:transparent;}
  .tab:active{transform:scale(.95);}

  .cart-fab{
    position:fixed; left:16px; right:16px; bottom:96px; z-index:24; max-width:488px; margin:0 auto;
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between; border-radius:20px;
    background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005; box-shadow:0 10px 26px rgba(255,138,92,.4);
  }

  .slider-row{display:flex; align-items:center; gap:12px;}
  input[type=range]{-webkit-appearance:none; flex:1; height:6px; border-radius:99px; background:var(--glass-brd); outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--coral); border:3px solid var(--sand); cursor:pointer;}
  .fs-demo{font-size:1em; padding:12px; border-radius:14px; background:rgba(255,255,255,.06); text-align:center; margin-top:10px;}

  .hidden{display:none !important;}
  .divider{height:1px; background:var(--glass-brd); margin:14px 0;}

  /* ---------- Home feed (redesign) ---------- */
  .home-header{justify-content:space-between;}
  .home-logo{flex:1; text-align:center; font-family:'Fraunces',serif; font-weight:700; font-size:1.2em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .notif-dot{position:absolute; top:7px; right:7px; width:9px; height:9px; border-radius:50%; background:var(--coral); border:2px solid var(--bg1);}

  .home-search-wrap{
    flex:1; min-width:0; display:flex; align-items:center; gap:8px; padding:0 14px;
    border-radius:14px; background:rgba(255,255,255,.08); border:1px solid var(--glass-brd);
  }
  .home-search-wrap input{flex:1; min-width:0; border:none; background:transparent; padding:12px 0; color:var(--ink); outline:none;}
  .home-search-wrap input::placeholder{color:rgba(234,253,255,.4);}
  .field-icon{font-size:1em; opacity:.7; flex-shrink:0;}

  .switcher-wrap{position:relative; flex-shrink:0;}
  .switcher-pill{
    display:flex; align-items:center; gap:6px; padding:11px 14px; border-radius:14px;
    background:var(--glass); border:1px solid var(--glass-brd);
    backdrop-filter:blur(22px) saturate(140%); -webkit-backdrop-filter:blur(22px) saturate(140%);
    color:var(--ink); font-weight:700; font-size:.82em; white-space:nowrap;
  }
  .switcher-pill.accent{background:rgba(34,184,200,.28); border-color:rgba(34,184,200,.55);}
  .switcher-pill:active{transform:scale(.96);}
  .switcher-dropdown{position:absolute; top:calc(100% + 8px); right:0; z-index:20; box-shadow:0 8px 24px rgba(0,10,15,.35); width:100%;}

  .cat-scroll{display:flex; gap:16px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-pill{display:flex; flex-direction:column; align-items:center; gap:6px; background:none; border:none; flex-shrink:0; width:64px;}
  .cat-circle{width:54px; height:54px; border-radius:50%; border:1.5px solid var(--glass-brd); display:flex; align-items:center; justify-content:center; font-size:1.5em; background:transparent; color:var(--ink);}
  .cat-label{font-size:.72em; color:var(--ink-dim); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:64px;}
  .cat-pill.active .cat-circle{border-color:var(--coral); color:var(--coral);}
  .cat-pill.active .cat-label{color:var(--ink);}
  .cat-pill:active{transform:scale(.95);}

  .featured-scroll{display:flex; gap:14px; overflow-x:auto; scroll-snap-type:x mandatory; padding-bottom:4px; scrollbar-width:none;}
  .featured-scroll::-webkit-scrollbar{display:none;}
  .featured-card{
    flex:0 0 82%; scroll-snap-align:start; border-radius:22px; min-height:180px; padding:20px;
    display:flex; align-items:flex-end; position:relative; overflow:hidden; color:#fff;
    box-shadow:0 10px 26px rgba(0,10,15,.3);
  }
  .featured-scrim{position:absolute; inset:0; background:linear-gradient(to top, rgba(0,0,0,.6), transparent 65%);}
  .featured-card > div{position:relative; z-index:1;}
  .featured-card .biz{font-size:.72em; opacity:.85; font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
  .featured-card h3{font-size:1.3em; margin:.2em 0; color:#fff;}
  .featured-card .price{color:#fff; font-weight:800;}
  .dots{display:flex; justify-content:center; gap:6px; margin-top:10px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--glass-brd); transition:all .2s ease;}
  .dot.active{width:18px; border-radius:4px; background:var(--coral);}

  .top-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .top-card{border-radius:20px; overflow:hidden; background:rgba(255,255,255,.06);}
  .top-card .img-wrap{
    position:relative; aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:2.2em;
    background:linear-gradient(145deg, rgba(255,138,92,.28), rgba(34,184,200,.22));
  }
  .top-card .img-wrap img{width:100%; height:100%; object-fit:cover;}
  .top-add-btn{
    position:absolute; right:8px; bottom:8px; width:32px; height:32px; border-radius:50%; border:none;
    background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005; font-size:1.2em; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(255,138,92,.4);
  }
  .top-add-btn:active{transform:scale(.9);}
  .top-card .info{padding:10px 12px 14px;}
  .biz-label{font-size:.7em; color:var(--ink-dim); font-weight:700; text-transform:uppercase; letter-spacing:.3px;}
  .top-card h3{font-size:.92em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:.25em 0;}
  .top-card .price{font-size:.88em;}

  /* Compact floating bottom-nav pill (customer home redesign) */
  .bottomnav.compact{left:50%; right:auto; transform:translateX(-50%); max-width:none; width:auto; padding:0;}
  .bottomnav.compact .bar{padding:8px; gap:2px;}
  .bottomnav.compact .navbtn{flex:none; flex-direction:row; padding:10px 18px; font-size:.8em; gap:7px;}
  .bottomnav.compact .navbtn .ic{font-size:1.1em;}
  .bottomnav.compact .navbtn.active{background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005;}

  /* ---------- Sign-up screen (redesign) ---------- */
  .field-icon-input{position:relative;}
  .field-icon-input input{padding-left:42px; padding-right:42px;}
  .field-icon-input .fi-icon{position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:1em; opacity:.65; pointer-events:none;}
  .field-icon-input .fi-eye{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none;
    color:var(--ink-dim); font-size:1.05em; padding:6px; cursor:pointer;
  }
  .role-tiles{display:flex; gap:8px; margin-bottom:14px;}
  .role-tile{
    flex:1; padding:14px 8px; border-radius:14px; border:1px solid var(--glass-brd); background:var(--glass);
    color:var(--ink-dim); font-weight:700; font-size:.8em; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .role-tile .ic{font-size:1.3em;}
  .role-tile.active{background:linear-gradient(135deg, rgba(255,138,92,.9), rgba(232,102,58,.9)); color:#241005; border-color:transparent;}
  .role-tile:active{transform:scale(.96);}
  .policy-box{display:flex; gap:10px; align-items:flex-start; padding:14px; border-radius:14px; background:rgba(255,255,255,.06); border:1px solid var(--glass-brd); margin:14px 0;}

-- submitCompleteAuctionOrder(), confirmCashReceived(), markDelivered(),

-- Revisit alongside a payout-lockdown SECURITY DEFINER pass if total/

create policy "business read own orders" on orders for select

create policy "rider read assigned or open orders" on orders for select

  );
create policy "customer update own order" on orders for update
  using (auth.uid() = customer_id)
  with check (auth.uid() = customer_id);
create policy "business update own orders" on orders for update
  using (exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid()));
create policy "rider update assigned or open orders" on orders for update
  using (
    orders.delivery_person_id is null
    or exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  )
  with check (
    exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  );

-- Mobile number + password sign-in (set up after a user's first magic-link
-- login). Password auth itself is Supabase's built-in email+password —
-- this table just maps a phone number to the account's email so a
-- not-yet-signed-in visitor can look up which email to authenticate,
-- and enforces phone uniqueness (email uniqueness is already enforced
-- natively by auth.users).

  user_id uuid primary key references auth.users(id) on delete cascade,
  phone text unique not null,
  email text unique not null,
  created_at timestamptz default now()
);
alter table user_profiles enable row level security;
create policy "self read own profile" on user_profiles for select using (auth.uid() = user_id);
create policy "self insert own profile" on user_profiles for insert with check (auth.uid() = user_id);

-- Security-definer lookup so an unauthenticated visitor can resolve a
-- phone number to its account email (only that one field, nothing else)
-- before calling signInWithPassword. Safe to expose to anon.
create or replace function resolve_login_email(p_phone text)
returns text
language sql
security definer
set search_path = public
as $$
  select email from user_profiles where phone = p_phone limit 1;
$$;
grant execute on function resolve_login_email(text) to anon, authenticated;

-- Super Admin: a manually-seeded allowlist (no self-service signup for
-- this — add rows directly in SQL). is_admin() is security-definer so
-- it can be used inside other tables' RLS policies without those
-- tables needing their own read access to `admins`.
create table admins (
  user_id uuid primary key references auth.users(id) on delete cascade,
  created_at timestamptz default now()
);
alter table admins enable row level security;
create policy "admin read own admin row" on admins for select using (auth.uid() = user_id);

create or replace function is_admin()
returns boolean
language sql
security definer
set search_path = public
as $$
  select exists(select 1 from admins where user_id = auth.uid());
$$;
grant execute on function is_admin() to authenticated;

-- Postgres OR's multiple permissive policies for the same command).

-- Admins can also see phone/email for any user who's set up mobile

-- Auction listings: a business chooses "Auction" instead of "Buy Now" when
-- listing an item (see items.listing_type above). There's no background job
-- runner in this app, so closing an ended auction and settling its winner
-- both happen lazily from the client whenever anyone views/interacts with the
-- listing (see checkAndSettleAuction()/settleAuctionWin()) rather than on a
-- timer - the "signed-in update auction" policy below is what makes that
-- safe to do from any authenticated visitor's browser.
create table auction_listings (
  id text primary key,
  item_id text references items(id) on delete cascade not null,
  business_id text references businesses(id) not null,
  starting_price numeric not null check (starting_price > 0),
  bid_increment numeric not null check (bid_increment > 0),
  start_time timestamptz not null default now(),
  end_time timestamptz not null,
  current_highest_bid numeric,
  current_highest_bidder uuid references auth.users(id),
  status text not null default 'active' check (status in ('active','ended','settled')),
  order_id text references orders(id),
  created_at timestamptz default now()
);
alter table auction_listings enable row level security;
create policy "public read auctions" on auction_listings for select using (true);
create policy "owner insert own auction" on auction_listings for insert
  with check (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
-- Deliberately permissive (any authenticated visitor, not just the seller or
-- winning bidder) since the lazy active->ended transition needs to happen
-- from whoever's browser next views an expired listing. Blocked once
-- 'settled' - a won auction's order has already been created and shouldn't
-- be touched again. This governs status/order_id only - current_highest_bid
-- and current_highest_bidder are locked down further below, once place_bid()
-- exists to be the only way those two actually get written.
create policy "signed-in update auction" on auction_listings for update to authenticated
  using (status in ('active','ended'))
  with check (true);

-- Full bid history - kept even after the winning bid is cached on
-- auction_listings above, for an auditable record of every bid placed.
create table auction_bids (
  id text primary key,
  auction_id text references auction_listings(id) on delete cascade not null,
  bidder_id uuid references auth.users(id) not null,
  bid_amount numeric not null check (bid_amount > 0),
  created_at timestamptz default now()
);
alter table auction_bids enable row level security;
create policy "public read bids" on auction_bids for select using (true);
-- Kept as a defense-in-depth backstop against a raw insert bypassing
-- place_bid() below (e.g. a hand-crafted API call) - place_bid() itself runs
-- as SECURITY DEFINER and doesn't go through this policy at all, so it isn't
-- what closes the race (the atomic UPDATE inside place_bid() does that); this
-- just stops a bypass attempt from writing a bid the way the old
-- insert-then-update flow used to.
create policy "customer valid bid" on auction_bids for insert
  with check (
    bidder_id = auth.uid()
    and exists (
      select 1 from auction_listings al
      where al.id = auction_id
        and al.status = 'active'
        and al.end_time > now()
        and bid_amount >= coalesce(al.current_highest_bid + al.bid_increment, al.starting_price)
        and not exists (select 1 from businesses b where b.id = al.business_id and b.owner_id = auth.uid())
    )
  );

-- Places a bid atomically. The UPDATE below is a single SQL statement whose
-- WHERE clause re-checks the increment rule against the row's CURRENT values
-- at write time, so Postgres serializes concurrent calls to this function
-- against the same row - two bids landing within milliseconds of each other
-- can no longer both pass validation against the same stale highest-bid
-- value the way the old separate insert-then-update from the client could.
-- No SELECT ... FOR UPDATE or other explicit locking needed; the atomicity
-- of one UPDATE statement is what does it. The auction_bids insert only
-- happens (via the `ins` CTE selecting `from updated`) once the UPDATE has
-- actually matched a row, so a rejected bid never gets recorded as history.
-- SECURITY DEFINER so it can write current_highest_bid/current_highest_bidder
-- despite the revoke just below locking those two columns down for everyone
-- else - this function is now the only way a bid actually moves the price.
create or replace function place_bid(p_auction_id text, p_bid_amount numeric)
returns setof auction_listings
language sql
security definer
set search_path = public
as $$
  with updated as (
    update auction_listings
    set current_highest_bid = p_bid_amount, current_highest_bidder = auth.uid()
    where id = p_auction_id
      and status = 'active'
      and end_time > now()
      and auth.uid() is not null
      and not exists (select 1 from businesses b where b.id = auction_listings.business_id and b.owner_id = auth.uid())
      and (
        (current_highest_bid is null and p_bid_amount >= starting_price)
        or (current_highest_bid is not null and p_bid_amount >= current_highest_bid + bid_increment)
      )
    returning *
  ),
  ins as (
    insert into auction_bids (id, auction_id, bidder_id, bid_amount)
    select 'bid_' || replace(gen_random_uuid()::text, '-', ''), p_auction_id, auth.uid(), p_bid_amount
    from updated
    returning 1
  )
  select * from updated;
$$;
grant execute on function place_bid(text, numeric) to authenticated;

-- Bidding now only happens through place_bid() above - lock the two
-- price-affecting columns down so no authenticated client can set them
-- directly via a raw REST update, which would otherwise bypass the atomic
-- check entirely and reopen the exact race place_bid() exists to close.
-- status/order_id (used by the lazy close/settle flow) are untouched by
-- this and remain updatable per the "signed-in update auction" policy above.
revoke update (current_highest_bid, current_highest_bidder) on auction_listings from authenticated;

-- Pro-tier upgrade requests: bank transfer (needs manual admin
-- approval) or Swipe (auto-approved by the payment webhook, no admin
-- action needed — logged here for visibility).
create table pro_upgrade_requests (
  id text primary key,
  business_id text references businesses(id) on delete cascade,
  payment_method text not null check (payment_method in ('bank_transfer','swipe')),
  status text not null default 'pending' check (status in ('pending','approved','rejected')),
  amount numeric not null default 500,
  slip_url text,
  swipe_reference text,
  swipe_payment_link text,
  created_at timestamptz default now(),
  resolved_at timestamptz,
  resolved_by uuid references auth.users(id)
);
alter table pro_upgrade_requests enable row level security;
create policy "owner insert own upgrade request" on pro_upgrade_requests for insert
  with check (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "owner read own upgrade requests" on pro_upgrade_requests for select
  using (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
-- Lets create-swipe-payment roll back its own just-inserted row if
-- registering the reference with SeaFare fails right after.
create policy "owner delete own upgrade request" on pro_upgrade_requests for delete
  using (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "admin read all upgrade requests" on pro_upgrade_requests for select using (is_admin());
create policy "admin update upgrade requests" on pro_upgrade_requests for update using (is_admin());

-- Per-listing delivery: a business now just checks/unchecks "Free delivery for
-- buyer" on each item (checked by default). It no longer changes HOW delivery
-- works - the buyer always picks a zone at checkout, same as always, and the
-- zone's flat fee is always what the delivery partner is paid. The checkbox
-- only controls whether that fee is ALSO charged to the buyer.
alter table items add column if not exists free_delivery boolean not null default true;
-- Superseded by free_delivery above - drop if the short-lived previous version
-- of this feature was ever run against this database.
alter table items drop column if exists delivery_type;
alter table items drop column if exists delivery_payout;

-- Orders: delivery_partner_payout is always the zone's flat fee (the delivery
-- partner is paid the same amount regardless of who's charged for it) -
-- delivery_type on the order records whether the buyer's total included that
-- fee ('zone') or not ('free'), decided by whether every item in the cart had
-- free_delivery checked (a cart is one business; if even one item requires
-- the buyer to pay, the fee is charged for the whole order).
-- Cash orders: 'zone' orders are unchanged (rider collects the fee inside
-- `total`, keeps it as their cut, remits `total - delivery_partner_payout`).
-- 'free' orders collect no fee at all, so the rider remits the FULL `total`
-- to the business and is paid their delivery_partner_payout separately.
-- Transfer orders: 'zone' orders are unchanged (buyer's transfer already
-- covers the fee - no payout tracking needed, same as the original app).
-- 'free' orders only collect the item price, so payout_status tracks the
-- business's separate obligation to pay the rider the fee once delivered -
-- for BOTH payment methods now, since a 'free' cash order also leaves that
-- fee uncollected from the buyer.
alter table orders add column if not exists delivery_type text not null default 'zone' check (delivery_type in ('zone','free'));
alter table orders add column if not exists delivery_partner_payout numeric;
alter table orders add column if not exists payout_status text check (payout_status is null or payout_status in ('pending','settled'));

-- Superseded columns from the short-lived previous version of this feature -
-- the custom per-item payout amount and the manual address/boat-info fields
-- are gone now that delivery always goes through the normal zone flow.
alter table orders drop column if exists delivery_address;
alter table orders drop column if exists boat_type;
alter table orders drop column if exists boat_name;
alter table orders drop column if exists boat_detail;

-- Backfill: every order placed before this feature (or its previous version)
-- is a zone-delivery order, so its delivery_partner_payout is exactly the fee
-- already on the row.
update orders set delivery_partner_payout = delivery_fee where delivery_partner_payout is null;
--------------------------------------------------- */

  if(part==='proRequests') return { id:o.id, business_id:o.businessId, payment_method:o.paymentMethod, status:o.status, amount:o.amount, slip_url:o.slipDataUrl, swipe_reference:o.swipeReference, swipe_payment_link:o.swipePaymentLink, created_at:new Date(o.createdAt).toISOString(), resolved_at:o.resolvedAt?new Date(o.resolvedAt).toISOString():null, resolved_by:o.resolvedBy||null };
  if(part==='auctions') return { id:o.id, item_id:o.itemId, business_id:o.businessId, starting_price:o.startingPrice, bid_increment:o.bidIncrement, start_time:new Date(o.startTime).toISOString(), end_time:new Date(o.endTime).toISOString(), current_highest_bid:o.currentHighestBid, current_highest_bidder:o.currentHighestBidder, status:o.status, order_id:o.orderId||null };
}
function fromDbRow(part, r){
  if(part==='businesses') return { id:r.id, ownerId:r.owner_id, name:r.name, ownerName:r.owner_name, phone:r.phone, accountNumber:r.account_number, accountName:r.account_name, tier:r.tier, joinDate:new Date(r.join_date).getTime(), paidAt:r.paid_at?new Date(r.paid_at).getTime():null, category:r.category };
  if(part==='items') return { id:r.id, businessId:r.business_id, name:r.name, price:Number(r.price), stock:r.stock, category:r.category, imageUrl:r.image_url||null, listingType:r.listing_type||'buy_now', freeDelivery:r.free_delivery!==false };
  if(part==='delivery') return { id:r.id, userId:r.user_id, name:r.name, phone:r.phone };
  if(part==='orders') return { id:r.id, businessId:r.business_id, businessName:r.business_name, customerId:r.customer_id, customerEmail:r.customer_email, customerName:r.customer_name, customerPhone:r.customer_phone, items:r.items, itemsTotal:Number(r.items_total), deliveryFee:Number(r.delivery_fee), total:Number(r.total), zone:r.zone, deliveryPersonId:r.delivery_person_id, deliveryPersonName:r.delivery_person_name, paymentMethod:r.payment_method, paymentStatus:r.payment_status, status:r.status, slipDataUrl:r.slip_url, createdAt:new Date(r.created_at).getTime(), deliveryType:r.delivery_type||'zone', deliveryPartnerPayout:r.delivery_partner_payout!=null?Number(r.delivery_partner_payout):Number(r.delivery_fee), payoutStatus:r.payout_status||null };
  if(part==='proRequests') return { id:r.id, businessId:r.business_id, paymentMethod:r.payment_method, status:r.status, amount:Number(r.amount), slipDataUrl:r.slip_url, swipeReference:r.swipe_reference, swipePaymentLink:r.swipe_payment_link, createdAt:new Date(r.created_at).getTime(), resolvedAt:r.resolved_at?new Date(r.resolved_at).getTime():null, resolvedBy:r.resolved_by };
  if(part==='auctions') return { id:r.id, itemId:r.item_id, businessId:r.business_id, startingPrice:Number(r.starting_price), bidIncrement:Number(r.bid_increment), startTime:new Date(r.start_time).getTime(), endTime:new Date(r.end_time).getTime(), currentHighestBid:r.current_highest_bid!=null?Number(r.current_highest_bid):null, currentHighestBidder:r.current_highest_bidder, status:r.status, orderId:r.order_id };

async function loadDB(){
  if(!sb){
    toast('Add your Supabase URL & key in the script to connect a real backend', 'bad');
    storageReady = true;
    return;
  }
  try{
    const [b,i,o,d,pr,au] = await Promise.all([
      sb.from('businesses').select('*'),
      sb.from('items').select('*'),
      sb.from('orders').select('*'),
      sb.from('delivery_persons').select('*'),
      sb.from('pro_upgrade_requests').select('*'),
      sb.from('auction_listings').select('*')
    ]);
    // Promise.all only rejects on a thrown/network-level failure - a query that
    // completes but fails server-side (e.g. an RLS policy error) resolves normally
    // with a populated .error field instead, which was previously never checked,
    // so a broken policy on just one table silently looked like "this store has no
    // items" rather than surfacing anything was wrong.
    const failed = [['businesses',b],['items',i],['orders',o],['delivery',d],['pro upgrade requests',pr],['auctions',au]]
      .filter(([,res])=>res.error);
    if(failed.length){
      failed.forEach(([label,res])=>console.error(`loadDB: ${label} query failed:`, res.error));
      toast(`Could not load ${failed.map(([label])=>label).join(', ')} — some data may be missing`, 'bad');
    }
    DB.businesses = (b.data||[]).map(r=>fromDbRow('businesses',r));
    DB.items = (i.data||[]).map(r=>fromDbRow('items',r));
    DB.orders = (o.data||[]).map(r=>fromDbRow('orders',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.delivery = (d.data||[]).map(r=>fromDbRow('delivery',r));
    DB.proRequests = (pr.data||[]).map(r=>fromDbRow('proRequests',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.auctions = (au.data||[]).map(r=>fromDbRow('auctions',r));
  }catch(e){ console.error(e); toast('Could not reach Supabase — check your config', 'bad'); }
  storageReady = true;
}
async function saveDB(part, only){
  if(!sb) return;
  try{
    // `only`, when given, limits the upsert to specific rows rather than the
    // whole DB[part] array. Needed for 'items': DB.items holds every
    // business's items (loaded via the public-read policy for customer
    // browsing), but the owner-only RLS check on writes rejects the entire
    // upsert if the batch includes even one row this session doesn't own.
    const rows = (only || DB[part]).map(o=>toDbRow(part,o));
    const { error } = await sb.from(TABLES[part]).upsert(rows);
    if(error){ console.error(error); toast('Save failed: '+error.message, 'bad'); }
  }catch(e){ console.error(e); toast('Save failed — check connection', 'bad'); }
}

function auctionForItem(itemId){ return DB.auctions.find(a=>a.itemId===itemId); }
// Called from every screen that renders a list of auction items, so an auction
// that's already past its end_time gets closed/settled the moment anyone views
// it - not only one that was seen actively counting down (an auction opened for
// the first time after it already ended would otherwise render as "ended" purely
// from the client-side time comparison, with no data-auction-end element for
// ensureCountdownTimer() to ever notice and act on).
function settleExpiredAuctions(itemList){
  itemList.filter(i=>i.listingType==='auction').forEach(i=>{
    const a = auctionForItem(i.id);
    if(a && a.status==='active' && Date.now()>=a.endTime) checkAndSettleAuction(a.id);
  });
}
function auctionMinNextBid(auction){
  return auction.currentHighestBid!=null ? auction.currentHighestBid + auction.bidIncrement : auction.startingPrice;
}
function fmtCountdown(ms){
  if(ms<=0) return 'Ended';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if(d>0) return `${d}d ${h}h left`;
  if(h>0) return `${h}h ${m}m left`;
  if(m>0) return `${m}m ${sec}s left`;
  return `${sec}s left`;
}
// One shared interval, (re)started after any render that includes an auction
// countdown, and self-clearing once none remain in the DOM (e.g. after
// navigating away) - render() fully replaces #app on every screen change, so
// there's nothing else to explicitly tear this down when it's no longer needed.
let _countdownTimer = null;
function ensureCountdownTimer(){
  if(_countdownTimer) return;
  _countdownTimer = setInterval(()=>{
    const els = document.querySelectorAll('[data-auction-end]');
    if(!els.length){ clearInterval(_countdownTimer); _countdownTimer=null; return; }
    els.forEach(el=>{
      const end = Number(el.getAttribute('data-auction-end'));
      const ms = end - Date.now();
      el.textContent = fmtCountdown(ms);
      if(ms<=0 && !el.dataset.settling){
        el.dataset.settling = '1';
        checkAndSettleAuction(el.getAttribute('data-auction-id'));
      }
    });
  }, 1000);
}
// Lazy close-on-view: there's no background job runner in this app, so an
// auction past its end_time is only actually transitioned out of 'active'
// when someone's browser happens to check it here - whenever the listing is
// rendered or interacted with (see ensureCountdownTimer() and placeBid()).
// The DB update is guarded by .eq('status','active') so concurrent viewers
// racing this don't matter - only the first to land actually changes anything.
async function checkAndSettleAuction(auctionId){
  const a = DB.auctions.find(x=>x.id===auctionId);
  if(!a) return;
  if(a.status==='active' && Date.now()>=a.endTime){
    if(sb){
      const { error } = await sb.from('auction_listings').update({ status:'ended' }).eq('id', a.id).eq('status','active');
      if(error){ console.error('Failed to close auction:', error); }
    }
    a.status = 'ended';
  }
  // Only the winning bidder's own session can create their winning order (orders
  // RLS requires customer_id = auth.uid()), so this only fires anything when the
  // person currently viewing is the auction's winner.
  if(a.status==='ended' && a.currentHighestBidder && state.authed && state.customerId===a.currentHighestBidder){
    await settleAuctionWin(a);
  }
  render();
}
// Converts a won auction into a real order so it flows into the existing
// order/payment process instead of being a dead end. paymentStatus
// 'awaiting_completion' is what every other order card/detail view checks
// for to show a "Complete your order" prompt instead of the normal payment
// UI until the winner picks a zone and payment method via
// sheetCompleteAuctionOrder()/submitCompleteAuctionOrder() - same zone
// selection every other order goes through, just deferred since there's no
// checkout sheet to run for a win.
async function settleAuctionWin(auction){
  if(auction.orderId || auction.status==='settled') return;
  const item = DB.items.find(i=>i.id===auction.itemId);
  const biz = DB.businesses.find(b=>b.id===auction.businessId);
  if(!item || !biz) return;
  const order = {
    id: uid('ord'), businessId: biz.id, businessName: biz.name,
    customerId: state.customerId, customerEmail: state.customerEmail,
    customerName: state.customerName, customerPhone: '',
    items: [{itemId:item.id, name:item.name, price:auction.currentHighestBid, qty:1}],
    itemsTotal: auction.currentHighestBid, deliveryFee: 0, total: auction.currentHighestBid,
    // Whether the buyer pays the zone fee is fixed by the item's own listing-time
    // checkbox; the zone itself (and so the fee amount and delivery_partner_payout)
    // isn't known until the winner picks one in sheetCompleteAuctionOrder().
    zone: null, deliveryType: item.freeDelivery ? 'free' : 'zone',
    deliveryPartnerPayout: null, payoutStatus: null,
    deliveryPersonId:null, deliveryPersonName:null,
    paymentMethod:null, paymentStatus:'awaiting_completion', status:'placed',
    createdAt: Date.now(), slipDataUrl:null
  };
  if(sb){
    const { error } = await sb.from('orders').insert(toDbRow('orders', order));
    if(error){ console.error('Failed to create winning order:', error); toast("You won the auction, but creating your order failed — contact the seller.",'bad'); return; }
    const { error: settleErr } = await sb.from('auction_listings').update({ status:'settled', order_id: order.id }).eq('id', auction.id).eq('status','ended');
    if(settleErr) console.error('Failed to mark auction settled:', settleErr);
  }
  DB.orders.unshift(order);
  auction.status = 'settled'; auction.orderId = order.id;
  toast(`🎉 You won the auction for ${money(auction.currentHighestBid)}! Complete your order to finish.`);
  openSheet('completeAuctionOrder', order.id);
}

  const o = DB.orders.find(x=>x.id===orderId);

async function placeBid(auctionId){
  if(sb && !state.authed){ openSheet('signIn'); return; }
  const auction = DB.auctions.find(a=>a.id===auctionId);
  if(!auction) return;
  const biz = DB.businesses.find(b=>b.id===auction.businessId);
  if(biz && biz.ownerId===state.customerId){ toast("You can't bid on your own store's auction",'bad'); return; }
  const inputEl = document.getElementById(`bidInput_${auctionId}`);
  const amount = Number(inputEl ? inputEl.value : NaN);
  if(sb){
    // Refresh from the server first purely so the client-side checks below (and
    // their error messages) are accurate - e.g. telling the user the auction
    // already ended rather than a generic rejection. This read is NOT the
    // correctness gate; place_bid()'s single atomic UPDATE is, so a stale read
    // here can't actually let an invalid bid through.
    const { data: fresh, error: fetchErr } = await sb.from('auction_listings').select('*').eq('id', auctionId).single();
    if(fetchErr || !fresh){ toast('Could not load the latest auction state — try again','bad'); return; }
    Object.assign(auction, fromDbRow('auctions', fresh));
  }
  if(Date.now()>=auction.endTime || auction.status!=='active'){
    toast('This auction has already ended','bad');
    await checkAndSettleAuction(auctionId);
    return;
  }
  const minBid = auctionMinNextBid(auction);
  if(!amount || amount < minBid){ toast(`Bid must be at least ${money(minBid)}`,'bad'); return; }
  if(sb){
    // place_bid() does the real, atomic check-and-write (see the SQL comment
    // near the top of this file) - Postgres serializes concurrent calls to it
    // against the same row, so an empty result here means someone else's bid
    // genuinely landed first, not a bug.
    const { data, error } = await sb.rpc('place_bid', { p_auction_id: auctionId, p_bid_amount: amount });
    if(error){ console.error('place_bid failed:', error); toast('Could not place your bid — try again','bad'); return; }
    const updatedRow = Array.isArray(data) ? data[0] : data;
    if(!updatedRow){
      toast('Someone else just placed a higher bid — check the current price and try again','bad');
      await checkAndSettleAuction(auctionId); // in case it was really the auction ending, not a race
      return;
    }
    Object.assign(auction, fromDbRow('auctions', updatedRow));
  } else {
    auction.currentHighestBid = amount; auction.currentHighestBidder = state.customerId;
  }
  toast('Bid placed!');
  render();
}

async function adminSetTier(bizId, tier){
  const biz = DB.businesses.find(b=>b.id===bizId);
  if(!biz) return;
  const paidAt = tier==='pro' ? Date.now() : null;
  const { error } = await sb.from('businesses').update({ tier, paid_at: paidAt?new Date(paidAt).toISOString():null }).eq('id', bizId);
  if(error){ toast('Failed: '+error.message,'bad'); return; }
  biz.tier = tier; biz.paidAt = paidAt;
  toast(tier==='pro' ? 'Pro granted' : 'Pro revoked');
  render();
}
async function adminResolveRequest(reqId, approve){
  const req = DB.proRequests.find(r=>r.id===reqId);
  if(!req) return;
  const status = approve ? 'approved' : 'rejected';
  const nowIso = new Date().toISOString();
  const { error } = await sb.from('pro_upgrade_requests').update({ status, resolved_at: nowIso, resolved_by: state.customerId }).eq('id', reqId);
  if(error){ toast('Failed: '+error.message,'bad'); return; }
  req.status = status; req.resolvedAt = Date.now(); req.resolvedBy = state.customerId;
  if(approve){
    const { error: bizErr } = await sb.from('businesses').update({ tier:'pro', paid_at: nowIso }).eq('id', req.businessId);
    if(bizErr){ toast('Approved request but failed to grant Pro: '+bizErr.message,'bad'); return; }
    const biz = DB.businesses.find(b=>b.id===req.businessId);
    if(biz){ biz.tier='pro'; biz.paidAt=Date.now(); }
  }
  toast(approve ? 'Approved — Pro granted' : 'Rejected');
  render();
}

function sheetHTML(){
  if(!state.sheet) return '';
  let body = '';
  if(state.sheet==='bizSignup') body = sheetBizSignup();
  else if(state.sheet==='delSignup') body = sheetDelSignup();
  else if(state.sheet==='bizSettings') body = sheetBizSettings();
  else if(state.sheet==='delSettings') body = sheetGenericSettings('delivery');
  else if(state.sheet==='custSettings') body = sheetGenericSettings('customer');
  else if(state.sheet==='addItem') body = sheetAddItem();
  else if(state.sheet==='editItem') body = sheetEditItem();
  else if(state.sheet==='upgradeTier') body = sheetUpgrade();
  else if(state.sheet==='upgradeBankSlip') body = sheetUpgradeBankSlip();
  else if(state.sheet==='uploadSlip') body = sheetUploadSlip();
  else if(state.sheet==='markCash') body = sheetMarkCash();
  else if(state.sheet==='checkout') body = sheetCheckout();
  else if(state.sheet==='completeAuctionOrder') body = sheetCompleteAuctionOrder();
  else if(state.sheet==='signIn') body = sheetSignIn();
  else if(state.sheet==='signUp') body = sheetSignUp();
  else if(state.sheet==='verifyEmail') body = sheetVerifyEmail();
  else if(state.sheet==='setupMobile') body = sheetSetupMobile();
  else if(state.sheet==='policy') body = sheetPolicy();
  const dismissable = state.sheet!=='verifyEmail' && state.sheet!=='setupMobile';
  return `
  <div class="sheet-wrap${state.sheetClosing?'':' show'}" id="sheetWrap">
    <div class="backdrop" ${dismissable?`onclick="closeSheet()"`:''}></div>

async function startProPayment(method){
  const biz = currentBiz();
  if(method==='bank_transfer'){ openSheet('upgradeBankSlip'); return; }
  toast('Creating your Swipe payment link…');
  try{
    const { data, error } = await sb.functions.invoke('create-swipe-payment', { body: { businessId: biz.id, amount: 500 } });
    if(error || !data || !data.paymentLink){
      // The edge function returns a JSON { error } body on failure - log it so
      // misconfiguration (e.g. a missing secret) is diagnosable from the
      // browser console instead of only showing this generic toast.
      let detail = error?.message || data?.error;
      if(error?.context?.json){ try{ detail = (await error.context.json()).error || detail; }catch(_){} }
      console.error('create-swipe-payment failed:', detail || error || data);
      toast("Swipe payment isn't set up yet — try bank transfer for now",'bad');
      return;
    }
    // The edge function already recorded the pro_upgrade_requests row and
    // registered the reference with SeaFare before returning this link —
    // both must succeed there before a link is ever payable, so there's
    // nothing left to track client-side.
    window.open(data.paymentLink, '_blank');
    closeSheet();
    toast('Complete payment in the new tab — Pro activates automatically once confirmed');
    await loadDB(); render();
  }catch(e){ toast("Swipe payment isn't set up yet — try bank transfer for now",'bad'); }
}

/* ---- Product photos (Supabase Storage) ---- */
const IMAGE_ALLOWED_TYPES = ['image/jpeg','image/png','image/webp','image/gif'];
const IMAGE_MAX_BYTES = 5*1024*1024;
let _itemPhotoFile = null;
function previewItemPhoto(e, previewId='itemPhotoPreview'){
  const f = e.target.files[0]; if(!f) return;
  if(!IMAGE_ALLOWED_TYPES.includes(f.type)){ toast('Please choose a JPEG, PNG, WEBP, or GIF image','bad'); e.target.value=''; return; }
  if(f.size > IMAGE_MAX_BYTES){ toast('Image must be under 5MB','bad'); e.target.value=''; return; }
  _itemPhotoFile = f;
  const reader = new FileReader();
  reader.onload = ()=>{ const img=document.getElementById(previewId); if(img){ img.src=reader.result; img.style.display='block'; } };
  reader.readAsDataURL(f);
}
// Uploaded under a path prefixed with the uploader's own auth.uid() - the
// storage RLS policies check against that same prefix, so no join to
// businesses is needed there. Returns null (photo skipped) rather than
// throwing when there's no backend or no file was chosen.
async function uploadItemPhoto(){
  if(!_itemPhotoFile || !sb) return null;
  const file = _itemPhotoFile;
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `${state.customerId}/${uid('img')}.${ext}`;
  const { error } = await sb.storage.from('product-images').upload(path, file, { cacheControl:'3600', upsert:false, contentType:file.type });
  if(error){ toast('Photo upload failed: '+error.message, 'bad'); return null; }
  const { data } = sb.storage.from('product-images').getPublicUrl(path);
  return data.publicUrl;
}

    } else {
      actionArea = `<div class="status-pill ok" style="display:inline-block;">Payment received</div>`;
    }
  } else {
    if(o.paymentStatus==='pending_cash'){
      actionArea = `<div class="card tight" style="background:rgba(255,207,92,.1);"><p style="font-size:.85em;">Delivery partner will collect ${money(o.total)} cash from the customer.</p></div>`;

        ? `<div class="card tight" style="background:rgba(34,184,200,.12);"><p style="font-size:.85em;">Rider collected cash. They owe you ${money(o.total-cashCut)} (after their ${money(cashCut)} cut). See Payouts tab once they settle.</p></div>`

// Cash orders (rider owes the store) and bank-transfer orders (the store now

function renderBizPayouts(biz){
  const cashOrders = DB.orders.filter(o=>o.businessId===biz.id && o.paymentMethod==='cash_to_delivery' && o.deliveryPersonId);
  // payout_status is only ever set on free-delivery orders (buyer wasn't charged
  // the zone fee), for either payment method - a zone-delivery/buyer-pays order
  // never needs this, since the buyer's own payment already covers the fee.
  const feePayouts = DB.orders.filter(o=>o.businessId===biz.id && o.payoutStatus);
  document.getElementById('app').innerHTML = wrapShell('business','bizPayouts', `
    ${topbar('Delivery payouts', 'Settle up with delivery partners')}
    <div style="padding:4px 16px 0;">
      <div class="section">
        <div class="section-head"><h2>Cash collected by riders</h2></div>

      </div>
    </div>
  `);
}
function cashPayoutCard(o){
  const cutAmt = Math.round(cashCutAmount(o));
  const owed = o.total - cutAmt;
  let pill = o.paymentStatus==='settled' ? `<span class="status-pill ok">Settled</span>` : o.paymentStatus==='cash_collected' ? `<span class="status-pill mid">Rider owes you ${money(owed)}</span>` : `<span class="status-pill wait">Not delivered yet</span>`;
  return `
  <div class="glass card">
    <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3>${pill}</div>
    <p class="muted" style="font-size:.85em; margin-top:4px;">${o.deliveryPersonName} collected ${money(o.total)} cash</p>
    <div class="row between" style="margin-top:8px;"><span class="muted">Rider's cut</span><span>${money(cutAmt)}</span></div>
    ${cutAmt===0 ? `<p class="muted" style="font-size:.78em; margin-top:6px;">No delivery fee was collected — you pay the rider's payout separately below.</p>` : ''}
    ${o.paymentStatus==='cash_collected' ? `<button class="btn btn-good btn-sm" style="margin-top:10px; width:100%;" onclick="settlePayout('${o.id}')">Confirm received from rider</button>` : ''}
  </div>`;
}
function feePayoutCard(o){
  const amt = Math.round(payoutAmountFor(o));
  const pill = o.payoutStatus==='settled' ? `<span class="status-pill ok">Settled</span>` : `<span class="status-pill mid">You owe ${money(amt)}</span>`;
  return `
  <div class="glass card">
    <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3>${pill}</div>
    <p class="muted" style="font-size:.85em; margin-top:4px;">${o.deliveryPersonName} · free delivery, ${o.paymentMethod==='transfer'?'bank transfer':'cash'} order</p>
    <div class="row between" style="margin-top:8px;"><span class="muted">Amount owed</span><span>${money(amt)}</span></div>
    ${o.payoutStatus==='pending' ? `<button class="btn btn-good btn-sm" style="margin-top:10px; width:100%;" onclick="markPayoutPaid('${o.id}')">Mark as paid to rider</button>` : ''}
  </div>`;
}
function settlePayout(id){ const o=DB.orders.find(x=>x.id===id); o.paymentStatus='settled'; saveDB('orders'); toast('Payout settled with rider'); render(); }
function markPayoutPaid(id){ const o=DB.orders.find(x=>x.id===id); o.payoutStatus='settled'; saveDB('orders'); toast('Marked as paid to rider'); render(); }

// The delivery partner is always paid the zone's flat fee (deliveryPartnerPayout),
// regardless of the item's free-delivery checkbox - falls back to deliveryFee for
// pre-feature rows that predate delivery_partner_payout.
function payoutAmountFor(o){ return o.deliveryPartnerPayout!=null ? o.deliveryPartnerPayout : o.deliveryFee; }
// What a cash-collecting rider deducts from the cash in hand before remitting the
// rest to the business. On a normal (buyer-pays) order the buyer's payment already
// includes the fee, so the rider keeps it as their cut. On a free-delivery order
// the buyer was never charged a fee, so there's nothing to deduct - the rider
// remits everything they collected, and is paid separately via payout_status.
function cashCutAmount(o){ return o.deliveryType==='free' ? 0 : payoutAmountFor(o); }
function renderDelHome(d){
  const jobs = DB.orders.filter(o=>o.deliveryPersonId===d.id && o.status!=='delivered');
  document.getElementById('app').innerHTML = wrapShell('delivery','delHome', `
    ${topbar(d.name, `MVR 15–25 per delivery, by zone`)}
    <div style="padding:4px 16px 0;">
      <div class="section-head"><h2>Active jobs</h2></div>
      ${jobs.length? jobs.map(o=>delJobCard(o)).join('') : `<div class="empty"><span class="ic">🛵</span>No active deliveries. New orders will appear here.</div>`}
      <div class="section" style="margin-top:22px;">
        <div class="section-head"><h2>Unassigned orders nearby</h2></div>
        ${DB.orders.filter(o=>!o.deliveryPersonId && o.status!=='delivered' && o.paymentStatus!=='awaiting_completion').map(o=>`
          <div class="glass card">
            <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3><span class="price">Earn ${money(payoutAmountFor(o))}</span></div>
            <p class="muted" style="font-size:.85em; margin-top:4px;">${o.businessName} → ${o.customerName} · ${ZONES[o.zone]?ZONES[o.zone].label:'—'}</p>
            <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="claimJob('${o.id}')">Accept job</button>
          </div>`).join('') || `<div class="empty"><span class="ic">📭</span>No open jobs right now</div>`}
      </div>
    </div>
  `);
}
function claimJob(id){
  const o = DB.orders.find(x=>x.id===id); const d = currentDel();
  o.deliveryPersonId = d.id; o.deliveryPersonName = d.name;
  saveDB('orders'); toast('Job accepted'); render();
}
function delJobCard(o){
  const biz = DB.businesses.find(b=>b.id===o.businessId);
  const pm = o.paymentMethod==='transfer'?'Customer pays by transfer':'Collect cash on delivery';
  const payoutAmt = payoutAmountFor(o);
  const cashCut = cashCutAmount(o);
  return `
  <div class="glass card">
    <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3><span class="price">${money(o.total)}</span></div>
    <p class="muted" style="font-size:.85em; margin:4px 0 10px;">${o.businessName} → ${o.customerName} · ${pm}</p>
    <div class="row between" style="margin-bottom:8px;"><span class="muted" style="font-size:.82em;">${ZONES[o.zone]?ZONES[o.zone].label:'—'} · your payout</span><strong>${money(payoutAmt)}</strong></div>
    ${o.paymentMethod==='transfer' && o.paymentStatus!=='paid' ? `
      <div class="acct-box"><div class="lbl">Store account (for customer reference)</div><div class="val">${biz?biz.accountName:''} · ${biz?biz.accountNumber:''}</div></div>
      <p class="muted" style="font-size:.78em; margin-top:8px;">Visible until the business marks payment received.</p>
    ` : ''}
    ${o.paymentMethod==='cash_to_delivery' && o.paymentStatus==='pending_cash' ? `
      <button class="btn btn-good btn-sm" style="width:100%;" onclick="openSheet('markCash', '${o.id}')">Mark cash received from customer</button>
    ` : ''}
    ${o.paymentMethod==='cash_to_delivery' && o.paymentStatus==='cash_collected' ? `
      <div class="card tight" style="background:rgba(34,184,200,.12); margin-bottom:8px;"><p style="font-size:.82em;">${cashCut>0 ? `You owe the store ${money(o.total-Math.round(cashCut))} after your ${money(Math.round(cashCut))} cut.` : `No delivery fee was collected, so you owe the store the full ${money(o.total)} — the store pays your ${money(Math.round(payoutAmt))} payout separately.`}</p></div>
    ` : ''}
    <button class="btn btn-outline btn-sm" style="width:100%; margin-top:8px;" onclick="markDelivered('${o.id}')">Mark delivered</button>
  </div>`;
}
function sheetMarkCash(){
  const o = DB.orders.find(x=>x.id===state.sheetData);
  const cashCut = Math.round(cashCutAmount(o));
  const owed = o.total - cashCut;
  const cutNote = cashCut>0
    ? `Your cut (${money(cashCut)}) stays with you — you'll owe the store <strong>${money(owed)}</strong>.`
    : `No delivery fee was collected from the customer, so you'll owe the store the full <strong>${money(owed)}</strong> — the store pays your ${money(Math.round(payoutAmountFor(o)))} delivery payout separately.`;
  return `
  <h2>Confirm cash received</h2>
  <p class="muted">Order #${o.id.slice(-5).toUpperCase()} · Total ${money(o.total)}</p>
  <div class="card tight" style="margin:14px 0; background:rgba(61,220,151,.1);">
    <p style="font-size:.88em;">Confirming you collected <strong>${money(o.total)}</strong> cash from the customer. ${cutNote}</p>
  </div>
  <button class="btn btn-good" style="margin-top:14px;" onclick="confirmCashReceived('${o.id}')">Confirm cash received</button>`;
}
function confirmCashReceived(id){ const o=DB.orders.find(x=>x.id===id); o.paymentStatus='cash_collected'; saveDB('orders'); closeSheet(); toast('Marked as cash received'); render(); }
// A free-delivery order (buyer wasn't charged the zone fee) always creates a
// payout obligation once delivered, regardless of payment method - a
// buyer-pays order never needs this, since the buyer's own payment already
// covers the fee either way (kept as the rider's cash cut, or already in the
// store's account from the transfer).
function markDelivered(id){
  const o=DB.orders.find(x=>x.id===id);
  o.status='delivered';
  if(o.deliveryType==='free') o.payoutStatus='pending';
  saveDB('orders'); toast('Marked delivered'); render();
}
// Cash orders show the cash-collected/settled state via paymentStatusPill AND,
// when this was also a free-delivery order, the separate store-owes-payout state -
// a free-delivery cash order has two independent settlements (rider remits the
// cash they collected; store pays the rider's fee separately) so both matter.
// Buyer-pays transfer orders show nothing extra here (no gap to track); a
// free-delivery transfer order shows only the payout state, since there's no
// cash leg for the rider at all.
function riderPayoutPill(o){
  const parts = [];
  if(o.paymentMethod==='cash_to_delivery') parts.push(paymentStatusPill(o));
  if(o.payoutStatus==='settled') parts.push(`<span class="status-pill ok">Paid by store ✓</span>`);
  else if(o.payoutStatus==='pending') parts.push(`<span class="status-pill mid">Store owes you</span>`);
  if(!parts.length) parts.push(paymentStatusPill(o));
  return parts.join(' ');
}
function renderDelHistory(d){
  const done = DB.orders.filter(o=>o.deliveryPersonId===d.id && o.status==='delivered');
  document.getElementById('app').innerHTML = wrapShell('delivery','delHistory', `
    ${topbar('Delivery history')}
    <div style="padding:4px 16px 0;">
      ${done.length? done.map(o=>`
        <div class="glass card">
          <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3>${riderPayoutPill(o)}</div>
          <p class="muted" style="font-size:.85em; margin-top:4px;">${o.businessName} → ${o.customerName}</p>
          <div class="row between" style="margin-top:8px;"><span>Your cut</span><span class="price">${money(Math.round(payoutAmountFor(o)))}</span></div>
        </div>`).join('') : `<div class="empty"><span class="ic">🧾</span>No completed deliveries yet</div>`}
    </div>
  `);
}

/* ---- Home feed: a market-wide item feed (not a store list) - Featured and
   Top-selling both pull individual items from every business, filtered by
   the Buy now/Auctions switcher, category, and search. There's no real
   "featured"/"sales rank" data anywhere in this app, so Featured is just the
   first few matches and Top-selling is the rest, in listing order - both
   genuinely reflect the current filter, just without a curation signal to
   rank by. ---- */
const CATEGORY_ICONS = { Grocery:'🛒', Bakery:'🍞', 'Café':'☕', Hardware:'🔧', Fashion:'👗', Other:'🏷️', General:'🏷️' };
function categoryIcon(cat){ return CATEGORY_ICONS[cat] || '🏷️'; }
const FEATURED_GRADIENTS = [
  'linear-gradient(135deg, #0f7a8c, #22b8c8)',
  'linear-gradient(135deg, #ff8a5c, #e8663a)',
  'linear-gradient(135deg, #23b47c, #3ddc97)',
  'linear-gradient(135deg, #6a4c93, #b185db)'
];
function homeFilteredItems(){
  const q = (state.homeSearch||'').trim().toLowerCase();
  const wantAuction = state.homeListingType==='auction';
  return DB.items.filter(i=>{
    if((i.listingType==='auction') !== wantAuction) return false;
    // A settled/ended (or expired-but-not-yet-settled) auction has nothing left to bid
    // on, so it drops out of the Auctions feed the moment it's no longer live - the
    // per-store auction card is still reachable for anyone with a direct link/history.
    if(i.listingType==='auction'){
      const a = auctionForItem(i.id);
      if(!a || a.status!=='active' || Date.now()>=a.endTime) return false;
    }
    if(state.homeCategory!=='All' && (i.category||'General')!==state.homeCategory) return false;
    if(q){
      const biz = DB.businesses.find(b=>b.id===i.businessId);
      const hay = (i.name+' '+(biz?biz.name:'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function itemPriceLine(item){
  if(item.listingType==='auction'){
    const auction = auctionForItem(item.id);
    const bid = auction ? (auction.currentHighestBid!=null?auction.currentHighestBid:auction.startingPrice) : item.price;
    return `Highest bid ${money(bid)}`;
  }
  return money(item.price);
}
function openFeedItem(itemId){
  const item = DB.items.find(i=>i.id===itemId);
  if(!item) return;
  go('custStore', {browseBizId:item.businessId, storeTab: item.listingType==='auction'?'auction':'buyNow'});
}

  const auctionHTML = auctionItems.map(i=>{

function auctionCard(item, auction){

  return `

      </div>
      ${ended ? (
        wonByMe ? `<p class="muted" style="font-size:.85em;">🎉 You won this auction for ${money(auction.currentHighestBid)}. Check My Orders.</p>`

// The cart isn't scoped per business, but checkout/placeOrder assume a single
// business per order (one delivery, one store account) - so mixing items from two
// stores into one cart would silently misattribute the order. Block the mix
// instead: confirm with the customer that adding this item clears what's there.
function cartBusinessId(){
  const firstId = Object.keys(state.cart)[0];
  if(!firstId) return null;
  const it = DB.items.find(i=>i.id===firstId);
  return it ? it.businessId : null;
}
function addToCart(itemId){
  const item = DB.items.find(i=>i.id===itemId);
  if(!item) return;
  const existingBizId = cartBusinessId();
  if(existingBizId && existingBizId!==item.businessId){
    const otherBiz = DB.businesses.find(b=>b.id===existingBizId);
    const ok = confirm(`Your cart has items from ${otherBiz?otherBiz.name:'another store'} — clear it to add items from this store instead?`);
    if(!ok) return;
    state.cart = {};
  }
  state.cart[itemId] = (state.cart[itemId]||0)+1;
  render();
}
function changeQty(itemId, d){ state.cart[itemId] = Math.max(0,(state.cart[itemId]||0)+d); if(state.cart[itemId]===0) delete state.cart[itemId]; render(); }

function renderCustCart(){

      ${lines.length? `

        <div class="ic" style="width:40px;height:40px;font-size:1.1em;">💵</div>

function refreshCheckoutTotals(){
  const entries = Object.entries(state.cart);
  const lines = entries.map(([id,qty])=>{ const it=DB.items.find(i=>i.id===id); return {it,qty}; }).filter(x=>x.it);
  const itemsTotal = lines.reduce((s,l)=>s+l.it.price*l.qty,0);
