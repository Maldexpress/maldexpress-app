  <button class="btn btn-primary" style="margin-top:10px;" onclick="submitAddAddress()">${a?'Save changes':'Save address'}</button>
  ${a ? `<button class="btn btn-ghost" style="margin-top:8px;" onclick="openSheet('addressBook')">Cancel</button>` : !first ? `<button class="btn btn-ghost" style="margin-top:8px;" onclick="openSheet('addressBook')">Back to my addresses</button>` : ''}`;
}
async function submitAddAddress(){
  if(!requireOnline()) return;
  const cat = _addAddressCategory;
  const isBoat = cat==='boat';
  const name = val('aa_name').trim(), phone = val('aa_phone').trim();
  const address = isBoat ? null : val('aa_address').trim();
  const harbour = isBoat ? val('aa_harbour').trim() : null;
  let island = null, zone = null;
  if(!isBoat){
    island = pickedIsland('aa_isl');
    if(!island){ toast('Pick the island','bad'); return; }
    if(isGreaterMale(island)) zone = island==='Malé' || island==='Villimalé' ? 'male' : (val('aa_zone')||'hulhumale1');
  }
  if(!name || !phone || (isBoat ? !harbour : !address)){ toast(isBoat?'Enter the boat name, phone, and harbour':'Enter the name, phone, and house / street','bad'); return; }
  if(_editAddressId){
    const a = DB.addresses.find(x=>x.id===_editAddressId);
    const upd = { name, phone, address, harbour, island, zone };
    const { error } = await sb.from('customer_addresses').update(upd).eq('id', _editAddressId);
    if(error){ toast('Could not save address: '+error.message, 'bad'); return; }
    if(a) Object.assign(a, { ...upd, address: address||'', harbour: harbour||'', island: island||'' });
    if(document.getElementById('aa_default') && document.getElementById('aa_default').checked) await setAddressDefault(_editAddressId, cat);
    _editAddressId = null; _addrDefaultsApplied = false;
    toast('Address updated'); openSheet('addressBook'); return;
  }
  const makeDefault = myAddresses(cat).length===0;
  const row = { id: uid('addr'), customerId: state.customerId, category: cat, name, phone, address, zone, island, harbour, isDefault: makeDefault, createdAt: Date.now() };
  const { data, error } = await sb.from('customer_addresses').insert(toDbRow('addresses', row)).select();
  if(error){ toast('Could not save address: '+error.message, 'bad'); return; }
  DB.addresses.push(fromDbRow('addresses', data[0]));
  toast(makeDefault ? 'Saved as your default address' : 'Address saved'); openSheet('addressBook');
}
async function setAddressDefault(id, category){
  if(!sb){ toast("You're offline, so this can't be saved. Reconnect and try again", 'bad'); return; }
  const { data, error } = await sb.rpc('set_default_address', { p_address_id: id, p_category: category });
  if(error){ toast('Could not set default: '+error.message, 'bad'); return; }
  if(!data || !data.length){ toast("Couldn't set that as default — it may have been removed", 'bad'); return; }
  // The RPC's final statement only returns the address that became default,
  // not the ones it unset along the way - flip those locally rather than
  // doing a full reload for a single-field change.
  DB.addresses.forEach(a=>{ if(a.category===category && a.customerId===state.customerId) a.isDefault = (a.id===id); });
  render();
}
async function deleteAddressEntry(id, category){
  if(!requireOnline()) return;
  const { error } = await sb.from('customer_addresses').delete().eq('id', id);
  if(error){ toast('Could not remove address: '+error.message, 'bad'); return; }
  const removed = DB.addresses.find(a=>a.id===id);
  DB.addresses = DB.addresses.filter(a=>a.id!==id);
  // If the default was just removed and others remain in this category, make
  // the most recently added one the new default so checkout never has to
  // fall back to "nothing set" while addresses still exist.
  if(removed && removed.isDefault){
    const remaining = myAddresses(category);
    if(remaining.length){
      const { data } = await sb.rpc('set_default_address', { p_address_id: remaining[0].id, p_category: category });
      if(data && data.length) remaining[0].isDefault = true;
    }
  }
  render();
}

function currentDel(){ return DB.delivery.find(d=>d.id===state.activeDelId); }
// Open jobs this rider should see: their island's stores, plus stores within
// NEARBY_KM while they're online (see jobVisibleToRider()).
function openJobsFor(d){
  if(!d) return [];
  return DB.orders.filter(o=>!o.deliveryPersonId && o.status!=='delivered' && o.paymentStatus!=='awaiting_completion'
    && (o.rentalItemId ? o.needsDeliveryPartner : o.readyForPickup) && jobVisibleToRider(o, d));
}

// Saves only this rider's own location/online columns (RLS: self update).
async function saveRiderFields(d, fields){
  if(sb){ const { error } = await sb.from('delivery_persons').update(fields).eq('id', d.id); if(error){ console.warn(error); toast("Couldn't update your status",'bad'); return false; } }
  return true;
}
async function setRiderIsland(k){
  const d = currentDel(); if(!d || !k) return;
  d.island = k;
  if(await saveRiderFields(d, { island:k })){ toast(`Now delivering on ${k}`); render(); }
}
let _riderWatchId = null, _riderLastSave = 0;
function riderSavePosition(d, pos){
  d.lat = pos.coords.latitude; d.lng = pos.coords.longitude; d.locationUpdatedAt = Date.now();
  // Throttled: every 2 minutes is plenty to decide who's nearby.
  if(Date.now() - _riderLastSave < 120000) return;
  _riderLastSave = Date.now();
  saveRiderFields(d, { lat:d.lat, lng:d.lng, location_updated_at:new Date(d.locationUpdatedAt).toISOString() });
}
function startRiderTracking(d){
  if(_riderWatchId!=null || !navigator.geolocation) return;
  _riderWatchId = navigator.geolocation.watchPosition(pos=>riderSavePosition(d, pos), ()=>{}, { enableHighAccuracy:true, maximumAge:60000, timeout:30000 });
}
function stopRiderTracking(){ if(_riderWatchId!=null && navigator.geolocation){ navigator.geolocation.clearWatch(_riderWatchId); } _riderWatchId = null; }
async function toggleRiderOnline(){
  const d = currentDel(); if(!d) return;
  if(!d.online && !requireRiderBank()) return;
  if(d.online){
    d.online = false; stopRiderTracking();
    await saveRiderFields(d, { online:false });
    toast("You're offline"); render(); return;
  }
  if(!navigator.geolocation){ toast("This device can't share its location",'bad'); return; }
  navigator.geolocation.getCurrentPosition(async pos=>{
    d.online = true; _riderLastSave = 0; riderSavePosition(d, pos);
    await saveRiderFields(d, { online:true, lat:d.lat, lng:d.lng, location_updated_at:new Date(d.locationUpdatedAt).toISOString() });
    startRiderTracking(d);
    toast("You're online. Nearby jobs will show up here"); render();
  }, err=>toast(err && err.code===1 ? 'Allow location access to go online' : "Couldn't get your location",'bad'), { enableHighAccuracy:true, timeout:15000 });
}
// In-app job alerts: when the background refresh finds a new job this rider
// can take, show a toast and vibrate.
let _seenRiderJobIds = null;
function checkNewRiderJobs(){
  if(state.role!=='delivery') return;
  const d = currentDel(); if(!d) return;
  const ids = openJobsFor(d).map(o=>o.id);
  if(_seenRiderJobIds===null){ _seenRiderJobIds = new Set(ids); return; }
  const fresh = ids.filter(id=>!_seenRiderJobIds.has(id));
  ids.forEach(id=>_seenRiderJobIds.add(id));
  if(fresh.length){
    const o = DB.orders.find(x=>x.id===fresh[0]);
    toast(fresh.length>1 ? `${fresh.length} new delivery jobs near you` : `New delivery job: ${o ? o.businessName : 'near you'}`);
    try{ navigator.vibrate && navigator.vibrate([180,80,180]); }catch(_){}
  }
}

// The delivery partner is always paid the zone's flat fee (deliveryPartnerPayout),
// regardless of the item's free-delivery checkbox - falls back to deliveryFee for
// pre-feature rows that predate delivery_partner_payout.
function payoutAmountFor(o){ return o.deliveryPartnerPayout!=null ? o.deliveryPartnerPayout : o.deliveryFee; }
// What a cash-collecting rider deducts from the cash in hand before remitting the
// rest to the business. On a normal (buyer-pays) order the buyer's payment already
// includes the fee, so the rider keeps it as their cut. On a free-delivery order
// the buyer was never charged a fee, so there's nothing to deduct - the rider
// remits everything they collected, and is paid separately via payout_status.
function cashCutAmount(o){ return o.deliveryType==='free' ? 0 : payoutAmountFor(o); }

  // offerOrderToRider() - because they're already picking up another one of

      </div>

        <div class="section-head"><h2>Unassigned orders nearby</h2></div>
        <!-- No customer name/contact/items/total here - nobody's committed to this

             lifting only once a job's actually handed to the rider (see

        <!-- Most rentals (rentalItemId set) never show up here - the renter handles

        ${openJobsFor(d).map(o=>`

// A genuine partial update naming only the two columns actually changing - NOT
// saveDB('orders', [o]), which upserts every column on the row (via toDbRow) and so
// would need UPDATE privilege on total/payment_status/payout_status/
// delivery_partner_payout too, even though their values never change here. The
// "rider update assigned or open orders" RLS policy (delivery_person_id IS NULL to
// claim; must be the assignee after) is what actually gates who can do this.
// A rental delivery job goes through claim_rental_job instead - an "upfront"
// job also needs payout_status flipped to 'pending' right at claim time, and
// that has to be computed server-side (from the store's own timing choice)
// rather than trusted as a plain column a rider could set to anything.
async function claimJob(id){
  if(!requireOnline()) return;
  if(!requireRiderBank()) return;
  const order = DB.orders.find(o=>o.id===id);
  if(order && order.rentalItemId){
    const updated = await callOrderRpc('claim_rental_job', { p_order_id: id }, id,
      'This job may have already been accepted by someone else');
    if(!updated) return;
    toast('Job accepted'); render();
    return;
  }
  const d = currentDel();
  const { data, error } = await sb.from('orders')
    .update({ delivery_person_id: d.id, delivery_person_name: d.name })
    .eq('id', id).select();
  if(error){ toast('Could not accept job: '+bankErrText(error.message), 'bad'); return; }
  if(!data || !data.length){ toast('This job may have already been accepted by someone else', 'bad'); return; }
  const updated = fromDbRow('orders', data[0]);
  await decryptOrderRow(updated, data[0]);
  const idx = DB.orders.findIndex(o=>o.id===id);
  if(idx>=0) DB.orders[idx] = updated; else DB.orders.unshift(updated);
  toast('Job accepted'); render();
}
// A pending direct offer (see offerOrderToRider()) rather than an open-pool
// job - no detail sheet, no claim-race with other riders, just accept or
// decline right here. Rentals never reach this (offerOrderToRider() only
// ever touches non-rental orders - a rental delivery job's own separate
// offer flow is offerRentalDelivery()/claim_rental_job()).
function delOfferCard(o){
  return `
  <div class="glass card">
    <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3><span class="price">Earn ${money(payoutAmountFor(o))}</span></div>
    <p class="muted" style="font-size:.85em; margin:4px 0 10px;">${o.businessName} · ${routeLabel(o)}</p>
    <p class="muted" style="font-size:.8em; margin-bottom:10px;">You're already picking up another order from ${o.businessName} - they'd like you to take this one too.</p>
    <div class="row" style="gap:8px;">
      <button class="btn btn-outline btn-sm" style="flex:1;" onclick="declineDeliveryOffer('${o.id}')">Decline</button>
      <button class="btn btn-primary btn-sm" style="flex:1;" onclick="acceptDeliveryOffer('${o.id}')">Accept</button>
    </div>
  </div>`;
}
function delJobCard(o){
  // A rental delivery job has nothing to do with the rental's own payment at all
  // (that's already settled, or being settled, directly between customer and
  // store) - just deliver the item and collect your own separate fee from the
  // store, so this skips every cash-collection/transfer-slip bit entirely.
  if(o.rentalItemId){
    const payoutAmt = payoutAmountFor(o);
    return `
    <div class="glass card" onclick="openDelOrderDetail('${o.id}')">
      <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3><span class="price">${money(payoutAmt)}</span></div>
      <p class="muted" style="font-size:.85em; margin:4px 0 10px;">${o.businessName} → ${o.receiverName||o.customerName} · Rental delivery</p>
      ${o.receiverName ? `<p class="muted" style="font-size:.82em; margin-bottom:8px;">${o.deliveryTargetType==='boat'?'🚤':'📍'} ${[o.receiverPhone,o.receiverAddress].filter(Boolean).join(' · ')}</p>` : ''}
      <div class="card tight" style="background:rgba(34,184,200,.12); margin-bottom:8px;"><p style="font-size:.82em;">${o.rentalPayoutTiming==='upfront'?`You've already been paid ${money(payoutAmt)} upfront for this.`:`Store owes you ${money(payoutAmt)} once you mark this delivered.`}</p></div>
      ${o.paymentStatus==='paid'
        ? `<button class="btn btn-outline btn-sm" style="width:100%; margin-top:8px;" onclick="event.stopPropagation(); markDelivered('${o.id}')">Mark delivered</button>`
        : `<div class="card tight" style="background:rgba(255,207,92,.1);"><p style="font-size:.82em;">Waiting for the customer's ${o.rentalFeeTiming==='on_return'?'advance':'payment'} to be confirmed before you can hand this over.</p></div>`}
    </div>`;
  }
  const biz = DB.businesses.find(b=>b.id===o.businessId);
  const pm = o.paymentMethod==='swipe'?'Prepaid with Swipe, nothing to collect':o.paymentMethod==='transfer'?'Customer pays by transfer':o.paymentMethod==='cash_on_pickup'?'Customer pays the store, nothing to collect':'Collect cash on delivery';
  const payoutAmt = payoutAmountFor(o);
  const cashCut = cashCutAmount(o);
  // The customer's name, phone, items, and the order's own total are all
  // withheld until the store's actually handed the package over
  // (out_for_delivery/delivered) - before that this is still just an
  // accepted job, not something in the rider's hands yet. The pickup address
  // (this business's own, not the customer's) is exactly what a rider needs
  // in the meantime, so that's shown instead - see biz.address in
  // sheetBizSettings(). The drop-off address stays visible throughout since a
  // rider reasonably needs it to judge/plan the trip; only the *identity*
  // (name/phone) and the money figures are what's gated on handoff.
  const handedOff = o.status==='out_for_delivery' || o.status==='delivered';
  return `
  <div class="glass card" onclick="openDelOrderDetail('${o.id}')">
    <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3><span class="price">${handedOff?money(o.total):money(payoutAmt)}</span></div>
    <p class="muted" style="font-size:.85em; margin:4px 0 10px;">${o.businessName}${handedOff?` → ${o.receiverName||o.customerName}`:''} · ${pm}</p>
    ${!handedOff ? `<p class="muted" style="font-size:.82em; margin-bottom:8px;">📍 Pickup from ${biz && biz.address ? biz.address : (biz?biz.name:'the store')}</p>` : ''}
    ${handedOff && o.receiverName ? `<p class="muted" style="font-size:.82em; margin-bottom:8px;">${o.deliveryTargetType==='boat'?'🚤':'📍'} ${[o.receiverPhone,o.receiverAddress].filter(Boolean).join(' · ')}</p>` : ''}
    ${!handedOff && o.receiverAddress ? `<p class="muted" style="font-size:.82em; margin-bottom:8px;">${o.deliveryTargetType==='boat'?'🚤 Drop-off':'📍 Drop-off'}: ${o.receiverAddress}</p>` : ''}

// Opened by markDelivered()/markOrderDeliveredByBusiness() instead of calling
// their RPC straight away, whenever the order is still an uncollected cash
// order - confirming here does both the cash collection and the delivery
// mark in one step. The amount field defaults to the order total (most
// deliveries are paid exactly), but stays editable for the real case of a
// customer handing over a bigger note - the keypad opens immediately
// (autofocus) and Enter submits, so a rider mid-handoff doesn't need to
// find and tap a separate button.
function sheetMarkCash(){
  const o = DB.orders.find(x=>x.id===state.sheetData);
  const cashCut = Math.round(cashCutAmount(o));
  const owed = o.total - cashCut;
  const cutNote = cashCut>0
    ? `Your cut (${money(cashCut)}) stays with you — you'll owe the store <strong>${money(owed)}</strong>.`
    : `No delivery fee was collected from the customer, so you'll owe the store the full <strong>${money(owed)}</strong> — the store pays your ${money(Math.round(payoutAmountFor(o)))} delivery payout separately.`;
  return `
  <h2>Cash received?</h2>
  <p class="muted">Order #${o.id.slice(-5).toUpperCase()} · Total due ${money(o.total)}</p>
  <div class="field" style="margin-top:14px;">
    <label>Amount handed over (MVR)</label>
    <input type="number" step="0.01" inputmode="decimal" id="cashReceivedInput" value="${o.total.toFixed(2)}" autofocus
      oninput="updateCashChangeNote('${o.id}')"
      onkeydown="if(event.key==='Enter'){ event.preventDefault(); confirmCashAndDeliver('${o.id}'); }">
  </div>
  <div class="card tight" id="cashChangeNote" style="margin-top:10px; background:rgba(255,138,92,.12); display:none;">
    <p style="font-size:.88em;">Give <strong id="cashChangeAmount"></strong> change back to the customer.</p>
  </div>
  <div class="card tight" style="margin-top:10px; background:rgba(61,220,151,.1);">
    <p style="font-size:.85em;">${cutNote}</p>
  </div>
  <button class="btn btn-good" style="margin-top:14px;" onclick="confirmCashAndDeliver('${o.id}')">Confirm & mark delivered</button>`;
}
function updateCashChangeNote(orderId){
  const o = DB.orders.find(x=>x.id===orderId);
  const input = document.getElementById('cashReceivedInput');
  const note = document.getElementById('cashChangeNote');
  if(!o || !input || !note) return;
  const received = Number(input.value);
  if(received > o.total + 0.001){
    document.getElementById('cashChangeAmount').textContent = money(received - o.total);
    note.style.display = 'block';
  } else {
    note.style.display = 'none';
  }
}
// Confirms cash collection and the delivery mark together - the final RPC
// differs depending on who's delivering: the assigned rider (mark_delivered)
// or the business itself for a self-delivery order
// (mark_order_delivered_by_business, since there's no rider account here).
async function confirmCashAndDeliver(id){
  const o = DB.orders.find(x=>x.id===id);
  const isSelfDelivery = !!(o && o.selfDelivery);
  const isBoat = o && !o.rentalItemId && o.deliveryTargetType==='boat';
  const cashUpdated = await callOrderRpc('confirm_cash_received', { p_order_id: id }, id,
    "Couldn't confirm cash received — the order may have changed");
  if(!cashUpdated) return;
  const finalRpc = isSelfDelivery ? 'mark_order_delivered_by_business' : 'mark_delivered';
  const updated = await callOrderRpc(finalRpc, { p_order_id: id, p_boat_photo_url: isBoat ? _handoffPhotoData : null }, id,
    "Cash confirmed, but couldn't mark delivered — try again");
  _handoffPhotoData = null;
  closeSheet();
  toast(updated ? 'Delivered!' : 'Cash confirmed'); render();
}
// A free-delivery order (buyer wasn't charged the zone fee) always creates a
// payout obligation once delivered, regardless of payment method - a
// buyer-pays order never needs this, since the buyer's own payment already
// covers the fee either way (kept as the rider's cash cut, or already in the
// store's account from the transfer).
async function markDelivered(id){
  const o = DB.orders.find(x=>x.id===id);
  const isBoat = o && !o.rentalItemId && o.deliveryTargetType==='boat';
  if(isBoat && !_handoffPhotoData){ toast('Take a photo of the handover to the boat first','bad'); return; }
  if(o && !o.rentalItemId && o.paymentMethod==='cash_to_delivery' && o.paymentStatus==='pending_cash'){
    if(isBoat && !_boatDeliveryPaid){
      const updated = await callOrderRpc('mark_delivered', { p_order_id: id, p_boat_photo_url: _handoffPhotoData }, id,
        "Couldn't mark this delivered — it may already be marked delivered");
      _handoffPhotoData = null; _boatDeliveryPaid = true;
      if(!updated) return;
      closeSheet(); toast('Marked delivered — payment still pending'); render();
      return;
    }
    openSheet('markCash', id);
    return;
  }
  const updated = await callOrderRpc('mark_delivered', { p_order_id: id, p_boat_photo_url: isBoat ? _handoffPhotoData : null }, id,
    "Couldn't mark this delivered — it may already be marked delivered");
  _handoffPhotoData = null;
  if(!updated) return;
  closeSheet(); toast('Marked delivered'); render();
}
// Cash orders show the cash-collected/settled state via paymentStatusPill AND,
// when this was also a free-delivery order, the separate store-owes-payout state -
// a free-delivery cash order has two independent settlements (rider remits the
// cash they collected; store pays the rider's fee separately) so both matter.
// Buyer-pays transfer orders show nothing extra here (no gap to track); a
// free-delivery transfer order shows only the payout state, since there's no
// cash leg for the rider at all.
function riderPayoutPill(o){
  // A rental delivery job's paymentStatus describes the customer's rental
  // payment to the store, not anything the rider is owed or collecting - never
  // fall back to paymentStatusPill() for one of these, or it'd misleadingly
  // read like the rider still needs to collect cash from the customer.
  if(o.rentalItemId){
    if(o.payoutStatus==='settled') return `<span class="status-pill ok">Paid by store ✓</span>`;
    if(o.payoutStatus==='pending') return `<span class="status-pill mid">Store owes you</span>`;
    return `<span class="status-pill wait">Rental delivery</span>`;
  }
  const parts = [];
  if(o.paymentMethod==='cash_to_delivery') parts.push(paymentStatusPill(o));
  if(o.payoutStatus==='settled') parts.push(`<span class="status-pill ok">Paid by store ✓</span>`);
  else if(o.payoutStatus==='pending') parts.push(`<span class="status-pill mid">Store owes you</span>`);
  if(!parts.length) parts.push(paymentStatusPill(o));
  return parts.join(' ');
}

function changeQty(key, d){
  const { itemId } = parseCartKey(key);

  const others = cartQtyForItem(itemId) - (state.cart[key]||0);   // stock is shared by all option combinations

  render();

function cartGroupTotals(lines){

  const ownDefault = defaultAddress('own');
  if(!ownDefault || !ownDefault.zone) return { itemsTotal, fee:null, feeKnown:false, grandTotal:itemsTotal };
  const fee = zoneFee(ownDefault.zone) + extraFee;

}

// Reads + validates whichever half of deliveryTargetFieldsHTML() is showing.

// Fills whichever block's fields from a saved address the customer picked from

function pickSavedAddress(category, id){

    if(a.island && !isGreaterMale(a.island)){ _destIsland = a.island; setDestMode('island'); const at = atollOfIsland(a.island); const as=document.getElementById('dest_atoll'); if(as && at){ as.value = at.code; islandAtollChanged('dest', null); const is=document.getElementById('dest_island'); if(is) is.value = a.island; } refreshCheckoutCards(); }

// Called once an order actually places successfully (see the three
// readDeliveryTargetFields() call sites) - saves whatever was used as the new
// default for its category, matching an already-saved address instead of
// duplicating it if the details are identical. Silent no-op for a guest
// (no sb/customerId) since there's no account to attach it to.
async function rememberDeliveryAddress(deliveryTarget){
  if(!sb || !state.customerId || !deliveryTarget) return;
  const cat = deliveryTarget.addressCategory;
  const fields = cat==='boat'
    ? { name: deliveryTarget.receiverName, phone: deliveryTarget.receiverPhone, address: null, zone: null, harbour: deliveryTarget.receiverAddress }
    : { name: deliveryTarget.receiverName, phone: deliveryTarget.receiverPhone, address: deliveryTarget.receiverAddress, zone: _destMode==='male' ? _selectedZone : null, island: _destMode==='male' ? (_selectedZone==='male'?'Malé':'Hulhumalé') : (_destIsland||null), harbour: null };
  await saveAddressFromCheckout(cat, fields);
}
async function saveAddressFromCheckout(category, fields){
  if(!requireOnline()) return;
  const existing = myAddresses(category).find(a =>
    a.name===fields.name && a.phone===fields.phone &&
    (category==='boat' ? a.harbour===fields.harbour : a.address===fields.address));
  if(existing){
    // Same place: keep its island / zone up to date, and make it the default.
    if(category!=='boat' && (existing.island!==(fields.island||'') || existing.zone!==fields.zone)){
      const { error } = await sb.from('customer_addresses').update({ island: fields.island||null, zone: fields.zone||null }).eq('id', existing.id);
      if(!error){ existing.island = fields.island||''; existing.zone = fields.zone||null; }
    }
    if(!existing.isDefault) await setAddressDefault(existing.id, category);
    return;
  }
  // Not using set_default_address here since it expects an existing row -
  // simplest correct way to make a brand-new row the default is to unset
  // whatever's default first (RLS lets the customer update their own rows
  // directly), then insert this one already flagged as default.
  await sb.from('customer_addresses').update({ is_default: false }).eq('customer_id', state.customerId).eq('category', category).eq('is_default', true);
  DB.addresses.forEach(a=>{ if(a.category===category && a.customerId===state.customerId) a.isDefault=false; });
  const row = { id: uid('addr'), customerId: state.customerId, category, isDefault: true, createdAt: Date.now(), ...fields };
  const { data, error } = await sb.from('customer_addresses').insert(toDbRow('addresses', row)).select();
  if(!error && data && data[0]) DB.addresses.push(fromDbRow('addresses', data[0]));
}
// Zone change affects every store's delivery fee (and so its total) at once, since
// there's one shared delivery destination - updates each store card's numbers in
// place rather than re-rendering the whole sheet (see storeCheckoutCardHTML()).
function refreshCheckoutTotals(){

// Earliest accepted-booking start date that's today or later, if any - an
// instant rental starting today can never run that far without crossing it.
function nextBookingStart(itemId){
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = itemBookingWindows(itemId).filter(w=>w.start>=today).sort((a,b)=>a.start-b.start)[0];
  return upcoming ? upcoming.start : null;
}
function maxRentDaysAvailable(itemId){
  const start = nextBookingStart(itemId);
  if(!start) return Infinity;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.max(1, Math.round((start-today)/86400000));

function changeRentDays(d){

}

// Rentals are paid entirely to the renter (the store) - there's no zone fee,

  // check a booking request goes through, so a rental can never be placed across
  // a date range someone already has an accepted booking for.

    return;

  let deliveryTarget = null;
  if(fulfillment==='pickup'){
    deliveryTargetType = 'pickup'; receiverName = null; receiverPhone = null; receiverAddress = null;
    pickupLocation = item.pickupLocation || '';
  } else {
    deliveryTarget = readDeliveryTargetFields();
    if(!deliveryTarget) return;
    ({ deliveryTargetType, receiverName, receiverPhone, receiverAddress } = deliveryTarget);
  }
  const boatDepartureAt = deliveryTarget ? deliveryTarget.boatDepartureAt||null : null;
  const biz = DB.businesses.find(b=>b.id===item.businessId);
  const extraFee = item.extraDeliveryFee||0;
  const deposit = item.rentalDeposit||0;
  const rentCost = effectiveDailyRate(item)*_rentDays;
  // Deferring the rental fee to return time only makes sense when there's an
  // actual advance/deposit to collect now - otherwise nothing at all would be
  // due at checkout, which submitRentItem never allows regardless of what
  // _rentFeeTiming happens to still be set to from a previous item.
  const isDeferred = deposit>0 && _rentFeeTiming==='on_return';
  const itemsTotal = isDeferred ? deposit : rentCost + deposit;
  const total = itemsTotal + extraFee;
  const order = {
    id: uid('ord'), businessId: biz.id, businessName: biz.name,
    customerId: state.customerId, customerEmail: state.customerEmail,
    customerName: state.customerName, customerPhone: state.customerPhone||'',
    deliveryTargetType, receiverName, receiverPhone, receiverAddress, boatDepartureAt, pickupLocation,
    items: [{itemId:item.id, name:`${item.name} (rental, ${_rentDays} day${_rentDays>1?'s':''}${isDeferred?' · advance':''})`, price:itemsTotal, qty:1}],
    itemsTotal, deliveryFee: 0, extraDeliveryFee: extraFee, total, zone:null,
    deliveryType: 'free',
    // The rental payment itself always goes straight to the renter (the store) -
    // no delivery partner ever touches it. A delivery partner can still be brought
    // in afterwards purely to physically deliver the item, paid a separate fee the
    // store offers out of its own pocket (see offerRentalDelivery()) - starts off
    // with nobody assigned and no fee, same as before that existed.
    deliveryPartnerPayout: 0, payoutStatus: null,
    deliveryPersonId:null, deliveryPersonName:null,
    needsDeliveryPartner: false, rentalPayoutTiming: null,
    paymentMethod: _selectedPay==='swipe' && bizTakesSwipe(biz) ? 'swipe' : _selectedPay==='transfer' ? 'transfer' : 'cash_on_pickup',
    paymentStatus: _selectedPay==='swipe' && bizTakesSwipe(biz) ? 'awaiting_swipe' : _selectedPay==='transfer' ? 'pending_transfer' : 'pending_cash',
    status:'placed', createdAt: Date.now(), slipDataUrl:null,
    rentalDays: _rentDays, rentalItemId: item.id, rentalFulfillment: fulfillment,
    // See mark_rental_fulfilled/mark_delivered's payment_status='paid' gate -
    // the item can't be handed over until whatever's due right now (the full

    // are only ever touched by mark_rental_returned(), once the item actually
    // comes back - see markRentalReturned()/sheetRentalReturn() below.
    rentalFeeAmount: isDeferred ? rentCost : null,
    rentalFeeTiming: isDeferred ? 'on_return' : 'upfront',
    rentalReturnedAt: null,
    rentalReturnFeeStatus: isDeferred ? 'pending' : null
  };
  if(sb){
    const dbRow = toDbRow('orders', order);
    await encryptOrderRow(dbRow, order);
    const { error } = await sb.from('orders').insert(dbRow);
    if(error){ toast('Could not place rental order: '+error.message, 'bad'); return; }
    // Stock lives on the items table, which is locked down to the owning
    // business via RLS - a renting customer can't upsert it directly, so the
    // decrement has to go through this SECURITY DEFINER RPC instead.
    const { data: updated, error: stockErr } = await sb.rpc('decrement_rental_stock', { p_item_id: item.id });
    if(!stockErr && updated && updated[0]) item.stock = updated[0].stock;

/* ---- Rental bookings: a customer can send a booking request for any rental
   item - "available soon" ones (which aren't rentable yet at all) as well as
   "available now" ones (for a future date instead of renting immediately).
   The renter accepts (optionally setting a booking charge) or declines - no
   order, payment, or delivery-partner machinery is involved until they decide,
   and nothing here ever touches the zone-fee/payout system rentals already
   skip. An accepted booking's date window then blocks that same window from
   being booked again or instantly rented (see itemBookingWindows() et al). ---- */
// The native <input type="date"> can't be made to show individual dates as
// unavailable inside its own popup calendar - no amount of min/max/step gets
// you a per-day disable - so the booking date picker is a small hand-built
// month grid instead: every day already inside an accepted booking's window
// (see itemBookingWindows()) renders struck-through and unclickable, and
// picking one at all is simply impossible rather than only caught at submit.
// Range picking is two taps: the first tap sets the start day, the second
// tap (on a later day) sets the end day and everything in between highlights
// as the booked range. A third tap after a range is already complete starts
// a fresh range. If the finished range would run into a day already booked
// for this item, _bookWarning holds a message shown as a blocking popup
// (see approveBookWarning()) instead of silently letting the range stand.
let _bookStartDate = null;
let _bookEndDate = null;
let _bookCalMonth = null; // {y, m} - m is 0-indexed, matches Date's own convention
let _bookWarning = null;
function openBookRentalItem(itemId){
  if(sb && !state.authed){ state.pendingItemAction = {type:'book', itemId}; openSheet('signIn', {intent:'book'}); return; }
  const item = DB.items.find(i=>i.id===itemId);
  const minDate = (item && item.availableFrom) || todayISODate();
  const [y,m] = minDate.split('-').map(Number);
  _bookStartDate = minDate;
  _bookEndDate = null;
  _bookWarning = null;
  _bookCalMonth = { y, m: m-1 };
  openSheet('bookRentalItem', itemId);
}
function bookRangeDays(){
  if(!_bookStartDate || !_bookEndDate) return 1;
  const [sy,sm,sd] = _bookStartDate.split('-').map(Number);
  const [ey,em,ed] = _bookEndDate.split('-').map(Number);
  const start = new Date(sy,sm-1,sd), end = new Date(ey,em-1,ed);
  return Math.round((end-start)/86400000) + 1;
}
function shiftBookCalMonth(delta, minDate){
  let { y, m } = _bookCalMonth;
  m += delta;
  if(m<0){ m=11; y--; } else if(m>11){ m=0; y++; }
  const [minY,minM] = minDate.split('-').map(Number);
  if(y<minY || (y===minY && m<minM-1)) return; // never behind the item's own earliest date
  _bookCalMonth = { y, m };
  render();
}
// First tap starts a fresh range; a second tap on a later day closes it (and
// checks the whole span for a booking conflict); a same-day second tap makes
// a one-day booking; anything after a range is already closed starts over.
function selectBookDate(dateStr){
  const itemId = state.sheetData;
  if(!_bookStartDate || _bookEndDate){
    _bookStartDate = dateStr; _bookEndDate = null; _bookWarning = null;
    render(); return;
  }
  if(dateStr < _bookStartDate){ _bookStartDate = dateStr; _bookEndDate = null; render(); return; }
  _bookEndDate = dateStr;
  const days = bookRangeDays();
  if(bookingOverlapsExisting(itemId, _bookStartDate, days)){
    _bookWarning = `These dates aren't available — part of ${fmtDateShort(_bookStartDate)}${days>1?` – ${fmtDateShort(_bookEndDate)}`:''} is already booked for this item.`;
  } else {
    _bookWarning = null;
  }
  render();
}
function approveBookWarning(){
  _bookWarning = null;
  _bookEndDate = null; // keep the start date, force a different end date
  render();
}
// One month's worth of day buttons for the booking date picker - min/y/m all
// passed in rather than recomputed, since the caller (sheetBookRentalItem)
// already has them and every day cell needs the same booked-dates set.
function bookCalendarHTML(item, minDate){
  const windows = itemBookingWindows(item.id);
  const bookedSet = new Set();
  windows.forEach(w=>{
    for(let d=new Date(w.start); d<=w.end; d.setDate(d.getDate()+1)) bookedSet.add(isoDateStr(d));
  });
  const { y, m } = _bookCalMonth;
  const first = new Date(y, m, 1);
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = first.toLocaleDateString(undefined, { month:'long', year:'numeric' });
  const [minY,minM] = minDate.split('-').map(Number);
  const canGoPrev = y>minY || (y===minY && m>minM-1);
  const cells = [];
  for(let i=0;i<first.getDay();i++) cells.push('<span></span>');
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isBooked = bookedSet.has(dateStr);
    const isPast = dateStr < minDate;
    const isEndpoint = dateStr===_bookStartDate || dateStr===_bookEndDate;
    const isInRange = _bookStartDate && _bookEndDate && dateStr>_bookStartDate && dateStr<_bookEndDate;
    const disabled = isPast || isBooked;
    cells.push(`<button type="button" class="cal-day${isEndpoint?' selected':(isInRange?' in-range':'')}${isBooked?' booked':''}" ${disabled?'disabled':''} onclick="selectBookDate('${dateStr}')" title="${isBooked?'Already booked - not available':''}">${d}</button>`);
  }
  return `
  <div class="cal-wrap">
    <div class="row between" style="margin-bottom:8px;">
      <button type="button" class="btn btn-outline btn-sm" ${canGoPrev?'':'disabled style="opacity:.3;"'} onclick="shiftBookCalMonth(-1,'${minDate}')">‹</button>
      <strong style="font-size:.92em;">${monthLabel}</strong>
      <button type="button" class="btn btn-outline btn-sm" onclick="shiftBookCalMonth(1,'${minDate}')">›</button>
    </div>
    <div class="cal-grid cal-dow">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="cal-grid">${cells.join('')}</div>
    ${windows.length ? `<p class="muted" style="font-size:.72em; margin-top:8px;">✕ struck-through = already booked, not available</p>` : ''}
  </div>`;
}
function sheetBookRentalItem(){

  if(!_bookStartDate || !_bookCalMonth){

      <button class="btn btn-primary" style="width:100%;" onclick="approveBookWarning()">Approve — I'll pick different dates</button>
    </div>
  </div>` : ''}`;
}
async function submitBookRentalItem(itemId){
const item = DB.items.find(i=>i.id===itemId);

const biz = DB.businesses.find(b=>b.id===item.businessId);

const booking = {

DB.bookings.unshift(booking);

closeSheet();
go('custOrders');
toast('Booking request sent!');

async function sendPasswordReset(){
  if(!fbAuth){ toast("Can't reach the sign-in service. Check your connection",'bad'); return; }
  const id = val('auth_identifier');
  let email = id && id.includes('@') ? id : null;
  if(id && !email && sb){

    // browser which address belongs to the number.

    toast((data && data.message) || 'If that number has an account, we sent a reset email'); return;
  }
  if(!email){ toast('Enter your email (or mobile number) above first','bad'); return; }
  try{ await fbSendPasswordReset(email); toast(`Password reset email sent to ${email}`); }

async function signInWithIdentifierPassword(){
  if(!sb || !fbAuth){ toast("Can't reach the sign-in service. Check your connection and reload",'bad'); return; }
  const identifier = val('auth_identifier'), pass = val('auth_pass');
  if(!identifier || !pass){ toast('Enter your mobile number or email, and your password','bad'); return; }
  // Captured now, before closeSheet() wipes state.sheetData - onAuthStateChange's
  // handlePostAuth() resumes this once sign-in (and any forced setupMobile step) finishes.
  const intent = state.sheetData && state.sheetData.intent;
  if(intent==='business' || intent==='delivery') state.pendingIntent = intent;
  let email;
  if(identifier.includes('@')){
    email = identifier;
  } else {
    // The server checks the password before it says which email the number
    // belongs to (see supabase/functions/phone-login).
    const { data, error } = await sb.functions.invoke('phone-login', { body: { action:'signin', phone: identifier, password: pass } });
    if(error || !data || !data.email){ let m = 'Incorrect mobile/email or password. New here? Sign up below'; try{ const b = error && await error.context.json(); if(b && b.error) m = b.error; }catch(_){} toast(m,'bad'); return; }
    email = data.email;
  }
  let cred;
  try{ cred = await fbAuth.signInWithEmailAndPassword(email, pass); }
  catch(e){ toast(fbErrorText(e),'bad'); return; }
  const u = cred.user;
  if(!u.emailVerified){
    // Signed in to Firebase but not verified yet: the database treats this
    // as signed out, so finish verification first.
    _pendingVerifyEmail = email; _pendingSignupPassword = pass;
    _verifySendError = '';
    if(Date.now() >= _verifyResendAt){ try{ await fbSendVerification(u); startVerifyCooldown(60); }catch(e){ console.warn(e); _verifySendError = fbErrorText(e); } }
    openSheet('verifyEmail');
    return;
  }
  await u.getIdToken(true);
  applySession(fbSession(u));
  await unlockMyPrivateKey(u.uid, pass);
  await loadDB();   // reload as the signed-in user (orders, addresses, ...)
  closeSheet();
  toast('Signed in!');
  try{ await handlePostAuth(true); }catch(e){ console.error(e); }
  render();
}

async function submitSignUp(){
  if(!sb){ toast('Connect Supabase first — see the config note at the top of the script','bad'); return; }
  const name = val('su_name'), phone = val('su_phone'), email = val('su_email'), pass = val('su_password');
  const policyBox = document.getElementById('su_policy');
  if(!name){ toast('Enter your full name','bad'); return; }
  if(phone && !/^[79]\d{6}$/.test(phone)){ toast('Enter a valid mobile number, or leave it blank for now','bad'); return; }
  if(!email || !email.includes('@')){ toast('Enter a valid email','bad'); return; }
  if(!pass || pass.length<6){ toast('Password must be at least 6 characters','bad'); return; }
  if(!policyBox || !policyBox.checked){ toast('Please agree to the policies to continue','bad'); return; }
  // Captured now, before openSheet('verifyEmail') below wipes state.sheetData (it opens
  // with no data) - without this, a business/delivery signup intent silently vanished
  // partway through signup -> verify-code -> mobile-number, leaving the user stranded
  // on customer home once it finished with no indication to continue into setup.
  if(_signupRole==='seller') state.pendingIntent = 'business';
  else if(_signupRole==='delivery') state.pendingIntent = 'delivery';
  _pendingSignupPhone = phone || null;
  _signupInFlight = true;
  if(!fbAuth){ _signupInFlight = false; toast("Can't reach the sign-in service. Check your connection and reload",'bad'); return; }
  let cred;
  try{
    cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
  }catch(e){ _signupInFlight = false; toast(fbErrorText(e),'bad'); return; }
  // The account exists from here on: a failed name/email step shouldn't
  // strand the user, they can resend from the next screen.
  try{ await cred.user.updateProfile({ displayName: name }); }catch(e){ console.warn(e); }
  _verifySendError = '';
  try{ await fbSendVerification(cred.user); startVerifyCooldown(60); }
  catch(e){ console.warn(e); _verifySendError = fbErrorText(e); toast("Account created, but the email didn't send: "+_verifySendError, 'bad'); }
  _pendingVerifyEmail = email;
  _signupInFlight = false;
  _pendingSignupPassword = pass;
  openSheet('verifyEmail');
}
// After tapping the verification link in the Firebase email, the person

async function confirmedSignIn(){
  if(!requireOnline() || !fbAuth) return;
  let u = fbAuth.currentUser;

    try{ u = (await fbAuth.signInWithEmailAndPassword(_pendingVerifyEmail, _pendingSignupPassword)).user; }
    catch(e){ toast(fbErrorText(e),'bad'); return; }

  await u.reload();

// Shared by submitSignUp()'s Confirm-email-off branch above and submitVerifyCode()
// below (the normal OTP path): silently submits a phone number captured on the
// sign-up form if valid, then resumes whatever the user was signing up to do
// (business/delivery setup) - falling back to the mobile-number sheet only if no
// phone was given up front, or it turns out to already be taken.
async function finishSignupPostAuth(userId, password){
  _pendingSignupUserId = userId;

  // plaintext password from the signup form is still in scope -- see
  // encryption_module.js above. `password` is null when this runs from
  // submitVerifyCode()'s OTP path instead (a separate screen with no
  // password field); that account just gets its keypair a little later,
  // via the self-heal in unlockMyPrivateKey() on its first real login.
  const keyCols = password ? await genKeypairAndWrap(password) : {};

// Places just ONE store's slice of the cart as its own order - a transfer needs a
// slip attached first (that's what "moves the card to orders": there's no separate
// pending-transfer step here, the order is created already slip_uploaded so the
// store can review it straight away), cash needs nothing but confirmation. Removes
// only that store's card from the open checkout sheet, leaving every other store's
// card (and its typed-in payment state) untouched - only when nothing selected is
// left across every store does checkout close and hand off to My Orders.
async function placeStoreOrder(bizId){
  const biz = DB.businesses.find(b=>b.id===bizId);
  if(!biz) return;
  const entries = Object.entries(state.cart);
  const allCartLines = cartLinesFromState();
  const cartLines = cartCheckoutLines(allCartLines).filter(l=>l.it.businessId===bizId);
  const lines = cartLines.map(l=>({itemId:l.it.id, name: optsLabel(l.opts) ? `${l.it.name} (${optsLabel(l.opts)})` : l.it.name, options: Object.keys(l.opts||{}).length ? l.opts : undefined, price:effectivePrice(l.it), qty:l.qty}));
  const itemsTotal = lines.reduce((s,l)=>s+l.price*l.qty,0);
  const name = val('c_name')||state.customerName; const phone = val('c_phone');
  if(!lines.length){ toast('No items to place for this store','bad'); return; }
  if(!name || !phone){ toast('Enter your name and phone','bad'); return; }
  // The phone field is only ever editable when nothing's on file yet (see
  // sheetCheckout()) - save it now so it's there next time instead of asking
  // again on every order. Best-effort: a save failure (e.g. that number's
  // already registered to another account) doesn't block placing this order.
  if(sb && state.authed && !state.customerPhone && /^[79]\d{6}$/.test(phone)){
    const { error: profileErr } = await sb.from('user_profiles').insert({ user_id: state.customerId, phone, email: state.customerEmail });
    if(!profileErr) state.customerPhone = phone;
  }
  const deliveryTarget = readDeliveryTargetFields();
  if(!deliveryTarget) return;
  const { deliveryTargetType, receiverName, receiverPhone, receiverAddress, boatDepartureAt } = deliveryTarget;
  if(!bizCanTakeOrders(biz)){ toast(`${biz.name} hasn't added a way to get paid yet, so it can't take orders`, 'bad'); return; }
  const payMethod = ckPayFor(biz);
  const originIsland = bizIsland(biz), destIsland = checkoutDestKey();
  if(!destIsland){ toast('Pick the island to deliver to','bad'); return; }
  const route = routeFor(originIsland, destIsland);
  if(!route){ toast(`${biz.name} can't deliver from ${originIsland} to ${destIsland}`,'bad'); return; }
  const zoneRoute = route==='male_zone';
  const buyerPaysFee = cartBuyerPaysFee(cartLines);
  // Zones have a flat fee; every other route's charge is set by the store
  // when it approves the order (approve_swipe_order).
  const fee = zoneRoute ? zoneFee(_selectedZone) : 0;
  const extraFee = cartExtraFee(cartLines);
  const total = itemsTotal + (buyerPaysFee?fee:0) + extraFee;
  state.customerName = name;
  const order = {
    id: uid('ord'), businessId: biz.id, businessName: biz.name,
    customerId: state.customerId, customerEmail: state.customerEmail,
    customerName: name, customerPhone: phone, items: lines,
    deliveryTargetType, receiverName, receiverPhone, receiverAddress, boatDepartureAt: boatDepartureAt||null,
    itemsTotal, deliveryFee: buyerPaysFee ? fee : 0, extraDeliveryFee: extraFee, total, zone: zoneRoute ? _selectedZone : null,
    deliveryType: buyerPaysFee ? 'zone' : 'free',
    route, originIsland, destIsland,
    // The delivery partner is always paid the zone's flat fee, regardless of
    // whether the buyer was charged for it.
    deliveryPartnerPayout: fee, payoutStatus: null,
    deliveryPersonId:null, deliveryPersonName:null,
    // Buy now orders are paid by Swipe or bank transfer, after the store
    // approves them (see approveOrderRequest()).
    paymentMethod: payMethod,
    paymentStatus: 'awaiting_approval',
    status:'placed', createdAt: Date.now(), slipDataUrl: null
  };
  // A genuine insert, not saveDB('orders', [order])'s upsert - PostgREST's upsert
  // always compiles to INSERT ... ON CONFLICT DO UPDATE, and Postgres checks UPDATE
  // privilege on every column in that DO UPDATE SET clause up front, whether or not a
  // conflict ever actually happens. Since this id is always freshly generated (never
  // an existing row), that DO UPDATE branch never fires - but the now-locked-down
  // total/payment_status/payout_status/delivery_partner_payout columns would still
  // fail the privilege check and reject the whole insert. A plain insert only needs
  // INSERT privilege, which every column keeps.
  if(sb){
    const dbRow = toDbRow('orders', order);
    await encryptOrderRow(dbRow, order);
    const { error } = await sb.from('orders').insert(dbRow);
    if(error){
      const m = /checkout_blocked:?\s*([\w-]+)?/.exec(error.message||'');
      if(m){ const owed = (m[1] && DB.orders.find(x=>x.id===m[1])) || unpaidDeliveredOrder(); if(owed){ openSheet('unpaidBlock', owed.id); return; } toast("You haven't paid for a delivered order. Pay it before placing a new one",'bad'); return; }
      toast('Could not place order: '+error.message, 'bad'); return;
    }
    await rememberDeliveryAddress(deliveryTarget);
  }
  DB.orders.push(order);
  // Clear only this store's lines, not the whole cart - any other store, or
  // anything left deselected (see toggleCartSelected()), stays in the cart.
  for(const l of cartLines){ delete state.cart[l.key]; if(state.cartSelected) delete state.cartSelected[l.key]; }
  const card = document.getElementById('storeCard_'+bizId);
  if(card) card.remove();
  toast(payMethod==='swipe' ? `Order sent to ${biz.name}. You'll pay with Swipe once they confirm it` : `Order sent to ${biz.name}. Once they confirm it, transfer the total and upload the slip`);
  const remainingEntries = Object.entries(state.cart);
  const remainingLines = cartLinesFromState();
  if(!cartCheckoutLines(remainingLines).length){ closeSheet(); go('custOrders'); }
}

  const mine = sb ? DB.orders.filter(o=>o.customerId===state.customerId) : DB.orders;

  const myBookings = (sb ? DB.bookings.filter(bk=>bk.customerId===state.customerId) : DB.bookings).sort((a,b)=>b.createdAt-a.createdAt);

  const myBidAuctionIds = new Set((sb ? DB.bids.filter(bd=>bd.bidderId===state.customerId) : DB.bids).map(bd=>bd.auctionId));
  const myBidAuctions = DB.auctions.filter(a=>myBidAuctionIds.has(a.id) && !a.orderId).sort((a,b)=>b.startTime-a.startTime);

// Which of the three listing types an order came from - a rental's item stays
// on the order itself (rentalItemId), but an auction leaves no trace on the
// order at all, so the only way to tell is checking which auction (if any)
// settled into it (see settleAuctionWin(), which sets auction.orderId).
function orderListingType(o){
  if(o.rentalItemId) return 'rental';
  if(DB.auctions.some(a=>a.orderId===o.id)) return 'auction';
  return 'buy_now';
}
// A rental isn't "done" when it's delivered (picked up) - only once it's
// actually been returned (rentalReturnedAt) - so it gets its own completion
// check instead of just reading o.status like every other order type does.
function isOrderCompleted(o){
  if(o.rentalItemId) return !!o.rentalReturnedAt;
  return o.status==='delivered';
}
// Business side only: a card doesn't move into the completed "Orders" list
// (see renderBizOrders()) just because it's been delivered - it also needs
// the customer's payment actually confirmed received (paid/settled, not
// merely placed/pending), so a business can't lose track of one it's still
// owed money on. A rental's own isOrderCompleted() already implies this -
// mark_rental_returned() only ever runs once any on-return fee is collected
// (or wasn't needed, for an upfront one) - so there's nothing extra to check there.
function isOrderFullyFulfilled(o){
  if(!isOrderCompleted(o)) return false;
  if(o.rentalItemId) return true;
  return o.paymentStatus==='paid' || o.paymentStatus==='settled';
}

let _slipData = null;
function previewSlip(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    _slipData = reader.result;
    const img=document.getElementById('slipPreview'); if(img) img.src=_slipData;
    const wrap=document.getElementById('slipPreviewWrap'); if(wrap) wrap.style.display='block';
  };
  reader.readAsDataURL(f);
}
function removeSlip(){
  _slipData = null;
  const input = document.getElementById('slipFile'); if(input) input.value = '';
  const wrap = document.getElementById('slipPreviewWrap'); if(wrap) wrap.style.display = 'none';
  const img = document.getElementById('slipPreview'); if(img) img.src = '';
}
// Same amount/account match requirement as the multi-store cart checkout (see
// placeStoreOrder()) - a slip alone doesn't let this through, what the buyer says
// they sent has to line up with the order's total and the store's real account.
async function submitSlip(id){
  const o = DB.orders.find(x=>x.id===id);
  const biz = o ? DB.businesses.find(b=>b.id===o.businessId) : null;
  const slipData = _slipData;
  if(!slipData){ toast('Choose a slip image first','bad'); return; }
  const enteredAmount = Number(val('slipAmountUpload'));
  const enteredAccount = val('slipAccountUpload');
  if(!enteredAmount || !enteredAccount){ toast('Enter the amount and account number first','bad'); return; }
  if(o && Math.abs(enteredAmount - o.total) > 0.01){ toast(`That amount doesn't match this order's total (${money(o.total)})`, 'bad'); return; }
  if(biz && enteredAccount.replace(/\s+/g,'') !== String(biz.accountNumber).replace(/\s+/g,'')){ toast(`That account number doesn't match the store's account (${biz.accountNumber})`, 'bad'); return; }
  if(sb){
    const { data, error } = await sb.rpc('submit_transfer_slip', { p_order_id: id, p_slip_url: slipData, p_amount: enteredAmount, p_account: enteredAccount });
    if(error){
      const m = error.message||'';
      toast(/slip_amount_mismatch/.test(m) ? `That amount doesn't match this order's total (${money(o.total)})` : /slip_account_mismatch/.test(m) ? "That account number doesn't match the store's account" : 'Could not submit the slip: '+m, 'bad');
      return;
    }
    if(!data || !data.length){ toast("This order isn't waiting for a transfer yet. The store has to approve it first",'bad'); return; }
    const upd = fromDbRow('orders', data[0]); await decryptOrderRow(upd, data[0]);
    const k = DB.orders.findIndex(x=>x.id===id); if(k>=0) DB.orders[k] = upd;
  }
  if(!sb){ toast("You're offline, so this can't be saved. Reconnect and try again",'bad'); return; }
  _slipData = null;
  closeSheet(); toast('Slip submitted — waiting for store approval'); render();
}

async function submitBookingSlip(id){
const bk = DB.bookings.find(x=>x.id===id);
const biz = bk ? DB.businesses.find(b=>b.id===bk.businessId) : null;
const slipData = _slipData;
if(!slipData){ toast('Choose a slip image first','bad'); return; }
const enteredAmount = Number(val('slipAmountUpload'));
const enteredAccount = val('slipAccountUpload');
if(!enteredAmount || !enteredAccount){ toast('Enter the amount and account number first','bad'); return; }
if(bk && Math.abs(enteredAmount - bk.bookingCharge) > 0.01){ toast(`That amount doesn't match the booking charge (${money(bk.bookingCharge)})`, 'bad'); return; }
if(biz && enteredAccount.replace(/\s+/g,'') !== String(biz.accountNumber).replace(/\s+/g,'')){ toast(`That account number doesn't match the store's account (${biz.accountNumber})`, 'bad'); return; }
const dbRow = { slip_url: slipData };
await encryptBookingRow(dbRow, bk);
const updated = await callBookingRpc('submit_booking_slip', { p_booking_id: id, p_slip_enc: dbRow.slip_enc, p_slip_iv: dbRow.slip_iv, p_slip_keys: dbRow.slip_keys }, id);
_slipData = null;
if(!updated) return;
closeSheet(); toast('Slip submitted — waiting for store approval'); render();
}


/* =================== INIT =================== */
// Runs after any sign-in (initial load or a later auth state change alike), then
// resumes a pending business/delivery signup intent - but only once any forced
// setupMobile step it triggered has been dealt with (submitMobileNumber()/
// skipMobileSetup() call resolvePendingIntent() themselves once that happens).
async function handlePostAuth(isFreshSignIn=false){
  if(state.adminMode){ await checkAdminStatus(); return; }
  // submitSignUp() sets this while a Confirm-email-off signup skips straight from
  // signUp() to an active session (see the TODO there) - that session's SIGNED_IN
  // event can fire before submitSignUp() finishes its own post-signup handling
  // (phone auto-submit, pending-intent routing), so bail out and let it finish
  // instead of racing it with a duplicate/premature check here.
  if(_signupInFlight) return;
  await checkMobileProfile();
  // Excludes 'verifyEmail' too, not just 'setupMobile' - onAuthStateChange can fire
  // before submitVerifyCode()'s own openSheet('setupMobile') call runs (event ordering
  // relative to the awaited verifyOtp() call isn't guaranteed), which would otherwise
  // resolve the pending intent while the user is still mid-verification.
  if(state.sheet!=='setupMobile' && state.sheet!=='verifyEmail') resolvePendingIntent(isFreshSignIn);
}
// Shown in place of the app if startup fails, so the screen is never left
// empty: says what happened and offers a reload.
function startupErrorHTML(e){
  const msg = (e && (e.message || String(e))) || 'Unknown error';
  return `<div class="empty" style="padding-top:30vh;">
    <span class="ic">⚠️</span>
    <h2>Maldexpress couldn't start</h2>
    <p style="margin:6px auto 16px; max-width:32ch;">Check your connection and try again. If it keeps happening, send this to support: <code style="word-break:break-word;">${escapeAttr(msg)}</code></p>
    <button class="btn btn-primary btn-sm" onclick="location.reload()">Reload</button>
  </div>`;
}
// A thrown error anywhere before the first full render used to leave a blank
// page. If nothing has drawn yet, show the error screen instead.
window.addEventListener('error', e=>{
  const app = document.getElementById('app');
  if(app && !storageReady) app.innerHTML = startupErrorHTML(e.error || e.message);
});
window.addEventListener('unhandledrejection', e=>{
  const app = document.getElementById('app');
  if(app && !storageReady) app.innerHTML = startupErrorHTML(e.reason);
});
(async function init(){
  // The CSS --fs var otherwise only ever gets set from the Settings slider's own
  // oninput - without this, the default state.fontSize never actually reaches the
  // page until the user drags the slider once.
  setFont(state.fontSize);
  // Draw the "Loading Maldexpress…" screen straight away. Before, nothing was
  // drawn until every table had downloaded and the sign-in check finished, so
  // a slow connection showed an empty screen.
  render();
  maybeShowOpeningAd();
  try{
    await loadDB();
    seedIfEmpty();
  }catch(e){
    console.error('Startup data load failed:', e);
    storageReady = true;
    toast('Some data could not be loaded. Pull down or reload to try again', 'bad');
  }
  if(sb){
    // Each step is guarded on its own: a failed session restore shouldn't stop
    // the app from opening as a guest, and a failed post-sign-in check
    // shouldn't stop the signed-in app from drawing.
    // Firebase restores a saved sign-in on its own; wait for that first
    // answer (capped so a slow network can't hold the app), then keep
    // listening for sign-outs and other changes.
    try{
      if(fbAuth){
        const first = await Promise.race([
          new Promise(res=>{ const off = fbAuth.onAuthStateChanged(u=>{ off(); res(u); }); }),
          new Promise(res=>setTimeout(()=>res(fbAuth.currentUser), 8000))
        ]);
        applySession(fbSession(first));
        if(state.authed){ await loadDB(); await handlePostAuth(); }
      }
    }catch(e){ console.error('Session restore failed:', e); }
    try{
      if(fbAuth){
        let seenFirst = false;
        fbAuth.onAuthStateChanged(async u=>{
          if(!seenFirst){ seenFirst = true; return; }   // initial restore handled above
          const wasAuthed = state.authed;
          applySession(fbSession(u));
          // Explicit sign-in/verify paths call handlePostAuth themselves; this
          // only catches sign-outs or a session ending elsewhere.
          if(wasAuthed !== state.authed){ await loadDB(); render(); }
        });
      }
      ensureLiveRefresh();
    }catch(e){ console.error('Live updates failed to start:', e); }
  }
  try{ if(!/[?&](item|store)=/.test(location.search)) openWorkModeOnStart(); }catch(e){ console.error('Work mode start failed:', e); }
  try{ applyDeepLink(); }catch(e){ console.error('Share link failed:', e); }
  try{ render(); }
  catch(e){ console.error('Render failed:', e); document.getElementById('app').innerHTML = startupErrorHTML(e); }
})();
</script>
