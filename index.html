  .sel-wrap.on > .item-card{border-color:var(--lagoon-500); box-shadow:0 0 0 2px var(--lagoon-500);}
  .sel-dot{color:var(--lagoon-600); display:flex;}
  .item-status.paused{color:var(--ink-dim);}
  .danger-txt{color:var(--red) !important;}
  .danger-bg{background:var(--red) !important; box-shadow:none !important;}
  .photo-slots{display:grid; grid-template-columns:repeat(auto-fill, minmax(88px,1fr)); gap:8px;}
  .ps-tile{position:relative; aspect-ratio:1/1; border-radius:14px; overflow:hidden; background:var(--sand-2); border:1px solid var(--edge);}
  .ps-tile img{width:100%; height:100%; object-fit:cover;}
  .ps-tile.cover{box-shadow:0 0 0 2px var(--lagoon-500);}
  .ps-cover{position:absolute; left:6px; bottom:6px; padding:2px 7px; border-radius:99px; background:var(--lagoon-700); color:#fff; font-size:.68em; font-weight:800;}
  .ps-btn{position:absolute; top:5px; width:26px; height:26px; border-radius:50%; border:none; background:rgba(13,43,51,.7); color:#fff; font-size:.8em; display:flex; align-items:center; justify-content:center;}
  .ps-x{right:5px;} .ps-star{left:5px;}
  .ps-add{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; border:1.5px dashed var(--lagoon-500); background:var(--lagoon-50); color:var(--lagoon-700); text-align:center; padding:6px;}
  .ps-add span{font-size:1.6em; line-height:1;} .ps-add small{font-size:.7em; font-weight:700;}
  .gal-arrow{font-size:calc(var(--fs)*1.6) !important; position:absolute; top:50%; transform:translateY(-50%); width:38px; height:38px; border-radius:50%; border:none; background:rgba(255,255,255,.92); color:var(--ink); line-height:1; box-shadow:0 2px 8px rgba(13,43,51,.2); display:flex; align-items:center; justify-content:center;}
  .gal-arrow.prev{left:10px;} .gal-arrow.next{right:10px;}
  .gal-count{position:absolute; right:10px; bottom:10px; padding:3px 9px; border-radius:99px; background:rgba(13,43,51,.7); color:#fff; font-size:calc(var(--fs)*.8) !important; line-height:1.4; font-weight:700;}
  .ip-photo.gal{display:block;}
  .gal-track{display:flex; width:100%; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain; outline:none;}
  .gal-track::-webkit-scrollbar{display:none;}
  .gal-slide{flex:0 0 100%; height:100%; scroll-snap-align:center; scroll-snap-stop:always; display:flex; align-items:center; justify-content:center;}
  .gal-slide img{width:100%; height:100%; object-fit:contain; background:#fff; user-select:none; -webkit-user-drag:none;}
  .gal .gal-arrow{transition:opacity .35s ease, transform .35s ease;}
  .gal.idle .gal-arrow{opacity:0; pointer-events:none;}
  .gal.idle .gal-arrow.prev{transform:translate(-8px,-50%);}
  .gal.idle .gal-arrow.next{transform:translate(8px,-50%);}
  .gal-count{transition:opacity .35s ease;}
  .gal-thumb{transition:border-color .2s ease, transform .2s ease;}
  .gal-thumb.on{transform:scale(1.04);}
  .gal-thumbs{display:flex; gap:8px; margin-top:10px; overflow-x:auto; scrollbar-width:none;}
  .gal-thumb{flex:0 0 64px; height:64px; border-radius:12px; overflow:hidden; border:2px solid transparent; padding:0; background:var(--sand-2);}
  .gal-thumb img{width:100%; height:100%; object-fit:cover;}
  .gal-thumb.on{border-color:var(--lagoon-600);}
  .opt-row-chips{display:block;}
  .opt-row-chips > label{display:block; margin-bottom:6px;}
  .opt-chips{display:flex; flex-wrap:wrap; gap:6px;}
  .opt-chip{padding:7px 12px; border-radius:99px; border:1.5px solid var(--edge-2); background:#fff; color:var(--ink); font-weight:600; font-size:.85em;}
  .opt-chip.on{background:var(--lagoon-700); border-color:var(--lagoon-700); color:#fff;}
  .opt-add{display:flex; gap:6px; margin-top:8px;}
  .opt-add input{flex:1; min-width:0;}
  .bulk-thumb-wrap{position:relative; flex-shrink:0; display:block;}
  .bulk-more{position:absolute; right:4px; bottom:4px; z-index:1; padding:1px 6px; border-radius:99px; background:var(--lagoon-700); color:#fff; font-size:.68em; font-weight:800;}
  /* Live support */
  .ticket-card{display:block; width:100%; text-align:left; margin-bottom:8px; background:var(--surface); border:1px solid var(--edge);}
  .sup-badge{display:inline-block; min-width:18px; padding:0 6px; border-radius:99px; background:var(--sunset); color:#fff; font-size:.72em; font-weight:800; line-height:18px; text-align:center;}
  .sup-thread{display:flex; flex-direction:column; gap:10px; max-height:46vh; overflow-y:auto; padding:4px 2px;}
  .sup-msg{max-width:86%; padding:10px 12px; border-radius:16px; background:var(--sand-2);}
  .sup-msg.me{align-self:flex-end; background:var(--lagoon-50); border-bottom-right-radius:6px;}
  .sup-msg.them{align-self:flex-start; background:#fff; border:1px solid var(--edge); border-bottom-left-radius:6px;}
  .sup-who{font-size:.72em; color:var(--ink-dim); font-weight:700; margin-bottom:3px;}
  .sup-body{font-size:.92em; line-height:1.45; word-break:break-word;}
  .sup-slip img{display:block; width:100%; max-height:260px; object-fit:contain; background:#fff; border-radius:10px; margin-top:8px; border:1px solid var(--edge);}
  .sup-reply{display:flex; gap:8px; align-items:flex-end; margin-top:12px;}
  .sup-reply textarea{flex:1; min-width:0; resize:vertical;}
  .slip-gone{background:var(--sand-2); margin-top:10px;}
  .bank-need{background:linear-gradient(150deg,#FFF4EC,#FFE6D8); border:1px solid #F7C9B3; margin-bottom:14px;}
  /* Opening ad */
  .open-ad{position:fixed; inset:0; z-index:9999; background:#0D2B33; display:flex; align-items:center; justify-content:center; animation:adIn .25s ease;}
  .open-ad.out{opacity:0; transition:opacity .25s ease;}
  @keyframes adIn{from{opacity:0;} to{opacity:1;}}
  .open-ad-media{width:100%; height:100%; object-fit:cover;}
  .open-ad-bar{position:absolute; top:calc(14px + env(safe-area-inset-top)); left:14px; right:14px; display:flex; justify-content:space-between; align-items:center;}
  .open-ad-tag{padding:4px 10px; border-radius:99px; background:rgba(0,0,0,.45); color:#fff; font-size:.75em; font-weight:800; letter-spacing:.5px;}
  .open-ad-skip{padding:9px 16px; border-radius:99px; border:1px solid rgba(255,255,255,.6); background:rgba(0,0,0,.5); color:#fff; font-weight:700; font-size:.86em;}
  .open-ad-skip:disabled{opacity:.75;}
  .open-ad-progress{position:absolute; left:0; right:0; bottom:0; height:4px; background:rgba(255,255,255,.25);}
  .open-ad-progress span{display:block; height:100%; width:0; background:#fff; transition:width .2s linear;}
  .open-ad-cta{position:absolute; left:50%; transform:translateX(-50%); bottom:calc(28px + env(safe-area-inset-bottom)); padding:12px 22px; border-radius:99px; background:var(--sunset); color:#fff; font-weight:800; text-decoration:none; box-shadow:0 6px 18px rgba(0,0,0,.3);}
  .ad-admin-prev{margin-top:10px;}
  .ad-admin-prev img, .ad-admin-prev video{display:block; width:100%; max-width:240px; aspect-ratio:9/16; object-fit:cover; border-radius:14px; border:1px solid var(--edge); background:#000;}
  /* Reviews */
  .ip-reviews{margin-top:18px; padding-top:16px; border-top:1px solid var(--edge);}
  .ip-reviews h3{font-family:var(--display); font-size:1.1em;}
  .stars{display:inline-flex; gap:1px; color:#D8DEE0; font-size:1em; line-height:1;}
  .stars .on{color:#F2B01E;}
  .stars .half{background:linear-gradient(90deg,#F2B01E 50%,#D8DEE0 50%); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .rev-chip{display:inline-flex; align-items:center; gap:6px; border:none; background:none; padding:2px 0; margin:2px 0 6px; font-size:.88em; color:var(--ink);}
  .rev-sum{display:flex; gap:16px; align-items:center; margin:12px 0 6px; padding:12px; border-radius:16px; background:var(--sand-2);}
  .rev-big{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:84px;}
  .rev-big strong{font-family:var(--display); font-size:2em; line-height:1;}
  .rev-big .muted{font-size:.74em;}
  .rev-bars{flex:1; display:flex; flex-direction:column; gap:3px;}
  .rev-bar{display:grid; grid-template-columns:24px 1fr 22px; align-items:center; gap:6px; font-size:.74em;}
  .rev-bar i{display:block; height:7px; border-radius:99px; background:#E3E9EA; overflow:hidden;}
  .rev-bar b{display:block; height:100%; background:#F2B01E; border-radius:99px;}
  .rev-item{padding:12px 0; border-top:1px solid var(--edge);}
  .rev-item:first-of-type{border-top:none;}
  .rev-av{width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:var(--lagoon-50); color:var(--lagoon-700); font-weight:800; font-size:.8em; flex-shrink:0;}
  .rev-text{font-size:.9em; line-height:1.5; margin-top:8px; word-break:break-word;}
  .rev-pick{display:flex; justify-content:center; gap:6px;}
  .rev-pick button{border:none; background:none; font-size:2.4em; line-height:1; color:#D8DEE0; padding:2px;}
  .rev-pick button.on{color:#F2B01E;}
  /* ---------- Motion & polish ---------- */
  .rv{opacity:0; transform:translate3d(0,22px,0) scale(.97); transition:opacity .55s ease, transform .6s cubic-bezier(.2,.8,.2,1); transition-delay:var(--rv-d,0ms); will-change:opacity, transform;}
  .rv.rv-in{opacity:1; transform:none;}
  .rv:not(.rv-in){transition-delay:0ms; transition-duration:.35s;}
  .rv.rv-now{transition:none;}
  .rail .rv, .featured-scroll .rv, .desk-row-feat .rv{transform:translate3d(26px,0,0) scale(.96);}
  .featured-scroll .rv.rv-in, .desk-row-feat .rv.rv-in{transform:none;}
  /* side-scrolling rows only ever move sideways */
  .rail, .featured-scroll, .feat-grid, .desk-row-feat, .gal-track, .gal-thumbs{overflow-y:hidden !important; overscroll-behavior-y:none; touch-action:pan-x pan-y;}
  .rail .rv.rv-in{transform:none;}
  .screen-in{animation:screenIn .38s cubic-bezier(.2,.8,.2,1);}
  @keyframes screenIn{from{opacity:0;} to{opacity:1;}}   /* opacity only: a transform here would unpin the fixed header and tab bar */
  img.img-fade{opacity:0; transition:opacity .45s ease;}
  img.img-fade.ok{opacity:1;}
  .img-loading{background-image:linear-gradient(100deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 50%, rgba(255,255,255,0) 70%) !important; background-size:220% 100% !important; animation:shimmer 1.2s linear infinite;}
  @keyframes shimmer{from{background-position:120% 0;} to{background-position:-120% 0;}}
  .top-card .img-wrap{overflow:hidden;}
  .top-card .img-wrap img{transition:transform .5s cubic-bezier(.2,.8,.2,1), opacity .45s ease;}
  .top-card:active .img-wrap{transform:scale(.97);}
  @media (hover:hover){
    .top-card:hover .img-wrap{transform:translateY(-4px); box-shadow:0 14px 30px rgba(13,43,51,.14);}
    .top-card:hover .img-wrap img{transform:scale(1.05);}
    .glass.card[onclick]:hover, .item-card:hover{transform:translateY(-2px); box-shadow:0 12px 28px rgba(13,43,51,.12);}
  }
  .glass.card[onclick], .item-card{transition:transform .25s ease, box-shadow .25s ease;}
  .glass.card[onclick]:active, .item-card:active{transform:scale(.985);}
  .btn{transition:transform .15s ease, box-shadow .2s ease, background-color .2s ease, filter .2s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary:hover{filter:brightness(1.05);}
  .section > h2, .section-head h2{position:relative; padding-bottom:6px;}
  .section > h2::after, .section-head h2::after{content:""; position:absolute; left:0; bottom:0; width:28px; height:3px; border-radius:3px; background:linear-gradient(90deg, var(--lagoon-500), var(--sunset));}
  .feat-panel{overflow:hidden;}
  .feat-panel::after{content:""; position:absolute; top:0; bottom:0; left:-60%; width:40%; pointer-events:none; background:linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.45), rgba(255,255,255,0)); transform:skewX(-18deg); animation:goldSheen 6.5s ease-in-out infinite; z-index:0;}
  .feat-panel > *{position:relative; z-index:1;}
  @keyframes goldSheen{0%,70%{left:-60%;} 100%{left:130%;}}
  .home-hero .hero-scene{will-change:transform, opacity;}
  .bottomnav .bar button{transition:color .2s ease, transform .2s ease;}
  .bottomnav .bar button:active{transform:scale(.92);}
  /* Header photo set by the super admin */
  .home-hero.has-photo{background:linear-gradient(180deg, rgba(6,40,52,.28) 0%, rgba(6,40,52,.12) 45%, rgba(10,60,90,.55) 100%), var(--hero-img) center calc(50% + var(--hero-shift,0px)) / cover no-repeat;}
  .home-hero.has-photo::before{display:none;}
  .hero-photo-space{height:118px;}
  .db-photo{width:100%; height:100%; object-fit:cover; border-radius:22px;}
  .hero-prev{position:relative; height:150px; border-radius:16px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; padding:12px; background:linear-gradient(150deg, #19C3B4 0%, #0FA3A3 40%, #1E6FD9 100%);}
  .hero-prev.has-photo{background:linear-gradient(180deg, rgba(6,40,52,.2), rgba(10,60,90,.55)), var(--hero-img) center / cover no-repeat;}
  .hero-prev .hero-scene{height:80px; margin:0;}
  .hero-prev-search{display:block; padding:8px 12px; border-radius:99px; background:#fff; color:var(--ink-dim); font-size:.8em;}
  @media (prefers-reduced-motion:reduce){ .rv{opacity:1 !important; transform:none !important;} .feat-panel::after{display:none;} }
  /* Profile */
  .who-btn{display:block; width:100%; text-align:left; background:none; border:none; padding:0; color:inherit; cursor:pointer; position:relative;}
  .who-profile{display:inline-block; margin-top:8px; padding:5px 12px; border-radius:99px; background:var(--lagoon-50); color:var(--lagoon-700); font-weight:800; font-size:.78em;}
  .who-btn:active .who-profile{transform:scale(.96);}
  .pf-hero{position:relative; display:flex; align-items:center; gap:14px; padding:22px 18px 34px; border-radius:24px; overflow:hidden; color:#fff;
    background:radial-gradient(90% 80% at 100% 0%, rgba(255,255,255,.25), transparent 60%), linear-gradient(150deg, #19C3B4 0%, #0FA3A3 40%, #1E6FD9 100%);}
  .pf-av{width:62px; height:62px; flex-shrink:0; border-radius:20px; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:1.7em; background:rgba(255,255,255,.22); border:1px solid rgba(255,255,255,.45);}
  .pf-name{font-family:var(--display); font-size:1.35em; line-height:1.15; word-break:break-word;}
  .pf-mail{font-size:.84em; opacity:.9; margin-top:3px; word-break:break-all;}
  .pf-edit{position:absolute; top:12px; right:12px; width:36px; height:36px; border-radius:50%; border:1px solid rgba(255,255,255,.5); background:rgba(255,255,255,.18); color:#fff; font-size:1em;}
  .pf-signin{align-self:flex-end; flex-shrink:0;}
  .pf-wave{position:absolute; left:0; right:0; bottom:-1px; width:100%; height:18px;}
  .pf-wave path{fill:var(--sand-bg);}
  .pf-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:-22px 10px 14px; position:relative; z-index:2;}
  .pf-stats button{display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 6px; border-radius:18px; border:1px solid var(--edge); background:var(--surface); box-shadow:var(--shadow-lift); color:var(--ink);}
  .pf-stats strong{font-family:var(--display); font-size:1.35em;}
  .pf-stats span{font-size:.76em; color:var(--ink-dim); font-weight:700;}
  .pf-card{background:var(--surface); border:1px solid var(--edge); border-radius:22px; padding:16px; margin-bottom:14px; box-shadow:0 2px 10px rgba(13,43,51,.04);}
  .pf-card h3{font-family:var(--display); font-size:1.05em; margin-bottom:12px;}
  .pf-card .row h3{margin-bottom:0;}
  .pf-stages{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-top:12px;}
  .pf-stage{display:flex; flex-direction:column; align-items:center; gap:6px; padding:10px 2px; border:none; border-radius:16px; background:var(--sand-2); color:var(--ink); font-size:.78em; font-weight:700;}
  .pf-sic{position:relative; font-size:1.7em; line-height:1;}
  .pf-sic b{position:absolute; top:-6px; right:-12px; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:var(--sunset); color:#fff; font-size:.42em; line-height:18px; text-align:center; font-family:var(--body, inherit);}
  .pf-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .pf-tile{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:14px 4px; border-radius:16px; border:1px solid var(--edge); background:#fff; color:var(--ink); font-size:.8em; font-weight:700; text-align:center;}
  .pf-ic{font-size:1.6em; line-height:1;}
  .pf-tv{position:absolute; top:6px; right:8px; font-size:.78em; color:var(--lagoon-700); font-weight:800;}
  .pf-earn{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .pf-earn-b{display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:14px; border-radius:18px; border:none; text-align:left; color:var(--ink);}
  .pf-earn-b span{font-size:1.6em; margin-bottom:4px;}
  .pf-earn-b small{color:var(--ink-dim); font-size:.76em;}
  .pf-earn-b.sell{background:linear-gradient(150deg,#FFF4E3,#FFE7C7);}
  .pf-earn-b.ride{background:linear-gradient(150deg,#E5F6EE,#CDEEDD);}
  .pf-rev{margin-top:2px;}
  .pf-rev-item{flex:0 0 120px; display:flex; flex-direction:column; gap:6px; border:none; background:none; text-align:left; padding:0; color:var(--ink); scroll-snap-align:start;}
  .pf-rev-img{display:block; width:120px; height:120px; border-radius:16px; overflow:hidden; background:var(--sand-2);}
  .pf-rev-img img, .pf-rev-img > *{width:100%; height:100%; object-fit:cover;}
  .pf-rev-name{font-size:.8em; font-weight:700; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .pf-rev-cta{font-size:.76em; font-weight:800; color:#B9780A;}
  @media (min-width:1024px){ .pf{max-width:760px; margin:0 auto;} .pf-grid{grid-template-columns:repeat(6,1fr);} }
  /* Share */
  .share-fab{position:absolute; top:10px; right:10px; z-index:3; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.94); color:var(--ink); box-shadow:0 2px 8px rgba(13,43,51,.18); display:flex; align-items:center; justify-content:center;}
  .share-card{display:flex; gap:12px; align-items:center; padding:12px; border-radius:16px; background:var(--sand-2); margin-bottom:14px;}
  .share-card img, .share-ic{width:56px; height:56px; border-radius:12px; object-fit:cover; flex-shrink:0; background:#fff; display:flex; align-items:center; justify-content:center; font-size:1.6em;}
  .share-card p{font-size:.8em; margin-top:2px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .share-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px 6px; margin-bottom:14px;}
  .share-opt{display:flex; flex-direction:column; align-items:center; gap:6px; padding:6px 2px; border:none; background:none; color:var(--ink); font-size:.76em; font-weight:700; text-decoration:none;}
  .share-dot{width:48px; height:48px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--display); font-weight:800; font-size:1.35em; box-shadow:0 3px 10px rgba(13,43,51,.15);}
  .share-link{display:flex; gap:8px;}
  .share-link input{flex:1; min-width:0; font-size:.8em;}
  .share-store{display:flex; gap:12px; align-items:center; margin-bottom:14px; background:linear-gradient(150deg,#E8F8F6,#DCEBFF); border:1px solid var(--edge);}
  /* Date / time boxes: same size as other fields, never wider than their column (iPhone) */
  input[type=date], input[type=time]{display:block; width:100%; min-width:0; max-width:100%; -webkit-appearance:none; appearance:none; text-align:left; height:42px; min-height:42px; line-height:1.2; box-sizing:border-box;}
  input[type=date]::-webkit-date-and-time-value, input[type=time]::-webkit-date-and-time-value{text-align:left;}
  .dt-row{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:10px;}
  .dt-row .field{min-width:0;}
  .dt-wrap{position:relative;}
  .dt-ph{position:absolute; left:16px; top:50%; transform:translateY(-50%); color:var(--ink-400); pointer-events:none; font-size:.95em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:calc(100% - 28px);}
  .dt-wrap.has-val .dt-ph{display:none;}
  .dt-wrap input:not(:focus){color:transparent;}
  .dt-wrap.has-val input, .dt-wrap input:focus{color:var(--ink);}
  /* Store payouts */
  .owe-sum{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px;}
  .owe-tile{display:flex; flex-direction:column; gap:2px; padding:14px; border-radius:18px; background:var(--surface); border:1px solid var(--edge);}
  .owe-tile span{font-size:.8em; color:var(--ink-dim); font-weight:700;}
  .owe-tile strong{font-family:var(--display); font-size:1.35em; color:var(--ink);}
  .owe-tile small{font-size:.74em; color:var(--ink-dim);}

create extension if not exists "pgcrypto";

create table businesses (
  id text primary key,
  owner_id uuid references auth.users(id) not null,
  name text not null,
  owner_name text not null,
  phone text,
  account_number text not null,
  account_name text not null,
  tier text default 'free',
  join_date timestamptz default now(),
  paid_at timestamptz,
  category text,
  category_other_name text,
  rating numeric(2,1) default 4.5,
  -- Where a delivery partner picks the package up from - shown on their job
  -- card/detail once they've accepted (see delJobCard()/sheetDelOrderDetail()).
  -- Optional so an existing store isn't blocked from anything by not having
  -- filled it in yet; the pickup note just falls back to the store's name.
  address text
);

create table items (
  id text primary key,
  business_id text references businesses(id) on delete cascade,
  name text not null,
  price numeric not null,
  stock int default 0,
  category text,
  category_other_name text,
  rental_rate_period text default 'day'
);

create table delivery_persons (
  id text primary key,
  user_id uuid references auth.users(id) not null,
  name text not null,
  phone text
);

create table orders (
  id text primary key,
  business_id text references businesses(id),
  business_name text,
  customer_id uuid references auth.users(id),
  customer_email text,
  customer_name text,
  customer_phone text,
  items jsonb not null,
  items_total numeric not null,
  delivery_fee numeric not null,
  total numeric not null,
  zone text,
  delivery_person_id text references delivery_persons(id),
  delivery_person_name text,
  payment_method text,
  payment_status text default 'pending_transfer',
  status text default 'placed',
  slip_url text,
  created_at timestamptz default now()
);

alter table businesses enable row level security;
alter table items enable row level security;
alter table delivery_persons enable row level security;
alter table orders enable row level security;

-- Everyone (including logged-out visitors) can browse stores & items
create policy "public read businesses" on businesses for select using (true);
create policy "public read items" on items for select using (true);
create policy "public read delivery" on delivery_persons for select using (true);

-- Only the signed-in owner can create/edit their own store, and only the
-- signed-in rider can create/edit their own delivery profile.
create policy "owner insert business" on businesses for insert with check (auth.uid() = owner_id);
create policy "owner update business" on businesses for update using (auth.uid() = owner_id);
create policy "owner delete business" on businesses for delete using (auth.uid() = owner_id);

create policy "self insert delivery" on delivery_persons for insert with check (auth.uid() = user_id);
create policy "self update delivery" on delivery_persons for update using (auth.uid() = user_id);
