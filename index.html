-- unassigned orders so riders can see jobs to pick up). The row-level "update
-- own orders" policies below are still needed for SELECT-adjacent reasons and
-- as a defense-in-depth backstop, but no client-side code relies on them for
-- payment/payout columns anymore - see the SECURITY DEFINER functions and the
-- column-level lockdown further down, which are what actually gate
-- submitSlip(), submitCompleteAuctionOrder(), confirmCashAndDeliver(),
-- markDelivered(), approveOrderPayment(), settlePayout(), and
-- markPayoutPaid() now. claimJob() is the sole remaining direct client write
-- on this table, touching only delivery_person_id/delivery_person_name.
create policy "customer read own orders" on orders for select
  using (auth.uid() = customer_id);
create policy "business read own orders" on orders for select
  using (exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid()));
create policy "rider read assigned or open orders" on orders for select
  using (
    exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
    or (orders.delivery_person_id is null and exists (select 1 from delivery_persons d where d.user_id = auth.uid()))
  );
create policy "customer update own order" on orders for update
  using (auth.uid() = customer_id)
  with check (auth.uid() = customer_id);
create policy "business update own orders" on orders for update
  using (exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid()));
-- A non-rental order is only claimable once the business has explicitly
-- marked it ready_for_pickup (see mark_order_ready_for_pickup() below) - a
-- rider can't claim it the instant it's placed just by knowing its id. A
-- rental delivery job's claim goes through claim_rental_job() instead,
-- which runs as SECURITY DEFINER and so isn't gated by this policy at all.
create policy "rider update assigned or open orders" on orders for update
  using (
    (orders.delivery_person_id is null and orders.ready_for_pickup = true)
    or exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  )
  with check (
    exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  );

-- Payout lockdown: every write to total/payment_status/payout_status/
-- delivery_partner_payout goes through exactly one of these seven functions
-- instead of a direct client update, so each write's precondition (ownership,
-- order status) is enforced atomically in the same statement that makes the
-- change - a raw REST update can no longer skip it.
-- Also flips payment_method to 'transfer' - lets a customer who originally
-- chose cash switch to a bank transfer instead, so every downstream branch
-- (the business's order detail, the rider's job card) treats it as a
-- transfer order from here on instead of payment_method/payment_status
-- telling two different stories.
create or replace function submit_transfer_slip(p_order_id text, p_slip_url text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set payment_status = 'slip_uploaded', slip_url = p_slip_url, payment_method = 'transfer'
  where id = p_order_id and customer_id = auth.uid()
  returning *;
$$;

create or replace function approve_order_payment(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set payment_status = 'paid'
  where id = p_order_id
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

-- Only the auction's own winning bidder, on an order still awaiting
-- completion, can turn their win into a real order - the zone fee, total,
-- and delivery_partner_payout are all computed here rather than trusted from
-- the client.
create or replace function complete_auction_order(p_order_id text, p_delivery_zone text, p_payment_method text,
  p_delivery_target_type text default 'person', p_receiver_name text default null, p_receiver_phone text default null, p_receiver_address text default null)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set
    zone = p_delivery_zone,
    delivery_fee = case when delivery_type <> 'free' then
      case p_delivery_zone when 'hulhumale1' then 20 when 'hulhumale2' then 25 else 15 end
    else 0 end,
    total = items_total + (case when delivery_type <> 'free' then
      case p_delivery_zone when 'hulhumale1' then 20 when 'hulhumale2' then 25 else 15 end
    else 0 end) + coalesce(extra_delivery_fee, 0),
    delivery_partner_payout = case p_delivery_zone when 'hulhumale1' then 20 when 'hulhumale2' then 25 else 15 end,
    payment_method = p_payment_method,
    payment_status = case when p_payment_method = 'transfer' then 'pending_transfer' else 'pending_cash' end,
    delivery_target_type = p_delivery_target_type,
    receiver_name = p_receiver_name,
    receiver_phone = p_receiver_phone,
    receiver_address = p_receiver_address
  where id = p_order_id
    and customer_id = auth.uid()
    and payment_status = 'awaiting_completion'
    and exists (
      select 1 from auction_listings al
      where al.order_id = orders.id and al.current_highest_bidder = auth.uid()
    )
  returning *;
$$;

create or replace function settle_payout(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set payment_status = 'settled'
  where id = p_order_id
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

create or replace function mark_payout_paid(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set payout_status = 'settled'
  where id = p_order_id
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

-- Either the assigned rider, or the business itself for a self-delivery
-- order (there's no rider account to act on its behalf) - and only once the
-- package has actually gone out (out_for_delivery), not the instant a job
-- is claimed - see mark_order_out_for_delivery() further down.
create or replace function confirm_cash_received(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set payment_status = 'cash_collected'
  where o.id = p_order_id
    and o.status = 'out_for_delivery'
    and (
      exists (select 1 from delivery_persons d where d.id = o.delivery_person_id and d.user_id = auth.uid())
      or (o.self_delivery = true and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid()))
    )
  returning o.*;
$$;

-- "status is distinct from 'delivered'" is the idempotency guard - a repeat
-- call (e.g. a retried request) can't re-open a payout that a first call
-- already settled. A rider can't mark a normal order delivered until the
-- store has actually handed it over (out_for_delivery); a rental delivery
-- job never goes through that handoff step at all, so it's exempted. A
-- boat delivery needs its own proof-of-handoff photo at the actual moment
-- of final delivery (handed to the boat) - the earlier handoff photo (from
-- when the package left the store/rider's hands) is superseded and
-- overwritten here rather than kept alongside it, since there's only ever
-- one "current custody" photo that matters. Rentals are exempted from this
-- one too - a rental delivery job's rider has no UI to capture this second
-- photo (its own claim_rental_job() flow never involved a handoff photo).
-- A rental delivery job also can't be marked delivered until its payment is
-- confirmed (payment_status='paid') - same "don't hand over the goods before
-- the money's in" rule mark_rental_fulfilled enforces for a rental the
-- business hands over itself; non-rental orders are untouched by this
-- (rental_item_id is null short-circuits the check immediately).
create or replace function mark_delivered(p_order_id text, p_boat_photo_url text default null)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set
    status = 'delivered',
    payout_status = case when delivery_type = 'free' then 'pending' else payout_status end,
    handoff_photo_url = case when delivery_target_type = 'boat' and rental_item_id is null then p_boat_photo_url else handoff_photo_url end
  where id = p_order_id
    and status is distinct from 'delivered'
    and (rental_item_id is not null or status = 'out_for_delivery')
    and (rental_item_id is null or payment_status = 'paid')
    and (delivery_target_type is distinct from 'boat' or rental_item_id is not null or p_boat_photo_url is not null)
    and exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  returning *;
$$;

-- Rentals have no delivery partner to mark them delivered by default - the
-- renter (the business that listed the item) does that themselves, once the
-- customer has picked it up or been handed it. Once a delivery partner has
-- taken the job (see claim_rental_job below), it's their call via
-- mark_delivered above instead - hence delivery_person_id is null here.
-- payment_status='paid' used to not be required at all - a business could
-- hand the item over before ever confirming payment. Now it can't, whether
-- that's the full rental cost (an 'upfront'-timing order, same as before) or
-- just the advance/deposit (an 'on_return' order - see the rental_fee_amount/
-- rental_fee_timing columns and mark_rental_returned() below).
create or replace function mark_rental_fulfilled(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set status = 'delivered'
  where id = p_order_id
    and rental_item_id is not null
    and status is distinct from 'delivered'
    and delivery_person_id is null
    and payment_status = 'paid'
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

-- Lets a store hand a "deliver"-fulfillment rental off to the delivery-partner
-- network for a fee it's offering out of its own pocket, instead of delivering
-- it themselves - entirely separate money from the rental payment itself
-- (already the customer's business with the store either way). Only while
-- nobody's claimed it yet and it hasn't already gone out; pickup-mode rentals
-- are excluded since there's nothing to deliver.
create or replace function offer_rental_delivery(p_order_id text, p_fee numeric, p_timing text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set
    needs_delivery_partner = true,
    delivery_partner_payout = p_fee,
    rental_payout_timing = case when p_timing = 'upfront' then 'upfront' else 'after' end
  where id = p_order_id
    and rental_item_id is not null
    and rental_fulfillment = 'deliver'
    and delivery_person_id is null
    and status is distinct from 'delivered'
    and p_fee > 0
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

-- A rental delivery job's own claim step, separate from the plain
-- delivery_person_id/name update a normal order's claim uses (see the RLS
-- policy note further down) - an "upfront" job also needs payout_status
-- flipped to 'pending' right here, computed from the order's own timing
-- choice rather than trusted as a value the claiming rider could set to
-- anything, same reasoning as mark_delivered() deciding payout_status itself.
create or replace function claim_rental_job(p_order_id text)
returns setof orders
language plpgsql
security definer
set search_path = public
as $$
declare v_rider_id text; v_rider_name text;
begin
  select id, name into v_rider_id, v_rider_name from delivery_persons where user_id = auth.uid();
  if v_rider_id is null then return; end if;
  return query
  update orders o set
    delivery_person_id = v_rider_id,
    delivery_person_name = v_rider_name,
    payout_status = case when o.rental_payout_timing = 'upfront' then 'pending' else o.payout_status end
  where o.id = p_order_id
    and o.rental_item_id is not null
    and o.needs_delivery_partner = true
    and o.delivery_person_id is null
    and o.status is distinct from 'delivered'
  returning o.*;
end;
$$;

-- items is locked down to the owning business via RLS ("owner manage items"),
-- so a renting customer can't upsert their own stock decrement through the
-- normal saveDB('items') path the way a business owner edits their catalogue -
-- this is the one write a non-owner legitimately needs, scoped to exactly a
-- stock decrement with nothing else on the row touchable.
create or replace function decrement_rental_stock(p_item_id text)
returns setof items
language sql
security definer
set search_path = public
as $$
  update items
  set stock = stock - 1
  where id = p_item_id
    and stock > 0
    and auth.uid() is not null
  returning *;
$$;

-- A rental order originally always bundled the full rental cost (days ×
-- rate) and the deposit/advance into one lump total, collected in full
-- before the item ever left the store. These columns split that apart:
-- rental_fee_amount holds the day-rate portion when the customer chooses to
-- pay it later instead of now (0/null when paying upfront, in which case
-- it's already folded into total exactly like before); rental_fee_timing
-- records that choice - distinct from rental_payout_timing above, which is
-- about when a delivery *partner* gets paid their own courier fee, not
-- when the customer pays the store; rental_returned_at and
-- rental_return_fee_status track the item actually coming back (and, for a
-- deferred order, its fee finally being collected) - see
-- mark_rental_returned() just below. None of these are settable by a raw
-- client update (see the orders column lockdown further down) - only via
-- order creation (client insert, in submitRentItem()) or this function.
alter table orders add column if not exists rental_fee_amount numeric;
alter table orders add column if not exists rental_fee_timing text check (rental_fee_timing is null or rental_fee_timing in ('upfront','on_return'));
alter table orders add column if not exists rental_returned_at timestamptz;
alter table orders add column if not exists rental_return_fee_status text check (rental_return_fee_status is null or rental_return_fee_status in ('pending','collected'));

-- Marks a rental's item as physically back in the store's hands - a step the
-- app never had before, so a rented-out unit's stock never came back
-- (decrement_rental_stock above had no counterpart). Works the same whether
-- the customer picked it up themselves or a rider delivered it (status just
-- needs to already be 'delivered'); for an 'on_return' order this also
-- collects the deferred rental fee - p_fee_collected is trusted from the
-- caller since there's no independent payment rail to verify it against,
-- the same trust boundary approve_order_payment/confirm_cash_received
-- already rely on elsewhere for an in-person cash handover.
create or replace function mark_rental_returned(p_order_id text, p_fee_collected numeric default null)
returns setof orders
language plpgsql
security definer
set search_path = public
as $$
declare v_result orders;
begin
  update orders o set
    rental_returned_at = now(),
    rental_return_fee_status = case when o.rental_fee_timing = 'on_return' then 'collected' else o.rental_return_fee_status end
  where o.id = p_order_id
    and o.rental_item_id is not null
    and o.status = 'delivered'
    and o.rental_returned_at is null
    and (o.rental_fee_timing is distinct from 'on_return' or p_fee_collected is not null)
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
  returning o.* into v_result;

  if v_result.id is null then
    return;
  end if;

  update items set stock = stock + 1 where id = v_result.rental_item_id;

  return query select v_result.*;
end;
$$;

-- A non-rental order used to be visible to every rider as an open job the
-- instant it was placed, with no way for the business to hold it back until
-- it was actually packed - or to say "I'll deliver this myself" and keep it
-- out of the rider pool entirely. These two columns plus the three
-- functions below give the business that choice; see the "rider update
-- assigned or open orders" policy above for the enforcement half (a rider
-- can't claim a job that isn't ready_for_pickup, not just "the UI doesn't
-- show it").
alter table orders add column if not exists ready_for_pickup boolean not null default false;
alter table orders add column if not exists self_delivery boolean not null default false;

create or replace function mark_order_ready_for_pickup(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set ready_for_pickup = true, self_delivery = false
  where o.id = p_order_id
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
    and o.rental_item_id is null
    and o.delivery_person_id is null
    and o.status is distinct from 'delivered'
  returning o.*;
$$;

create or replace function mark_order_self_delivery(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set self_delivery = true, ready_for_pickup = false
  where o.id = p_order_id
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
    and o.rental_item_id is null
    and o.delivery_person_id is null
    and o.status is distinct from 'delivered'
  returning o.*;
$$;

-- The business takes a photo of the package at the moment they hand it
-- over - to the assigned rider, or to themselves if self-delivering - and
-- this is what actually flips the order to out_for_delivery, the status a
-- customer sees. Only makes sense once a fulfillment method is chosen.
alter table orders add column if not exists handoff_photo_url text;
create or replace function mark_order_out_for_delivery(p_order_id text, p_photo_url text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set status = 'out_for_delivery', handoff_photo_url = p_photo_url
  where o.id = p_order_id
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
    and o.rental_item_id is null
    and o.status not in ('delivered','out_for_delivery')
    and (o.delivery_person_id is not null or o.self_delivery = true)
  returning o.*;
$$;

-- Same handoff-first requirement as mark_delivered() above, for a
-- self-delivered order's final mark.
create or replace function mark_order_delivered_by_business(p_order_id text, p_boat_photo_url text default null)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set
    status = 'delivered',
    handoff_photo_url = case when o.delivery_target_type = 'boat' then p_boat_photo_url else o.handoff_photo_url end
  where o.id = p_order_id
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
    and o.self_delivery = true
    and o.status = 'out_for_delivery'
    and (o.delivery_target_type is distinct from 'boat' or p_boat_photo_url is not null)
  returning o.*;
$$;

-- Mid-flight reassignment: a rider already assigned to pick up one of this
-- business's orders (deliveryPersonId set, status still 'placed' - not yet
-- handed off) can be offered a second one directly, instead of it going
-- into the open pool for a stranger to claim. Sits as a pending offer
-- (pending_rider_id) rather than an instant assignment - deliveryPersonId
-- itself is treated everywhere else in this app as "the rider has already
-- agreed to this", so a genuinely new "assigned but not yet accepted" state
-- needed its own column rather than reusing that one. The rider still has
-- to accept or decline (see accept_delivery_offer()/decline_delivery_offer()
-- below); a decline just clears this and leaves the order exactly where
-- mark_order_ready_for_pickup()/mark_order_self_delivery() found it, free
-- for the business to choose differently.
alter table orders add column if not exists pending_rider_id text references delivery_persons(id);

-- Extends (rather than replaces) the original policy - a rider can also now
-- see an order they've been offered but not yet accepted/declined, on top
-- of the two cases they could already see (their own assigned jobs, and any
-- unclaimed open job).
drop policy if exists "rider read assigned or open orders" on orders;
create policy "rider read assigned or open orders" on orders for select
  using (
    exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
    or exists (select 1 from delivery_persons d where d.id = orders.pending_rider_id and d.user_id = auth.uid())
    or (orders.delivery_person_id is null and exists (select 1 from delivery_persons d where d.user_id = auth.uid()))
  );

create or replace function offer_order_to_rider(p_order_id text, p_rider_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set pending_rider_id = p_rider_id
  where o.id = p_order_id
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
    and o.rental_item_id is null
    and o.delivery_person_id is null
    and o.pending_rider_id is null
    and o.status is distinct from 'delivered'
    and exists (
      select 1 from orders o2
      where o2.business_id = o.business_id and o2.delivery_person_id = p_rider_id
        and o2.status = 'placed' and o2.id <> o.id
    )
  returning o.*;
$$;

create or replace function accept_delivery_offer(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set
    delivery_person_id = o.pending_rider_id,
    delivery_person_name = (select d.name from delivery_persons d where d.id = o.pending_rider_id),
    pending_rider_id = null
  where o.id = p_order_id
    and o.pending_rider_id is not null
    and exists (select 1 from delivery_persons d where d.id = o.pending_rider_id and d.user_id = auth.uid())
  returning o.*;
$$;

create or replace function decline_delivery_offer(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set pending_rider_id = null
  where o.id = p_order_id
    and o.pending_rider_id is not null
    and exists (select 1 from delivery_persons d where d.id = o.pending_rider_id and d.user_id = auth.uid())
  returning o.*;
$$;

-- Order-time discount: while reviewing a freshly-placed order, before the
-- customer has actually paid (payment_status still 'pending_transfer' or
-- 'pending_cash' - not once a slip's uploaded or cash is collected, since by
-- then a specific amount has already changed hands), the business can knock
-- a flat MVR amount off the items subtotal. Separate from item.discountPercent
-- (a standing listing-level discount set on the item itself) - this one is
-- per-order and capped at the items subtotal so total can't go negative.
-- Left out of rentals: their total already means something narrower (just
-- the advance/deposit due now, not the full rental cost - see submitRentItem()),
-- so a flat items-subtotal discount doesn't translate cleanly there.
alter table orders add column if not exists discount_amount numeric default 0;

create or replace function apply_order_discount(p_order_id text, p_discount numeric)
returns setof orders
language plpgsql
security definer
set search_path = public
as $$
declare
  v_capped numeric;
begin
  select greatest(0, least(coalesce(p_discount,0), coalesce(o.items_total,0)))
    into v_capped
  from orders o where o.id = p_order_id;

  return query
    update orders o set
      discount_amount = v_capped,
      total = greatest(0, coalesce(o.items_total,0) - v_capped) + coalesce(o.delivery_fee,0) + coalesce(o.extra_delivery_fee,0)
    where o.id = p_order_id
      and o.rental_item_id is null
      and o.payment_status in ('pending_transfer','pending_cash')
      and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
    returning o.*;
end;
$$;

grant execute on function submit_transfer_slip(text, text) to authenticated;
grant execute on function approve_order_payment(text) to authenticated;
grant execute on function complete_auction_order(text, text, text, text, text, text, text) to authenticated;
grant execute on function settle_payout(text) to authenticated;
grant execute on function mark_payout_paid(text) to authenticated;
grant execute on function confirm_cash_received(text) to authenticated;
grant execute on function mark_delivered(text) to authenticated;
grant execute on function mark_rental_fulfilled(text) to authenticated;
grant execute on function offer_rental_delivery(text, numeric, text) to authenticated;
grant execute on function claim_rental_job(text) to authenticated;
grant execute on function decrement_rental_stock(text) to authenticated;
grant execute on function mark_rental_returned(text, numeric) to authenticated;
grant execute on function mark_order_ready_for_pickup(text) to authenticated;
grant execute on function mark_order_self_delivery(text) to authenticated;
grant execute on function mark_order_delivered_by_business(text) to authenticated;
grant execute on function mark_order_out_for_delivery(text, text) to authenticated;
grant execute on function offer_order_to_rider(text, text) to authenticated;
grant execute on function accept_delivery_offer(text) to authenticated;
grant execute on function decline_delivery_offer(text) to authenticated;
grant execute on function apply_order_discount(text, numeric) to authenticated;

-- The ten functions above are now the only way total/payment_status/
-- payout_status/delivery_partner_payout/status/needs_delivery_partner/
-- rental_payout_timing ever change - lock them down so no authenticated client
-- can set them directly via a raw REST update/upsert, which would otherwise
-- bypass every precondition those functions enforce.
-- orders has a full table-level UPDATE grant by default (like every Supabase
-- table), which overrides a column-specific revoke on its own (see the
-- identical gotcha and fix for auction_listings above) - so the table-wide
-- grant has to be revoked first, then re-granted only for the one column
-- pair a client still legitimately writes directly: claimJob() setting
-- delivery_person_id/delivery_person_name to claim a normal open job (gated by
-- the "rider update assigned or open orders" policy above, not by column
-- grants) - a rental delivery job's claim goes through claim_rental_job
-- instead, since it also needs to flip payout_status for an "upfront" job.
revoke update on orders from anon, authenticated;
grant update (delivery_person_id, delivery_person_name) on orders to anon, authenticated;

-- Mobile number + password sign-in (set up after a user's first magic-link
-- login). Password auth itself is Supabase's built-in email+password —
-- this table just maps a phone number to the account's email so a
-- not-yet-signed-in visitor can look up which email to authenticate,
-- and enforces phone uniqueness (email uniqueness is already enforced
-- natively by auth.users).
create table user_profiles (
  user_id uuid primary key references auth.users(id) on delete cascade,
  phone text unique not null,
  email text unique not null,
  created_at timestamptz default now()
);
alter table user_profiles enable row level security;
create policy "self read own profile" on user_profiles for select using (auth.uid() = user_id);
create policy "self insert own profile" on user_profiles for insert with check (auth.uid() = user_id);

-- Security-definer lookup so an unauthenticated visitor can resolve a
-- phone number to its account email (only that one field, nothing else)
-- before calling signInWithPassword. Safe to expose to anon.
create or replace function resolve_login_email(p_phone text)
returns text
language sql
security definer
set search_path = public
as $$
  select email from user_profiles where phone = p_phone limit 1;
$$;
grant execute on function resolve_login_email(text) to anon, authenticated;

-- Super Admin: a manually-seeded allowlist (no self-service signup for
-- this — add rows directly in SQL). is_admin() is security-definer so
-- it can be used inside other tables' RLS policies without those
-- tables needing their own read access to `admins`.
create table admins (
  user_id uuid primary key references auth.users(id) on delete cascade,
  created_at timestamptz default now()
);
alter table admins enable row level security;
create policy "admin read own admin row" on admins for select using (auth.uid() = user_id);

create or replace function is_admin()
returns boolean
language sql
security definer
set search_path = public
as $$
  select exists(select 1 from admins where user_id = auth.uid());
$$;
grant execute on function is_admin() to authenticated;

-- Admins can update tier/paid_at on any business (owners can already
-- update their own via the existing "owner update business" policy —
-- Postgres OR's multiple permissive policies for the same command).
create policy "admin update any business" on businesses for update using (is_admin());
-- Admins can also see phone/email for any user who's set up mobile
-- sign-in, useful for cross-checking a business owner's identity.
create policy "admin read all profiles" on user_profiles for select using (is_admin());

-- Product photos: stored in Supabase Storage (bucket 'product-images', public),
-- not as base64 in the row - this column just holds the resulting public URL.
alter table items add column if not exists image_url text;
alter table items add column if not exists listing_type text not null default 'buy_now' check (listing_type in ('buy_now','auction','rental'));

-- Storage bucket for product photos. Create via Dashboard -> Storage -> New
-- bucket named "product-images" with Public bucket ON, or run:
insert into storage.buckets (id, name, public) values ('product-images','product-images', true)
  on conflict (id) do nothing;
-- Anyone can view (public bucket + public read policy); only the authenticated
-- uploader can add/replace/delete their own files. Objects are uploaded under
-- a path prefixed with the uploader's own auth.uid() (see uploadItemPhoto() in
-- the app), which is what these policies check against - no join to
-- businesses needed.
create policy "public read product images" on storage.objects for select
  using (bucket_id = 'product-images');
create policy "owner upload product images" on storage.objects for insert to authenticated
  with check (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "owner update product images" on storage.objects for update to authenticated
  using (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "owner delete product images" on storage.objects for delete to authenticated
  using (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);

-- Auction listings: a business chooses "Auction" instead of "Buy Now" when
-- listing an item (see items.listing_type above). There's no background job
-- runner in this app, so closing an ended auction and settling its winner
-- both happen lazily from the client whenever anyone views/interacts with the
-- listing (see checkAndSettleAuction()/settleAuctionWin()) rather than on a
-- timer - the "signed-in update auction" policy below is what makes that
-- safe to do from any authenticated visitor's browser.
create table auction_listings (
  id text primary key,
  item_id text references items(id) on delete cascade not null,
  business_id text references businesses(id) not null,
  starting_price numeric not null check (starting_price > 0),
  bid_increment numeric not null check (bid_increment > 0),
  start_time timestamptz not null default now(),
  end_time timestamptz not null,
  current_highest_bid numeric,
  current_highest_bidder uuid references auth.users(id),
  bid_count int not null default 0,
  status text not null default 'active' check (status in ('active','ended','settled')),
  order_id text references orders(id),
  created_at timestamptz default now()
);
alter table auction_listings enable row level security;
create policy "public read auctions" on auction_listings for select using (true);
create policy "owner insert own auction" on auction_listings for insert
  with check (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
-- Deliberately permissive (any authenticated visitor, not just the seller or
-- winning bidder) since the lazy active->ended transition needs to happen
-- from whoever's browser next views an expired listing. Blocked once
-- 'settled' - a won auction's order has already been created and shouldn't
-- be touched again. This governs status/order_id only - current_highest_bid
-- and current_highest_bidder are locked down further below, once place_bid()
-- exists to be the only way those two actually get written.
create policy "signed-in update auction" on auction_listings for update to authenticated
  using (status in ('active','ended'))
  with check (true);

-- Full bid history - kept even after the winning bid is cached on
-- auction_listings above, for an auditable record of every bid placed.
create table auction_bids (
  id text primary key,
  auction_id text references auction_listings(id) on delete cascade not null,
  bidder_id uuid references auth.users(id) not null,
  bid_amount numeric not null check (bid_amount > 0),
  created_at timestamptz default now()
);
alter table auction_bids enable row level security;
create policy "public read bids" on auction_bids for select using (true);
-- Kept as a defense-in-depth backstop against a raw insert bypassing
-- place_bid() below (e.g. a hand-crafted API call) - place_bid() itself runs
-- as SECURITY DEFINER and doesn't go through this policy at all, so it isn't
-- what closes the race (the atomic UPDATE inside place_bid() does that); this
-- just stops a bypass attempt from writing a bid the way the old
-- insert-then-update flow used to.
create policy "customer valid bid" on auction_bids for insert
  with check (
    bidder_id = auth.uid()
    and exists (
      select 1 from auction_listings al
      where al.id = auction_id
        and al.status = 'active'
        and al.end_time > now()
        and bid_amount >= coalesce(al.current_highest_bid + al.bid_increment, al.starting_price)
        and not exists (select 1 from businesses b where b.id = al.business_id and b.owner_id = auth.uid())
    )
  );

-- Places a bid atomically. The UPDATE below is a single SQL statement whose
-- WHERE clause re-checks the increment rule against the row's CURRENT values
-- at write time, so Postgres serializes concurrent calls to this function
-- against the same row - two bids landing within milliseconds of each other
-- can no longer both pass validation against the same stale highest-bid
-- value the way the old separate insert-then-update from the client could.
-- No SELECT ... FOR UPDATE or other explicit locking needed; the atomicity
-- of one UPDATE statement is what does it. The auction_bids insert only
-- happens (via the `ins` CTE selecting `from updated`) once the UPDATE has
-- actually matched a row, so a rejected bid never gets recorded as history.
-- SECURITY DEFINER so it can write current_highest_bid/current_highest_bidder
-- despite the revoke just below locking those two columns down for everyone
-- else - this function is now the only way a bid actually moves the price.
create or replace function place_bid(p_auction_id text, p_bid_amount numeric)
returns setof auction_listings
language sql
security definer
set search_path = public
as $$
  with updated as (
    update auction_listings
    set current_highest_bid = p_bid_amount, current_highest_bidder = auth.uid(), bid_count = coalesce(bid_count,0) + 1
    where id = p_auction_id
      and status = 'active'
      and end_time > now()
      and auth.uid() is not null
      and not exists (select 1 from businesses b where b.id = auction_listings.business_id and b.owner_id = auth.uid())
      and (
        (current_highest_bid is null and p_bid_amount >= starting_price)
        or (current_highest_bid is not null and p_bid_amount >= current_highest_bid + bid_increment)
      )
    returning *
  ),
  ins as (
    insert into auction_bids (id, auction_id, bidder_id, bid_amount)
    select 'bid_' || replace(gen_random_uuid()::text, '-', ''), p_auction_id, auth.uid(), p_bid_amount
    from updated
    returning 1
  )
  select * from updated;
$$;
grant execute on function place_bid(text, numeric) to authenticated;

-- Bidding now only happens through place_bid() above - lock the two
-- price-affecting columns down so no authenticated client can set them
-- directly via a raw REST update, which would otherwise bypass the atomic
-- check entirely and reopen the exact race place_bid() exists to close.
-- status/order_id (used by the lazy close/settle flow) are untouched by
-- this and remain updatable per the "signed-in update auction" policy above.
revoke update (current_highest_bid, current_highest_bidder, bid_count) on auction_listings from authenticated;
-- Existing deployments: add the column and backfill it from the real bid
-- history rather than leaving pre-existing auctions at a misleading 0.
alter table auction_listings add column if not exists bid_count int not null default 0;
update auction_listings al set bid_count = (select count(*) from auction_bids ab where ab.auction_id = al.id) where bid_count = 0;

-- Pro-tier upgrade requests: bank transfer (needs manual admin
-- approval) or Swipe (auto-approved by the payment webhook, no admin
-- action needed — logged here for visibility).
create table pro_upgrade_requests (
  id text primary key,
  business_id text references businesses(id) on delete cascade,
  payment_method text not null check (payment_method in ('bank_transfer','swipe')),
  status text not null default 'pending' check (status in ('pending','approved','rejected')),
  amount numeric not null default 500,
  slip_url text,
  swipe_reference text,
  swipe_payment_link text,
  created_at timestamptz default now(),
  resolved_at timestamptz,
  resolved_by uuid references auth.users(id)
);
alter table pro_upgrade_requests enable row level security;
create policy "owner insert own upgrade request" on pro_upgrade_requests for insert
  with check (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "owner read own upgrade requests" on pro_upgrade_requests for select
  using (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
-- Lets create-swipe-payment roll back its own just-inserted row if
-- registering the reference with SeaFare fails right after.
create policy "owner delete own upgrade request" on pro_upgrade_requests for delete
  using (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "admin read all upgrade requests" on pro_upgrade_requests for select using (is_admin());
create policy "admin update upgrade requests" on pro_upgrade_requests for update using (is_admin());

-- A business picking "Other" on the category checklist names their own
-- category here; super admin reviews it and can approve it into
-- custom_categories (which the app then offers as a normal pickable
-- category everywhere alongside the built-in list) or dismiss it.
create table category_requests (
  id text primary key,
  business_id text references businesses(id) on delete cascade,
  business_name text not null,
  category_name text not null,
  status text not null default 'pending' check (status in ('pending','approved','dismissed')),
  created_at timestamptz default now(),
  resolved_at timestamptz,
  resolved_by uuid references auth.users(id)
);
alter table category_requests enable row level security;
create policy "owner insert own category request" on category_requests for insert
  with check (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "owner read own category requests" on category_requests for select
  using (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "admin read all category requests" on category_requests for select using (is_admin());
create policy "admin update category requests" on category_requests for update using (is_admin());

-- Category names an admin has approved from a category_requests row - merged
-- into the app's built-in MARKETPLACE_CATEGORIES list on load (see
-- mergeCustomCategories()), so an approved category becomes pickable
-- everywhere a category is chosen, not just remembered on that one business.
create table custom_categories (
  name text primary key,
  added_at timestamptz default now()
);
alter table custom_categories enable row level security;
create policy "public read custom categories" on custom_categories for select using (true);
create policy "admin manage custom categories" on custom_categories for all using (is_admin());

-- Per-listing delivery: a business now just checks/unchecks "Free delivery for
-- buyer" on each item (checked by default). It no longer changes HOW delivery
-- works - the buyer always picks a zone at checkout, same as always, and the
-- zone's flat fee is always what the delivery partner is paid. The checkbox
-- only controls whether that fee is ALSO charged to the buyer.
alter table items add column if not exists free_delivery boolean not null default true;
-- Superseded by free_delivery above - drop if the short-lived previous version
-- of this feature was ever run against this database.
alter table items drop column if exists delivery_type;
alter table items drop column if exists delivery_payout;

-- Extra delivery fee: a seller-set surcharge (eg. for a bulky/fragile item),
-- separate from the fixed zone fee - always charged to the buyer when set
-- (regardless of free_delivery), and goes to the business, not the delivery
-- partner. Snapshotted onto the order at placement time (or, for auctions, at
-- win time) so a later item edit never changes an already-placed order's total.
alter table items add column if not exists extra_delivery_fee numeric not null default 0;
alter table orders add column if not exists extra_delivery_fee numeric not null default 0;

-- Orders: delivery_partner_payout is always the zone's flat fee (the delivery
-- partner is paid the same amount regardless of who's charged for it) -
-- delivery_type on the order records whether the buyer's total included that
-- fee ('zone') or not ('free'), decided by whether every item in the cart had
-- free_delivery checked (a cart is one business; if even one item requires
-- the buyer to pay, the fee is charged for the whole order).
-- Cash orders: 'zone' orders are unchanged (rider collects the fee inside
-- `total`, keeps it as their cut, remits `total - delivery_partner_payout`).
-- 'free' orders collect no fee at all, so the rider remits the FULL `total`
-- to the business and is paid their delivery_partner_payout separately.
-- Transfer orders: 'zone' orders are unchanged (buyer's transfer already
-- covers the fee - no payout tracking needed, same as the original app).
-- 'free' orders only collect the item price, so payout_status tracks the
-- business's separate obligation to pay the rider the fee once delivered -
-- for BOTH payment methods now, since a 'free' cash order also leaves that
-- fee uncollected from the buyer.
alter table orders add column if not exists delivery_type text not null default 'zone' check (delivery_type in ('zone','free'));
alter table orders add column if not exists delivery_partner_payout numeric;
alter table orders add column if not exists payout_status text check (payout_status is null or payout_status in ('pending','settled'));

-- Who the order is actually handed to, collected at checkout - distinct from the
-- old dropped delivery_address/boat_* columns above (those drove pricing; these
-- are just contact/handoff details on top of the normal zone-fee flow, always
-- required regardless of type).
alter table orders add column if not exists delivery_target_type text not null default 'person' check (delivery_target_type in ('person','boat'));
alter table orders add column if not exists receiver_name text;
alter table orders add column if not exists receiver_phone text;
alter table orders add column if not exists receiver_address text;
-- When the boat is expected to depart, so the store/rider know the actual
-- deadline for getting the package there - optional (a customer may not know
-- yet), only ever set for delivery_target_type='boat'.
alter table orders add column if not exists boat_departure_at timestamptz;

-- Superseded columns from the short-lived previous version of this feature -
-- the custom per-item payout amount and the manual address/boat-info fields
-- are gone now that delivery always goes through the normal zone flow.
alter table orders drop column if exists delivery_address;
alter table orders drop column if exists boat_type;
alter table orders drop column if exists boat_name;
alter table orders drop column if exists boat_detail;

-- Backfill: every order placed before this feature (or its previous version)
-- is a zone-delivery order, so its delivery_partner_payout is exactly the fee
-- already on the row.
update orders set delivery_partner_payout = delivery_fee where delivery_partner_payout is null;

-- Rentals never involve the delivery-partner network: the renter (the store
-- listing the item) is paid the full rental amount directly, and decides per
-- item whether the customer picks it up (in which case the customer never
-- sees the deliver-to fields - they see the pickup location the renter set
-- instead) or the renter delivers it themselves to a person. Either way, no
-- zone fee is charged and no delivery_partner_payout is ever created for
-- these orders - see submitRentItem()/sheetRentItem() in the JS.
alter table items add column if not exists rental_fulfillment text check (rental_fulfillment is null or rental_fulfillment in ('pickup','deliver'));
alter table items add column if not exists pickup_location text;
alter table orders add column if not exists rental_item_id text;
alter table orders add column if not exists rental_days int;
alter table orders add column if not exists rental_fulfillment text check (rental_fulfillment is null or rental_fulfillment in ('pickup','deliver'));
alter table orders add column if not exists pickup_location text;
-- A "deliver"-fulfillment rental order the store has opted to hand off to a
-- delivery partner (for the fee already sitting in delivery_partner_payout,
-- once needs_delivery_partner is set) instead of delivering it themselves.
alter table orders add column if not exists needs_delivery_partner boolean not null default false;
alter table orders add column if not exists rental_payout_timing text check (rental_payout_timing is null or rental_payout_timing in ('upfront','after'));
-- Widen delivery_target_type to allow 'pickup' alongside the existing
-- 'person'/'boat' values (Postgres's default name for a column check added via
-- ALTER TABLE ADD COLUMN is "<table>_<column>_check").
alter table orders drop constraint if exists orders_delivery_target_type_check;
alter table orders add constraint orders_delivery_target_type_check check (delivery_target_type in ('person','boat','pickup'));

-- A rental item can be listed as available right now ('now', the default) or
-- 'soon' with a known available_from date - a "coming soon" rental still shows
-- up (in its own section) so customers can request it ahead of time instead of
-- only finding out once it's actually ready.
alter table items add column if not exists rental_availability text not null default 'now' check (rental_availability in ('now','soon'));
alter table items add column if not exists available_from date;

-- Store rating shown on hover on any item card and inside the item detail sheet
-- (see ratingBadgeHTML()) - a simple numeric average for now, not backed by a
-- real review system yet, so existing rows get a plausible default rather than
-- null (which would render as "no rating" instead of a number).
alter table businesses add column if not exists rating numeric(2,1) default 4.5;
update businesses set rating = 4.5 where rating is null;

-- A booking request against a 'soon' rental item - separate from orders because
-- it's a request the renter (the business) has to accept or decline before any
-- money changes hands, and only gets a charge amount once accepted. No delivery
-- partner, payout, or zone-fee columns at all - same reasoning as rentals
-- themselves (see the rental_item_id block above): the renter deals with the
-- customer directly.
create table rental_bookings (
  id text primary key,
  item_id text references items(id) on delete cascade,
  item_name text,
  business_id text references businesses(id),
  business_name text,
  customer_id uuid references auth.users(id),
  customer_email text,
  customer_name text,
  customer_phone text,
  requested_date date not null,
  days int not null default 1,
  note text,
  status text not null default 'pending' check (status in ('pending','accepted','declined','cancelled')),
  booking_charge numeric,
  charge_status text check (charge_status is null or charge_status in ('pending','slip_uploaded','collected')),
  slip_url text,
  created_at timestamptz default now(),
  decided_at timestamptz
);
alter table rental_bookings enable row level security;
create policy "customer insert own booking" on rental_bookings for insert
  with check (auth.uid() = customer_id);
create policy "customer read own bookings" on rental_bookings for select
  using (auth.uid() = customer_id);
create policy "business read own bookings" on rental_bookings for select
  using (exists (select 1 from businesses b where b.id = rental_bookings.business_id and b.owner_id = auth.uid()));
-- The business decides status/booking_charge/charge_status directly (no
-- SECURITY DEFINER function needed there, unlike orders' payment/payout
-- columns) since there's only one other party's money involved (the
-- customer's) and no delivery partner whose column-level lockdown this would
-- need to defend against. The customer's own two actions below DO need their
-- own functions though, since - unlike the business - a customer has no
-- update policy on this table at all: cancelling only ever needs to flip
-- 'pending' to 'cancelled', and submitting a slip only ever needs to set
-- charge_status/slip_url, so a function scoped to exactly that beats opening
-- a whole update policy a customer could otherwise use to rewrite any column
-- on their own booking, including the ones the business is supposed to own.
create policy "business update own bookings" on rental_bookings for update
  using (exists (select 1 from businesses b where b.id = rental_bookings.business_id and b.owner_id = auth.uid()));

create or replace function cancel_booking_request(p_booking_id text)
returns setof rental_bookings
language sql
security definer
set search_path = public
as $$
  update rental_bookings
  set status = 'cancelled'
  where id = p_booking_id and customer_id = auth.uid() and status = 'pending'
  returning *;
$$;

-- Only reachable once the business has accepted with a charge (see
-- bookingCardCust()/sheetBookingDetailCust()) - the account details shown
-- alongside this are the store's real ones, same acctValHTML() used for a
-- regular order's transfer, so there's nothing extra to validate about the
-- destination account here, only that this booking is this customer's own,
-- accepted, and actually has a charge to transfer.
create or replace function submit_booking_slip(p_booking_id text, p_slip_url text)
returns setof rental_bookings
language sql
security definer
set search_path = public
as $$
  update rental_bookings
  set charge_status = 'slip_uploaded', slip_url = p_slip_url
  where id = p_booking_id and customer_id = auth.uid() and status = 'accepted' and booking_charge is not null
  returning *;
$$;

grant execute on function cancel_booking_request(text) to authenticated;
grant execute on function submit_booking_slip(text, text) to authenticated;

-- A customer's saved delivery addresses - three independent categories, each
-- with its own default: 'own' (places the customer themselves gets things
-- delivered to), 'other' (people the customer has delivered to on their
-- behalf, e.g. a gift), and 'boat' (harbours/vessels the customer has used).
-- Purely the customer's own data, so plain ownership RLS is enough - unlike
-- orders there's no other party's money or column here that needs a
-- SECURITY DEFINER function to defend, except the one-default-per-category
-- swap below (see set_default_address()), which needs to be atomic.
create table customer_addresses (
  id text primary key,
  customer_id uuid references auth.users(id) on delete cascade,
  category text not null check (category in ('own','other','boat')),
  name text,
  phone text,
  address text,
  zone text check (zone is null or zone in ('male','hulhumale1','hulhumale2')),
  harbour text,
  is_default boolean not null default false,
  created_at timestamptz default now()
);
alter table customer_addresses enable row level security;
create policy "customer manage own addresses" on customer_addresses for all
  using (auth.uid() = customer_id) with check (auth.uid() = customer_id);

-- Swaps which address is default within one category atomically - a plain
-- client-side "unset the old one, set the new one" would be two separate
-- writes, and RLS lets the customer do that anyway since they own every row
-- here, but a function keeps it one round trip and one indivisible step.
create or replace function set_default_address(p_address_id text, p_category text)
returns setof customer_addresses
language sql
security definer
set search_path = public
as $$
  with unset as (
    update customer_addresses set is_default = false
    where customer_id = auth.uid() and category = p_category and is_default = true
  )
  update customer_addresses set is_default = true
  where id = p_address_id and customer_id = auth.uid() and category = p_category
  returning *;
$$;
grant execute on function set_default_address(text, text) to authenticated;

-- =========================================================================
-- SWIPE ORDER PAYMENTS (Buy now orders). Run this block once after the rest.
-- Flow: customer places order (payment_method 'swipe', payment_status
-- 'awaiting_approval') -> store approves ('awaiting_swipe') or declines ->
-- customer pays through a Swipe link created on the STORE'S OWN Swipe
-- account (edge function create-order-payment) -> Swipe calls
-- swipe-order-webhook -> 'paid', fees recorded. The store can't hand the
-- order to a rider until it's paid. Cash on delivery and bank transfer are
-- no longer offered for Buy now orders; rentals and auctions are unchanged.
--
-- Fees: Maldexpress takes 5% of each order total. Swipe's 1% charge is
-- split 1:1 between the store and Maldexpress. Money lands in the store's
-- wallet minus Swipe's 1%, so the store owes Maldexpress
-- platform_fee - swipe_fee/2 (4.5% of the total). Recorded per order in
-- platform_fee_due and cleared by an admin with settle_platform_fees().
-- =========================================================================

-- Each store's Swipe API credentials. RLS on and NO policies: only the edge
-- functions (service role) can read them, so secrets never reach a browser.
create table if not exists business_swipe_accounts (
  business_id text primary key references businesses(id) on delete cascade,
  client_id text not null,
  client_secret text not null,
  webhook_secret text not null,
  updated_at timestamptz default now()
);
alter table business_swipe_accounts enable row level security;

-- Which stores can take Swipe payments (ids only, never the credentials).
-- A function rather than a businesses column, so no client write can mark a
-- store as connected.
create or replace function swipe_connected_business_ids()
returns setof text
language sql
stable
security definer
set search_path = public
as $$ select business_id from business_swipe_accounts; $$;
grant execute on function swipe_connected_business_ids() to anon, authenticated;

alter table orders add column if not exists swipe_reference text;
alter table orders add column if not exists swipe_payment_link text;
alter table orders add column if not exists paid_at timestamptz;
alter table orders add column if not exists swipe_fee numeric;
alter table orders add column if not exists platform_fee numeric;
alter table orders add column if not exists platform_fee_due numeric;
alter table orders add column if not exists fee_settled_at timestamptz;

-- A new Buy now order can only start unpaid and awaiting the store. Before
-- this, the insert policy only checked customer_id, so a customer could
-- insert an order already marked paid. Rentals and auction wins keep their
-- own starting states.
drop policy if exists "customer insert own order" on orders;
create policy "customer insert own order" on orders for insert
  with check (
    auth.uid() = customer_id
    and swipe_reference is null and swipe_payment_link is null and paid_at is null
    and swipe_fee is null and platform_fee is null and platform_fee_due is null and fee_settled_at is null
    and (
      rental_item_id is not null
      or payment_status = 'awaiting_completion'
      or (payment_method = 'swipe' and payment_status = 'awaiting_approval')
    )
  );

-- Store owner saves (or replaces) their Swipe credentials.
create or replace function set_business_swipe_account(p_business_id text, p_client_id text, p_client_secret text, p_webhook_secret text)
returns boolean
language plpgsql
security definer
set search_path = public
as $$
begin
  if not exists (select 1 from businesses b where b.id = p_business_id and b.owner_id = auth.uid()) then
    return false;
  end if;
  if coalesce(trim(p_client_id),'') = '' or coalesce(trim(p_client_secret),'') = '' or coalesce(trim(p_webhook_secret),'') = '' then
    return false;
  end if;
  insert into business_swipe_accounts (business_id, client_id, client_secret, webhook_secret, updated_at)
  values (p_business_id, trim(p_client_id), trim(p_client_secret), trim(p_webhook_secret), now())
  on conflict (business_id) do update
    set client_id = excluded.client_id, client_secret = excluded.client_secret,
        webhook_secret = excluded.webhook_secret, updated_at = now();
  return true;
end;
$$;
grant execute on function set_business_swipe_account(text, text, text, text) to authenticated;

create or replace function approve_swipe_order(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set payment_status = 'awaiting_swipe'
  where o.id = p_order_id
    and o.payment_method = 'swipe' and o.payment_status = 'awaiting_approval'
    and o.status is distinct from 'declined'
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
    and exists (select 1 from business_swipe_accounts s where s.business_id = o.business_id)
  returning o.*;
$$;
grant execute on function approve_swipe_order(text) to authenticated;

create or replace function decline_swipe_order(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set status = 'declined'
  where o.id = p_order_id
    and o.payment_method = 'swipe' and o.payment_status in ('awaiting_approval','awaiting_swipe')
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
  returning o.*;
$$;
grant execute on function decline_swipe_order(text) to authenticated;

-- Admin marks everything a store owes Maldexpress as paid.
create or replace function settle_platform_fees(p_business_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set fee_settled_at = now()
  where o.business_id = p_business_id
    and o.platform_fee_due is not null and o.fee_settled_at is null
    and is_admin()
  returning o.*;
$$;
grant execute on function settle_platform_fees(text) to authenticated;

-- A Swipe order can't go to a rider (or out for self-delivery) until paid.
create or replace function mark_order_ready_for_pickup(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set ready_for_pickup = true, self_delivery = false
  where o.id = p_order_id
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
    and o.rental_item_id is null
    and o.delivery_person_id is null
    and o.status is distinct from 'delivered' and o.status is distinct from 'declined'
    and (o.payment_method is distinct from 'swipe' or o.payment_status = 'paid')
  returning o.*;
$$;
create or replace function mark_order_self_delivery(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders o set self_delivery = true, ready_for_pickup = false
  where o.id = p_order_id
    and exists (select 1 from businesses b where b.id = o.business_id and b.owner_id = auth.uid())
    and o.rental_item_id is null
    and o.delivery_person_id is null
    and o.status is distinct from 'delivered' and o.status is distinct from 'declined'
    and (o.payment_method is distinct from 'swipe' or o.payment_status = 'paid')
  returning o.*;
$$;

-- Auctions and rentals can also be paid by Swipe. A rental is inserted
-- straight into 'awaiting_swipe'. An auction win is completed by
-- complete_auction_order; this is the live definition (see
-- supabase/live_functions_snapshot.sql) with one change: 'swipe' goes to
-- 'awaiting_swipe' instead of 'pending_cash', which orders_insert_guard /
-- orders_update_guard would reject as cash_not_supported. Cash for an
-- auction win is paid to the store ('cash_on_pickup'); riders never carry
-- cash.
create or replace function complete_auction_order(p_order_id text, p_delivery_zone text, p_payment_method text,
  p_delivery_target_type text default 'person', p_shipping_enc text default null, p_shipping_iv text default null, p_shipping_keys jsonb default null)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders set
    zone = p_delivery_zone,
    delivery_fee = case when delivery_type <> 'free' then case p_delivery_zone when 'hulhumale1' then 20 when 'hulhumale2' then 25 else 15 end else 0 end + coalesce(extra_delivery_fee, 0),
    delivery_partner_payout = case p_delivery_zone when 'hulhumale1' then 20 when 'hulhumale2' then 25 else 15 end,
    payment_method = p_payment_method,
    payment_status = case p_payment_method when 'transfer' then 'pending_transfer' when 'swipe' then 'awaiting_swipe' else 'pending_cash' end,
    delivery_target_type = p_delivery_target_type,
    receiver_name = null,
    receiver_phone = null,
    receiver_address = null,
    shipping_enc = p_shipping_enc,
    shipping_iv = p_shipping_iv,
    shipping_keys = p_shipping_keys
  where id = p_order_id and customer_id = auth.uid() and payment_status = 'awaiting_completion'
    and p_payment_method in ('transfer','cash_on_pickup','swipe')
    and (p_payment_method <> 'swipe' or exists (select 1 from business_swipe_accounts s where s.business_id = orders.business_id))
    and exists (select 1 from auction_listings al where al.order_id = orders.id and al.current_highest_bidder = auth.uid())
  returning *;
$$;

-- Rentals may only start unpaid too (the policy above still let a rental be
-- inserted with any payment_status, including 'paid').
drop policy if exists "customer insert own order" on orders;
create policy "customer insert own order" on orders for insert
  with check (
    auth.uid() = customer_id
    and swipe_reference is null and swipe_payment_link is null and paid_at is null
    and swipe_fee is null and platform_fee is null and platform_fee_due is null and fee_settled_at is null
    and (
      (rental_item_id is not null and (
        (payment_method = 'transfer' and payment_status = 'pending_transfer')
        or (payment_method = 'cash_on_pickup' and payment_status = 'pending_cash')
        or (payment_method = 'swipe' and payment_status = 'awaiting_swipe'
            and exists (select 1 from business_swipe_accounts s where s.business_id = orders.business_id))
      ))
      or (rental_item_id is null and payment_status = 'awaiting_completion')
      or (rental_item_id is null and payment_method = 'swipe' and payment_status = 'awaiting_approval')
    )
  );

-- Riders are owed their zone fee on every delivered non-rental order; the
-- live orders_update_guard trigger already sets payout_status = 'pending',
-- so mark_delivered needs no change for Swipe orders.
--------------------------------------------------- */

/* =================== DATA LAYER =================== */
const TABLES = { businesses:'businesses', items:'items', orders:'orders', delivery:'delivery_persons', proRequests:'pro_upgrade_requests', auctions:'auction_listings', bookings:'rental_bookings', bids:'auction_bids', categoryRequests:'category_requests', addresses:'customer_addresses' };
let DB = { businesses:[], items:[], orders:[], delivery:[], proRequests:[], auctions:[], bookings:[], bids:[], categoryRequests:[], customCategories:[], addresses:[] };
let storageReady = false;

// ============================================================
// END-TO-END ENCRYPTION HELPERS
// ============================================================
// Every user gets an RSA-OAEP keypair generated in their browser at
// signup. The public half is stored in user_profiles (safe -- it's
// public by definition). The private half is encrypted with a key
// derived from the user's own password (PBKDF2) before it's ever sent
// to Supabase, so Supabase never has a usable copy of it.
//
// Order shipping details (receiver name/phone/address) and payment
// slips are AES-GCM encrypted client-side. The AES key itself is then
// wrapped (RSA-OAEP) once per person who legitimately needs to read
// that field -- the customer, the business owner, and (for shipping
// only) a shared delivery-partner key, since the specific rider who'll
// claim an open job isn't known yet at order-creation time. See
// get_delivery_pool_private_key() in the database -- it's the only way
// to ever retrieve that key, and it checks the caller is a real
// delivery partner first.
//
// Known limitation, disclosed on purpose: the private key is only ever
// held in memory, derived from the password at sign-in/sign-up time.
// A page reload with an existing session will show blank shipping
// fields until the next sign-in re-derives the key -- the same
// trade-off password-manager apps make between convenience and never
// letting the server hold a usable private key.

const DELIVERY_POOL_PUBLIC_KEY_B64 = "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAvvaPfBZbRxg68VfkUZZeZJjCH1yeJAbZepG7p1SQMHDmAzgKHjeSaFItc54p4BhkvQMRqA+3WXqHpS/5Uaw7lQarbyqGcA1Iu7TrB5tKwmT+tex+NEjTRG1Y9Gq+SLeauJglLYytgzpIDfZha3SDVI6YM2fEx8fiUOjkbQq6f9ADuj6//xwvGBRUvTUzbzmbh/WFq0/c+h7bhJlbEhSE/U0rxfSOhTQTH2g2UlVXJp3BLV2dGJq8CzrLbis1rgjz6ylDD2pAE7cHcQ3iI2RxuUSd5Jr37RTS8895Cv8oDF+iitX9MFRXsIBpalYI9CeFuDdVfXn6b+spPivh7nAfeQIDAQAB";
// (rotated 2026-11-08 after the old private key was exposed)

let __myPrivateKey = null;   // this session's own CryptoKey (RSA-OAEP), once unlocked
let __myPublicKeyB64 = null;
let __poolPrivateKeyPromise = null; // lazily fetched + imported once per session
// Set whenever a keypair is generated but hasn't been saved to user_profiles
// yet -- e.g. at signup, before a phone number (required by that table) is
// known, so there's no row to save it into. submitMobileNumber() merges this
// in once a row finally gets created, so a keypair generated at signup time
// is never silently thrown away.
let __myPendingKeyCols = null;

function b64FromBuf(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function bufFromB64(b64){ const bin = atob(b64); const arr = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i); return arr.buffer; }

async function deriveWrapKey(password, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:100000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}

// Called from submitSignUp() right after a successful Firebase sign-up,
// while the plaintext password is still in local scope. Returns the
// columns to include in the same user_profiles insert signup already does.
async function genKeypairAndWrap(password){
  const kp = await crypto.subtle.generateKey({ name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256' }, true, ['encrypt','decrypt']);
  const pubRaw = await crypto.subtle.exportKey('spki', kp.publicKey);
  const privRaw = await crypto.subtle.exportKey('pkcs8', kp.privateKey);
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const wrapKey = await deriveWrapKey(password, salt);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encPriv = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, wrapKey, privRaw);
  __myPrivateKey = kp.privateKey;
  __myPublicKeyB64 = b64FromBuf(pubRaw);
  __myPendingKeyCols = {
    public_key: __myPublicKeyB64,
    private_key_enc: b64FromBuf(encPriv),
    private_key_iv: b64FromBuf(iv),
    private_key_salt: b64FromBuf(salt)
  };
  return __myPendingKeyCols;
}

// Called from signInWithIdentifierPassword() right after a successful
// Firebase signInWithEmailAndPassword(), while the plaintext password is still
// in local scope. Self-heals accounts that predate this feature (e.g.
// the seeded test accounts, or any real account created before this
// shipped) by generating and saving a keypair for them on the spot,
// using the password they just signed in with -- so nobody is ever
// stuck with encrypted orders they can never open.
async function unlockMyPrivateKey(userId, password){
  try{
    const { data, error } = await sb.from('user_profiles').select('public_key,private_key_enc,private_key_iv,private_key_salt').eq('user_id', userId).maybeSingle();
    if(error) return false;
    if(!data || !data.private_key_enc){
      const cols = await genKeypairAndWrap(password);
      const { error: upErr } = await sb.from('user_profiles').update(cols).eq('user_id', userId);
      if(upErr){ console.error('could not save new keypair for existing account', upErr); return false; }
      return true; // genKeypairAndWrap already set __myPrivateKey/__myPublicKeyB64
    }
    const salt = new Uint8Array(bufFromB64(data.private_key_salt));
    const wrapKey = await deriveWrapKey(password, salt);
    const iv = new Uint8Array(bufFromB64(data.private_key_iv));
    const privRaw = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, wrapKey, bufFromB64(data.private_key_enc));
    __myPrivateKey = await crypto.subtle.importKey('pkcs8', privRaw, { name:'RSA-OAEP', hash:'SHA-256' }, true, ['decrypt']);
    __myPublicKeyB64 = data.public_key;
    return true;
  } catch(e){ console.error('unlockMyPrivateKey failed', e); return false; }
}

async function importPublicKeyB64(b64){
  return crypto.subtle.importKey('spki', bufFromB64(b64), { name:'RSA-OAEP', hash:'SHA-256' }, true, ['encrypt']);
}

async function getPoolPrivateKey(){
  if(__poolPrivateKeyPromise) return __poolPrivateKeyPromise;
  __poolPrivateKeyPromise = (async ()=>{
    const { data, error } = await sb.rpc('get_delivery_pool_private_key');
    if(error || !data) return null;
    return crypto.subtle.importKey('pkcs8', bufFromB64(data), { name:'RSA-OAEP', hash:'SHA-256' }, true, ['decrypt']);
  })();
  return __poolPrivateKeyPromise;
}

async function lookupPublicKey(userId){
  const { data } = await sb.rpc('get_user_public_key', { target_user_id: userId });
  return data || null;
}

async function businessOwnerPublicKeyB64(businessId){
  const biz = DB.businesses.find(b=>b.id===businessId);
  const ownerId = biz && biz.ownerId;
  if(!ownerId) return null;
  return lookupPublicKey(ownerId);
}

// Encrypts one JSON-able payload with a fresh AES key, wraps that key
// once per recipient public key given ({label: pubKeyB64}). Returns
// {enc, iv, keys} ready to store in the encrypted columns.
async function encryptForRecipients(payload, recipients){
  const aesKey = await crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const plaintext = new TextEncoder().encode(JSON.stringify(payload));
  const ciphertext = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, aesKey, plaintext);
  const rawAesKey = await crypto.subtle.exportKey('raw', aesKey);
  const keys = {};
  for(const label in recipients){
    const pubB64 = recipients[label];
    if(!pubB64) continue;
    const pubKey = await importPublicKeyB64(pubB64);
    const wrapped = await crypto.subtle.encrypt({ name:'RSA-OAEP' }, pubKey, rawAesKey);
    keys[label] = b64FromBuf(wrapped);
  }
  return { enc: b64FromBuf(ciphertext), iv: b64FromBuf(iv), keys };
}

// Tries to decrypt using whichever wrapped key entry applies to the
// current session -- own user id first, then (if this account is a
// delivery partner) the shared pool key. Returns null on no access.
async function decryptForMe(enc, iv, keys){
  if(!enc || !keys) return null;
  try{
    let myLabel = state.customerId;
    let privateKey = null;
    if(myLabel && keys[myLabel] && __myPrivateKey){
      privateKey = __myPrivateKey;
    } else if(keys.pool){
      privateKey = await getPoolPrivateKey();
      myLabel = 'pool';
    }
    if(!privateKey || !keys[myLabel]) return null;
    const rawAesKey = await crypto.subtle.decrypt({ name:'RSA-OAEP' }, privateKey, bufFromB64(keys[myLabel]));
    const aesKey = await crypto.subtle.importKey('raw', rawAesKey, 'AES-GCM', false, ['decrypt']);
    const plaintext = await crypto.subtle.decrypt({ name:'AES-GCM', iv: new Uint8Array(bufFromB64(iv)) }, aesKey, bufFromB64(enc));
    return JSON.parse(new TextDecoder().decode(plaintext));
  } catch(e){ return null; }
}

// Mutates dbRow in place (the object about to be sent to Supabase):
// encrypts shipping + slip fields, blanks the plaintext columns so
// Supabase only ever stores ciphertext for them.
async function encryptOrderRow(dbRow, order){
  try{
    if(dbRow.receiver_name || dbRow.receiver_phone || dbRow.receiver_address){
      const recipients = {};
      if(order.customerId){
        const custKey = (order.customerId===state.customerId && __myPublicKeyB64) ? __myPublicKeyB64 : await lookupPublicKey(order.customerId);
        if(custKey) recipients[order.customerId] = custKey;
      }
      const biz = DB.businesses.find(b=>b.id===order.businessId);
      if(biz && biz.ownerId){
        const ownerKey = await businessOwnerPublicKeyB64(order.businessId);
        if(ownerKey) recipients[biz.ownerId] = ownerKey;
      }
      recipients['pool'] = DELIVERY_POOL_PUBLIC_KEY_B64;
      const { enc, iv, keys } = await encryptForRecipients({ name: dbRow.receiver_name, phone: dbRow.receiver_phone, address: dbRow.receiver_address }, recipients);
      dbRow.shipping_enc = enc; dbRow.shipping_iv = iv; dbRow.shipping_keys = keys;
      dbRow.receiver_name = null; dbRow.receiver_phone = null; dbRow.receiver_address = null;
    }
    if(dbRow.slip_url){
      const recipients = {};
      if(order.customerId && __myPublicKeyB64 && order.customerId===state.customerId) recipients[order.customerId] = __myPublicKeyB64;
      const biz = DB.businesses.find(b=>b.id===order.businessId);
      if(biz && biz.ownerId){
        const ownerKey = await businessOwnerPublicKeyB64(order.businessId);
        if(ownerKey) recipients[biz.ownerId] = ownerKey;
      }
      const { enc, iv, keys } = await encryptForRecipients({ url: dbRow.slip_url }, recipients);
      dbRow.slip_enc = enc; dbRow.slip_iv = iv; dbRow.slip_keys = keys;
      dbRow.slip_url = null;
    }
  } catch(e){ console.error('encryptOrderRow failed, leaving order unencrypted this write', e); }
}

// Mutates the JS order object in place: decrypts shipping/slip fields
// if this session has access, using the raw DB row fields.
async function decryptOrderRow(order, dbRow){
  try{
    if(dbRow.shipping_enc){
      const out = await decryptForMe(dbRow.shipping_enc, dbRow.shipping_iv, dbRow.shipping_keys);
      if(out){ order.receiverName = out.name||null; order.receiverPhone = out.phone||null; order.receiverAddress = out.address||null; }
    }
    if(dbRow.slip_enc){
      const out = await decryptForMe(dbRow.slip_enc, dbRow.slip_iv, dbRow.slip_keys);
      if(out) order.slipDataUrl = out.url||null;
    }
  } catch(e){ console.error('decryptOrderRow failed', e); }
}

function toDbRow(part, o){
  if(part==='businesses') return { id:o.id, owner_id:o.ownerId, name:o.name, owner_name:o.ownerName, phone:o.phone, account_number:o.accountNumber, account_name:o.accountName, tier:o.tier, join_date:new Date(o.joinDate).toISOString(), paid_at:o.paidAt?new Date(o.paidAt).toISOString():null, category:o.category, category_other_name:o.categoryOtherName||null, rating:o.rating!=null?o.rating:null, address:o.address||null, island:o.island||null, lat:o.lat!=null?o.lat:null, lng:o.lng!=null?o.lng:null };
