<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
  // iPhone/iPad zoom in when a form box with text under 16px is tapped. Telling
  // iOS maximum-scale=1 stops that, and iOS still lets people pinch-zoom anyway.
  // Other phones don't auto-zoom, so they keep the plain viewport (and pinch-zoom).
  if(/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1)){
    document.querySelector('meta[name=viewport]').setAttribute('content','width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover');
  }
</script>
<!-- Add-to-Home-Screen: the Maldexpress logo (icons/) is the app icon on
     Android (manifest.webmanifest, incl. a maskable icon) and iPhone
     (apple-touch-icon). Opened from the home screen it runs full-screen. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Maldexpress">
<meta name="theme-color" content="#0FA3A3">
<title>Maldexpress</title>
<meta name="description" content="Shop stores across the Maldives and get it delivered to your door or your boat.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Maldexpress">
<meta property="og:title" content="Maldexpress · Shop every island">
<meta property="og:description" content="Shop stores across the Maldives and get it delivered to your door or your boat.">
<meta property="og:image" content="https://maldexpress.github.io/maldexpress-app/icons/icon-512.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Plus+Jakarta+Sans:wght@400..800&family=Gochi+Hand&display=swap" rel="stylesheet">
<!-- Real Supabase client (replaces the in-browser mock used for the Claude
     Artifact preview, whose network calls that sandbox's CSP blocks anyway -
     this loads the genuine supabase-js library so SUPABASE_URL/ANON_KEY
     below (already pointing at the real Maldexpress project) actually work
     once this file is hosted anywhere outside that sandbox, e.g. GitHub Pages. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<!-- Firebase Auth handles accounts (sign-up, email verification, sign-in);
     Supabase stores the data and checks the Firebase login on every request. -->
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.14.1/firebase-auth-compat.js"></script>
<style>
  /* "Bright lagoon": a Maldivian island in full daylight. Warm white-sand
     ground, clean white cards with soft shadows, a turquoise lagoon for what's
     selected or active, and sunset coral for the action that moves an order
     forward and for prices. Display: Bricolage Grotesque (headings).
     Body: Plus Jakarta Sans. Old token names (--glass, --plankton,
     --night-coral, --ink, --channel, --ground, --shallow, ...) are kept as
     aliases because inline styles in the script use them. */
  :root{
    --sand-bg:#F3F7F6;       /* page ground: white sand under clear water */
    --surface:#FFFFFF;       /* cards */
    --sand-2:#EAF1EF;        /* chips, inner fills */
    --sand-3:#DDE7E4;
    --edge:#DCE6E3;          /* hairlines */
    --edge-2:#C6D4D0;
    --island:#F7E7BF;        /* real sand, used on the island only */

    --lagoon-500:#0FA3A3;    /* active / selected */
    --lagoon-600:#0B8A8C;
    --lagoon-700:#086A70;
    --lagoon-50:#E4F6F4;
    --ocean:#1E6FD9;         /* secondary blue */
    --sunset:#E24A24;        /* primary action (white text passes AA) */
    --sunset-dk:#C23B17;     /* prices and coral text */
    --sunset-glow:#FF7A57;
    --ink-900:#0D2B33;       /* text */
    --ink-600:#4F646A;
    --ink-400:#64777C;
    --amber:#8A5300;
    --palm:#0B6E47;
    --red:#D93A44;

    /* aliases kept for inline styles and older rules */
    --abyss:#FFFFFF;
    --deep:var(--ink-900);
    --plankton:var(--lagoon-500);
    --plankton-dim:var(--lagoon-600);
    --volt:var(--ocean);
    --night-coral:var(--sunset);
    --night-coral-dk:var(--sunset-dk);
    --star:var(--ink-900);
    --star-dim:var(--ink-600);
    --sun:var(--amber);
    --mint:var(--palm);
    --glass:var(--sand-2);
    --glass-2:var(--sand-3);
    --glass-brd:var(--edge);
    --glass-hi:var(--edge-2);
    --blur:none;
    --bg1:var(--sand-bg);
    --ink:var(--ink-900);
    --ink-dim:var(--ink-600);
    --coral:var(--sunset);
    --coral-dk:var(--sunset-dk);
    --lagoon:var(--lagoon-500);
    --lagoon-deep:var(--lagoon-700);
    --shallow:var(--lagoon-50);
    --channel:var(--ink-900);
    --channel-2:var(--ink-600);
    --sandbar:var(--sand-2);
    --ground:var(--sand-bg);
    --line:var(--edge);
    --coral-pink:var(--sunset);
    --coral-pink-dk:var(--sunset-dk);
    --sand:var(--sand-bg);
    --danger:var(--red);
    --good:var(--palm);
    --warn:var(--amber);
    --link:var(--lagoon-700);

    --radius:20px;
    --shadow:0 1px 2px rgba(13,43,51,.05), 0 6px 20px rgba(13,43,51,.06);
    --shadow-lift:0 2px 6px rgba(13,43,51,.06), 0 18px 44px rgba(13,43,51,.14);
    --glow-cyan:0 6px 16px rgba(15,163,163,.25);
    --glow-coral:0 8px 22px rgba(226,74,36,.28);
    --display:'Bricolage Grotesque','Plus Jakarta Sans',system-ui,sans-serif;
    --fs:12px;
    font-size:var(--fs);
    color-scheme:light;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Locks the app from sliding sideways (iOS needs it on html too).
     Horizontal strips scroll inside their own box. */
  html,body{height:100%; max-width:100%; overflow-x:hidden; overscroll-behavior-x:none;}
  html{background:var(--sand-bg);}
  ::selection{background:rgba(15,163,163,.22);}
  body{
    margin:0;
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
    font-size:1rem;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background:var(--sand-bg);
  }
  h1,h2,h3,.display{letter-spacing:-.015em; text-wrap:balance;}
  h1{font-family:var(--display); font-size:1.75em; font-weight:800; margin:0; line-height:1.1;}
  h2{font-family:var(--display); font-size:1.25em; font-weight:700; margin:0 0 .7em; letter-spacing:-.02em; line-height:1.2;}
  h3{font-size:1em; font-weight:700; margin:0;}
  p{margin:0; line-height:1.5;}
  button{font-family:inherit; cursor:pointer; color:inherit;}
  /* iOS zooms on focus under 16px, so fields never go below it. */
  input,select,textarea{font-family:inherit; font-size:max(13px, 1.06em);}   /* iPhone zoom-on-tap is stopped in the viewport meta instead (see the iOS check in <head>) */
  a{color:var(--link);}
  :focus-visible{outline:2px solid var(--lagoon-500); outline-offset:3px;}

  /* Card surface (the class is still called .glass). */
  .glass{
    background:var(--surface);
    border:1px solid var(--edge);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }

  /* ---------- App shell ---------- */
  #app{max-width:560px; margin:0 auto; min-height:100vh; position:relative; z-index:1; padding-bottom:100px;}

  /* Landing (store / delivery profile pickers) */
  .landing{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:28px 20px;}
  .landing-mark{text-align:left; margin-bottom:28px;}
  .landing-mark h1{font-size:2.5em; font-weight:800; line-height:1.02; color:var(--ink);}
  .landing-mark h1::after{content:""; display:block; width:56px; height:6px; border-radius:99px; margin-top:14px; background:linear-gradient(90deg, var(--lagoon-500), var(--ocean));}
  .landing-mark p{color:var(--ink-dim); margin-top:12px; max-width:34ch;}
  .role-card{
    padding:16px; margin-bottom:12px; display:flex; align-items:center; gap:14px;
    transition:transform .15s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .role-card:active{transform:scale(.98);}
  .role-card:hover{border-color:var(--lagoon-500); box-shadow:var(--shadow-lift);}
  .role-card .ic{
    width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:1.45em; background:var(--lagoon-50); flex-shrink:0;
  }
  .role-card .txt{flex:1; min-width:0;}
  .role-card .txt h3{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .role-card .txt small{color:var(--ink-dim); font-size:.88em;}
  .role-card .arrow{width:34px; height:34px; border-radius:50%; background:var(--sand-2); color:var(--lagoon-600); display:flex; align-items:center; justify-content:center; font-size:1em; flex-shrink:0;}

  /* Payment-method choices */
  .pay-option{
    width:100%; text-align:left; border:1.5px solid var(--edge); border-radius:16px;
    background:var(--surface); padding:12px 14px; color:var(--ink);
    display:flex; align-items:center; gap:12px;
    transition:border-color .2s ease, background .2s ease, box-shadow .2s ease;
  }
  .pay-option:hover{border-color:var(--edge-2);}
  .pay-option:active{transform:scale(.985);}
  .pay-option .ic{
    width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    font-size:1.05em; background:var(--sand-2); flex-shrink:0;
  }
  .pay-option .txt{flex:1; min-width:0;}
  .pay-option .txt h3{font-size:.98em; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .pay-option .txt small{color:var(--ink-dim); font-size:.84em;}

  /* Header (every screen but Home) */
  .topbar{
    position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
    padding:calc(10px + env(safe-area-inset-top)) 16px 12px; margin:0 -16px 10px;
  }
  .topbar.glass{background:rgba(243,247,246,.9); -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px); border:none; border-bottom:1px solid var(--edge); border-radius:0; box-shadow:none;}
  .topbar .iconbtn{
    width:42px; height:42px; border-radius:14px; border:1px solid var(--edge); background:var(--surface);
    display:flex; align-items:center; justify-content:center; font-size:1.1em; color:var(--ink); flex-shrink:0; box-shadow:0 1px 2px rgba(13,43,51,.05);
  }
  .topbar .titles{flex:1; min-width:0;}
  .topbar .titles h1{font-size:1.25em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar .titles .sub{font-size:.86em; color:var(--ink-dim);}
  .badge{padding:4px 10px; border-radius:999px; font-size:.76em; font-weight:700;}
  .badge.free{background:#FFF1D6; color:var(--amber);}
  .badge.pro{background:#DDF4E8; color:var(--palm);}

  main{padding:0 16px;}
  .section{margin-bottom:28px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:14px;}
  .section-head h2{margin:0;}
  .link-btn{color:var(--link); font-size:.92em; font-weight:700; background:none; border:none; padding:4px;}

  /* Cards */
  .card{padding:18px; margin-bottom:12px;}
  .card.tight{padding:14px 16px;}
  .card:not(.glass){border-radius:16px;}
  .row{display:flex; align-items:center; gap:12px;}
  .row.between{justify-content:space-between;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .muted{color:var(--ink-dim);}
  .price{color:var(--sunset-dk); font-weight:800; font-variant-numeric:tabular-nums;}

  .item-card{padding:12px; display:flex; gap:12px; align-items:center; margin-bottom:10px;}
  .item-thumb{
    position:relative; width:58px; height:58px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.5em;
    background:var(--lagoon-50); overflow:hidden;
  }
  .item-thumb img{width:100%; height:100%; object-fit:cover; object-position:50% 35%; background:#fff;}
  .item-info{flex:1; min-width:0;}
  .item-info h3{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  /* Multi-item order thumbnail: top item in front, runner-up peeking behind. */
  .order-thumb-wrap{position:relative; width:58px; height:58px; flex-shrink:0;}
  .order-thumb-wrap .item-thumb{position:absolute; top:0; left:0;}
  .order-thumb-wrap .item-thumb.behind{transform:translate(7px,7px) scale(.9); z-index:0; opacity:.55;}
  .order-thumb-wrap .item-thumb.front{z-index:1; box-shadow:0 0 0 3px #fff;}

  .qty-ctrl{display:flex; align-items:center; gap:4px; flex-shrink:0; font-weight:800; font-variant-numeric:tabular-nums; background:var(--sand-2); border-radius:999px; padding:3px;}
  .qty-ctrl strong{min-width:1.4em; text-align:center;}
  .qty-ctrl button{
    width:28px; height:28px; border-radius:50%; border:none; background:var(--surface); color:var(--ink); font-size:1em; font-weight:800;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; box-shadow:0 1px 3px rgba(13,43,51,.12);
  }
  .qty-ctrl button:active{transform:scale(.88);}

  .cart-check-circle{
    width:24px; height:24px; flex-shrink:0; border:none; background:none; padding:0; color:var(--lagoon-500);
    display:flex; align-items:center; justify-content:center;
  }
  .cart-check-circle:active{transform:scale(.9);}

  /* Buttons. Sunset coral is the order-moving action. */
  .btn{
    border:none; border-radius:14px; padding:14px 20px; font-weight:700; font-size:1em;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    transition:transform .12s ease, background .15s ease, box-shadow .2s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(180deg, var(--sunset-glow) -40%, var(--sunset) 60%); color:#fff; box-shadow:var(--glow-coral), inset 0 1px 0 rgba(255,255,255,.25);}
  .btn-primary:hover{background:var(--sunset-dk);}
  .btn-ghost{background:var(--sand-2); color:var(--ink); border:1px solid var(--edge);}
  .btn-ghost:hover{background:var(--sand-3);}
  .btn-outline{background:var(--surface); border:1.5px solid var(--lagoon-500); color:var(--lagoon-700);}
  .btn-outline:hover{background:var(--lagoon-50);}
  .btn-good{background:var(--lagoon-700); color:#fff; box-shadow:var(--glow-cyan);}
  .btn-good:hover{background:#06575C;}
  .btn-sm{padding:9px 16px; font-size:.9em; width:auto; border-radius:12px;}
  .btn[disabled]{opacity:.45; pointer-events:none;}

  .fab{
    position:fixed; right:max(20px, calc(50% - 260px)); bottom:calc(96px + env(safe-area-inset-bottom)); z-index:25;
    width:58px; height:58px; border-radius:18px; border:none;
    background:var(--sunset); color:#fff;
    font-size:1.7em; display:flex; align-items:center; justify-content:center; box-shadow:var(--glow-coral);
  }

  /* Cart total + Checkout, floating above the nav. */
  .cart-checkout-bar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:28;
    width:calc(100% - 24px); max-width:536px; padding:14px 16px;
    box-shadow:var(--shadow-lift) !important; border-radius:20px !important;
  }

  /* Bottom nav: a white tab bar docked to the bottom on phones. */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    background:rgba(255,255,255,.94); -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px);
    border-top:1px solid var(--edge); padding:6px 10px calc(6px + env(safe-area-inset-bottom));
  }
  .bottomnav .bar{
    display:flex; justify-content:space-between; gap:4px; max-width:560px; margin:0 auto;
    background:none; border:none; box-shadow:none; border-radius:0; padding:0;
  }
  .navbtn{
    background:none; border:none; color:var(--ink-400); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-size:.74em; font-weight:700; padding:7px 4px; flex:1; border-radius:14px; position:relative;
    transition:background .2s ease, color .2s ease;
  }
  .navbtn .ic{position:relative; display:inline-flex; line-height:0; padding:4px 16px; border-radius:99px; transition:background .2s ease;}
  .navbtn.active{color:var(--lagoon-700); font-weight:800;}
  .navbtn.active .ic{background:var(--lagoon-50);}
  .navbtn:active{transform:scale(.95);}
  .nav-badge{
    position:absolute; top:-2px; right:6px; min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    background:var(--sunset); color:#fff; font-size:.66em; font-weight:800; line-height:18px; text-align:center;
    box-shadow:0 0 0 2px #fff;
  }

  /* Drawer / menu */
  .overlay{
    position:fixed; inset:0; background:rgba(13,43,51,.32); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:82%; max-width:330px; z-index:61;
    padding:calc(24px + env(safe-area-inset-top)) 14px 24px; transform:translateX(-105%); transition:transform .3s cubic-bezier(.2,.9,.3,1);
    display:flex; flex-direction:column; overflow-y:auto;
  }
  .drawer.glass{border-radius:0 24px 24px 0; background:var(--surface); border:none;}
  .drawer.show{transform:translateX(0); box-shadow:var(--shadow-lift);}
  .drawer .who{padding:4px 8px 18px; margin-bottom:8px; border-bottom:1px solid var(--edge);}
  .drawer .who .av{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg, var(--lagoon-500), var(--ocean)); color:#fff; display:flex;align-items:center;justify-content:center; font-family:var(--display); font-weight:800; font-size:1.2em; margin-bottom:10px;}
  .drawer-item{
    display:flex; align-items:center; gap:12px; padding:12px; border-radius:12px; color:var(--ink); background:none; border:none; width:100%; text-align:left; font-size:1em; font-weight:600;
  }
  .drawer-item:hover{background:var(--sand-2);}
  .drawer-item:active{background:var(--lagoon-50);}
  .drawer-item .ic{width:24px; text-align:center;}
  .drawer-spacer{flex:1;}

  /* Popups slide up from the bottom as white sheets. */
  .sheet-wrap{
    position:fixed; inset:0; z-index:70; display:flex; align-items:flex-end; justify-content:center; padding:0;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sheet-wrap.show{opacity:1; pointer-events:auto;}
  .sheet-wrap .backdrop{position:absolute; inset:0; background:rgba(13,43,51,.4);}
  .sheet{
    position:relative; width:100%; max-width:560px; max-height:92vh; overflow-y:auto;
    padding:10px 18px calc(28px + env(safe-area-inset-bottom)); transform:translateY(40px); opacity:0;
    transition:transform .32s cubic-bezier(.2,.9,.3,1), opacity .2s ease;
  }
  .sheet.glass{border-radius:26px 26px 0 0; background:var(--surface); border:none; box-shadow:0 -12px 40px rgba(13,43,51,.18);}
  .sheet-wrap.show .sheet{transform:translateY(0); opacity:1;}
  .sheet .handle{display:block; width:40px; height:5px; border-radius:99px; background:var(--edge-2); margin:0 auto 14px;}
  .sheet-close{position:absolute; right:14px; top:14px; width:36px; height:36px; border-radius:50%; border:none; background:var(--sand-2); color:var(--ink); font-size:1em; z-index:2;}
  .sheet-close:hover{background:var(--sand-3);}
  .sheet-close:active, .topbar .iconbtn:active{transform:scale(.9);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.88em; color:var(--ink); margin-bottom:6px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:10px 13px; border-radius:12px; border:1.5px solid var(--edge); background:var(--surface); min-height:42px;
    color:var(--ink); outline:none; transition:border-color .2s ease, box-shadow .2s ease;
  }
  .field select option{background:#fff; color:var(--ink);}
  .field input::placeholder, .field textarea::placeholder{color:var(--ink-400);}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--lagoon-500); box-shadow:0 0 0 4px rgba(15,163,163,.14);}
  select{background:var(--surface); color:var(--ink); border:1.5px solid var(--edge); border-radius:12px; padding:11px 12px;}
  /* Store categories: wrapping list of markable pills (multi-select). */
  .cat-check-list{display:flex; flex-wrap:wrap; gap:8px;}
  .cat-check-item{
    display:flex; align-items:center; gap:6px; padding:7px 12px; border-radius:99px;
    border:1.5px solid var(--edge); background:var(--surface); font-size:.86em; color:var(--ink); font-weight:600;
    cursor:pointer; user-select:none; white-space:nowrap; flex-wrap:nowrap;
    transition:background .15s ease, border-color .15s ease;
  }
  .field label.cat-check-item{display:flex; margin:0; font-size:.86em; font-weight:600; color:var(--ink);}
  .cat-check-item input{position:absolute; opacity:0; width:0; height:0; margin:0;}
  .cat-check-item.checked{background:var(--lagoon-50); border-color:var(--lagoon-500);}
  .cat-check-circle{
    width:16px; height:16px; border-radius:50%; border:1.5px solid var(--edge-2); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cat-check-circle svg{width:9px; height:9px; opacity:0; transition:opacity .12s ease;}
  .cat-check-item.checked .cat-check-circle{background:var(--lagoon-500); border-color:var(--lagoon-500);}
  .cat-check-item.checked .cat-check-circle svg{opacity:1;}
  /* Plain checkboxes: real input kept (invisible), mark follows :checked. */
  .chk-row{display:flex; align-items:flex-start; gap:10px; cursor:pointer;}
  .field label.chk-row{display:flex; margin-bottom:0; font-size:.94em; font-weight:600; color:var(--ink);}
  .chk-row input[type=checkbox]{position:absolute; opacity:0; width:0; height:0; margin:0;}
  .chk-row .chk-circle{
    width:22px; height:22px; border-radius:7px; border:1.5px solid var(--edge-2); color:#fff; background:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .12s ease;
  }
  .chk-row .chk-circle svg{width:12px; height:12px; opacity:0; transition:opacity .12s ease;}
  .chk-row input[type=checkbox]:checked ~ .chk-circle{background:var(--lagoon-500); border-color:var(--lagoon-500);}
  .chk-row input[type=checkbox]:checked ~ .chk-circle svg{opacity:1;}
  .chk-row input[type=checkbox]:focus-visible ~ .chk-circle{outline:2px solid var(--lagoon-500); outline-offset:3px;}
  .field.file{position:relative;}
  .field .filebtn{display:flex; align-items:center; justify-content:center; gap:8px; padding:24px; border:1.5px dashed var(--lagoon-500); border-radius:16px; color:var(--lagoon-700); font-weight:700; background:var(--lagoon-50);}
  .slip-preview-wrap{position:relative;}
  .slip-remove-btn{position:absolute; top:8px; right:8px; width:30px; height:30px; border-radius:50%; border:none; background:rgba(13,43,51,.75); color:#fff; font-size:.8em; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .slip-remove-btn:active{transform:scale(.9);}

  /* Toast: floats above the nav and any open sheet. */
  .toast-wrap{position:fixed; bottom:calc(88px + env(safe-area-inset-bottom)); left:0; right:0; z-index:80; display:flex; justify-content:center; pointer-events:none; transition:bottom .15s ease; padding:0 16px;}
  .toast{padding:12px 18px; border-radius:14px; font-weight:700; font-size:.92em; display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(80px) scale(.96); transition:transform .35s cubic-bezier(.2,1.3,.4,1), opacity .25s ease; max-width:100%; background:var(--ink-900); color:#fff; box-shadow:var(--shadow-lift);}
  .toast.show{opacity:1; transform:translateY(0) scale(1);}
  .toast.good{background:var(--lagoon-700);}
  .toast.bad{background:var(--red); color:#fff;}

  .status-pill{padding:4px 11px; border-radius:99px; font-size:.76em; font-weight:700; white-space:nowrap;}
  .status-pill.wait{background:#FFF1D6; color:var(--amber);}
  .status-pill.ok{background:#DDF4E8; color:var(--palm);}
  .status-pill.mid{background:var(--lagoon-50); color:var(--lagoon-700);}
  .status-pill.bad{background:#FDE3E4; color:var(--red);}

  .acct-box{padding:14px 16px; border-radius:16px; background:var(--sand-bg); border:1.5px dashed var(--edge-2); margin-top:10px;}
  .acct-box .lbl{font-size:.84em; color:var(--ink-dim); font-weight:600;}
  .acct-box .val{font-weight:800; font-size:1.08em; margin-top:2px; word-break:break-all; font-variant-numeric:tabular-nums;}
  .copy-num{cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; text-decoration-color:var(--lagoon-500);}
  .copy-num:active{opacity:.6;}
  .copy-ic{font-size:.85em; opacity:.7;}

  .empty{text-align:center; padding:48px 16px; color:var(--ink-dim);}
  .empty .ic{width:76px; height:76px; margin:0 auto 14px; border-radius:24px; background:var(--lagoon-50); display:flex; align-items:center; justify-content:center; font-size:2em;}

  .tabs{display:flex; gap:4px; margin-bottom:14px; overflow-x:auto; padding:4px; background:var(--sand-2); border-radius:14px; scrollbar-width:none; width:max-content; max-width:100%;}
  .tab{padding:8px 16px; border-radius:10px; border:none; background:none; color:var(--ink-dim); font-weight:700; font-size:.9em; white-space:nowrap; transition:background .2s ease, color .2s ease;}
  .tab.active{background:var(--surface); color:var(--lagoon-700); box-shadow:0 1px 3px rgba(13,43,51,.12);}
  .tab:active{transform:scale(.96);}

  /* Rental booking calendar (see bookCalendarHTML()). */
  .cal-wrap{background:var(--surface); border:1px solid var(--edge); border-radius:18px; padding:14px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-dow{margin-bottom:6px;}
  .cal-dow span{font-size:.78em; color:var(--ink-dim); font-weight:700;}
  .cal-day{aspect-ratio:1; border:none; border-radius:50%; background:var(--sand-bg); color:var(--ink); font-size:.9em; font-weight:600; cursor:pointer; font-variant-numeric:tabular-nums;}
  .cal-day:disabled{opacity:.35; cursor:not-allowed;}
  .cal-day.booked{text-decoration:line-through; color:var(--red); opacity:.8; background:#FDE3E4;}
  .cal-day.in-range{background:var(--lagoon-50); color:var(--lagoon-700); font-weight:800; border-radius:10px;}
  .cal-day.selected{background:var(--lagoon-500); color:#fff; font-weight:800; border-radius:50%;}
  .cal-warn-overlay{position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(13,43,51,.4);}
  .cal-warn-card{max-width:380px; width:100%; padding:22px; text-align:center; background:var(--surface) !important;}
  .cal-warn-card .ic{font-size:2em; display:block; margin-bottom:8px;}

  .slider-row{display:flex; align-items:center; gap:12px;}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:99px; background:var(--sand-3); outline:none;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:24px; height:24px; border-radius:50%; background:var(--lagoon-500); border:4px solid #fff; box-shadow:0 1px 4px rgba(13,43,51,.3); cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:var(--lagoon-500); border:4px solid #fff; box-shadow:0 1px 4px rgba(13,43,51,.3); cursor:pointer;}
  .fs-demo{font-size:1em; padding:14px; border-radius:14px; background:var(--sand-bg); border:1px solid var(--edge); text-align:center; margin-top:10px;}

  .hidden{display:none !important;}
  .divider{height:1px; background:var(--edge); margin:14px 0;}

  /* ---------- Customer home ---------- */
  /* The hero is a sunlit lagoon: turquoise water fading to ocean blue with a
     soft ripple. Menus in it may overflow (the switcher and notifications open
     past its edge); only the ripple is clipped. */
  .home-hero{
    position:relative; z-index:5; margin:0 -16px 22px; padding:0 16px 26px; color:#fff;
    background:
      radial-gradient(90% 70% at 100% 0%, rgba(255,255,255,.28), transparent 60%),
      linear-gradient(150deg, #19C3B4 0%, #0FA3A3 40%, #1E6FD9 100%);
    border-radius:0;
    padding-bottom:42px;
  }
  .home-hero::before{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:.35;
    background:
      radial-gradient(120% 60% at 50% 120%, rgba(255,255,255,.35), transparent 60%),
      repeating-radial-gradient(ellipse at 85% -20%, rgba(255,255,255,0) 0 22px, rgba(255,255,255,.22) 22px 23.5px);
    -webkit-mask:linear-gradient(180deg, #000, transparent 85%); mask:linear-gradient(180deg, #000, transparent 85%);
  }
  .home-hero > *{position:relative; z-index:1;}
  /* header (notifications menu) above the search row (switcher menu) above the headline */
  .home-hero > .home-header{z-index:4;}
  .home-hero > .row{z-index:3;}
  .hero-scene{height:118px; margin:-6px -4px 8px; pointer-events:none;}
  .hero-scene svg{width:100%; height:100%; display:block; overflow:visible;}
  .hero-dhoni{animation:dhoni 5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 100%;}
  @keyframes dhoni{ from{transform:translate(-10px,0) rotate(-2deg);} to{transform:translate(10px,-2px) rotate(2deg);} }
  .hero-shore{position:absolute; left:0; right:0; bottom:-1px; width:100%; height:26px; z-index:0 !important; pointer-events:none;}
  .hero-shore path{fill:var(--sand-bg);}
  .home-hero .hero-line{font-family:var(--display); font-size:1.9em; font-weight:800; line-height:1.05; letter-spacing:-.025em; margin:8px 0 18px; max-width:15ch; color:#fff;}
  .home-header{justify-content:space-between; padding-bottom:6px; margin-bottom:0; position:relative; top:auto; background:none !important; border:none !important;}
  .home-header .iconbtn{background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.35); color:#fff; box-shadow:none;}
  .mode-pill{display:inline-flex; align-items:center; gap:6px; height:42px; padding:0 14px; border-radius:999px; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.35); color:#fff; font-weight:800; font-size:.86em; white-space:nowrap; -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
  .mode-pill:active{transform:scale(.96);}
  @media (max-width:389px){ .mode-pill span{display:none;} .mode-pill{width:42px; padding:0; justify-content:center;} }
  .utext.strong{font-weight:800; color:var(--lagoon-700);}
  .home-header .brand{display:flex; align-items:center; gap:10px; min-width:0; flex:1;}
  .brand-mark{padding:0; cursor:pointer; color:inherit; width:42px; height:42px; border-radius:14px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35);}
  .brand-mark svg{width:34px; height:34px;}
  .brand-name{font-family:var(--display); font-weight:800; font-size:1.25em; letter-spacing:-.02em; line-height:1.05; color:#fff;}
  .brand-sub{font-size:.76em; font-weight:600; color:rgba(255,255,255,.82); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .avatar-btn .av-letter{font-family:var(--display); font-weight:800; font-size:1.05em;}
  .home-hero > .home-header{padding-top:calc(14px + env(safe-area-inset-top)); padding-bottom:10px;}
  .home-logo{flex:1; text-align:center; font-family:var(--display); font-weight:800; font-size:1.15em; letter-spacing:-.01em; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:transform .15s ease, opacity .15s ease;}
  .notif-dot{position:absolute; top:8px; right:9px; width:9px; height:9px; border-radius:50%; background:var(--sunset); box-shadow:0 0 0 2px #fff;}
  .notif-dropdown{
    position:absolute; top:calc(100% + 8px); right:0; width:320px; max-width:86vw; z-index:40; color:var(--ink);
    padding:8px; max-height:380px; overflow-y:auto; border-radius:18px; background:var(--surface) !important; box-shadow:var(--shadow-lift) !important;
  }
  .notif-dropdown-head{font-family:var(--display); font-weight:700; font-size:1em; padding:8px 10px 6px;}
  .notif-row{display:flex; align-items:flex-start; gap:10px; padding:10px; border-radius:12px; cursor:pointer;}
  .notif-row:hover{background:var(--sand-2);}
  .notif-row:active{background:var(--lagoon-50);}
  .notif-row.empty-row{cursor:default;}
  .notif-ic{font-size:1.05em; flex-shrink:0;}
  .notif-txt{font-size:.9em; line-height:1.4;}
  .notif-section-head{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    padding:8px 10px 4px; font-size:.84em; font-weight:700; color:var(--ink-dim); cursor:pointer;
  }
  .notif-section-head .chev{display:flex; transition:transform .18s ease;}
  .notif-section-head.open .chev{transform:rotate(180deg);}

  .home-search-wrap{
    flex:1; min-width:0; height:44px; display:flex; align-items:center; gap:8px; padding:0 6px 0 14px;
    border-radius:999px; background:rgba(255,255,255,.96); border:1px solid rgba(255,255,255,.7); color:var(--ink); box-shadow:0 4px 14px rgba(8,60,80,.14);
  }
  .home-search-wrap:focus-within{box-shadow:0 0 0 3px rgba(255,255,255,.5), 0 4px 14px rgba(8,60,80,.14);}
  .home-search-wrap .hs-ic{display:flex; color:var(--lagoon-700); flex-shrink:0;}
  .home-search-wrap .hs-ic svg{width:17px; height:17px;}
  .home-search-wrap input{flex:1; min-width:0; height:100%; border:none; background:transparent; padding:0; color:var(--ink); outline:none; font-size:.95em; -webkit-appearance:none; appearance:none;}
  .home-search-wrap input::-webkit-search-cancel-button{display:none;}
  .hs-clear{flex-shrink:0; width:28px; height:28px; border-radius:50%; border:none; background:var(--sand-2); color:var(--ink-dim); font-size:.75em; display:flex; align-items:center; justify-content:center;}
  .home-search-wrap input::placeholder{color:var(--ink-400);}
  .field-icon{flex-shrink:0; border:none; background:var(--sunset); color:#fff; width:40px; height:40px; border-radius:12px; padding:0; cursor:pointer; display:flex; align-items:center; justify-content:center;}

  .switcher-wrap{position:relative; flex-shrink:0;}
  .switcher-pill{
    display:flex; align-items:center; gap:6px; padding:12px 14px; border-radius:14px;
    background:var(--surface); border:1px solid var(--edge); color:var(--ink); font-weight:700; font-size:.88em; white-space:nowrap;
  }
  .switcher-pill.accent{background:rgba(255,255,255,.18); border-color:rgba(255,255,255,.45); color:#fff;}
  .search-row .switcher-pill.accent{height:44px; padding:0 12px; gap:5px; border-radius:999px; font-size:.8em;}
  .search-row .sw-ic{font-size:1.05em; line-height:1;}
  .home-mini{--p:0; position:fixed; top:0; left:0; right:0; z-index:60; display:flex; align-items:center; gap:calc(8px * var(--p)); padding:calc(8px + env(safe-area-inset-top)) 16px 8px;
    color:#fff; background:
      radial-gradient(60% 140% at 100% 0%, rgba(255,255,255,.22), transparent 60%),
      linear-gradient(100deg, #19C3B4 0%, #0FA3A3 45%, #1E6FD9 100%);
    box-shadow:0 4px 16px rgba(8,60,80,calc(.22 * var(--p)));
    visibility:hidden; pointer-events:none;}
  .home-mini.show{visibility:visible; pointer-events:auto;}
  /* With an admin header photo, the small header shows the same photo, lined up
     with the big header (updateHomeMiniHeader sets --mini-bg-size / --mini-bg-pos) */
  .home-mini.has-photo{background:linear-gradient(180deg, rgba(6,40,52,.28) 0%, rgba(6,40,52,.2) 100%), var(--hero-img) var(--mini-bg-pos, center 30%) / var(--mini-bg-size, cover) no-repeat;}
  .home-mini .mini-mark{flex-shrink:0; width:calc(40px * var(--p)); height:40px; opacity:var(--p); padding:0; overflow:hidden; border-radius:12px;}
  /* The app's name: big over the Home header, and it moves into the small header beside the search as you scroll */
  .hero-wordmark{position:relative; z-index:2; margin:2px 0 14px; font-family:'Gochi Hand', var(--display), cursive; font-weight:400; font-size:clamp(42px, 13.5vw, 64px); line-height:1; letter-spacing:.01em; -webkit-text-stroke:2px #fff; paint-order:stroke fill; color:#fff;
    text-shadow:0 2px 0 rgba(8,60,80,.35), 0 8px 24px rgba(6,40,52,.45); text-align:left;}
  .word-fly{display:none; position:fixed; left:0; top:0; z-index:61; pointer-events:none; transform-origin:0 0; will-change:transform;
    font-family:'Gochi Hand', var(--display), cursive; line-height:1; letter-spacing:.01em; color:#fff; white-space:nowrap;
    -webkit-text-stroke:2px #fff; paint-order:stroke fill; text-shadow:0 2px 0 rgba(8,60,80,.35), 0 8px 24px rgba(6,40,52,.45);}
  @media (min-width:1024px){ .word-fly{display:none !important;} }
  /* Over an uploaded header photo the name is frosted glass: see-through letters
     with a bright edge and a soft top-to-bottom sheen, so any photo shows through. */
  .home-hero.has-photo .hero-wordmark, .glass-word{color:transparent !important; text-shadow:none !important;
    background-image:linear-gradient(180deg, rgba(255,255,255,.82) 0%, rgba(255,255,255,.48) 48%, rgba(255,255,255,.30) 100%);
    -webkit-background-clip:text; background-clip:text; paint-order:fill stroke;
    filter:drop-shadow(0 2px 1px rgba(6,40,52,.25)) drop-shadow(0 8px 18px rgba(6,40,52,.35));}
  .home-hero.has-photo .hero-wordmark, .word-fly.glass-word{-webkit-text-stroke:1.6px rgba(255,255,255,.92);}

  .home-mini .mini-word{width:auto; max-width:calc(132px * var(--p)); height:40px; display:flex; align-items:center; border:none; background:none; color:#fff; border-radius:0;
    font-family:'Gochi Hand', var(--display), cursive; font-size:25px; -webkit-text-stroke:.8px #fff; line-height:1; white-space:nowrap; text-shadow:0 2px 8px rgba(6,40,52,.45); padding:0 2px 0 0;}
  /* the small header has less room: its Categories pill shows just the icon (the label is in aria-label) */
  .home-mini .cat-open-btn{padding:0 10px; max-width:none;}
  .home-mini .cat-open-btn .cob-txt, .search-row.making-room .cat-open-btn .cob-txt{display:none;}
  .search-row.making-room .cat-open-btn{padding:0 10px; max-width:none;}
  .home-mini .mini-word.glass-word{color:transparent; -webkit-text-stroke:.9px rgba(255,255,255,.95); background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.55)); -webkit-background-clip:text; background-clip:text;}
  @media (max-width:359px){ .home-mini .mini-word{font-size:21px; max-width:calc(108px * var(--p));} }
  .home-mini .mini-mark svg{width:26px; height:26px; flex-shrink:0;}
  .home-mini .search-row{flex:1; min-width:0;}
  @media (min-width:1024px){ .home-mini{display:none;} }
  .switcher-pill:active{transform:scale(.96);}
  .switcher-caret{font-size:.85em; opacity:.85; transition:transform .15s ease; display:inline-block;}
  .switcher-dropdown{position:absolute; top:calc(100% + 8px); right:0; z-index:40; width:max-content; min-width:100%; display:flex; flex-direction:column; gap:2px; padding:6px; border-radius:16px; background:var(--surface) !important; box-shadow:var(--shadow-lift) !important;}
  .switcher-dropdown .switcher-pill{width:100%; background:none; border-color:transparent; color:var(--ink);}
  .switcher-dropdown .switcher-pill:hover{background:var(--sand-2);}

  .cat-scroll{display:flex; gap:10px; overflow-x:auto; padding:2px 2px 8px; scrollbar-width:none;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-pill{display:flex; flex-direction:column; align-items:center; gap:7px; background:none; border:none; flex-shrink:0; width:70px; padding:0;}
  .cat-circle{width:62px; height:62px; border-radius:20px; border:1px solid var(--edge); display:flex; align-items:center; justify-content:center; font-size:1.55em; background:var(--surface); color:var(--ink); box-shadow:var(--shadow); transition:background .2s ease, border-color .2s ease, transform .2s ease;}
  .cat-label{font-size:.78em; color:var(--ink-dim); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:70px;}
  .cat-pill.active .cat-circle{border-color:var(--lagoon-500); background:var(--lagoon-50); transform:translateY(-2px);}
  .cat-pill.active .cat-label{color:var(--lagoon-700); font-weight:800;}
  .cat-pill:active{transform:scale(.94);}

  .rail{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 2px 10px; margin:0 -2px; scrollbar-width:none; -webkit-overflow-scrolling:touch;}
  .rail::-webkit-scrollbar{display:none;}
  .rail .top-card{flex:0 0 44%; max-width:220px; scroll-snap-align:start;}
  .rail-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px;}
  .featured-scroll{display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory; padding:4px 2px 10px; scrollbar-width:none;}
  .featured-scroll::-webkit-scrollbar{display:none;}
  .featured-card{
    flex:0 0 82%; scroll-snap-align:start; border-radius:24px; min-height:180px; padding:20px;
    display:flex; align-items:flex-end; position:relative; overflow:hidden; color:#fff;
  }
  .featured-scrim{position:absolute; inset:0; background:linear-gradient(to top, rgba(13,43,51,.75), transparent 65%);}
  .featured-card > div{position:relative; z-index:1;}
  .featured-card .biz{font-size:.82em; opacity:.92; font-weight:700;}
  .featured-card h3{font-size:1.3em; margin:.2em 0; color:#fff;}
  .featured-card .price{color:#fff;}
  .dots{display:flex; justify-content:center; gap:6px; margin-top:8px;}
  .dot{width:6px; height:6px; border-radius:50%; background:var(--edge-2); transition:all .25s ease;}
  .dot.active{width:22px; border-radius:99px; background:var(--lagoon-500);}

  /* Item grids */
  .top-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (min-width:440px){ .top-grid{grid-template-columns:1fr 1fr 1fr;} }
  .store-grid-expanded .top-grid{grid-template-columns:1fr 1fr;}
  .top-card{border-radius:0; overflow:visible; background:none; border:none; box-shadow:none; cursor:pointer; min-width:0; padding:0;}
  .top-card .img-wrap{transition:transform .25s cubic-bezier(.2,.9,.3,1), box-shadow .25s ease;}
  .top-card:hover .img-wrap{transform:translateY(-3px); box-shadow:0 14px 30px rgba(13,43,51,.12);}
  .top-card:active{transform:scale(.98);}
  /* Glyph sized on the art only, so badges/buttons in the tile keep text size. */
  .top-card .img-wrap{
    position:relative; aspect-ratio:1/1; max-width:100%; display:flex; align-items:center; justify-content:center; font-size:1em;
    background:var(--lagoon-50); border-radius:22px; overflow:hidden; box-shadow:inset 0 0 0 1px rgba(13,43,51,.04);
  }
  .top-card .img-wrap > div:first-child{font-size:2.6em;}
  .top-card .img-wrap img{width:100%; height:100%; object-fit:cover; object-position:50% 35%; background:#fff;   /* photos fill the square card (tall photos lose a little top and bottom) */}
  .item-detail-hero{
    position:relative; width:260px; max-width:100%; height:260px; margin:0 auto 16px; border-radius:28px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; font-size:4em;
    background:var(--lagoon-50);
  }
  .item-detail-hero img{width:100%; height:100%; object-fit:contain; background:#fff;}
  .top-add-btn{
    position:absolute; right:8px; bottom:8px; width:34px; height:34px; border-radius:11px; border:none;
    background:var(--sunset); color:#fff; font-size:1.2em; font-weight:800;
    display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(255,106,77,.4);
  }
  .top-add-btn:active{transform:scale(.88);}
  .fav-btn{
    position:absolute; left:8px; top:8px; width:32px; height:32px; border-radius:50%; border:none;
    background:rgba(255,255,255,.92); color:var(--ink); font-size:.85em; box-shadow:0 1px 4px rgba(13,43,51,.15);
    display:flex; align-items:center; justify-content:center;
  }
  .fav-btn.on{color:var(--sunset);}
  .fav-btn:active{transform:scale(.88);}
  /* Store rating on a card shows on pointer hover only (the item sheet always shows it). */
  .rating-badge{
    position:absolute; top:8px; right:8px; padding:3px 8px; border-radius:99px;
    background:rgba(255,255,255,.95); color:var(--amber); font-size:.74em; font-weight:800; box-shadow:0 1px 4px rgba(13,43,51,.15);
    display:flex; align-items:center; gap:2px;
    opacity:0; transition:opacity .15s ease; pointer-events:none;
  }
  .top-card:hover .rating-badge{opacity:1;}
  .auction-time-badge{
    position:absolute; bottom:8px; left:8px; padding:3px 9px; border-radius:99px;
    background:var(--ink-900); color:#fff; font-size:.74em; font-weight:800; font-variant-numeric:tabular-nums;
  }
  .rating-badge-static{
    display:inline-flex; align-items:center; gap:4px; padding:4px 10px; border-radius:99px;
    background:#FFF1D6; color:var(--amber); font-size:.84em; font-weight:800;
  }
  .oos-stamp{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-8deg);
    border-radius:8px; padding:4px 12px; white-space:nowrap;
    color:#fff; background:var(--red); font-weight:800; font-size:.76em;
  }
  .top-card .info{padding:10px 4px 2px;}
  .biz-label{font-size:.8em; color:var(--ink-dim); font-weight:600;}
  .top-card h3{font-size:.95em; font-weight:650; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:0 0 .2em;}
  .top-card .price{font-size:1.02em; letter-spacing:-.01em;}
  .discount-badge{font-size:.74em; font-weight:800; color:#fff; background:var(--palm); padding:2px 7px; border-radius:6px; white-space:nowrap; flex-shrink:0;}
  .featured-scroll .top-card{flex:0 0 44%; scroll-snap-align:start;}

  /* Customer nav: same bar. */
  .bottomnav.compact .bar{overflow-x:auto; scrollbar-width:none;}
  .nav-brand{display:none;}
  .bottomnav.compact .navbtn .ic:has(.nav-badge){margin-right:0;}

  /* ---------- Sign-up screen ---------- */
  .field-icon-input{position:relative;}
  .field-icon-input input{padding-left:44px; padding-right:44px;}
  .field-icon-input .fi-icon{position:absolute; left:16px; top:50%; transform:translateY(-50%); font-size:1em; opacity:.7; pointer-events:none;}
  .field-icon-input .fi-eye{
    position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none;
    color:var(--ink-dim); font-size:1.05em; padding:6px; cursor:pointer;
  }
  .role-tiles{display:flex; gap:8px; margin-bottom:14px;}
  .role-tile{
    flex:1; padding:16px 8px; border-radius:16px; border:1.5px solid var(--edge); background:var(--surface);
    color:var(--ink-dim); font-weight:700; font-size:.88em; display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .role-tile .ic{font-size:1.4em;}
  .role-tile.active{background:var(--lagoon-50); color:var(--lagoon-700); border-color:var(--lagoon-500);}
  .role-tile:active{transform:scale(.96);}
  .policy-box{display:flex; gap:10px; align-items:flex-start; padding:14px; border-radius:16px; background:var(--sand-bg); border:1px solid var(--edge); margin:14px 0; cursor:pointer;}
  .policy-box .txt{font-size:.88em; color:var(--ink-dim); line-height:1.55;}
  .policy-box .txt button.link-inline{color:var(--link); text-decoration:underline; font-weight:700; background:none; border:none; padding:0; font-size:1em; cursor:pointer;}
  .policy-content .draft-note{padding:12px 14px; border-radius:14px; background:#FFF1D6; font-size:.86em; color:var(--amber); margin-bottom:16px;}
  .policy-content h3{margin-top:18px; margin-bottom:6px; font-size:1.05em;}
  .policy-content h3:first-of-type{margin-top:0;}
  .policy-content p{margin-bottom:10px; font-size:.95em; color:var(--ink-dim); line-height:1.6; max-width:65ch;}
  .policy-content ul{margin:0 0 10px; padding-left:20px;}
  .policy-content li{margin-bottom:7px; font-size:.95em; color:var(--ink-dim); line-height:1.55;}
  .policy-content strong{color:var(--ink);}

  /* Delivery zone as a route from Malé outward (see zoneRouteHTML()). */
  .zone-route{position:relative; display:flex; flex-direction:column; gap:4px; background:var(--sand-bg); border:1px solid var(--edge); border-radius:18px; padding:6px;}
  .zone-route::before{content:""; position:absolute; left:30px; top:30px; bottom:30px; width:2px;
    background:repeating-linear-gradient(var(--lagoon-500) 0 6px, transparent 6px 11px); border-radius:2px;}
  .zone-stop{display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px 12px 12px; border:1.5px solid transparent;
    background:none; text-align:left; border-radius:14px; position:relative; color:var(--ink); transition:background .2s ease, border-color .2s ease;}
  .zone-stop .pin{width:26px; height:26px; border-radius:50%; background:#fff; border:3px solid var(--lagoon-500);
    flex-shrink:0; position:relative; z-index:1; transition:transform .3s cubic-bezier(.3,1.6,.5,1), background .2s ease, border-color .2s ease;}
  .zone-stop .where{flex:1; min-width:0; font-weight:700;}
  .zone-stop .fare{font-weight:800; font-size:1.05em; font-variant-numeric:tabular-nums;}
  .zone-stop[aria-checked="true"]{background:var(--surface); border-color:var(--lagoon-500); box-shadow:var(--shadow);}
  .zone-stop[aria-checked="true"] .pin{background:var(--sunset); border-color:#fff; box-shadow:0 0 0 2px var(--sunset); transform:scale(1.1);}
  .zone-stop[aria-checked="true"] .fare{color:var(--sunset-dk);}

  /* Swipe payment note at checkout, and the two notice tints */
  .swipe-note{display:flex; gap:12px; align-items:flex-start; margin-top:12px; padding:14px; border-radius:16px; background:var(--sand-bg); border:1px solid var(--edge);}
  .swipe-note strong{display:block;}
  .swipe-note p{font-size:.86em; color:var(--ink-dim); margin-top:2px;}
  .swipe-badge{width:40px; height:40px; border-radius:12px; background:linear-gradient(135deg, var(--lagoon-500), var(--ocean)); color:#fff; font-family:var(--display); font-weight:800; font-size:1.1em; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  .notice-warn{background:#FFF6E3 !important; border:1px solid #F5D9A0 !important; box-shadow:none !important; color:var(--ink);}
  .notice-info{background:var(--lagoon-50) !important; border:1px solid #B5E5E0 !important; box-shadow:none !important; color:var(--ink);}
  .fee-card .row{padding:3px 0; font-size:.9em; gap:16px;}
  .fee-card .row span:last-child, .fee-card .row strong:last-child{white-space:nowrap; font-variant-numeric:tabular-nums;}

  /* Payment choice highlight, Swipe mark, contact buttons */
  .pay-option.selected{border-color:var(--lagoon-500); background:var(--lagoon-50);}
  .swipe-ic{background:linear-gradient(135deg, var(--lagoon-500), var(--ocean)) !important; color:#fff; font-family:var(--display); font-weight:800;}
  .contact-row{display:flex; flex-direction:column; gap:8px; margin-bottom:12px; padding:12px 14px; border-radius:16px; background:var(--sand-bg); border:1px solid var(--edge);}
  .contact-row .muted{font-size:.86em;}
  .contact-row a{color:var(--ink); font-weight:700;}
  .contact-btns{display:flex; gap:8px; flex-wrap:wrap;}
  .contact-btn{flex:1; min-width:84px; text-align:center; padding:9px 12px; border-radius:12px; background:var(--surface); border:1px solid var(--edge); color:var(--ink) !important; font-weight:700; font-size:.86em; text-decoration:none;}
  .contact-btn:hover{border-color:var(--lagoon-500);}
  .contact-btn:active{transform:scale(.96);}

  .route-note{font-size:.84em; color:var(--lagoon-700); font-weight:600; margin:0 0 6px;}
  .verify-steps{margin:12px 0 16px; padding-left:20px; color:var(--ink-dim); line-height:1.6;}
  .verify-steps li{margin-bottom:6px;}
  .verify-steps strong{color:var(--ink);}

  /* Rider online switch */
  .switch{position:relative; width:52px; height:30px; border-radius:999px; border:none; background:var(--sand-3); flex-shrink:0; padding:0; transition:background .2s ease;}
  .switch span{position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(13,43,51,.25); transition:transform .2s ease;}
  .switch.on{background:var(--palm);}
  .switch.on span{transform:translateX(22px);}
  .rider-status.is-online{border-color:var(--palm); background:#F1FBF6;}

  /* ---------- Admin (Super Admin console) ----------
     Same look as the shop: white top bar with the logo, a lagoon overview
     banner with the numbers, sections as a side menu on PC (chips on
     phones) and white cards for each store / request. */
  .admin{min-height:100vh; padding-bottom:48px;}
  .admin-top{position:sticky; top:0; z-index:30; background:rgba(255,255,255,.95); -webkit-backdrop-filter:saturate(180%) blur(14px); backdrop-filter:saturate(180%) blur(14px); border-bottom:1px solid var(--edge); margin:0 calc(50% - 50vw);}
  .admin-top-in{max-width:1280px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:calc(10px + env(safe-area-inset-top)) 16px 10px;}
  .admin-logo{display:flex; align-items:center; gap:10px; background:none; border:none; padding:0; min-width:0;}
  .admin-logo .site-logo-mark, .admin-land-mark{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #19C3B4, var(--ocean)); flex-shrink:0;}
  .admin-logo .site-logo-mark svg, .admin-land-mark svg{width:32px; height:32px;}
  .admin-land-mark{width:56px; height:56px; border-radius:16px; margin-bottom:18px;}
  .admin-land-mark svg{width:46px; height:46px;}
  .admin-logo-txt{display:flex; flex-direction:column; align-items:flex-start; line-height:1.1;}
  .admin-logo .site-logo-word{font-family:var(--display); font-weight:800; font-size:1.2em; letter-spacing:-.03em; color:var(--ink);}
  .admin-badge{font-size:.72em; font-weight:800; color:var(--lagoon-700); background:var(--lagoon-50); padding:2px 8px; border-radius:99px; margin-top:3px;}
  .admin-top-r{display:flex; align-items:center; gap:10px; min-width:0;}
  .admin-who{display:flex; align-items:center; gap:8px; min-width:0; color:var(--ink-dim); font-size:.88em;}
  .admin-who .site-av{width:30px; height:30px; border-radius:10px; background:linear-gradient(135deg, var(--lagoon-500), var(--ocean)); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; flex-shrink:0;}
  .admin-who-mail{display:none; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px;}
  .admin-layout{padding:0 16px;}
  .admin-side{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding:14px 0 4px; margin:0 -16px; padding-left:16px; padding-right:16px;}
  .admin-nav{display:flex; align-items:center; gap:8px; flex-shrink:0; padding:9px 14px; border-radius:12px; border:1px solid var(--edge); background:var(--surface); color:var(--ink); font-weight:700; font-size:.9em; white-space:nowrap;}
  .admin-nav:hover{background:var(--sand-2);}
  .admin-nav.on{background:var(--lagoon-50); border-color:var(--lagoon-500); color:var(--lagoon-700);}
  .an-ic{font-size:1.05em;}
  .admin-hero{position:relative; overflow:hidden; margin:14px 0 22px; padding:22px 18px 20px; border-radius:24px; color:#fff;
    background:radial-gradient(90% 70% at 100% 0%, rgba(255,255,255,.25), transparent 60%), linear-gradient(150deg, #19C3B4 0%, #0FA3A3 40%, #1E6FD9 100%);}
  .admin-hero::after{content:""; position:absolute; right:-40px; bottom:-60px; width:220px; height:220px; border-radius:50%; pointer-events:none; opacity:.35;
    background:repeating-radial-gradient(circle, rgba(255,255,255,0) 0 16px, rgba(255,255,255,.35) 16px 17.5px);}
  .admin-hero > *{position:relative; z-index:1;}
  .admin-hero h1{color:#fff; font-size:1.8em;}
  .admin-sub{color:rgba(255,255,255,.9); margin-top:4px; font-size:.95em;}
  .admin-stats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px;}
  .admin-stat{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; padding:14px; border-radius:16px; border:1px solid rgba(255,255,255,.28); background:rgba(255,255,255,.16); color:#fff; transition:background .2s ease;}
  .admin-stat:hover{background:rgba(255,255,255,.24);}
  .admin-stat strong{font-family:var(--display); font-size:1.6em; font-weight:800; line-height:1.1; font-variant-numeric:tabular-nums;}
  .admin-stat span{font-size:.84em; color:rgba(255,255,255,.92); font-weight:600;}
  .admin-stat.needs{background:#fff; border-color:#fff; color:var(--sunset-dk);}
  .admin-stat.needs span{color:var(--ink);}
  .admin-panel-h{font-size:1.35em; margin-bottom:14px;}
  .admin-grid{display:grid; grid-template-columns:1fr; gap:12px;}
  .admin-grid > .glass.card{margin-bottom:0 !important;}
  .admin-grid > .field, .admin-grid > .empty{grid-column:1/-1; margin-bottom:0 !important;}
  .tab-count{display:inline-flex; min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--sunset); color:#fff; font-size:.78em; align-items:center; justify-content:center; margin-left:auto;}
  .admin-store{margin-bottom:12px; cursor:pointer;}
  .admin-store .adm-chev{align-self:center; margin-left:8px;}
  .adm-back{display:inline-block; margin:0 0 10px; grid-column:1/-1;}
  .adm-store-card, .adm-tools, .adm-cat{grid-column:1/-1; min-width:0;}
  .adm-counts{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin-top:12px;}
  .adm-counts div{display:flex; flex-direction:column; align-items:center; padding:8px 2px; border-radius:12px; background:var(--sand-bg);}
  .adm-counts strong{font-family:var(--display); font-size:1.15em;}
  .adm-counts span{font-size:.7em; color:var(--ink-600); text-align:center;}
  .adm-filters{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px;}
  .adm-filters .chip{flex-shrink:0; padding:7px 12px; border-radius:99px; border:1px solid var(--edge); background:var(--surface); color:var(--ink); font-weight:700; font-size:.84em;}
  .adm-filters .chip.active{background:var(--lagoon-50); border-color:var(--lagoon-500); color:var(--lagoon-700);}
  .adm-cat{margin-top:18px;}
  .adm-cat-head{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .adm-cat-head h3{font-family:var(--display);}
  .adm-cat-list{display:grid; gap:10px;}
  @media (min-width:768px){ .adm-cat-list{grid-template-columns:repeat(2,minmax(0,1fr));} }
  .adm-row{padding:12px; border-radius:16px; background:var(--surface); border:1px solid var(--edge); min-width:0;}
  .adm-row-main{display:flex; gap:12px; align-items:flex-start; width:100%; padding:0; border:none; background:none; text-align:left; color:var(--ink); font-size:1em;}
  .adm-row-main .adm-name{white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}
  .adm-row-pill{margin-top:8px;}
  .adm-note{font-size:.8em; margin-top:6px;}
  .adm-row-acts{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
  .adm-row-acts .btn{flex:1 1 auto;}
  .admin-av{width:44px; height:44px; border-radius:14px; background:var(--lagoon-50); color:var(--lagoon-700); font-family:var(--display); font-weight:800; font-size:1em; display:flex; align-items:center; justify-content:center; flex-shrink:0;}
  @media (min-width:1024px){
    .admin-top-in{max-width:1280px; padding:14px 40px;}
    .admin-who-mail{display:inline;}
    .admin-layout{max-width:1200px; margin:0 auto; padding:28px 0 0; display:grid; grid-template-columns:240px minmax(0,1fr); gap:32px; align-items:start;}
    .admin-side{position:sticky; top:96px; flex-direction:column; gap:4px; overflow:visible; margin:0; padding:12px; background:var(--surface); border:1px solid var(--edge); border-radius:20px; box-shadow:var(--shadow);}
    .admin-nav{border:none; padding:12px 14px; font-size:.96em; width:100%;}
    .admin-hero{margin:0 0 30px; padding:34px 36px 30px; border-radius:28px;}
    .admin-hero h1{font-size:2.4em;}
    .admin-stats{grid-template-columns:repeat(4, minmax(0,1fr)); gap:14px;}
    .admin-stats > .admin-stat:last-child{grid-column:span 1;}
    .admin-grid{grid-template-columns:repeat(2, minmax(0,1fr)); gap:16px;}
    .admin #app, .admin-main{min-width:0;}
  }
  @media (min-width:1440px){ .admin-grid{grid-template-columns:repeat(3, minmax(0,1fr));} }

  /* Shown when the Supabase library couldn't be downloaded (see sb setup). */
  .offline-banner{position:relative; z-index:2; margin:10px 16px 0; padding:12px 14px; border-radius:14px; background:#FFF1D6; color:var(--amber); font-size:.88em; font-weight:600;}

  /* ---------- Desktop web app (PC) ----------
     Phones keep the single column with the tab bar docked at the bottom. On a
     computer the app becomes a website: a sticky white top navigation bar
     (logo left, sections right), a wide centred content column with product
     grids that fill the width, and popups as centred dialogs. */
  @media (min-width:1024px){
    #app{max-width:1280px; padding:0 40px 56px;}
    #app:has(.bottomnav){padding-top:76px;}
    .bottomnav{top:0; bottom:auto; height:68px; padding:0 40px; border-top:none; border-bottom:1px solid var(--edge); display:flex; align-items:center;}
    .bottomnav .bar, .bottomnav.compact .bar{max-width:1200px; width:100%; justify-content:flex-end; align-items:center; gap:6px; overflow:visible;}
    .nav-brand{display:flex !important; align-items:center; gap:10px; margin-right:auto; background:none; border:none; padding:0;}
    .nav-brand .site-logo-mark{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, #19C3B4, var(--ocean));}
    .nav-brand .site-logo-mark svg{width:32px; height:32px;}
    .nav-brand .site-logo-word{font-family:var(--display); font-weight:800; font-size:1.45em; letter-spacing:-.03em; color:var(--ink);}
    .navbtn{flex:none; flex-direction:row; gap:8px; padding:10px 16px; font-size:.95em; border-radius:12px; color:var(--ink-dim);}
    .navbtn .ic{padding:0; background:none !important;}
    .navbtn:hover{background:var(--sand-2); color:var(--ink);}
    .navbtn.active{background:var(--lagoon-50); color:var(--lagoon-700);}
    .nav-badge{top:-8px; right:-10px;}

    .topbar{top:68px; margin:0 -40px 18px; padding:18px 40px 16px;}
    .topbar .titles h1{font-size:1.6em;}
    .home-hero > .home-header{position:absolute; top:24px; right:32px; left:auto; margin:0; padding:0;}
    .home-header .brand{display:none;}
    .home-hero{margin:16px 0 30px; padding:40px 48px 56px; border-radius:32px 32px 0 0; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,520px); gap:32px; align-items:center;}
    .home-hero > .hero-scene{grid-column:2; grid-row:1; height:220px; margin:0;}
    .home-hero > .row{grid-column:1; grid-row:1;}
    .hero-shore{height:40px;}
    .home-hero .hero-line{font-size:3.2em; max-width:18ch; margin:0 0 26px;}
    .home-hero > .row{max-width:760px;}
    .section{margin-bottom:40px;}
    h2{font-size:1.45em;}

    .top-grid, .store-grid-expanded .top-grid{grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:20px;}
    .featured-scroll .top-card{flex:0 0 240px;}
    .top-card .img-wrap > div:first-child{font-size:3.8em;}
    .top-card h3{font-size:1em;}
    .featured-card{flex:0 0 46%; min-height:260px;}
    .cat-scroll{display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:18px 12px; overflow:visible; margin:0 !important; padding:2px 0 8px !important;}
    .cat-pill{justify-self:center;}
    .cat-pill{width:84px;}
    .cat-circle{width:76px; height:76px; border-radius:24px; font-size:1.8em;}
    .cat-label{max-width:84px;}
    .item-card:hover, .role-card:hover{box-shadow:var(--shadow-lift);}

    /* popups: centred dialogs instead of bottom sheets */
    .sheet-wrap{align-items:center; padding:32px;}
    .sheet{max-width:620px; max-height:88vh; padding:18px 30px 30px; transform:translateY(16px) scale(.98);}
    .sheet.glass{border-radius:24px; box-shadow:0 30px 80px rgba(13,43,51,.28);}
    .sheet-wrap.show .sheet{transform:none;}
    .sheet .handle{display:none;}

  /* Upload a list of items */

  /* ---------- Item page ---------- */

  .ip-back{font-size:1.6em; line-height:1; width:40px; height:40px; border-radius:12px; border:1px solid var(--edge); background:var(--surface); color:var(--ink); display:flex; align-items:center; justify-content:center; flex-shrink:0;}

  .ip-type{font-size:.76em; font-weight:800; color:var(--lagoon-700); background:var(--lagoon-50); padding:3px 9px; border-radius:99px;}
  .ip-name{font-size:1.6em; line-height:1.15; margin:10px 0 10px; letter-spacing:-.02em;}

  .ip-was{color:var(--ink-dim); text-decoration:line-through;}
  .ip-stock{margin:10px 0 14px;}

  .unpaid-block{background:#FFF1EC; border:1px solid #F7C9B3; border-radius:18px; padding:16px;}

  .unpaid-block p{font-size:.88em; margin-top:4px; color:var(--ink-600);}
  .unpaid-note{font-size:.85em; font-weight:700; color:var(--sunset-dk); margin:4px 0 6px;}
  .adm-group .adm-item{flex-wrap:wrap;}
  .adm-group .adm-name{white-space:normal; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;}

  .adm-group .adm-acts .btn{flex:0 1 140px;}

  .adm-store-av{width:44px; height:44px; flex-shrink:0; border-radius:14px; display:flex; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:1.15em; color:#fff; background:linear-gradient(135deg, var(--lagoon-500), var(--ocean));}
  .adm-store-count{min-width:30px; height:26px; padding:0 9px; border-radius:99px; background:var(--sunset); color:#fff; font-weight:800; font-size:.86em; line-height:26px; text-align:center;}
  .adm-chev{font-size:1.4em; color:var(--ink-400); transition:transform .2s ease;}

  .cap-bar{height:10px; border-radius:99px; background:var(--sand-3); overflow:hidden; margin-top:10px;}
  .cap-bar span{display:block; height:100%; background:linear-gradient(90deg, var(--lagoon-500), var(--ocean)); border-radius:99px;}
  /* Featured: larger cards on a gold and light-blue panel */
  .feat-panel{position:relative; margin-left:-6px; margin-right:-6px; padding:18px 14px 14px; border-radius:26px;
    background:radial-gradient(120% 90% at 0% 0%, #FFE8A3 0%, rgba(255,232,163,0) 55%), radial-gradient(120% 100% at 100% 100%, #CDEBFF 0%, rgba(205,235,255,0) 60%), linear-gradient(135deg, #FFF4D1 0%, #EAF6FF 100%);
    border:1px solid #F1D58A; box-shadow:0 10px 30px rgba(200,150,30,.12);}

  .feat-panel .feat-grid{display:grid; grid-auto-flow:column; grid-template-rows:auto; grid-auto-columns:calc((100% - 3*8px) / 4); gap:8px; padding:4px 2px 8px;}
