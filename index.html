// Units sold THROUGH THE APP per item (item_sales(): delivered orders paid by
// Swipe, or by a bank transfer whose slip was uploaded and confirmed in the
// app). Sales arranged outside the app don't count.
DB.sales = DB.sales || {};
async function loadItemSales(){
  if(!sb) return;
  try{ const { data, error } = await sb.rpc('item_sales'); if(!error) DB.sales = Object.fromEntries((data||[]).map(r=>[r.item_id, Number(r.units)||0])); }catch(e){}
}
function unitsSold(itemId){ return (DB.sales||{})[itemId] || 0; }
function soldLabelHTML(item){ const n = unitsSold(item.id); return n ? `<span class="sold-tag">🔥 ${n} sold</span>` : ''; }
// Most sold first; items with no app sales keep their usual order after them.
function sortByAppSales(list){ return list.map((it,i)=>[it,i]).sort((a,b)=>(unitsSold(b[0].id)-unitsSold(a[0].id)) || (a[1]-b[1])).map(x=>x[0]); }

/* =================== REVIEWS =================== */
// Customer reviews with 1-5 stars (item_reviews). Anyone can read; only a
// customer with a delivered order containing the item can write one (the
// item_review_guard trigger checks), one per item, editable.
let _reviews = {};   // itemId -> { list:[], loaded:bool, loading:bool }
function revRow(r){ return { id:r.id, itemId:r.item_id, userId:r.user_id, name:r.reviewer_name||'Customer', rating:Number(r.rating), comment:r.comment||'', createdAt:new Date(r.created_at).getTime(), updatedAt:new Date(r.updated_at||r.created_at).getTime() }; }
async function loadItemReviews(itemId, force){
  const c = _reviews[itemId] || (_reviews[itemId] = { list:[], loaded:false, loading:false });
  if(c.loading || (c.loaded && !force)) return;
  if(!sb){ c.loaded = true; return; }
  c.loading = true;
  try{
    const { data, error } = await sb.from('item_reviews').select('*').eq('item_id', itemId).order('created_at', { ascending:false }).limit(100);
    if(!error) c.list = (data||[]).map(revRow);
    c.loaded = true;
  } finally { c.loading = false; }
  if(state.screen==='custItem' && state.viewItemId===itemId && !state.sheet) render();
}
function reviewStats(itemId){
  const list = (_reviews[itemId]||{}).list || [];
  const n = list.length, avg = n ? list.reduce((a,r)=>a+r.rating,0)/n : 0;
  const dist = [5,4,3,2,1].map(k=>({ k, c:list.filter(r=>r.rating===k).length }));
  return { n, avg, dist, list };
}
function starsHTML(v, size){
  const full = Math.round(v*2)/2;
  return `<span class="stars" style="${size?`font-size:${size};`:''}" aria-label="${v.toFixed(1)} out of 5 stars">${[1,2,3,4,5].map(i=>`<span class="${i<=full?'on':(i-0.5===full?'half':'')}">★</span>`).join('')}</span>`;
}
function canReviewItem(item){
  if(!state.authed) return false;
  return DB.orders.some(o=>o.customerId===state.customerId && o.status==='delivered' && (o.items||[]).some(l=>l.itemId===item.id));
}
function myReviewFor(itemId){ return ((_reviews[itemId]||{}).list||[]).find(r=>r.userId===state.customerId); }
function reviewSummaryChipHTML(item){
  const c = _reviews[item.id]; if(!c || !c.loaded){ loadItemReviews(item.id); return ''; }
  const st = reviewStats(item.id); if(!st.n) return '';
  return `<button class="rev-chip" onclick="document.getElementById('ipReviews').scrollIntoView({behavior:'smooth', block:'start'})">${starsHTML(st.avg)} <strong>${st.avg.toFixed(1)}</strong> <span class="muted">(${st.n} review${st.n===1?'':'s'})</span></button>`;
}
function itemReviewsHTML(item){
  const c = _reviews[item.id];
  const st = reviewStats(item.id);
  const mine = myReviewFor(item.id);
  const can = canReviewItem(item);
  const list = state.revShowAll === item.id ? st.list : st.list.slice(0,3);
  return `<div class="ip-reviews" id="ipReviews">
    <div class="row between" style="gap:10px; align-items:flex-end;"><h3>💬 Island Voices</h3>
      ${mine ? `<button class="link-btn" onclick="openSheet('writeReview','${item.id}')">Edit your review</button>` : can ? `<button class="btn btn-primary btn-sm" onclick="openSheet('writeReview','${item.id}')">★ Write a review</button>` : ''}
    </div>
    ${!c || !c.loaded ? `<p class="muted" style="font-size:.86em;">Loading reviews…</p>` : st.n ? `
    <div class="rev-sum">
      <div class="rev-big"><strong>${st.avg.toFixed(1)}</strong>${starsHTML(st.avg)}<span class="muted">${st.n} review${st.n===1?'':'s'}</span></div>
      <div class="rev-bars">${st.dist.map(d=>`<div class="rev-bar"><span>${d.k}★</span><i><b style="width:${st.n?Math.round(d.c/st.n*100):0}%"></b></i><span class="muted">${d.c}</span></div>`).join('')}</div>
    </div>
    ${list.map(r=>`<div class="rev-item">
      <div class="row between" style="gap:8px;"><div class="row" style="gap:8px;"><span class="rev-av">${escapeAttr((r.name||'C').trim().charAt(0).toUpperCase())}</span><div><strong style="font-size:.9em;">${escapeAttr(r.name)}</strong><div class="muted" style="font-size:.74em;">✓ Verified buyer · ${new Date(r.createdAt).toLocaleDateString([], { day:'numeric', month:'short', year:'numeric' })}</div></div></div>${starsHTML(r.rating)}</div>
      ${r.comment ? `<p class="rev-text">${escapeAttr(r.comment).replace(/\n/g,'<br>')}</p>` : ''}
    </div>`).join('')}
    ${st.n > 3 && state.revShowAll !== item.id ? `<button class="btn btn-ghost btn-sm" style="width:100%;" onclick="state.revShowAll='${item.id}'; render();">Show all ${st.n} reviews</button>` : ''}`
    : `<p class="muted" style="font-size:.86em;">No reviews yet.${can && !mine ? ' Be the first to review it.' : ''}</p>`}
    ${!can && !mine && state.authed ? `<p class="muted" style="font-size:.76em; margin-top:8px;">Only customers who received this item can review it.</p>` : ''}
  </div>`;
}
let _revDraft = 0;
function sheetWriteReview(){
  const item = DB.items.find(i=>i.id===state.sheetData); if(!item) return `<h2>Item not found</h2>`;
  const mine = myReviewFor(item.id);
  if(!_revDraft) _revDraft = mine ? mine.rating : 0;
  return `<h2>${mine?'Edit your review':'Write a review'}</h2>
  <p class="muted" style="margin-bottom:12px;">${escapeAttr(item.name)}</p>
  <div class="rev-pick" role="radiogroup" aria-label="Your rating">${[1,2,3,4,5].map(i=>`<button type="button" role="radio" aria-checked="${_revDraft===i}" aria-label="${i} star${i>1?'s':''}" class="${i<=_revDraft?'on':''}" onclick="_revDraft=${i}; document.querySelectorAll('.rev-pick button').forEach((b,k)=>{ b.classList.toggle('on', k<${i}); b.setAttribute('aria-checked', String(k===${i-1})); }); document.getElementById('revLbl').textContent='${['','Poor','Fair','Good','Very good','Excellent'][i]}';">★</button>`).join('')}</div>
  <p class="muted" id="revLbl" style="text-align:center; margin:4px 0 12px; font-weight:700;">${_revDraft?['','Poor','Fair','Good','Very good','Excellent'][_revDraft]:'Tap a star'}</p>
  <div class="field"><label for="rev_name">Your name (shown with the review)</label><input id="rev_name" maxlength="40" value="${escapeAttr(mine ? mine.name : (state.customerName||''))}"></div>
  <div class="field"><label for="rev_text">Your review (optional)</label><textarea id="rev_text" rows="4" maxlength="1000" placeholder="What did you like or not like?">${escapeAttr(mine ? mine.comment : '')}</textarea></div>
  <button class="btn btn-primary" onclick="submitReview('${item.id}')">${mine?'Save review':'Post review'}</button>
  ${mine ? `<button class="btn btn-ghost danger-txt" style="margin-top:8px;" onclick="deleteMyReview('${item.id}')">Delete review</button>` : ''}`;
}
async function submitReview(itemId){
  if(!_revDraft){ toast('Tap the stars to rate it','bad'); return; }
  const name = val('rev_name').trim() || 'Customer', comment = val('rev_text').trim();
  const mine = myReviewFor(itemId);
  const row = { item_id:itemId, rating:_revDraft, comment:comment||null, reviewer_name:name };
  if(sb){
    const res = mine ? await sb.from('item_reviews').update(row).eq('id', mine.id) : await sb.from('item_reviews').insert({ id:uid('rv'), ...row });
    if(res.error){ toast(/review_needs_purchase/.test(res.error.message) ? 'Only customers who received this item can review it' : 'Could not post: '+res.error.message,'bad'); return; }
    await loadItemReviews(itemId, true);
  } else {
    const c = _reviews[itemId] || (_reviews[itemId] = { list:[], loaded:true });
    if(mine) Object.assign(mine, { rating:_revDraft, comment, name, updatedAt:Date.now() });
    else c.list.unshift({ id:uid('rv'), itemId, userId:state.customerId, name, rating:_revDraft, comment, createdAt:Date.now(), updatedAt:Date.now() });
  }
  _revDraft = 0; closeSheet(); toast(mine ? 'Review updated' : 'Thanks for your review'); render();
}
async function deleteMyReview(itemId){
  const mine = myReviewFor(itemId); if(!mine) return;
  if(sb){ const { error } = await sb.from('item_reviews').delete().eq('id', mine.id); if(error){ toast('Could not delete: '+error.message,'bad'); return; } await loadItemReviews(itemId, true); }
  else { const c = _reviews[itemId]; c.list = c.list.filter(r=>r!==mine); }
  _revDraft = 0; closeSheet(); toast('Review deleted'); render();
}

async function startProPayment(method){
  const biz = currentBiz();
  if(method==='bank_transfer'){ openSheet('upgradeBankSlip'); return; }
  toast('Creating your Swipe payment link…');
  try{
    const { data, error } = await sb.functions.invoke('create-swipe-payment', { body: { businessId: biz.id, amount: 500 } });
    if(error || !data || !data.paymentLink){
      // The edge function returns a JSON { error } body on failure - log it so
      // misconfiguration (e.g. a missing secret) is diagnosable from the
      // browser console instead of only showing this generic toast.
      let detail = error?.message || data?.error;
      if(error?.context?.json){ try{ detail = (await error.context.json()).error || detail; }catch(_){} }
      console.error('create-swipe-payment failed:', detail || error || data);
      toast("Swipe payment isn't set up yet — try bank transfer for now",'bad');
      return;
    }
    // The edge function already recorded the pro_upgrade_requests row and
    // registered the reference with SeaFare before returning this link —
    // both must succeed there before a link is ever payable, so there's
    // nothing left to track client-side.
    window.open(data.paymentLink, '_blank');
    closeSheet();
    toast('Complete payment in the new tab — Pro activates automatically once confirmed');
    await loadDB(); render();
  }catch(e){ toast("Swipe payment isn't set up yet — try bank transfer for now",'bad'); }
}

    <div class="row between" style="margin-top:8px;"><span class="price">${money(o.total)}${o.rentalItemId && o.rentalFeeTiming==='on_return' && o.rentalReturnFeeStatus!=='collected' ? ` <span class="muted" style="font-size:.7em; font-weight:600;">+ ${money(o.rentalFeeAmount||0)} on return</span>` : ''}</span><span class="muted" style="font-size:.8em;">${new Date(o.createdAt).toLocaleDateString()}</span></div>

function paymentStatusPill(o){
  if(o.paymentMethod==='transfer' && isBuyNowOrder(o)){
    if(o.status==='declined') return `<span class="status-pill bad">${o.cancelledAt?'Cancelled':'Declined'}</span>`;
    if(o.paymentStatus==='awaiting_approval') return `<span class="status-pill wait">Waiting for store</span>`;
  }
  if(o.paymentMethod==='swipe'){
    if(o.status==='declined') return `<span class="status-pill bad">${o.cancelledAt?'Cancelled':'Declined'}</span>`;
    if(o.paymentStatus==='awaiting_approval') return `<span class="status-pill wait">Waiting for store</span>`;
    if(o.paymentStatus==='awaiting_swipe') return `<span class="status-pill mid">Ready to pay</span>`;
  }
  if(o.paymentStatus==='awaiting_completion') return `<span class="status-pill wait">Needs completion</span>`;
  // An 'on_return' rental's payment_status flips to 'paid' the moment its
  // advance is confirmed - same column a fully-paid order uses - but the
  // rental fee itself is still outstanding at that point, so "Paid ✓" would
  // overstate it until rentalReturnFeeStatus also says 'collected'.
  if(o.rentalItemId && o.rentalFeeTiming==='on_return' && o.rentalReturnFeeStatus!=='collected' && (o.paymentStatus==='paid'||o.paymentStatus==='settled')) return `<span class="status-pill mid">Advance paid</span>`;
  if(o.paymentStatus==='paid'||o.paymentStatus==='settled') return `<span class="status-pill ok">Paid ✓</span>`;
  if(o.paymentStatus==='slip_uploaded') return `<span class="status-pill mid">Slip uploaded</span>`;
  if(o.paymentStatus==='cash_collected') return `<span class="status-pill mid">Cash with rider</span>`;
  return `<span class="status-pill wait">Awaiting payment</span>`;
}

/* ---- Product photos (Supabase Storage) ---- */
const IMAGE_ALLOWED_TYPES = ['image/jpeg','image/png','image/webp','image/gif'];
const IMAGE_MAX_BYTES = 5*1024*1024;
let _itemPhotoFile = null;
// Up to 5 photos per listing; the first is the cover (items.image_url).
const PHOTO_MAX = 5;

// ---- One name and one photo per item, per store ----
function nameKey(t){ return bulkSlug(t); }
function storeItemByName(bizId, name, exceptId){ const k = nameKey(name); return k ? DB.items.find(i=>i.businessId===bizId && i.id!==exceptId && nameKey(i.name)===k) : null; }
// A photo's fingerprint: a 64-bit difference hash of the picture plus its
// colours in 4 corners, so the same photo still matches after it was
// resized or re-saved, while colour variants of one product don't.
const _printCache = new Map();
function photoPrint(src){
  if(!src) return Promise.resolve(null);
  if(_printCache.has(src)) return _printCache.get(src);
  const p = new Promise(res=>{
    const img = new Image(); let obj = null;
    if(typeof src==='string' && /^https?:/i.test(src)) img.crossOrigin = 'anonymous';
    const done = v=>{ if(obj) URL.revokeObjectURL(obj); res(v); };
    img.onload = ()=>{ try{
      const c = document.createElement('canvas'), x = c.getContext('2d', { willReadFrequently:true });
      c.width = 9; c.height = 8; x.drawImage(img, 0, 0, 9, 8);
      const d = x.getImageData(0, 0, 9, 8).data, lum = k=>d[k]*.299 + d[k+1]*.587 + d[k+2]*.114;
      let hex = '';
      for(let y=0;y<8;y++){ let nib = 0; for(let i=0;i<8;i++){ const a = (y*9+i)*4; nib = (nib<<1) | (lum(a) > lum(a+4) ? 1 : 0); if(i===3 || i===7){ hex += nib.toString(16); nib = 0; } } }
      c.width = 2; c.height = 2; x.drawImage(img, 0, 0, 2, 2);
      const e = x.getImageData(0, 0, 2, 2).data; let col = '';
      for(let k=0;k<16;k+=4) col += [e[k],e[k+1],e[k+2]].map(v=>(v>>5).toString(8)).join('');
      done(hex + '-' + col);
    }catch(_){ done(null); } };
    img.onerror = ()=>done(null);
    if(src instanceof Blob){ obj = URL.createObjectURL(src); img.src = obj; } else img.src = src;
  });
  _printCache.set(src, p); return p;
}
function printsMatch(a, b){
  if(!a || !b) return false; if(a===b) return true;
  const [ha, ca] = a.split('-'), [hb, cb] = b.split('-');
  if(!ha || !hb || !ca || !cb || ha.length!==hb.length || ca.length!==cb.length) return false;
  let bits = 0; for(let k=0;k<ha.length;k++){ let v = parseInt(ha[k],16) ^ parseInt(hb[k],16); while(v){ bits += v & 1; v >>= 1; } }
  if(bits > 4) return false;
  for(let k=0;k<ca.length;k++) if(Math.abs(parseInt(ca[k],8) - parseInt(cb[k],8)) > 1) return false;
  return true;
}
// Fingerprints for a store's existing items (older items get theirs worked
// out from their photos once, and saved).
const _printsReady = {};
function ensureBizPrints(bizId){
  if(_printsReady[bizId]) return _printsReady[bizId];
  _printsReady[bizId] = (async()=>{
    const todo = DB.items.filter(i=>i.businessId===bizId && itemImages(i).length && !(i.photoPrints && i.photoPrints.length===itemImages(i).length));
    const changed = [];
    for(const it of todo){
      const prints = await Promise.all(itemImages(it).map(u=>photoPrint(u)));
      if(!prints.some(Boolean)) continue;
      it.photoPrints = prints;
      // Don't save one that clashes with another item already (old duplicates): the server would refuse it.
      const clash = DB.items.some(o=>o.businessId===bizId && o.id!==it.id && (o.photoPrints||[]).some(a=>prints.includes(a)));
      if(!clash) changed.push(it);
    }
    if(sb && changed.length){ try{ await sb.from('items').upsert(changed.map(it=>({ ...toDbRow('items', it) }))); }catch(_){} }
  })();
  return _printsReady[bizId];
}
function itemUsingPhoto(print, bizId, exceptIds){
  if(!print) return null;
  return DB.items.find(i=>i.businessId===bizId && !(exceptIds||[]).includes(i.id) && (i.photoPrints||[]).some(p=>printsMatch(p, print))) || null;
}
function photoInUseMsg(it){ return `This photo is already used for “${it.name}”. Each item needs its own photo`; }
let _photoSlots = [];   // [{url}] saved, or [{file, preview}] new
function itemImages(it){ return it && it.images && it.images.length ? it.images : (it && it.imageUrl ? [it.imageUrl] : []); }
function startAddItem(){ if(!requireStoreBank()) return; _itemPhotoFile = null; _photoSlots = []; _dupReplaceId = null; const b = currentBiz(); if(b) ensureBizPrints(b.id); openSheet('addItem'); }
function startEditItem(id){ const it = DB.items.find(i=>i.id===id); _itemPhotoFile = null; _photoSlots = itemImages(it).map((url,k)=>({url, print:(it.photoPrints||[])[k]||null})); if(it) ensureBizPrints(it.businessId); openSheet('editItem', id); }
function photoSlotsHTML(){
  return `<div class="photo-slots" id="photoSlots">
    ${_photoSlots.map((ph,i)=>`<div class="ps-tile ${i===0?'cover':''}">
      <img src="${ph.url||ph.preview}" alt="Photo ${i+1}">
      ${i===0?`<span class="ps-cover">Cover</span>`:`<button type="button" class="ps-btn ps-star" aria-label="Make photo ${i+1} the cover" onclick="coverPhotoSlot(${i})">★</button>`}
      <button type="button" class="ps-btn ps-x" aria-label="Remove photo ${i+1}" onclick="removePhotoSlot(${i})">✕</button>
    </div>`).join('')}
    ${_photoSlots.length < PHOTO_MAX ? `<label class="ps-tile ps-add" for="itemPhotosInput"><span>＋</span><small>${_photoSlots.length?`Add (${PHOTO_MAX-_photoSlots.length} left)`:`Add up to ${PHOTO_MAX} photos`}</small></label>` : ''}
  </div>
  <input type="file" accept="image/*" multiple id="itemPhotosInput" style="display:none;" onchange="onPhotosPicked(event)">`;

function redrawPhotoSlots(){ const el = document.getElementById('photoSlots'); if(el){ const inp = document.getElementById('itemPhotosInput'); if(inp) inp.remove(); el.outerHTML = photoSlotsHTML(); } }
function onPhotosPicked(e){
  const files = [...(e.target.files||[])]; e.target.value = '';
  const room = PHOTO_MAX - _photoSlots.length;
  if(files.length > room) toast(`Up to ${PHOTO_MAX} photos per item, so only ${room} more were added`,'bad');
  files.slice(0, room).forEach(f=>{
    if(!IMAGE_ALLOWED_TYPES.includes(f.type)){ toast('Please choose JPEG, PNG, WEBP or GIF images','bad'); return; }
    if(f.size > 20*1024*1024){ toast(`${f.name} is over 20MB`,'bad'); return; }   // shrunk before upload (shrinkPhoto)
    const slot = { file:f, preview:'' }; _photoSlots.push(slot);
    const r = new FileReader(); r.onload = ()=>{ slot.preview = r.result; redrawPhotoSlots(); }; r.readAsDataURL(f);
    checkSlotPhoto(slot);
  });
  redrawPhotoSlots();
}
// A new photo already used by another item (or added twice here) is taken out again.
async function checkSlotPhoto(slot){
  const b = currentBiz(); if(!b) return;
  slot.print = await photoPrint(slot.file);
  await ensureBizPrints(b.id);

  const twice = _photoSlots.some(s=>s!==slot && s.print && printsMatch(s.print, slot.print));

// Uploaded under a path prefixed with the uploader's own auth.uid() - the
// storage RLS policies check against that same prefix, so no join to
// businesses is needed there. Returns null (photo skipped) rather than
// throwing when there's no backend or no file was chosen.
// Make a photo small before it's uploaded without visible quality loss:
// at most PHOTO_MAX_SIDE px on the long side, re-encoded as WebP (JPEG where
// the browser can't write WebP). Small photos are left as they are, and the
// original is kept if the new one wouldn't be smaller.
const PHOTO_MAX_SIDE = 1600, PHOTO_QUALITY = 0.86;
async function shrinkPhoto(file){
  try{
    if(!file || /gif$/i.test(file.type)) return file;
    const bmp = await createImageBitmap(file);
    const big = Math.max(bmp.width, bmp.height);
    if(big <= PHOTO_MAX_SIDE && file.size <= 350*1024){ bmp.close && bmp.close(); return file; }
    const k = Math.min(1, PHOTO_MAX_SIDE / big);
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
    let blob = await new Promise(r=>c.toBlob(r, 'image/webp', PHOTO_QUALITY));
    if(!blob || blob.type !== 'image/webp') blob = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.9));
    if(!blob || blob.size >= file.size) return file;
    const ext = blob.type === 'image/webp' ? 'webp' : 'jpg';
    return new File([blob], file.name.replace(/\.[^.]+$/,'') + '.' + ext, { type: blob.type });
  }catch(e){ return file; }
}
// Read photos out of a .zip in the browser (stored or deflate entries; uses
// DecompressionStream). Folders and macOS "__MACOSX" / "._" files are skipped.
async function photosFromZip(zipFile){
  const buf = new Uint8Array(await zipFile.arrayBuffer()); const dv = new DataView(buf.buffer);
  let eocd = -1; for(let i = buf.length - 22; i >= Math.max(0, buf.length - 66000); i--){ if(dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; } }
  if(eocd < 0) throw new Error('not a zip file');
  const count = dv.getUint16(eocd + 10, true); let p = dv.getUint32(eocd + 16, true);
  const out = []; const dec = new TextDecoder();
  for(let n = 0; n < count; n++){
    if(dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
    const nlen = dv.getUint16(p + 28, true), xlen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = dec.decode(buf.subarray(p + 46, p + 46 + nlen)); p += 46 + nlen + xlen + clen;
    const base = name.split('/').pop();
    if(!base || /(^|\/)__MACOSX\//.test(name) || base.startsWith('._') || !/\.(jpe?g|png|webp|gif)$/i.test(base)) continue;
    const start = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    let data = buf.slice(start, start + csize);
    if(method === 8){ data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer()); }
    else if(method !== 0) continue;
    const ext = base.split('.').pop().toLowerCase();
    out.push(new File([data], base, { type: ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg' : 'image/' + ext }));
  }
  return out;
}
async function uploadItemPhoto(fileArg){
  let file = fileArg || _itemPhotoFile;
  if(!file || !sb) return null;
  file = await shrinkPhoto(file);
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  // Storage doesn't accept Firebase sign-ins directly, so the photo goes
  // through the upload-item-photo function, which checks the sign-in and
  // saves it in this user's own folder (see supabase/functions/upload-item-photo).
  try{
    const { data, error } = await sb.functions.invoke('upload-item-photo', { body: file, headers: { 'x-file-ext': ext, 'Content-Type': file.type || 'application/octet-stream' } });
    if(error || !data || !data.url){
      let msg = error ? error.message : 'no link returned';
      try{ const b = error && error.context && await error.context.json(); if(b && b.error) msg = b.error; }catch(e){}
      toast('Photo upload failed: '+msg, 'bad'); return null;
    }
    return data.url;
  }catch(e){ toast('Photo upload failed: '+(e.message||e), 'bad'); return null; }
}

// location" for most goods, but Home & Living rentals (furniture, appliances,
// property) are often really an advance payment rather than something fully
// refundable, and "location" fits better than "pickup location" when the
// item may just be describing where it is rather than somewhere to collect
// it from - so both labels adapt to whatever category is picked. Reads the
// category select directly (rather than being passed a value) since it's
// wired as that select's own onchange handler - see itemCatFieldHTML() -

async function submitAddItem(){
  const biz = currentBiz(); const t = tierInfo(biz);
  const myCount = DB.items.filter(i=>i.businessId===biz.id).length;
  const dupNow = storeItemByName(biz.id, val('i_name'));
  if(_dupReplaceId && (!dupNow || dupNow.id!==_dupReplaceId)) _dupReplaceId = null;   // name changed since
  if(dupNow && !_dupReplaceId){ const w = document.getElementById('dupWarn'); if(w){ w.innerHTML = dupWarnHTML(dupNow); w.scrollIntoView({block:'center', behavior:'smooth'}); } else toast(`You already have “${dupNow.name}”`,'bad'); return; }
  if(!_dupReplaceId && myCount>=t.limit){ toast(`Item limit reached (${t.limit})`,'bad'); return; }
  const name=val('i_name'), cat=val('i_cat')||'General';
  const catOtherName = cat==='Other' ? (val('i_cat_other')||'') : '';
  if(!name){ toast('Enter an item name','bad'); return; }
  const listingType = val('i_listing_type') || 'buy_now';
  let price, stock, startingPrice, bidIncrement, days, discountPercent=0, rentalDeposit=0, rentalRatePeriod='day', rentalFulfillment='pickup', pickupLocation='', rentalAvailability='now', availableFrom='';
  if(listingType==='auction'){
    startingPrice = Number(val('i_start_price'));
    bidIncrement = Number(val('i_bid_increment'));
    days = Number(val('i_duration'));
    if(!startingPrice || startingPrice<=0){ toast('Enter a starting price','bad'); return; }
    if(!bidIncrement || bidIncrement<=0){ toast('Enter a bid increment','bad'); return; }
    if(!days || days<1 || days>5){ toast('Choose a duration up to 5 days','bad'); return; }
    price = startingPrice; stock = 1;
  } else if(listingType==='rental'){
    price = Number(val('i_rent_rate')); stock = Number(val('i_rent_stock')||0);
    rentalDeposit = Number(val('i_rent_deposit')||0);
    rentalRatePeriod = (cat==='Home & Living' && val('i_rent_rate_period')==='month') ? 'month' : 'day';
    if(!price || price<=0){ toast(rentalRatePeriod==='month'?'Enter a monthly rental rate':'Enter a daily rental rate','bad'); return; }
    if(!stock || stock<=0){ toast('Enter units available to rent','bad'); return; }
    // Pickup is the only fulfillment mode offered at creation time now (the
    // pickup/deliver choice was removed from this form) - a seller who wants
    // to deliver instead can still switch it in Edit item afterwards.
    rentalFulfillment = 'pickup';
    pickupLocation = val('i_rent_pickup_location');
    if(!pickupLocation){ toast('Enter a pickup location','bad'); return; }
    rentalAvailability = val('i_rent_availability') || 'now';
    if(rentalAvailability==='soon'){
      availableFrom = val('i_available_from');
      if(!availableFrom){ toast('Enter the date this item will be available from','bad'); return; }
    }
  } else {
    price = Number(val('i_price')); stock = Number(val('i_stock')||0);
    discountPercent = Math.min(90, Math.max(0, Number(val('i_discount')||0)));
    if(!price){ toast('Enter item name and price','bad'); return; }
  }
  const freeDelivery = document.getElementById('i_free_delivery').checked;
  const extraDeliveryFee = Math.max(0, Number(val('i_extra_fee')||0));
  const description = val('i_desc');
  const replacing = _dupReplaceId ? DB.items.find(i=>i.id===_dupReplaceId) : null;
  if(replacing && (replacing.listingType==='auction' || listingType==='auction')){ toast('Auctions can\u2019t be replaced. Give this item a different name','bad'); return; }
  const prints = await slotPrintsOrBlock(biz.id, replacing ? [replacing.id] : []);
  if(!prints) return;
  toast('Saving item…');
  const images = await uploadPhotoSlots();
  const imageUrl = images[0] || null;
  if(replacing){
    const before = { ...replacing };
    Object.assign(replacing, { name, price, stock, category:cat, categoryOtherName:catOtherName, listingType, freeDelivery, extraDeliveryFee, discountPercent, rentalDeposit, rentalRatePeriod, rentalFulfillment, pickupLocation, rentalAvailability, availableFrom, description, options: readOptionsEditor('i') });
    if(images.length){ replacing.images = images; replacing.imageUrl = imageUrl; replacing.photoPrints = prints.slice(0, images.length); }
    if(await saveDB('items', [replacing]) === false){ Object.assign(replacing, before); render(); return; }
    _dupReplaceId = null; _itemPhotoFile = null;
    closeSheet(); toast(`Replaced “${replacing.name}”`); render(); return;
  }
  const item = {id:uid('it'), images, photoPrints: prints.slice(0, images.length), businessId:biz.id, name, price, stock, category:cat, categoryOtherName:catOtherName, imageUrl, listingType, freeDelivery, extraDeliveryFee, discountPercent, rentalDeposit, rentalRatePeriod, rentalFulfillment, pickupLocation, rentalAvailability, availableFrom, description, approvalStatus: sb ? 'pending' : 'approved', submittedAt: Date.now(), options: readOptionsEditor('i')};
  DB.items.push(item);
  if(await saveDB('items', [item]) === false){ DB.items = DB.items.filter(i=>i.id!==item.id); render(); return; }
  if(catOtherName) await submitCategoryRequest(biz, catOtherName);

// Small RFC 4180 parser: quoted cells, doubled quotes, commas/newlines in
// quotes. Excel in some regions saves with ';' (or tabs), so the separator is
// taken from the header line.
function parseCSV(text){
  text = String(text||'').replace(/^﻿/,'');
  const firstLine = text.split(/\r?\n/)[0] || '';
  const counts = { ',':(firstLine.match(/,/g)||[]).length, ';':(firstLine.match(/;/g)||[]).length, '\t':(firstLine.match(/\t/g)||[]).length };
  const sep = Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; }
      else cell+=c;
    } else if(c==='"') q=true;
    else if(c===sep){ row.push(cell); cell=''; }
    else if(c==='\n' || c==='\r'){ if(c==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell!=='' || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function bulkNum(v){ v=String(v==null?'':v).trim().replace(/^MVR\s*/i,'').replace(/,/g,''); return v==='' ? null : (isFinite(Number(v)) ? Number(v) : NaN); }

function bulkSlug(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
// Which photo belongs to a row, in this order:
//  1. one the store picked for this row in the preview ("Change photo")
//  2. a web link in the photo column
//  3. the file named in the photo column
//  4. if the column is empty: a picked photo named after the item's code
//     (e.g. LL0010.jpg for "Code LL0010") or after the item name itself.
function bulkPhotoFor(r){
  if(r.override === 'none') return { kind:'none', removed:true };
  if(r.override) return { kind:'file', file:r.override, how:'you' };
  if(r.photoUrl) return { kind:'url', url:r.photoUrl, how:'web link' };
  if(r.photo){
    const k = r.photo.split('|')[0].trim().split(/[\\/]/).pop().toLowerCase();
    const f = _bulkPhotos[k] || _bulkPhotos[k.replace(/\.[^.]+$/,'')];
    return f ? { kind:'file', file:f, how:'photo column' } : { kind:'missing', name:r.photo };
  }
  const files = [...new Set(Object.values(_bulkPhotos))];
  if(!files.length) return { kind:'none' };
  const text = ' '+bulkSlug((r.item.name||'')+' '+(r.item.description||''))+' ';
  const byCode = files.find(f=>{ const b = bulkSlug(f.name.replace(/\.[^.]+$/,'')); return b.length>=3 && /\d/.test(b) && text.includes(' '+b+' '); });
  if(byCode) return { kind:'file', file:byCode, how:'item code' };
  const nm = bulkSlug(r.item.name);
  const byName = nm && files.find(f=>bulkSlug(f.name.replace(/\.[^.]+$/,''))===nm);

async function submitBulkItems(){
  if(!_bulk) return;
  const biz = currentBiz(); const t = tierInfo(biz);
  const room = Math.max(0, t.limit - DB.items.filter(i=>i.businessId===biz.id).length);
  await bulkCheckPhotos();
  const okRows = _bulk.rows.filter(bulkRowOK);
  const rows = [...okRows.filter(r=>r.replaceId), ...okRows.filter(r=>!r.replaceId).slice(0, room)];
  if(!rows.length){ toast('Nothing to add','bad'); return; }
  toast(`Adding ${rows.length} item${rows.length===1?'':'s'}…`);
  // Every photo for every row (cover + extras from the photo column), uploaded
  // a few at a time with one running count.
  let photoFails = 0, done = 0;
  const jobs = [];   // {r, slot, file|url}
  rows.forEach(r=>{
    const ph = bulkPhotoFor(r);
    r._imgs = new Array(PHOTO_MAX).fill(null); r._prt = new Array(PHOTO_MAX).fill(null);
    if(ph.kind==='url') r._imgs[0] = ph.url;
    else if(ph.kind==='file') jobs.push({ r, slot:0, file:ph.file });
    bulkExtraPhotos(r).forEach((x,k)=>{ if(x.kind==='url') r._imgs[k+1] = x.url; else if(x.kind==='file') jobs.push({ r, slot:k+1, file:x.file }); });
  });
  let next = 0;
  async function worker(){
    while(next < jobs.length){
      const j = jobs[next++];
      const url = sb ? await uploadItemPhoto(j.file) : bulkThumbURL(j.file);   // no server: local preview
      if(url){ j.r._imgs[j.slot] = url; j.r._prt[j.slot] = await photoPrint(j.file); } else photoFails++;
      done++; if(sb && (done % 3 === 0 || done === jobs.length)) toast(`Uploading photos… ${done} of ${jobs.length}`);
    }
  }
  await Promise.all(Array.from({ length: Math.min(4, jobs.length) }, worker));
  rows.forEach(r=>{ const keep = r._imgs.map((u,k)=>u?k:-1).filter(k=>k>=0).slice(0, PHOTO_MAX); const imgs = keep.map(k=>r._imgs[k]); r.item.images = imgs; r.item.photoPrints = keep.map(k=>r._prt[k]); r.item.imageUrl = imgs[0] || r.item.imageUrl || null; delete r._imgs; delete r._prt; });
  // Rows that replace an item the store already has update that item (same id, reviews and sales kept).
  const replaced = [], backups = [];
  rows.filter(r=>r.replaceId).forEach(r=>{
    const ex = DB.items.find(i=>i.id===r.replaceId); if(!ex) return;
    backups.push({ ...ex });
    const { id, businessId, approvalStatus, submittedAt, images, imageUrl, photoPrints, ...fields } = r.item;
    Object.assign(ex, fields);
    if(images && images.length){ ex.images = images; ex.imageUrl = imageUrl; ex.photoPrints = photoPrints; }
    replaced.push(ex);
  });
  const items = rows.filter(r=>!r.replaceId).map(r=>r.item);
  items.forEach(it=>{ it.approvalStatus = sb ? 'pending' : 'approved'; it.submittedAt = Date.now(); });
  DB.items.push(...items);
  const saved = await saveDB('items', [...items, ...replaced]);
  if(saved === false){
    // Nothing was stored, so don't show the items as if they were.
    const ids = new Set(items.map(i=>i.id));
    DB.items = DB.items.filter(i=>!ids.has(i.id));
    backups.forEach(b=>{ const ex = DB.items.find(i=>i.id===b.id); if(ex) Object.assign(ex, b); });
    render();
    return;
  }
  const now = Date.now();
  const auctions = rows.filter(r=>r.auction).map(r=>({ id:uid('auc'), itemId:r.item.id, businessId:biz.id, startingPrice:r.auction.startingPrice, bidIncrement:r.auction.bidIncrement, startTime:now, endTime:now + r.auction.days*86400000, currentHighestBid:null, currentHighestBidder:null, status:'active', orderId:null }));
  if(auctions.length){
    DB.auctions.push(...auctions);
    if(sb){ const { error } = await sb.from('auction_listings').insert(auctions.map(a=>toDbRow('auctions', a))); if(error) toast('Items saved but auction setup failed: '+error.message,'bad'); }
  }
  const others = [...new Set(items.map(i=>i.categoryOtherName).filter(Boolean))];
  for(const name of others){ try{ await submitCategoryRequest(biz, name); }catch(e){} }
  _bulk = null; _bulkPhotos = {}; if(sb){ _bulkThumbs.forEach(u=>URL.revokeObjectURL(u)); _bulkThumbs = new Map(); } closeSheet();
  toast(`${items.length} item${items.length===1?'':'s'} added${replaced.length?` · ${replaced.length} replaced`:''}${sb?'. They show to customers once Maldexpress approves them':''}${photoFails?` · ${photoFails} photo${photoFails===1?'':'s'} didn't upload, add ${photoFails===1?'it':'them'} in Edit item`:''}`, photoFails?'bad':undefined); render();
}

async function submitEditItem(itemId){
  const item = DB.items.find(i=>i.id===itemId);
  if(!item) return;
  const name = val('e_name');
  if(!name){ toast('Enter an item name','bad'); return; }
  const dupE = storeItemByName(item.businessId, name, item.id);
  if(dupE){ toast(`You already have an item called “${dupE.name}”. Use a different name`,'bad'); return; }
  const printsE = await slotPrintsOrBlock(item.businessId, [item.id]);
  if(!printsE) return;
  if(item.approvalStatus==='rejected'){ item.approvalStatus = 'pending'; item.approvalNote = ''; }
  item.name = name;
  item.category = val('e_cat') || 'General';
  item.categoryOtherName = item.category==='Other' ? (val('e_cat_other')||'') : '';
  if(item.categoryOtherName) await submitCategoryRequest(currentBiz(), item.categoryOtherName);
  item.description = val('e_desc');
  if(document.getElementById('e_opts')) item.options = readOptionsEditor('e');
  if(item.listingType==='rental'){
    const price = Number(val('e_rent_rate')), stock = Number(val('e_rent_stock')||0);
    if(!price){ toast('Enter a daily rate','bad'); return; }
    const rentalFulfillment = val('e_rent_fulfillment') || 'deliver';
    let pickupLocation = item.pickupLocation || '';
    if(rentalFulfillment==='pickup'){
      pickupLocation = val('e_rent_pickup_location');
      if(!pickupLocation){ toast('Enter a pickup location','bad'); return; }
    }
    const rentalAvailability = val('e_rent_availability') || 'now';
    let availableFrom = item.availableFrom || '';
    if(rentalAvailability==='soon'){
      availableFrom = val('e_available_from');
      if(!availableFrom){ toast('Enter the date this item will be available from','bad'); return; }
    }
    item.price = price; item.stock = stock; item.rentalDeposit = Number(val('e_rent_deposit')||0);
    item.rentalRatePeriod = (item.category==='Home & Living' && val('e_rent_rate_period')==='month') ? 'month' : 'day';
    item.rentalFulfillment = rentalFulfillment; item.pickupLocation = pickupLocation;
    item.rentalAvailability = rentalAvailability; item.availableFrom = availableFrom;
  } else if(item.listingType!=='auction'){
    const price = Number(val('e_price')), stock = Number(val('e_stock')||0);
    if(!price){ toast('Enter a price','bad'); return; }
    item.price = price; item.stock = stock;
    item.discountPercent = Math.min(90, Math.max(0, Number(val('e_discount')||0)));
  }
  const freeDeliveryEl = document.getElementById('e_free_delivery');
  if(freeDeliveryEl) item.freeDelivery = freeDeliveryEl.checked;
  item.extraDeliveryFee = Math.max(0, Number(val('e_extra_fee')||0));
  if(_photoSlots.some(ph=>ph.file)) toast('Saving photos…');
  const imgs = await uploadPhotoSlots();
  item.images = imgs; item.imageUrl = imgs[0] || null; item.photoPrints = printsE.slice(0, imgs.length);
  if(await saveDB('items', [item]) === false) return;
  _itemPhotoFile = null;
  closeSheet(); toast('Item updated'); render();
}

function renderBizOrders(biz){
  const myOrders = DB.orders.filter(o=>o.businessId===biz.id).sort((a,b)=>b.createdAt-a.createdAt);
  const myBookings = DB.bookings.filter(bk=>bk.businessId===biz.id).sort((a,b)=>b.createdAt-a.createdAt);
  // A card stays in Active for as long as either half of the deal is still
  // open (payment not yet confirmed, or the item not yet in the customer's
  // hands) - see isOrderFullyFulfilled() - and only moves down into the
  // completed Orders list once both are actually done.
  const isClosed = o=>['declined','cancelled'].includes(o.status);   // declined / cancelled orders aren't active
  const activeOrders = myOrders.filter(o=>!isClosed(o) && !isOrderFullyFulfilled(o));
  const completedOrders = myOrders.filter(o=>isClosed(o) || isOrderFullyFulfilled(o));
  document.getElementById('app').innerHTML = wrapShell('business','bizOrders', `
    ${topbar('Orders & payments')}
    <div style="padding:4px 0 0;">
      ${myBookings.length? `
      <div class="section" style="margin-bottom:22px;">
        <div class="section-head"><h2>Rental bookings</h2></div>
        <div class="card-list">${myBookings.map(bk=>bookingCardBiz(bk)).join('')}</div>
      </div>` : ''}
      <div class="section-head"><h2>Active</h2></div>
      ${activeOrders.length? `<div class="card-list">${activeOrders.map(o=>orderCardBiz(o)).join('')}</div>` : `<div class="empty"><span class="ic">🧾</span>No active orders</div>`}
      ${completedOrders.length? `
      <div class="section-head" style="margin-top:18px;"><h2>Orders</h2></div>
      <div class="card-list">${completedOrders.map(o=>orderCardBiz(o)).join('')}</div>` : ''}
    </div>
  `);
}
// A pending request the renter has to Accept (optionally setting a booking
// charge to hold it) or Decline - the customer can still withdraw it up to
// that point (see cancelBookingRequest()), which lands here as 'cancelled'.
// Once accepted with a charge, the customer transfers it and uploads a slip
// (same shape as an order's transfer - see sheetUploadBookingSlip()) before
// this shows anything to approve; "Mark charge collected" only appears once
// that slip is actually in.
function bookingCardBiz(bk){
  const pill = bk.status==='pending' ? `<span class="status-pill wait">Pending</span>`
    : bk.status==='declined' ? `<span class="status-pill bad">Declined</span>`
    : bk.status==='cancelled' ? `<span class="status-pill bad">Cancelled by customer</span>`
    : bk.bookingCharge!=null && bk.chargeStatus==='slip_uploaded' ? `<span class="status-pill mid">Booked · slip uploaded</span>`
    : bk.bookingCharge!=null && bk.chargeStatus!=='collected' ? `<span class="status-pill mid">Booked · charge pending</span>`
    : `<span class="status-pill ok">Booked ✓</span>`;
  return `
  <div class="glass card">
    <div class="row between"><h3>${bk.itemName}</h3>${pill}</div>
    <p class="muted" style="font-size:.85em; margin:4px 0 8px;">${bk.customerName} · wants ${bk.days} day${bk.days>1?'s':''} from ${fmtDateShort(bk.requestedDate)}</p>
    ${bk.customerPhone?contactHTML(bk.customerPhone, bk.customerName||'Customer'):''}
    ${bk.note?`<p class="muted" style="font-size:.82em; margin-bottom:8px;">"${bk.note}"</p>`:''}
    ${bk.status==='accepted' && bk.bookingCharge!=null ? `<div class="row between" style="margin-bottom:8px;"><span class="muted">Booking charge</span><strong>${money(bk.bookingCharge)}</strong></div>` : ''}
    ${bk.status==='pending' ? `
      <div class="row" style="gap:8px;">
        <button class="btn btn-good btn-sm" style="flex:1;" onclick="openSheet('acceptBooking','${bk.id}')">Accept</button>
        <button class="btn btn-outline btn-sm" style="flex:1;" onclick="declineBooking('${bk.id}')">Decline</button>
      </div>` : ''}
    ${bk.status==='accepted' && bk.bookingCharge!=null && bk.chargeStatus==='pending' ? `<div class="card tight" style="background:rgba(255,207,92,.1);"><p style="font-size:.85em;">Waiting for the customer to transfer & upload a slip.</p></div>` : ''}
    ${bk.status==='accepted' && bk.chargeStatus==='slip_uploaded' ? `
      <div class="card tight" style="background:rgba(34,184,200,.12);">
        <p style="font-size:.85em; margin-bottom:8px;">Customer uploaded a transfer slip:</p>
        ${bk.slipDataUrl ? `<img src="${bk.slipDataUrl}" style="width:100%; border-radius:12px; max-height:220px; object-fit:contain; background:#fff; border:1px solid var(--glass-brd);">` : `<p class="muted" style="font-size:.8em;">(slip image not available)</p>`}
      </div>
      <button class="btn btn-good btn-sm" style="width:100%; margin-top:10px;" onclick="markBookingChargeCollected('${bk.id}')">Mark charge collected</button>` : ''}
    ${bk.chargeStatus==='collected' ? `<div class="status-pill ok" style="display:inline-block;">Charge collected</div>` : ''}
  </div>`;

async function encryptBookingRow(dbRow, booking){
try{
if(dbRow.customer_phone || dbRow.note){
const recipients = {};
if(booking.customerId){
const custKey = (booking.customerId===state.customerId && __myPublicKeyB64) ? __myPublicKeyB64 : await lookupPublicKey(booking.customerId);
if(custKey) recipients[booking.customerId] = custKey;
}
const biz = DB.businesses.find(b=>b.id===booking.businessId);
if(biz && biz.ownerId){
const ownerKey = await businessOwnerPublicKeyB64(booking.businessId);
if(ownerKey) recipients[biz.ownerId] = ownerKey;
}
const { enc, iv, keys } = await encryptForRecipients({ phone: dbRow.customer_phone, note: dbRow.note }, recipients);
dbRow.contact_enc = enc; dbRow.contact_iv = iv; dbRow.contact_keys = keys;
dbRow.customer_phone = null; dbRow.note = null;
}
if(dbRow.slip_url){
const recipients = {};
if(booking.customerId && __myPublicKeyB64 && booking.customerId===state.customerId) recipients[booking.customerId] = __myPublicKeyB64;
const biz = DB.businesses.find(b=>b.id===booking.businessId);
if(biz && biz.ownerId){
const ownerKey = await businessOwnerPublicKeyB64(booking.businessId);
if(ownerKey) recipients[biz.ownerId] = ownerKey;
}
const { enc, iv, keys } = await encryptForRecipients({ url: dbRow.slip_url }, recipients);
dbRow.slip_enc = enc; dbRow.slip_iv = iv; dbRow.slip_keys = keys;
dbRow.slip_url = null;
}
} catch(e){ console.error('encryptBookingRow failed, leaving booking unencrypted this write', e); }
}

async function decryptBookingRow(booking, dbRow){
try{
if(dbRow.contact_enc){
const out = await decryptForMe(dbRow.contact_enc, dbRow.contact_iv, dbRow.contact_keys);
if(out){ booking.customerPhone = out.phone||''; booking.note = out.note||''; }
}
if(dbRow.slip_enc){
const out = await decryptForMe(dbRow.slip_enc, dbRow.slip_iv, dbRow.slip_keys);
if(out) booking.slipDataUrl = out.url||null;
}
} catch(e){ console.error('decryptBookingRow failed', e); }
}


async function acceptBooking(id){
  if(!requireOnline()) return;
const bk = DB.bookings.find(x=>x.id===id);
if(bk && bookingOverlapsExisting(bk.itemId, bk.requestedDate, bk.days, bk.id)){
toast("Can't accept — those dates overlap a booking you've already accepted for this item", 'bad');
return;
}
const charge = Number(val('booking_charge_amt')||0);
const patch = { status:'accepted', booking_charge: charge>0?charge:null, charge_status: charge>0?'pending':null, decided_at:new Date().toISOString() };
const { data, error } = await sb.from('rental_bookings').update(patch).eq('id', id).select();
if(error){ toast('Could not accept booking: '+error.message, 'bad'); return; }
if(!data || !data.length){ toast("Couldn't update this booking — it may have changed", 'bad'); return; }
const updated = fromDbRow('bookings', data[0]);
await decryptBookingRow(updated, data[0]);
const idx = DB.bookings.findIndex(bk=>bk.id===id);
if(idx>=0) DB.bookings[idx] = updated; else DB.bookings.unshift(updated);
closeSheet(); toast('Booking accepted'); render();
}

// The two customer-side booking actions (cancel, submit-slip) go through
// cancel_booking_request()/submit_booking_slip() - see the schema comment
// above explaining why those needed their own SECURITY DEFINER functions
// rather than a customer update policy like the business gets.
async function callBookingRpc(rpcName, args, bookingId, failMsg){
if(!sb){ toast("You're offline, so this can't be saved. Reconnect and try again", 'bad'); return null; }
const { data, error } = await sb.rpc(rpcName, args);
if(error){ toast('Could not update booking: '+error.message, 'bad'); return null; }
if(!data || !data.length){ toast(failMsg || "Couldn't update this booking — it may have changed", 'bad'); return null; }
const updated = fromDbRow('bookings', data[0]);
await decryptBookingRow(updated, data[0]);
const idx = DB.bookings.findIndex(bk=>bk.id===bookingId);
if(idx>=0) DB.bookings[idx] = updated; else DB.bookings.unshift(updated);
return updated;
}

// Only reachable while the store hasn't responded yet (see bookingCardCust()/
// sheetBookingDetailCust()) - once accepted, the item's dates are held for
// this booking and the store may already be expecting payment, so the
// request no longer cancels; the RPC's own WHERE clause enforces the same
// cutoff server-side.
async function cancelBookingRequest(id){
  const updated = await callBookingRpc('cancel_booking_request', { p_booking_id: id }, id,
    "Couldn't cancel — the store may have already responded to this request");
  if(!updated) return;
  toast('Booking request cancelled'); render();
}

// Riders already coming to pick up at least one of this business's other
// orders (assigned - deliveryPersonId set - but not yet handed off, so
// status is still 'placed') - offering a new order directly to one of them
// (see offerOrderToRider()) bundles it onto a trip that's already happening
// instead of dropping it into the open pool for a different rider to claim
// separately. Deduped by rider, since the same rider could have more than
// one other order from this store in flight.
function ridersInFlightForBusiness(businessId, excludeOrderId){
  const seen = new Map();
  DB.orders.forEach(o=>{
    if(o.businessId!==businessId || o.id===excludeOrderId) return;
    if(!o.deliveryPersonId || o.status!=='placed') return;
    if(!seen.has(o.deliveryPersonId)) seen.set(o.deliveryPersonId, o.deliveryPersonName);
  });
  return [...seen.entries()].map(([id,name])=>({id,name}));
}

        <div class="field" style="margin:0; flex:1;"><input type="number" min="0" id="orderDiscount_${o.id}" placeholder="Discount (MVR)"></div>
        <button class="btn btn-outline btn-sm" style="flex-shrink:0;" onclick="applyOrderDiscount('${o.id}')">Apply</button>
      </div>
    </div>`;
  }
  const discountLine = o.discountAmount>0 ? `<div class="row between" style="margin-top:6px;"><span class="muted">Discount</span><span>-${money(o.discountAmount)}</span></div>` : '';
  const feeTBD = routeNeedsStoreCharge(o.route) && o.paymentStatus==='awaiting_approval';
  const deliveryLine = o.rentalItemId ? '' : `<div class="row between" style="margin-top:6px;"><span class="muted">Delivery fee</span><span>${feeTBD ? '—' : buyerPaidFee ? money(payoutAmt) : 'Free'}</span></div>`;
  // An 'on_return' rental's own o.total only ever holds the advance due at
  // checkout (see submitRentItem()) - the rental fee itself lives separately
  // in rentalFeeAmount, so it needs its own line here or the order would
  // look like it was worth far less than it actually is.
  const rentalFeeLine = (o.rentalItemId && o.rentalFeeTiming==='on_return') ? `<div class="row between" style="margin-top:6px;"><span class="muted">Rental fee ${o.rentalReturnFeeStatus==='collected'?'(collected on return)':'(due on return)'}</span><span>${money(o.rentalFeeAmount||0)}</span></div>` : '';
  return `
    <h2>Order #${o.id.slice(-5).toUpperCase()}</h2>
    <p class="muted" style="margin-bottom:8px;">${o.receiverName && o.receiverName!==o.customerName ? `${o.customerName} → ${o.receiverName}` : o.customerName} · ${new Date(o.createdAt).toLocaleString()}</p>
    ${contactHTML(o.customerPhone || o.receiverPhone, 'Customer')}
    ${o.status==='declined' ? '' : o.deliveryTargetType==='pickup' ? `
    <div class="glass card tight" style="margin-bottom:12px;">
      <p class="muted" style="font-size:.78em; margin-bottom:4px;">📦 Pickup from</p>
      <p style="font-weight:700;">${o.pickupLocation||'—'}</p>
    </div>` : o.receiverName ? `
    <div class="glass card tight" style="margin-bottom:12px;">
      <p class="muted" style="font-size:.78em; margin-bottom:4px;">${o.deliveryTargetType==='boat'?'🚤 Boat delivery':'📍 Receiver'}</p>
      <p style="font-weight:700;">${o.receiverName}</p>
      ${o.receiverPhone?`<p class="muted" style="font-size:.85em; margin-top:2px;">${o.receiverPhone}</p>`:''}
      ${o.receiverAddress?`<p class="muted" style="font-size:.85em; margin-top:2px;">${o.receiverAddress}</p>`:''}
      ${o.deliveryTargetType==='boat' && o.boatDepartureAt?`<p class="muted" style="font-size:.85em; margin-top:2px;">🕐 Departs ${fmtBoatDeparture(o.boatDepartureAt)}</p>`:''}
    </div>` : ''}
    <div class="glass card tight">${itemsList}<div class="divider"></div>
      <div class="row between"><span class="muted">Items subtotal</span><span>${money(o.itemsTotal!=null?o.itemsTotal:o.total-(buyerPaidFee?payoutAmt:0))}</span></div>
      ${discountLine}
      ${deliveryLine}
      ${rentalFeeLine}
      <div class="row between" style="margin-top:6px;"><strong>${o.rentalItemId && o.rentalFeeTiming==='on_return'?'Due now':'Total'}</strong><strong class="price">${money(o.total)}</strong></div>
    </div>
    <div style="margin-top:14px;">${actionArea}</div>
  `;
}
async function markRentalFulfilled(id){

// Shown once a rental's been handed over (picked up or delivered) and hasn't
// come back yet - the one step the app never had before, so a rented-out

// in the schema above). An 'on_return' order still owes its rental fee, so
// that needs collecting first via its own popup, same idea as markCash's
// cash-on-delivery popup for a normal order; an 'upfront' order already paid
// everything, so returning it is a single button with nothing left to collect.

// Only reached for an 'upfront' order (or one whose fee was somehow already
// collected) - nothing left to gather, so this skips the popup entirely.
async function markRentalReturned(id){

function sheetRentalReturn(){

async function confirmRentalReturn(id){

  const updated = await callOrderRpc('mark_rental_returned', { p_order_id: id, p_fee_collected: collected }, id,
    "Couldn't mark this returned — it may have changed");
  if(!updated) return;
  const item = DB.items.find(i=>i.id===updated.rentalItemId);
  if(item) item.stock += 1;

// Posts a normal (non-rental) order to the delivery-partner network - it only

// Offers (doesn't assign) a new order to a rider who's already picking up
// another of this business's orders - offer_order_to_rider() re-checks
// server-side that the rider still actually has one in flight, in case
// they've handed it off in the meantime. The rider still has to accept it
// (see acceptDeliveryOffer()/declineDeliveryOffer() below) before
// deliveryPersonId is ever set.
async function offerOrderToRider(orderId, riderId){
  const riderName = (DB.delivery.find(d=>d.id===riderId)||{}).name || 'the rider';
  const updated = await callOrderRpc('offer_order_to_rider', { p_order_id: orderId, p_rider_id: riderId }, orderId,
    `Couldn't offer this to ${riderName} — they may no longer have an order of yours in progress`);
  if(!updated) return;
  toast(`Sent to ${riderName} — waiting for them to accept`); render();
}

// Order-time discount: only offered while the customer hasn't paid yet
// (payment_status still pending_transfer/pending_cash - see apply_order_discount()
// in the schema above) - a flat MVR amount off the items subtotal, separate from
// any standing item.discountPercent already baked into the item's own price.
async function applyOrderDiscount(orderId){
  const amount = Number(val('orderDiscount_'+orderId));
  if(!(amount>0)){ toast('Enter a discount amount first', 'bad'); return; }
  const updated = await callOrderRpc('apply_order_discount', { p_order_id: orderId, p_discount: amount }, orderId,
    "Couldn't apply a discount — the customer may have already paid");
  if(!updated) return;
  toast(`Discount applied — new total ${money(updated.total)}`); render();
}
async function markOrderDeliveredByBusiness(id){
  const o = DB.orders.find(x=>x.id===id);
  const isBoat = o && o.deliveryTargetType==='boat';
  if(isBoat && !_handoffPhotoData){ toast('Take a photo of the handover to the boat first','bad'); return; }
  if(o && o.paymentMethod==='cash_to_delivery' && o.paymentStatus==='pending_cash'){
    if(isBoat && !_boatDeliveryPaid){
      const updated = await callOrderRpc('mark_order_delivered_by_business', { p_order_id: id, p_boat_photo_url: _handoffPhotoData }, id,
        "Couldn't update this order — it may have changed");
      _handoffPhotoData = null; _boatDeliveryPaid = true;
      if(!updated) return;
      toast('Marked as delivered — payment still pending'); render();
      return;
    }
    openSheet('markCash', id);
    return;
  }
  const updated = await callOrderRpc('mark_order_delivered_by_business', { p_order_id: id, p_boat_photo_url: isBoat ? _handoffPhotoData : null }, id,
    "Couldn't update this order — it may have changed");
  _handoffPhotoData = null;
  if(!updated) return;
  toast('Marked as delivered'); render();
}
// Shared by both the rider-assigned and self-delivery paths in
// orderDetailBizBody() - a photo of the package is required before the
// confirm button (disabled until one's chosen) actually flips the order to
// out_for_delivery. capture="environment" opens the phone's camera directly
// rather than a gallery picker, since the point is a fresh proof-of-handoff
// photo, not any existing image.
function handoffPhotoHTML(o, label, buttonText, onclickFn='markOrderOutForDelivery'){
  return `
  <div class="glass card tight" style="margin-top:10px;">
    <p class="muted" style="font-size:.82em; margin-bottom:8px;">${label}</p>
    <input type="file" accept="image/*" capture="environment" id="handoffPhotoFile_${o.id}" style="display:none;" onchange="previewHandoffPhoto(event,'${o.id}')">
    <label for="handoffPhotoFile_${o.id}" class="filebtn">📸 Take photo</label>
    <div class="slip-preview-wrap" id="handoffPhotoPreviewWrap_${o.id}" style="display:none; margin-top:10px;">
      <img id="handoffPhotoPreview_${o.id}" style="width:100%; border-radius:14px; display:block; max-height:200px; object-fit:cover;">

// Boat deliveries are commonly settled by a bank transfer made around the
// time the parcel reaches the boat, not cash handed to whoever's dropping it
// off - so unlike a normal cash-on-delivery order (always assumed to be
// cash, forced straight into sheetMarkCash()), a boat order still on
// cash_to_delivery/pending_cash gets an explicit choice right before the
// final "Mark delivered" tap: paid (cash in hand - open the cash-collection
// popup, same as any other cash order) or not yet (leave payment_status
// alone and just mark it delivered - the customer's expected to transfer
// instead, see markDelivered()/markOrderDeliveredByBusiness()). Once the
// customer switches to transfer themselves (paymentMethod is no longer
// cash_to_delivery), this never renders at all - nothing left for whoever's
// delivering it to decide, the business approves that from their own side.
let _boatDeliveryPaid = true;
function setBoatDeliveryPaid(id, paid){
  _boatDeliveryPaid = paid;
  const yes = document.getElementById('boatPaidTabYes_'+id);
  const no = document.getElementById('boatPaidTabNo_'+id);
  if(yes) yes.classList.toggle('active', paid);
  if(no) no.classList.toggle('active', !paid);
}
function boatPaymentChoiceHTML(o){
  if(o.paymentMethod!=='cash_to_delivery' || o.paymentStatus!=='pending_cash') return '';
  return `
  <div class="glass card tight" style="margin-top:10px;">
    <p class="muted" style="font-size:.82em; margin-bottom:8px;">Has the customer paid?</p>
    <div class="tabs">
      <button type="button" class="tab active" id="boatPaidTabYes_${o.id}" style="flex:1; text-align:center;" onclick="setBoatDeliveryPaid('${o.id}', true)">Paid (cash)</button>
      <button type="button" class="tab" id="boatPaidTabNo_${o.id}" style="flex:1; text-align:center;" onclick="setBoatDeliveryPaid('${o.id}', false)">Not yet (transfer)</button>
    </div>
  </div>`;
}
let _handoffPhotoData = null;
function previewHandoffPhoto(e, orderId){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    _handoffPhotoData = reader.result;
    const img = document.getElementById('handoffPhotoPreview_'+orderId);
    const wrap = document.getElementById('handoffPhotoPreviewWrap_'+orderId);
    if(img) img.src = _handoffPhotoData;
    if(wrap) wrap.style.display = 'block';
    const btn = document.getElementById('handoffConfirmBtn_'+orderId);
    if(btn) btn.disabled = false;
  };
  reader.readAsDataURL(f);
}

// Posts a "deliver"-fulfillment rental order to the delivery-partner network for
// a fee the store itself is offering to pay - a purely optional alternative to
// the store delivering it themselves, and entirely separate money from the
// rental payment (which the customer already paid, or will pay, straight to the
// store either way). Once posted, the job shows up for delivery partners same
// as any other unassigned order (see renderDelHome()).
async function offerRentalDelivery(orderId){

    "Couldn't send this to delivery partners — it may already have one assigned");
  if(!updated) return;
  toast('Sent to delivery partners'); render();

// Cash orders (rider owes the store) and bank-transfer orders (the store now
// owes the rider, once delivered) are opposite directions of the same "settle
// up with the delivery partner" job, so both sections live on this one screen.
// Payouts: what the store owes. Maldexpress's fee on each paid order
// (platform_fee_due until an admin marks it settled in Admin -> Fees) and each
// rider's delivery fee after delivery (payout_status 'pending' until the store
// marks it paid). Riders never collect cash, so there's no cash section.
function renderBizPayouts(biz){
  const mine = DB.orders.filter(o=>o.businessId===biz.id);
  const feeDue = mine.filter(o=>o.platformFeeDue!=null && Number(o.platformFeeDue)>0 && !o.feeSettledAt).sort((a,b)=>b.createdAt-a.createdAt);
  const feePaid = mine.filter(o=>o.platformFeeDue!=null && o.feeSettledAt);
  const feeTotal = round2(feeDue.reduce((a,o)=>a+Number(o.platformFeeDue||0),0));
  const riderDue = mine.filter(o=>o.payoutStatus==='pending' && o.deliveryPersonId);
  const riderPaid = mine.filter(o=>o.payoutStatus==='settled' && o.deliveryPersonId);
  const riderTotal = round2(riderDue.reduce((a,o)=>a+Number(payoutAmountFor(o)||0),0));
  const byRider = {};
  riderDue.forEach(o=>{ const k = o.deliveryPersonId; (byRider[k] = byRider[k] || { name:o.deliveryPersonName||'Rider', orders:[], total:0 }); byRider[k].orders.push(o); byRider[k].total = round2(byRider[k].total + Number(payoutAmountFor(o)||0)); });
  const st = DB.settings || {};
  const hasBank = !!String(st.bankAccountNumber||'').trim();
  document.getElementById('app').innerHTML = wrapShell('business','bizPayouts', `
    ${topbar('Payouts', 'What you owe Maldexpress and riders')}
    <div style="padding:4px 0 0;">
      <div class="owe-sum">
        <div class="owe-tile ${feeTotal>0?'due':''}"><span>You owe Maldexpress</span><strong>${money(feeTotal)}</strong><small>${feeDue.length} order${feeDue.length===1?'':'s'}</small></div>
        <div class="owe-tile ${riderTotal>0?'due':''}"><span>You owe riders</span><strong>${money(riderTotal)}</strong><small>${riderDue.length} deliver${riderDue.length===1?'y':'ies'}</small></div>
      </div>

      <div class="section" style="margin-top:18px;">
        <div class="section-head"><h2>Pay Maldexpress</h2></div>
        ${feeTotal>0 ? `
        <div class="glass card">
          <p class="muted" style="font-size:.86em;">Maldexpress's fee on your paid orders. Transfer the total, then tell us so we can mark it paid.</p>
          ${hasBank ? `<div class="acct-box" style="margin-top:10px;"><div class="lbl">Transfer ${money(feeTotal)} to</div><div class="val">${acctValHTML(st.bankAccountName, st.bankAccountNumber)}</div></div>` : `<p class="muted" style="font-size:.84em; margin-top:8px;">Maldexpress's bank account isn't set yet. Ask Live support how to pay.</p>`}
          <button class="btn btn-primary" style="margin-top:12px;" onclick="openNewTicket(${escapeAttr(JSON.stringify({ topic:'payment', subject:'Fee payment '+money(feeTotal), body:'I transferred '+money(feeTotal)+' for the Maldexpress fees on '+feeDue.length+' order'+(feeDue.length===1?'':'s')+'. Store: '+biz.name }))})">I've paid. Tell Maldexpress</button>
          <details class="owe-list"><summary>Fees by order (${feeDue.length})</summary>
            ${feeDue.map(o=>`<button class="owe-row" onclick="openOrderDetailBiz('${o.id}')"><span>#${o.id.slice(-5).toUpperCase()} · ${fmtDateShort(new Date(o.createdAt).toISOString().slice(0,10))}</span><span>${money(o.platformFeeDue)}</span></button>`).join('')}
          </details>
        </div>` : `<div class="empty"><span class="ic">✅</span>Nothing owed to Maldexpress${feePaid.length?` · ${feePaid.length} fee${feePaid.length===1?'':'s'} paid`:''}</div>`}
      </div>

      <div class="section" style="margin-top:22px;">
        <div class="section-head"><h2>Pay delivery riders</h2></div>
        ${Object.keys(byRider).length ? Object.entries(byRider).map(([rid,r])=>{
          const d = DB.delivery.find(x=>x.id===rid);
          return `<div class="glass card">
            <div class="row between"><h3>${escapeAttr(r.name)}</h3><span class="status-pill mid">You owe ${money(r.total)}</span></div>
            <p class="muted" style="font-size:.84em; margin-top:4px;">Delivery fee for ${r.orders.length} deliver${r.orders.length===1?'y':'ies'}. Transfer to the rider's account, then mark it paid.</p>
            ${(DB.riderBanks||{})[rid] ? `<div class="acct-box" style="margin-top:10px;"><div class="lbl">Pay ${money(r.total)} to${DB.riderBanks[rid].bankName?' · '+escapeAttr(DB.riderBanks[rid].bankName):''}</div><div class="val">${acctValHTML(DB.riderBanks[rid].accountName, DB.riderBanks[rid].accountNumber)}</div></div>` : `<p class="muted" style="font-size:.8em; margin-top:8px;">This rider hasn't added a bank account yet. Contact them.</p>`}
            ${d && d.phone ? contactHTML(d.phone, r.name) : ''}
            <details class="owe-list"><summary>Deliveries (${r.orders.length})</summary>
              ${r.orders.map(o=>`<div class="owe-row"><span>#${o.id.slice(-5).toUpperCase()} · ${money(payoutAmountFor(o))}</span><button class="link-btn" onclick="markPayoutPaid('${o.id}')">Mark paid</button></div>`).join('')}
            </details>
            <button class="btn btn-good btn-sm" style="width:100%; margin-top:10px;" onclick="markRiderPaidAll('${rid}')">Mark all ${money(r.total)} paid to ${escapeAttr(r.name)}</button>
          </div>`; }).join('') : `<div class="empty"><span class="ic">🛵</span>Nothing owed to riders${riderPaid.length?` · ${riderPaid.length} paid`:''}</div>`}
      </div>
    </div>
  `);
}
async function markRiderPaidAll(riderId){
  const biz = currentBiz();
  const list = DB.orders.filter(o=>biz && o.businessId===biz.id && o.payoutStatus==='pending' && o.deliveryPersonId===riderId);
  let ok = 0;
  for(const o of list){ const u = await callOrderRpc('mark_payout_paid', { p_order_id: o.id }, o.id); if(u) ok++; }
  toast(ok===list.length ? `Marked ${ok} deliver${ok===1?'y':'ies'} paid` : `${ok} of ${list.length} marked paid`, ok===list.length?undefined:'bad'); render();
}
function cashPayoutCard(o){
  const cutAmt = Math.round(cashCutAmount(o));
  const owed = o.total - cutAmt;
  let pill = o.paymentStatus==='settled' ? `<span class="status-pill ok">Settled</span>` : o.paymentStatus==='cash_collected' ? `<span class="status-pill mid">Rider owes you ${money(owed)}</span>` : `<span class="status-pill wait">Not delivered yet</span>`;
  return `
  <div class="glass card" onclick="openOrderDetailBiz('${o.id}')">
    <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3>${pill}</div>
    <p class="muted" style="font-size:.85em; margin-top:4px;">${o.deliveryPersonName} collected ${money(o.total)} cash</p>
    <div class="row between" style="margin-top:8px;"><span class="muted">Rider's cut</span><span>${money(cutAmt)}</span></div>
    ${cutAmt===0 ? `<p class="muted" style="font-size:.78em; margin-top:6px;">No delivery fee was collected — you pay the rider's payout separately below.</p>` : ''}
    ${o.paymentStatus==='cash_collected' ? `<button class="btn btn-good btn-sm" style="margin-top:10px; width:100%;" onclick="event.stopPropagation(); settlePayout('${o.id}')">Confirm received from rider</button>` : ''}

// Buy-now and rental items only - auctions need their own duration/increment
// setup, so those still go through the usual + button one at a time. A real
// file download (see downloadBulkImportTemplate()) works fine on a normally
// hosted page - filled in and saved as .csv, then uploaded back here.
const BULK_IMPORT_HEADERS = ['Name','Price','Stock','Category','Listing type (buy_now or rental)','Free delivery (yes/no)','Extra delivery fee','Discount percent','Rental deposit','Rental fulfillment (pickup or deliver)','Pickup location','Description'];
const BULK_IMPORT_EXAMPLE = ['Coconut Bondi Cake','180','8','Bakery','buy_now','yes','0','0','','','','Freshly baked - ask about flavors'];
// Builds the same CSV text either downloaded as the template or parsed back
// on upload - kept as one function so the two can never drift apart.
function bulkImportCsvText(){
  return [BULK_IMPORT_HEADERS.join(','), BULK_IMPORT_EXAMPLE.map(v=>/[,"]/.test(v)?`"${v.replace(/"/g,'""')}"`:v).join(',')].join('\n');
}
function downloadBulkImportTemplate(){
  const blob = new Blob([bulkImportCsvText()], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'maldexpress-bulk-import-template.csv';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}
const BULK_COLUMN_ALIASES = {
  name:['name','itemname','item'], price:['price'], stock:['stock','qty','quantity'],
  category:['category','cat'], listingtype:['listingtype','listing','type'],
  freedelivery:['freedelivery','delivery'], extradeliveryfee:['extradeliveryfee','extrafee','extradeliverycharge'],
  discountpercent:['discountpercent','discount'], rentaldeposit:['rentaldeposit','deposit'],
  rentalfulfillment:['rentalfulfillment','fulfillment'], pickuplocation:['pickuplocation','pickup'],
  description:['description','desc','details']
};
function sheetBizBulkImport(){
  return `
  <h2>Bulk add items from a spreadsheet</h2>
  <p class="muted" style="font-size:.85em; margin-bottom:10px;">Download the template below, fill in a row per item in Excel, Google Sheets, Numbers — anything that can save as CSV, save it as .csv, then upload it here.</p>
  <button class="btn btn-outline" style="width:100%;" onclick="downloadBulkImportTemplate()">⬇️ Download CSV template</button>
  <p class="muted" style="font-size:.78em; margin-top:8px;">The template's second row is an example item — replace it (or add more rows after it) with your own. Only Name and Price are required; leave anything else blank for sensible defaults.</p>
  <div class="field" style="margin-top:14px;">
    <input type="file" accept=".csv,text/csv" id="bulkImportFile" style="display:none;" onchange="handleBulkImportFile(event)">
    <label for="bulkImportFile" class="filebtn">📄 Tap to choose a .csv file</label>
  </div>
  <div id="bulkImportPreview"></div>
  <button class="btn btn-outline" style="width:100%; margin-top:14px;" onclick="closeSheet()">Close</button>`;
}
// Minimal CSV parser - handles quoted fields (including embedded commas and
// escaped "" quotes) and both \n and \r\n line endings. Good enough for a
// flat list of items; not meant to handle formulas or multi-sheet exports.
function parseCsv(text){
  const rows = []; let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else inQuotes=false; }
      else field += c;
    } else if(c==='"') inQuotes = true;
    else if(c===','){ row.push(field); field=''; }
    else if(c==='\n' || c==='\r'){
      if(c==='\r' && text[i+1]==='\n') i++;
      row.push(field); field='';
      if(row.some(v=>v.trim()!=='')) rows.push(row);
      row = [];
    } else field += c;
  }
  if(field!=='' || row.length){ row.push(field); if(row.some(v=>v.trim()!=='')) rows.push(row); }
  return rows;
}
function normalizeHeader(h){ return String(h||'').trim().toLowerCase().replace(/[^a-z0-9]/g,''); }
let _bulkImportStaged = null;
function handleBulkImportFile(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const rows = parseCsv(String(reader.result||''));
    e.target.value = '';
    if(rows.length < 2){ toast('That file has no data rows','bad'); return; }
    const headerRow = rows[0].map(normalizeHeader);
    const colIndex = {};
    Object.keys(BULK_COLUMN_ALIASES).forEach(key=>{
      const idx = headerRow.findIndex(h=>BULK_COLUMN_ALIASES[key].includes(h));
      if(idx>=0) colIndex[key] = idx;
    });
    if(colIndex.name===undefined || colIndex.price===undefined){
      toast('Could not find a "Name" and "Price" column in that file','bad'); return;
    }
    const biz = currentBiz(); const t = tierInfo(biz);
    const remaining = Math.max(0, t.limit - DB.items.filter(i=>i.businessId===biz.id).length);
    const items = [], skipped = [];
    for(let r=1; r<rows.length; r++){
      const row = rows[r];
      const get = key => colIndex[key]!==undefined ? (row[colIndex[key]]||'').trim() : '';
      const name = get('name'); const price = Number(get('price'));
      if(!name || !price || price<=0){ skipped.push(`Row ${r+1}: needs a name and a price`); continue; }
      if(items.length >= remaining){ skipped.push(`Row ${r+1}: over the ${t.limit}-item limit`); continue; }
      const listingType = /rent/i.test(get('listingtype')) ? 'rental' : 'buy_now';
      const freeStr = get('freedelivery').toLowerCase();
      const freeDelivery = freeStr==='' ? true : ['yes','y','true','1'].includes(freeStr);
      items.push({
        id: uid('it'), businessId: biz.id, name, price,
        stock: Math.max(0, Number(get('stock')||0) || 0),
        category: get('category') || 'General',
        imageUrl: null, listingType, freeDelivery,
        extraDeliveryFee: Math.max(0, Number(get('extradeliveryfee')||0) || 0),
        discountPercent: listingType==='buy_now' ? Math.min(90, Math.max(0, Number(get('discountpercent')||0) || 0)) : 0,
        rentalDeposit: listingType==='rental' ? Math.max(0, Number(get('rentaldeposit')||0) || 0) : 0,
        rentalFulfillment: listingType==='rental' ? (/deliv/i.test(get('rentalfulfillment')) ? 'deliver' : 'pickup') : 'deliver',
        pickupLocation: get('pickuplocation'), rentalAvailability:'now', availableFrom:'',
        description: get('description')
      });
    }
    _bulkImportStaged = items;
    const box = document.getElementById('bulkImportPreview');
    if(box) box.innerHTML = `
      <div class="card tight" style="margin-top:12px; background:rgba(61,220,151,.1); border:1px solid rgba(61,220,151,.3);">
        <p style="font-size:.9em;">${items.length} item${items.length===1?'':'s'} ready to add${skipped.length?`, ${skipped.length} row${skipped.length===1?'':'s'} skipped`:''}.</p>
        ${skipped.length? `<p class="muted" style="font-size:.78em; margin-top:6px;">${skipped.slice(0,5).join(' · ')}${skipped.length>5?` · +${skipped.length-5} more`:''}</p>`:''}
      </div>
      ${items.length? `<button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="confirmBulkImport()">Add ${items.length} item${items.length===1?'':'s'}</button>`:''}
    `;
  };
  reader.readAsText(f);
}
function confirmBulkImport(){
  if(!_bulkImportStaged || !_bulkImportStaged.length) return;
  const items = _bulkImportStaged;
  DB.items.push(...items);
  saveDB('items', items);
  _bulkImportStaged = null;
  closeSheet();
  toast(`${items.length} item${items.length===1?'':'s'} added — add photos for them anytime from Store settings`);
  render();
}

function onAddrIslandChange(k){ const box = document.getElementById('aa_zone_box'); if(box) box.classList.toggle('hidden', !(k && isGreaterMale(k) && k!=='Villimalé')); const sel=document.getElementById('aa_zone'); if(sel && k==='Malé') sel.value='male'; }

      <option value="hulhumale2" ${a&&a.zone==='hulhumale2'?'selected':''}>Hulhumalé Phase 2</option>
    </select>
  </div>
  <div class="field"><label for="aa_address">House / street</label><input id="aa_address" placeholder="e.g. H. Blue Lagoon, Majeedhee Magu" value="${escapeAttr(a?a.address:'')}"></div>`}
