  <h2>${copy.title}</h2>
  <div class="policy-content">
    <div class="draft-note">⚠ Draft policy, pending final legal review before launch.</div>
    ${copy.html}
    <h3>Contact us</h3>
    <p>For order-specific issues, message the store you ordered from via My Orders. For account or platform-level issues, a dedicated Maldexpress support channel will be published here before launch.</p>
  </div>
  <button class="btn btn-primary" style="margin-top:18px;" onclick="openSheet('signUp', {intent:'${_signupIntent||''}'})">Back to sign up</button>`;
}
function sheetVerifyEmail(){
  return `
  <h2>Verify your email</h2>
  <p class="muted">We sent a 6-digit code to <strong>${_pendingVerifyEmail}</strong>. Enter it below to finish creating your account.</p>
  <div class="field" style="margin-top:14px;"><label>Verification code</label><input id="ve_code" placeholder="123456"></div>
  <button class="btn btn-primary" onclick="submitVerifyCode()">Verify</button>
  <button class="link-btn" style="margin-top:12px;" onclick="resendVerifyCode()">Resend code</button>`;
}
async function submitVerifyCode(){
  const code = val('ve_code');
  if(!code){ toast('Enter the verification code','bad'); return; }
  const { data, error } = await sb.auth.verifyOtp({ email: _pendingVerifyEmail, token: code, type: 'signup' });
  if(error){ toast(error.message,'bad'); return; }
  _pendingSignupUserId = data.user ? data.user.id : (data.session && data.session.user ? data.session.user.id : null);
  toast("Account verified — you're signed in!");
  // If a valid mobile number was already captured on the sign-up form, submit it
  // silently here and skip straight past setupMobile - it only needs to be shown
  // as a fallback when no phone was given up front, or it turns out to be taken.
  if(_pendingSignupPhone && /^[79]\d{6}$/.test(_pendingSignupPhone)){
    const userId = _pendingSignupUserId || state.customerId;
    const email = _pendingVerifyEmail || state.customerEmail;
    const { error: profileErr } = await sb.from('user_profiles').insert({ user_id: userId, phone: _pendingSignupPhone, email });
    _pendingSignupPhone = null;
    if(!profileErr){
      _pendingVerifyEmail = null; _pendingSignupUserId = null;
      state.sheet = null; state.sheetData = null;
      resolvePendingIntent();
      return;
    }
  }
  openSheet('setupMobile');
}
async function resendVerifyCode(){
  const { error } = await sb.auth.resend({ type: 'signup', email: _pendingVerifyEmail });
  if(error){ toast(error.message,'bad'); return; }
  toast('Code resent — check your email!');
}
function sheetSetupMobile(){
  return `
  <h2>Add your mobile number</h2>
  <p class="muted">Signed up as: <strong>${_pendingVerifyEmail || state.customerEmail}</strong></p>
  <div class="field" style="margin-top:14px;"><label>Mobile number</label><input id="sm_phone" placeholder="7XXXXXX"></div>
  <button class="btn btn-primary" style="margin-top:14px;" onclick="submitMobileNumber()">Save</button>
  <button class="link-btn" style="margin-top:12px; display:block; width:100%; text-align:center;" onclick="skipMobileSetup()">Skip for now</button>`;
}
async function submitMobileNumber(){
  const phone = val('sm_phone');
  if(!/^[79]\d{6}$/.test(phone)){ toast('Enter a valid mobile number','bad'); return; }
  const userId = _pendingSignupUserId || state.customerId;
  const email = _pendingVerifyEmail || state.customerEmail;
  const { error } = await sb.from('user_profiles').insert({ user_id: userId, phone, email });
  if(error){
    if(error.code==='23505' || /duplicate/i.test(error.message)) toast('That mobile number is already registered to another account','bad');
    else toast('Could not save: '+error.message,'bad');
    return;
  }
  _pendingVerifyEmail = null; _pendingSignupUserId = null;
  state.sheet = null; state.sheetData = null;
  toast('Mobile number saved!');
  resolvePendingIntent();
}
// Mobile number is only used as an alternate sign-in identifier (resolve_login_email) -
// email+password already works without it - so this sheet otherwise having no close
// button and no backdrop-dismiss would trap a user who doesn't have one handy, or who
// hits a phone number already claimed by another account, with no way out at all.
function skipMobileSetup(){
  _pendingVerifyEmail = null; _pendingSignupUserId = null;
  state.sheet = null; state.sheetData = null;
  toast("Skipped — we'll ask again next time you sign in");
  resolvePendingIntent();
}
async function signOutCustomer(){
  if(sb) await sb.auth.signOut();
  applySession(null);
  state.role='customer'; state.activeBizId=null; state.activeDelId=null; state.drawerOpen=false;
  go('custHome');
  toast('Signed out');
}
let _selectedPay = 'transfer';
let _selectedZone = 'male';
function selectPay(m){ _selectedPay=m; document.getElementById('pay_transfer').style.outline = m==='transfer'?'2px solid var(--coral)':'none'; document.getElementById('pay_cash').style.outline = m==='cash_to_delivery'?'2px solid var(--coral)':'none'; }
function placeOrder(bizId){
  const entries = Object.entries(state.cart);
  const cartLines = entries.map(([id,qty])=>{ const it = DB.items.find(i=>i.id===id); return {it,qty}; }).filter(x=>x.it);
  const lines = cartLines.map(l=>({itemId:l.it.id, name:l.it.name, price:l.it.price, qty:l.qty}));
  const itemsTotal = lines.reduce((s,l)=>s+l.price*l.qty,0);
  const biz = DB.businesses.find(b=>b.id===bizId);
  const name = val('c_name')||state.customerName; const phone = val('c_phone');
  if(!lines.length){ toast('Your cart is empty','bad'); return; }
  state.customerName = name;
  const buyerPaysFee = cartBuyerPaysFee(cartLines);
  const fee = zoneFee(_selectedZone);
  const order = {
    id: uid('ord'), businessId: biz.id, businessName: biz.name,
    customerId: state.customerId, customerEmail: state.customerEmail,
    customerName: name, customerPhone: phone, items: lines,
    itemsTotal, deliveryFee: buyerPaysFee ? fee : 0, total: itemsTotal + (buyerPaysFee?fee:0), zone:_selectedZone,
    deliveryType: buyerPaysFee ? 'zone' : 'free',
    // The delivery partner is always paid the zone's flat fee, regardless of
    // whether the buyer was charged for it.
    deliveryPartnerPayout: fee, payoutStatus: null,
    deliveryPersonId:null, deliveryPersonName:null,
    paymentMethod: _selectedPay,
    paymentStatus: _selectedPay==='transfer' ? 'pending_transfer' : 'pending_cash',
    status:'placed', createdAt: Date.now(), slipDataUrl:null
  };
  DB.orders.push(order); saveDB('orders');
  state.cart = {};
  closeSheet();
  go('custOrders');
  toast('Order placed!');
}

function renderCustOrders(){
  if(sb && !state.authed){
    document.getElementById('app').innerHTML = wrapShell('customer','custOrders', `
      ${topbar('My orders')}
      <div style="padding:4px 16px 0;">
        <div class="empty">
          <span class="ic">🔒</span>Sign in with your email to see your orders
          <button class="btn btn-primary" style="margin-top:16px;" onclick="openSheet('signIn')">Sign in</button>
        </div>
      </div>
    `);
    return;
  }
  const mine = sb ? DB.orders.filter(o=>o.customerId===state.customerId) : DB.orders;
  const sorted = mine.sort((a,b)=>b.createdAt-a.createdAt);
  document.getElementById('app').innerHTML = wrapShell('customer','custOrders', `
    ${topbar('My orders')}
    <div style="padding:4px 16px 0;">
      ${sorted.length? sorted.map(o=>custOrderCard(o)).join('') : `<div class="empty"><span class="ic">🧾</span>No orders yet — go browse a store!</div>`}
    </div>
  `);
}
function custOrderCard(o){
  const biz = DB.businesses.find(b=>b.id===o.businessId);
  if(o.paymentStatus==='awaiting_completion'){
    return `
    <div class="glass card">
      <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3>${paymentStatusPill(o)}</div>
      <p class="muted" style="font-size:.85em; margin:4px 0 8px;">${o.businessName} · Won at auction for ${money(o.itemsTotal)}</p>
      <button class="btn btn-primary btn-sm" style="width:100%;" onclick="openSheet('completeAuctionOrder','${o.id}')">Complete your order</button>
    </div>`;
  }
  const showAcct = o.paymentMethod==='transfer' && o.paymentStatus!=='paid';
  return `
  <div class="glass card">
    <div class="row between"><h3>#${o.id.slice(-5).toUpperCase()}</h3>${paymentStatusPill(o)}</div>
    <p class="muted" style="font-size:.85em; margin:4px 0 8px;">${o.businessName} · ${money(o.total)}</p>
    ${showAcct ? `
      <div class="acct-box"><div class="lbl">Pay to</div><div class="val">${biz.accountName} · ${biz.accountNumber}</div></div>
      ${o.paymentStatus==='pending_transfer' ? `<button class="btn btn-primary btn-sm" style="width:100%; margin-top:10px;" onclick="openSheet('uploadSlip','${o.id}')">Upload transfer slip</button>` : `<p class="muted" style="font-size:.8em; margin-top:8px;">Slip uploaded — waiting on store to confirm</p>`}
    ` : ''}
    ${o.paymentMethod==='cash_to_delivery' && o.paymentStatus==='pending_cash' ? `<p class="muted" style="font-size:.82em;">Have ${money(o.total)} cash ready for your delivery partner.</p>` : ''}
    ${o.deliveryType==='free' ? `<p class="muted" style="font-size:.8em; margin-top:6px;">🚚 Free delivery — no delivery fee charged</p>` : ''}
  </div>`;
}
function sheetUploadSlip(){
  const o = DB.orders.find(x=>x.id===state.sheetData);
  return `
  <h2>Upload transfer slip</h2>
  <p class="muted">Order #${o.id.slice(-5).toUpperCase()} · ${money(o.total)}</p>
  <div class="field" style="margin-top:14px;">
    <label>Slip / screenshot</label>
    <input type="file" accept="image/*" id="slipFile" style="display:none;" onchange="previewSlip(event)">
    <label for="slipFile" class="filebtn">📎 Tap to choose an image</label>
    <img id="slipPreview" style="width:100%; border-radius:14px; margin-top:10px; display:none; max-height:200px; object-fit:cover;">
  </div>
  <button class="btn btn-primary" style="margin-top:14px;" onclick="submitSlip('${o.id}')">Submit for approval</button>`;
}
let _slipData = null;
function previewSlip(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{ _slipData = reader.result; const img=document.getElementById('slipPreview'); img.src=_slipData; img.style.display='block'; };
  reader.readAsDataURL(f);
}
function submitSlip(id){
  const o = DB.orders.find(x=>x.id===id);
  o.paymentStatus='slip_uploaded'; o.slipDataUrl = _slipData;
  saveDB('orders'); _slipData=null; closeSheet(); toast('Slip submitted — waiting for store approval'); render();
}

/* =================== INIT =================== */
// Runs after any sign-in (initial load or a later auth state change alike), then
// resumes a pending business/delivery signup intent - but only once any forced
// setupMobile step it triggered has been dealt with (submitMobileNumber()/
// skipMobileSetup() call resolvePendingIntent() themselves once that happens).
async function handlePostAuth(){
  if(state.adminMode){ await checkAdminStatus(); return; }
  await checkMobileProfile();
  // Excludes 'verifyEmail' too, not just 'setupMobile' - onAuthStateChange can fire
  // before submitVerifyCode()'s own openSheet('setupMobile') call runs (event ordering
  // relative to the awaited verifyOtp() call isn't guaranteed), which would otherwise
  // resolve the pending intent while the user is still mid-verification.
  if(state.sheet!=='setupMobile' && state.sheet!=='verifyEmail') resolvePendingIntent();
}
(async function init(){
  await loadDB();
  seedIfEmpty();
  if(sb){
    const { data:{ session } } = await sb.auth.getSession();
    applySession(session);
    if(state.authed) await handlePostAuth();
    sb.auth.onAuthStateChange(async (_event, session)=>{
      applySession(session);
      if(state.authed) await handlePostAuth();
      render();
    });
  }
  render();
})();
</script>
