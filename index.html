<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Maldexpress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Real Supabase client (replaces the in-browser mock used for the Claude
     Artifact preview, whose network calls that sandbox's CSP blocks anyway -
     this loads the genuine supabase-js library so SUPABASE_URL/ANON_KEY
     below (already pointing at the real Maldexpress project) actually work
     once this file is hosted anywhere outside that sandbox, e.g. GitHub Pages. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg1:#04222c;
    --bg2:#0a4a5c;
    --bg3:#0f7a8c;
    --lagoon:#22b8c8;
    --coral:#ff8a5c;
    --coral-dk:#e8663a;
    --sand:#f6ecd9;
    --ink:#eafdff;
    --ink-dim:rgba(234,253,255,.68);
    --glass:rgba(255,255,255,.10);
    --glass-brd:rgba(255,255,255,.22);
    --glass-hi:rgba(255,255,255,.18);
    --danger:#ff6b6b;
    --good:#3ddc97;
    --warn:#ffcf5c;
    --radius:22px;
    --fs:11px;
    font-size:var(--fs);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* Locks the whole app from ever sliding sideways - overflow-x:hidden on
     body alone isn't fully reliable on iOS Safari, so it's set on html too,
     plus overscroll-behavior-x to kill the rubber-band/bounce feel at the
     left/right edges. The intentional horizontal-scrolling strips (Featured
     carousel, category rows, the category checklist) are unaffected - each
     of those scrolls within its own container, which this doesn't touch. */
  html,body{height:100%; max-width:100%; overflow-x:hidden; overscroll-behavior-x:none;}
  /* "Minimal Deep Ocean": same navy/teal palette as before, simplified to one
     smooth gradient plus a single larger, softer glow - no diagonal line
     texture/drift animation and no second coral glow competing with it, for a
     cleaner, more premium-feeling backdrop. */
  body{
    margin:0;
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--ink);
    min-height:100vh;
    background:
      radial-gradient(1500px 1100px at 50% -15%, rgba(34,184,200,.26), transparent 62%),
      linear-gradient(165deg, var(--bg1), var(--bg2) 55%, var(--bg3) 130%);
    background-attachment:fixed;
    overflow-x:hidden;
    font-size:1rem;
  }
  h1,h2,h3,.display{font-family:'Baloo 2',sans-serif; letter-spacing:.2px;}
  h1{font-size:1.9em; font-weight:700; margin:0;}
  h2{font-size:1.25em; font-weight:600; margin:0 0 .6em;}
  h3{font-size:1.05em; font-weight:600; margin:0;}
  p{margin:0; line-height:1.5;}
  button{font-family:inherit; cursor:pointer;}
  /* iOS Safari auto-zooms the whole page on focus when an input's computed
     font-size is under 16px - max() keeps every field at least 16px regardless
     of the app's own text-size setting (which can go smaller), which is what
     actually stops the zoom-on-keyboard-open behavior; the maximum-scale/
     user-scalable=no on the viewport meta above is the backstop for pinch-zoom
     everywhere else. */
  input,select,textarea{font-family:inherit; font-size:max(16px, 1em);}
  a{color:inherit;}

  .glass{
    background:var(--glass);
    border:1px solid var(--glass-brd);
    border-radius:var(--radius);
    backdrop-filter:blur(22px) saturate(140%);
    -webkit-backdrop-filter:blur(22px) saturate(140%);
    box-shadow:0 8px 32px rgba(0,10,15,.28), inset 0 1px 0 rgba(255,255,255,.15);
  }

  /* ---------- App shell ---------- */
  #app{max-width:520px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:92px;}
  /* On a wide (desktop-width) screen this reads as a plain website unless the
     centered mobile-width column is visually set apart from the page background
     behind it - a subtle side border + drop shadow does that without touching
     any layout/positioning (the bottom-nav, sheets, drawer and toast all stay
     position:fixed and centered the same way they already are, so nothing about
     how the app behaves changes, only how the column reads against the backdrop
     on a big screen). On an actual phone-width screen nothing changes at all -
     it's the full-bleed mobile app view exactly as before. */
  @media (min-width:641px){
    #app{
      border-left:1px solid var(--glass-brd); border-right:1px solid var(--glass-brd);
      box-shadow:0 0 90px rgba(0,0,0,.4);
    }
  }

  /* Landing */
  .landing{min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:28px 22px;}
  .landing-mark{text-align:center; margin-bottom:36px;}
  .landing-mark h1{font-size:2.1em;}
  .landing-mark p{color:var(--ink-dim); margin-top:6px;}
  .role-card{
    padding:20px 20px; margin-bottom:14px; display:flex; align-items:center; gap:16px;
    transition:transform .18s ease, background .18s ease;
  }
  .role-card:active{transform:scale(.98);}
  .role-card .ic{
    width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:1.5em; background:linear-gradient(145deg, rgba(255,255,255,.28), rgba(255,255,255,.06));
    border:1px solid var(--glass-brd); flex-shrink:0;
  }
  .role-card .txt{flex:1; min-width:0;}
  .role-card .txt h3{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .role-card .txt small{color:var(--ink-dim); font-size:.85em;}
  .role-card .arrow{color:var(--coral); font-size:1.3em; flex-shrink:0;}

  /* Header */
  .topbar{
    position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px;
    padding:16px 18px; margin-bottom:6px;
  }
  .topbar .iconbtn{
    width:42px; height:42px; border-radius:14px; border:1px solid var(--glass-brd); background:var(--glass);
    display:flex; align-items:center; justify-content:center; font-size:1.15em; color:var(--ink); flex-shrink:0;
  }
  .topbar .titles{flex:1; min-width:0;}
  .topbar .titles h1{font-size:1.15em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar .titles .sub{font-size:.78em; color:var(--ink-dim);}
  .badge{
    padding:3px 10px; border-radius:999px; font-size:.72em; font-weight:700; letter-spacing:.3px;
    border:1px solid var(--glass-brd);
  }
  .badge.free{background:rgba(255,207,92,.18); color:var(--warn);}
  .badge.pro{background:rgba(61,220,151,.18); color:var(--good);}

  main{padding:0 16px;}
  .section{margin-bottom:20px;}
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .section-head h2{margin:0;}
  .link-btn{color:var(--lagoon); font-size:.9em; font-weight:700; background:none; border:none; padding:4px;}

  /* Cards */
  .card{padding:16px; margin-bottom:12px;}
  .card.tight{padding:14px 16px;}
  .row{display:flex; align-items:center; gap:12px;}
  .row.between{justify-content:space-between;}
  .stack{display:flex; flex-direction:column; gap:10px;}
  .muted{color:var(--ink-dim);}
  .price{color:var(--coral); font-weight:800;}

  .item-card{padding:14px; display:flex; gap:12px; align-items:center; margin-bottom:10px;}
  .item-thumb{
    position:relative; width:56px; height:56px; border-radius:14px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:1.5em;
    background:linear-gradient(145deg, rgba(255,138,92,.35), rgba(34,184,200,.25));
    border:1px solid var(--glass-brd); overflow:hidden;
  }
  .item-thumb img{width:100%; height:100%; object-fit:cover;}
  .item-info{flex:1; min-width:0;}
  .item-info h3{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  .qty-ctrl{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .qty-ctrl button{
    width:24px; height:24px; border-radius:8px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--ink); font-size:.95em;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .qty-ctrl button:active{transform:scale(.9);}

  /* Cart line select circle - sits in front of the card (thumb/info/qty-ctrl
     unchanged after it), thin white outline always, filled in with a thin white
     checkmark only when selected. */
  .cart-check-circle{
    width:22px; height:22px; flex-shrink:0; border:none; background:none; padding:0;
    display:flex; align-items:center; justify-content:center;
  }
  .cart-check-circle:active{transform:scale(.9);}

  /* Buttons */
  .btn{
    border:none; border-radius:16px; padding:13px 18px; font-weight:700; font-size:.95em;
    display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.97);}
  .btn-primary{background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005; box-shadow:0 6px 18px rgba(255,138,92,.35);}
  .btn-ghost{background:var(--glass); border:1px solid var(--glass-brd); color:var(--ink);}
  .btn-outline{background:transparent; border:1px solid var(--glass-brd); color:var(--ink);}
  .btn-good{background:linear-gradient(135deg, #4de3a8, #23b47c); color:#04241a;}
  .btn-sm{padding:9px 14px; font-size:.85em; width:auto;}
  .btn[disabled]{opacity:.4; pointer-events:none;}

  .fab{
    position:fixed; right:20px; bottom:110px; z-index:25;
    width:58px; height:58px; border-radius:50%; border:none;
    background:linear-gradient(135deg, var(--coral), var(--coral-dk)); color:#241005;
    font-size:1.6em; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 26px rgba(255,138,92,.45); max-width:520px; margin:0 auto;
  }

  /* Cart's total + Checkout button: a fixed bar pinned just above the bottom
     nav (same 78px-ish clearance as .toast-wrap) instead of scrolling away with
     the item list, so it's always reachable without scrolling down. */
  .cart-checkout-bar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:84px; z-index:28;
    width:calc(100% - 32px); max-width:488px; padding:14px 16px;
  }

  /* Bottom nav */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:14px; z-index:30;
    max-width:480px; margin:0 auto; padding:0 20px;
  }
  .bottomnav .bar{
    display:flex; justify-content:space-around; padding:10px 6px; border-radius:24px;
  }
  .navbtn{
    background:none; border:none; color:var(--ink-dim); display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:.68em; font-weight:700; padding:6px 10px; border-radius:14px; flex:1;
  }
  .navbtn .ic{font-size:1.35em; position:relative; display:inline-block;}
  .navbtn.active{color:var(--sand); background:rgba(255,255,255,.12);}
  .navbtn:active{background:rgba(255,255,255,.12);}
  .nav-badge{
    position:absolute; top:-6px; right:-10px; min-width:16px; height:16px; padding:0 4px; border-radius:999px;
    background:var(--coral); color:#241005; font-size:.6em; font-weight:800; line-height:16px; text-align:center;
    box-shadow:0 2px 6px rgba(255,138,92,.5);
  }

  /* Drawer / menu */
  .overlay{
    position:fixed; inset:0; background:rgba(2,15,20,.55); backdrop-filter:blur(4px); z-index:60;
    opacity:0; pointer-events:none; transition:opacity .22s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .drawer{
    position:fixed; top:0; bottom:0; left:0; width:78%; max-width:320px; z-index:61;
    padding:26px 18px; transform:translateX(-105%); transition:transform .26s cubic-bezier(.2,.9,.3,1);
    border-radius:0 26px 26px 0; display:flex; flex-direction:column;
  }
  .drawer.show{transform:translateX(0);}
  .drawer .who{padding:8px 6px 18px; border-bottom:1px solid var(--glass-brd); margin-bottom:14px;}
  .drawer .who .av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--lagoon),var(--coral)); display:flex;align-items:center;justify-content:center; font-weight:800; margin-bottom:8px;}
  .drawer-item{
    display:flex; align-items:center; gap:12px; padding:13px 10px; border-radius:14px; color:var(--ink); background:none; border:none; width:100%; text-align:left; font-size:.95em; font-weight:600;
  }
  .drawer-item:active{background:var(--glass);}
  .drawer-item .ic{width:22px; text-align:center;}
  .drawer-spacer{flex:1;}

  /* Modal / popup sheets */
  .sheet-wrap{
    position:fixed; inset:0; z-index:70; display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .sheet-wrap.show{opacity:1; pointer-events:auto;}
  .sheet-wrap .backdrop{position:absolute; inset:0; background:rgba(2,12,16,.6); backdrop-filter:blur(3px);}
  .sheet{
    position:relative; width:100%; max-width:520px; max-height:85vh; overflow-y:auto;
    border-radius:26px; padding:24px 20px 26px; transform:scale(.94); opacity:0;
    transition:transform .22s cubic-bezier(.2,.9,.3,1), opacity .18s ease;
  }
  .sheet-wrap.show .sheet{transform:scale(1); opacity:1;}
  .sheet .handle{display:none;}
  .sheet-close{position:absolute; right:16px; top:16px; width:34px; height:34px; border-radius:50%; border:1px solid var(--glass-brd); background:var(--glass); color:var(--ink); font-size:1.1em;}
  .sheet-close:active, .topbar .iconbtn:active{transform:scale(.92);}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:.82em; color:var(--ink-dim); margin-bottom:6px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; padding:12px 14px; border-radius:14px; border:1px solid var(--glass-brd); background:rgba(255,255,255,.08);
    color:var(--ink); outline:none;
  }
  .field input::placeholder, .field textarea::placeholder{color:rgba(234,253,255,.4); font-size:.88em;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--lagoon); background:rgba(255,255,255,.13);}
  /* A "markable list" of categories (checkboxes styled as pills) in place of a
     single-select dropdown - a store can genuinely sell across more than one
     category (e.g. Bakery + Café), so letting more than one be marked here
     beats forcing a single pick. */
  /* Plain wrapping list, not a horizontal-scrolling one - the app is meant to
     never slide sideways anywhere, so this wraps into as many rows as it
     needs instead of scrolling. (An earlier version used a horizontal-
     scrolling 2-row grid here, which both violated that and - because of how
     grid track sizing interacted with the flex row inside each pill - could
     make a pill's checkbox+icon+name stack onto two lines instead of staying
     in one row. Plain wrapping avoids both problems.) */
  .cat-check-list{display:flex; flex-wrap:wrap; gap:6px 8px;}
  .cat-check-item{
    display:flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px;
    border:1.5px solid var(--glass-brd); background:rgba(255,255,255,.05); font-size:.76em;
    cursor:pointer; user-select:none; white-space:nowrap; flex-wrap:nowrap;
    transition:background .15s ease, border-color .15s ease;
  }
  .cat-check-item input{position:absolute; opacity:0; width:0; height:0; margin:0;}
  .cat-check-item.checked{background:rgba(34,184,200,.18); border-color:var(--lagoon);}
  /* Small circular check mark standing in for the native checkbox - it's the
     very first thing in the row (before the category icon+name - see the
     markup order in catChecklistHTML()), a thin white ring with no fill,
     empty until checked, when a thin white check line-art mark fades in (see
     toggleCatCheck(), which flips this via the .checked class on the label). */
  .cat-check-circle{
    width:12px; height:12px; border-radius:50%; border:1.3px solid rgba(255,255,255,.7);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .cat-check-circle svg{width:7px; height:7px; opacity:0; transition:opacity .12s ease;}
  .cat-check-item.checked .cat-check-circle svg{opacity:1;}
  /* Every plain (non-checklist) checkbox in the app - "Free delivery for
     buyer", the receiving-self toggle, the sign-up policy agreement - uses
     this same thin-line-circle mark instead of the browser's native checkbox,
     for one consistent look everywhere a box gets checked. Same idea as
     .cat-check-circle above, just without a JS-toggled class: the real
     checkbox is still there (so .checked reads/writes exactly as before,
     nothing else in the app needs to change) but drawn invisible, and the
     circle's checkmark fades in purely off the input's own :checked state
     via the sibling selector below - it only works because the circle is a
     sibling AFTER the input in the markup. */
  .chk-row{display:flex; align-items:flex-start; gap:10px; cursor:pointer;}
  .chk-row input[type=checkbox]{position:absolute; opacity:0; width:0; height:0; margin:0;}
  .chk-row .chk-circle{
    width:18px; height:18px; margin-top:1px; border-radius:50%; border:1.5px solid rgba(255,255,255,.7);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .chk-row .chk-circle svg{width:10px; height:10px; opacity:0; transition:opacity .12s ease;}
  .chk-row input[type=checkbox]:checked ~ .chk-circle svg{opacity:1;}
  .field.file{position:relative;}
  .field .filebtn{display:flex; align-items:center; justify-content:center; gap:8px; padding:22px; border:1.5px dashed var(--glass-brd); border-radius:16px; color:var(--ink-dim); font-weight:600;}
  .slip-preview-wrap{position:relative;}
  .slip-remove-btn{position:absolute; top:6px; right:6px; width:26px; height:26px; border-radius:50%; border:none; background:var(--coral); color:#fff; font-size:.8em; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.35);}
  .slip-remove-btn:active{transform:scale(.9);}

  /* Sits just above the bottom nav bar (Home/Cart/Orders etc.) rather than high up
     the screen, so a toast like "Signed in" or "Added to cart" reads as coming from
     down near where the person's attention already is. */
  /* Above .sheet-wrap's z-index:70 - a toast fired while a sheet (item detail,
     checkout, etc.) is open must still be visible over it, not hidden behind
     the sheet's backdrop, so it stays the same "floating near the bottom" toast
     as everywhere else instead of silently not appearing on sheet screens. */
  .toast-wrap{position:fixed; bottom:78px; left:0; right:0; z-index:80; display:flex; justify-content:center; pointer-events:none; transition:bottom .15s ease;}
  .toast{padding:12px 20px; border-radius:16px; font-weight:700; font-size:.9em; display:flex; align-items:center; gap:8px; opacity:0; transform:translateY(80px); transition:transform .3s ease, opacity .3s ease; max-width:90%;}
  .toast.show{opacity:1; transform:translateY(0);}
  .toast.good{background:rgba(61,220,151,.25); border:1px solid rgba(61,220,151,.5); color:#c6ffe5;}
  .toast.bad{background:rgba(255,107,107,.25); border:1px solid rgba(255,107,107,.5); color:#ffd6d6;}

  .status-pill{padding:4px 11px; border-radius:99px; font-size:.72em; font-weight:800;}
  .status-pill.wait{background:rgba(255,207,92,.2); color:var(--warn);}
  .status-pill.ok{background:rgba(61,220,151,.2); color:var(--good);}
  .status-pill.mid{background:rgba(34,184,200,.22); color:var(--lagoon);}
  .status-pill.bad{background:rgba(255,107,107,.2); color:var(--danger);}

  .acct-box{
    padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.07); border:1px dashed var(--glass-brd); margin-top:10px;
  }
  .acct-box .lbl{font-size:.72em; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.5px;}
  .acct-box .val{font-weight:700; font-size:1.05em; margin-top:2px; word-break:break-all;}
  .copy-num{cursor:pointer; text-decoration:underline dotted; text-underline-offset:3px; text-decoration-color:var(--lagoon);}
  .copy-num:active{opacity:.6;}
  .copy-ic{font-size:.85em; opacity:.7;}

  .empty{text-align:center; padding:50px 16px; color:var(--ink-dim);}
  .empty .ic{font-size:2.4em; margin-bottom:10px; display:block;}

  .tabs{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px;}
  .tab{padding:9px 16px; border-radius:14px; border:1px solid var(--glass-brd); background:var(--glass); color:var(--ink-dim); font-weight:700; font-size:.85em; white-space:nowrap;}
  .tab.active{background:linear-gradient(135deg, rgba(255,138,92,.9), rgba(232,102,58,.9)); color:#241005; border-color:transparent;}
  .tab:active{transform:scale(.95);}

  /* Hand-built month calendar for the rental booking date picker - lets an
     already-booked day render struck-through and unclickable, which a native
     <input type="date"> can't do (see bookCalendarHTML()). */
  .cal-wrap{background:rgba(255,255,255,.04); border:1px solid var(--glass-brd); border-radius:14px; padding:12px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-dow{margin-bottom:6px;}
  .cal-dow span{font-size:.7em; opacity:.55; font-weight:700;}
  .cal-day{aspect-ratio:1; border:none; border-radius:10px; background:rgba(255,255,255,.06); color:var(--ink); font-size:.85em; cursor:pointer;}
  .cal-day:disabled{opacity:.28; cursor:not-allowed;}
  .cal-day.booked{text-decoration:line-through; color:var(--coral); opacity:.6; background:rgba(255,107,107,.14);}
  .cal-day.in-range{background:rgba(255,138,92,.28); color:var(--ink); font-weight:700; border-radius:4px;}
  .cal-day.selected{background:linear-gradient(135deg, rgba(255,138,92,.9), rgba(232,102,58,.9)); color:#241005; font-weight:700; border-radius:10px;}
  .cal-warn-overlay{position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(2,12,16,.55);}
  .cal-warn-card{max-width:380px; width:100%; border-radius:20px; padding:20px; text-align:center;}
  .cal-warn-card .ic{font-size:2em; display:block; margin-bottom:8px;}

  .slider-row{display:flex; align-items:center; gap:12px;}

   4. Paste your project URL + anon public key below (Settings → API) */
const SUPABASE_URL = "https://ngoykqdzjpkrdqwhaqjy.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5nb3lrcWR6anBrcmRxd2hhcWp5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1Mjc1MTQsImV4cCI6MjEwNDEwMzUxNH0.0b9P4ZLPbQTkqge99pjF8bya2FAELtDiCoECaF3PI8I";
const sb = (SUPABASE_URL.startsWith('http'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;
/* ---- SQL to run once in Supabase → SQL Editor ----
create extension if not exists "pgcrypto";

create table businesses (
  id text primary key,
  owner_id uuid references auth.users(id) not null,
  name text not null,
  owner_name text not null,
  phone text,
  account_number text not null,
  account_name text not null,
  tier text default 'free',
  join_date timestamptz default now(),
  paid_at timestamptz,
  category text,
  category_other_name text,
  rating numeric(2,1) default 4.5
);

create table items (
  id text primary key,
  business_id text references businesses(id) on delete cascade,
  name text not null,
  price numeric not null,
  stock int default 0,
  category text,
  category_other_name text,
  rental_rate_period text default 'day'
);

create table delivery_persons (
  id text primary key,
  user_id uuid references auth.users(id) not null,
  name text not null,
  phone text
);

create table orders (
  id text primary key,
  business_id text references businesses(id),
  business_name text,
  customer_id uuid references auth.users(id),
  customer_email text,
  customer_name text,
  customer_phone text,
  items jsonb not null,
  items_total numeric not null,
  delivery_fee numeric not null,
  total numeric not null,
  zone text,
  delivery_person_id text references delivery_persons(id),
  delivery_person_name text,
  payment_method text,
  payment_status text default 'pending_transfer',
  status text default 'placed',
  slip_url text,
  created_at timestamptz default now()
);

alter table businesses enable row level security;
alter table items enable row level security;
alter table delivery_persons enable row level security;
alter table orders enable row level security;

-- Everyone (including logged-out visitors) can browse stores & items
create policy "public read businesses" on businesses for select using (true);
create policy "public read items" on items for select using (true);
create policy "public read delivery" on delivery_persons for select using (true);

-- Only the signed-in owner can create/edit their own store, and only the
-- signed-in rider can create/edit their own delivery profile.
create policy "owner insert business" on businesses for insert with check (auth.uid() = owner_id);
create policy "owner update business" on businesses for update using (auth.uid() = owner_id);
create policy "owner delete business" on businesses for delete using (auth.uid() = owner_id);

create policy "self insert delivery" on delivery_persons for insert with check (auth.uid() = user_id);
create policy "self update delivery" on delivery_persons for update using (auth.uid() = user_id);

-- Items can only be managed by the business's own owner
create policy "owner manage items" on items for all
  using (exists (select 1 from businesses b where b.id = items.business_id and b.owner_id = auth.uid()))
  with check (exists (select 1 from businesses b where b.id = items.business_id and b.owner_id = auth.uid()));

-- Orders: only a signed-in customer can create their own order
create policy "customer insert own order" on orders for insert
  with check (auth.uid() = customer_id);
-- Orders are only readable by the customer who placed them, the business
-- that owns them, or a delivery partner (their own assigned jobs, plus
-- unassigned orders so riders can see jobs to pick up). The row-level "update
-- own orders" policies below are still needed for SELECT-adjacent reasons and
-- as a defense-in-depth backstop, but no client-side code relies on them for
-- payment/payout columns anymore - see the SECURITY DEFINER functions and the
-- column-level lockdown further down, which are what actually gate
-- submitSlip(), submitCompleteAuctionOrder(), confirmCashReceived(),
-- markDelivered(), approveOrderPayment(), settlePayout(), and
-- markPayoutPaid() now. claimJob() is the sole remaining direct client write
-- on this table, touching only delivery_person_id/delivery_person_name.
create policy "customer read own orders" on orders for select
  using (auth.uid() = customer_id);
create policy "business read own orders" on orders for select
  using (exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid()));
create policy "rider read assigned or open orders" on orders for select
  using (
    exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
    or (orders.delivery_person_id is null and exists (select 1 from delivery_persons d where d.user_id = auth.uid()))
  );
create policy "customer update own order" on orders for update
  using (auth.uid() = customer_id)
  with check (auth.uid() = customer_id);
create policy "business update own orders" on orders for update
  using (exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid()));
create policy "rider update assigned or open orders" on orders for update
  using (
    orders.delivery_person_id is null
    or exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  )
  with check (
    exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  );

-- Payout lockdown: every write to total/payment_status/payout_status/
-- delivery_partner_payout goes through exactly one of these seven functions
-- instead of a direct client update, so each write's precondition (ownership,
-- order status) is enforced atomically in the same statement that makes the
-- change - a raw REST update can no longer skip it.
create or replace function submit_transfer_slip(p_order_id text, p_slip_url text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set payment_status = 'slip_uploaded', slip_url = p_slip_url
  where id = p_order_id and customer_id = auth.uid()
  returning *;
$$;

create or replace function approve_order_payment(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set payment_status = 'paid'
  where id = p_order_id
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

-- Only the auction's own winning bidder, on an order still awaiting
-- completion, can turn their win into a real order - the zone fee, total,
-- and delivery_partner_payout are all computed here rather than trusted from
-- the client.
create or replace function complete_auction_order(p_order_id text, p_delivery_zone text, p_payment_method text,
  p_delivery_target_type text default 'person', p_receiver_name text default null, p_receiver_phone text default null, p_receiver_address text default null)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set
    zone = p_delivery_zone,
    delivery_fee = case when delivery_type <> 'free' then
      case p_delivery_zone when 'hulhumale1' then 20 when 'hulhumale2' then 25 else 15 end
    else 0 end,
    total = items_total + (case when delivery_type <> 'free' then
      case p_delivery_zone when 'hulhumale1' then 20 when 'hulhumale2' then 25 else 15 end
    else 0 end) + coalesce(extra_delivery_fee, 0),
    delivery_partner_payout = case p_delivery_zone when 'hulhumale1' then 20 when 'hulhumale2' then 25 else 15 end,
    payment_method = p_payment_method,
    payment_status = case when p_payment_method = 'transfer' then 'pending_transfer' else 'pending_cash' end,
    delivery_target_type = p_delivery_target_type,
    receiver_name = p_receiver_name,
    receiver_phone = p_receiver_phone,
    receiver_address = p_receiver_address
  where id = p_order_id
    and customer_id = auth.uid()
    and payment_status = 'awaiting_completion'
    and exists (
      select 1 from auction_listings al
      where al.order_id = orders.id and al.current_highest_bidder = auth.uid()
    )
  returning *;
$$;

create or replace function settle_payout(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set payment_status = 'settled'
  where id = p_order_id
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

create or replace function mark_payout_paid(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set payout_status = 'settled'
  where id = p_order_id
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

create or replace function confirm_cash_received(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set payment_status = 'cash_collected'
  where id = p_order_id
    and exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  returning *;
$$;

-- "status is distinct from 'delivered'" is the idempotency guard - a repeat
-- call (e.g. a retried request) can't re-open a payout that a first call
-- already settled.
create or replace function mark_delivered(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set
    status = 'delivered',
    payout_status = case when delivery_type = 'free' then 'pending' else payout_status end
  where id = p_order_id
    and status is distinct from 'delivered'
    and exists (select 1 from delivery_persons d where d.id = orders.delivery_person_id and d.user_id = auth.uid())
  returning *;
$$;

-- Rentals have no delivery partner to mark them delivered by default - the
-- renter (the business that listed the item) does that themselves, once the
-- customer has picked it up or been handed it. Once a delivery partner has
-- taken the job (see claim_rental_job below), it's their call via
-- mark_delivered above instead - hence delivery_person_id is null here.
create or replace function mark_rental_fulfilled(p_order_id text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set status = 'delivered'
  where id = p_order_id
    and rental_item_id is not null
    and status is distinct from 'delivered'
    and delivery_person_id is null
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

-- Lets a store hand a "deliver"-fulfillment rental off to the delivery-partner
-- network for a fee it's offering out of its own pocket, instead of delivering
-- it themselves - entirely separate money from the rental payment itself
-- (already the customer's business with the store either way). Only while
-- nobody's claimed it yet and it hasn't already gone out; pickup-mode rentals
-- are excluded since there's nothing to deliver.
create or replace function offer_rental_delivery(p_order_id text, p_fee numeric, p_timing text)
returns setof orders
language sql
security definer
set search_path = public
as $$
  update orders
  set
    needs_delivery_partner = true,
    delivery_partner_payout = p_fee,
    rental_payout_timing = case when p_timing = 'upfront' then 'upfront' else 'after' end
  where id = p_order_id
    and rental_item_id is not null
    and rental_fulfillment = 'deliver'
    and delivery_person_id is null
    and status is distinct from 'delivered'
    and p_fee > 0
    and exists (select 1 from businesses b where b.id = orders.business_id and b.owner_id = auth.uid())
  returning *;
$$;

-- A rental delivery job's own claim step, separate from the plain
-- delivery_person_id/name update a normal order's claim uses (see the RLS
-- policy note further down) - an "upfront" job also needs payout_status
-- flipped to 'pending' right here, computed from the order's own timing
-- choice rather than trusted as a value the claiming rider could set to
-- anything, same reasoning as mark_delivered() deciding payout_status itself.
create or replace function claim_rental_job(p_order_id text)
returns setof orders
language plpgsql
security definer
set search_path = public
as $$
declare v_rider_id uuid; v_rider_name text;
begin
  select id, name into v_rider_id, v_rider_name from delivery_persons where user_id = auth.uid();
  if v_rider_id is null then return; end if;
  return query
  update orders o set
    delivery_person_id = v_rider_id,
    delivery_person_name = v_rider_name,
    payout_status = case when o.rental_payout_timing = 'upfront' then 'pending' else o.payout_status end
  where o.id = p_order_id
    and o.rental_item_id is not null
    and o.needs_delivery_partner = true
    and o.delivery_person_id is null
    and o.status is distinct from 'delivered'
  returning o.*;
end;
$$;

grant execute on function approve_order_payment(text) to authenticated;
grant execute on function complete_auction_order(text, text, text, text, text, text, text) to authenticated;
grant execute on function settle_payout(text) to authenticated;
grant execute on function mark_payout_paid(text) to authenticated;
grant execute on function confirm_cash_received(text) to authenticated;
grant execute on function mark_delivered(text) to authenticated;
grant execute on function mark_rental_fulfilled(text) to authenticated;
grant execute on function offer_rental_delivery(text, numeric, text) to authenticated;
grant execute on function claim_rental_job(text) to authenticated;

-- The ten functions above are now the only way total/payment_status/
-- payout_status/delivery_partner_payout/status/needs_delivery_partner/
-- rental_payout_timing ever change - lock them down so no authenticated client
-- can set them directly via a raw REST update/upsert, which would otherwise
-- bypass every precondition those functions enforce.
-- orders has a full table-level UPDATE grant by default (like every Supabase
-- table), which overrides a column-specific revoke on its own (see the
-- identical gotcha and fix for auction_listings above) - so the table-wide
-- grant has to be revoked first, then re-granted only for the one column
-- pair a client still legitimately writes directly: claimJob() setting
-- delivery_person_id/delivery_person_name to claim a normal open job (gated by
-- the "rider update assigned or open orders" policy above, not by column
-- grants) - a rental delivery job's claim goes through claim_rental_job
-- instead, since it also needs to flip payout_status for an "upfront" job.
revoke update on orders from anon, authenticated;
grant update (delivery_person_id, delivery_person_name) on orders to anon, authenticated;

-- Mobile number + password sign-in (set up after a user's first magic-link
-- login). Password auth itself is Supabase's built-in email+password —
-- this table just maps a phone number to the account's email so a
-- not-yet-signed-in visitor can look up which email to authenticate,
-- and enforces phone uniqueness (email uniqueness is already enforced
-- natively by auth.users).
create table user_profiles (
  user_id uuid primary key references auth.users(id) on delete cascade,
  phone text unique not null,
  email text unique not null,
  created_at timestamptz default now()
);
alter table user_profiles enable row level security;
create policy "self read own profile" on user_profiles for select using (auth.uid() = user_id);
create policy "self insert own profile" on user_profiles for insert with check (auth.uid() = user_id);

-- Security-definer lookup so an unauthenticated visitor can resolve a
-- phone number to its account email (only that one field, nothing else)
-- before calling signInWithPassword. Safe to expose to anon.
create or replace function resolve_login_email(p_phone text)
returns text
language sql
security definer
set search_path = public
as $$
  select email from user_profiles where phone = p_phone limit 1;
$$;
grant execute on function resolve_login_email(text) to anon, authenticated;

-- Super Admin: a manually-seeded allowlist (no self-service signup for
-- this — add rows directly in SQL). is_admin() is security-definer so
-- it can be used inside other tables' RLS policies without those
-- tables needing their own read access to `admins`.
create table admins (
  user_id uuid primary key references auth.users(id) on delete cascade,
  created_at timestamptz default now()
);
alter table admins enable row level security;
create policy "admin read own admin row" on admins for select using (auth.uid() = user_id);

create or replace function is_admin()
returns boolean
language sql
security definer
set search_path = public
as $$
  select exists(select 1 from admins where user_id = auth.uid());
$$;
grant execute on function is_admin() to authenticated;

-- Admins can update tier/paid_at on any business (owners can already
-- update their own via the existing "owner update business" policy —
-- Postgres OR's multiple permissive policies for the same command).
create policy "admin update any business" on businesses for update using (is_admin());
-- Admins can also see phone/email for any user who's set up mobile
-- sign-in, useful for cross-checking a business owner's identity.
create policy "admin read all profiles" on user_profiles for select using (is_admin());

-- Product photos: stored in Supabase Storage (bucket 'product-images', public),
-- not as base64 in the row - this column just holds the resulting public URL.
alter table items add column if not exists image_url text;
alter table items add column if not exists listing_type text not null default 'buy_now' check (listing_type in ('buy_now','auction'));

-- Storage bucket for product photos. Create via Dashboard -> Storage -> New
-- bucket named "product-images" with Public bucket ON, or run:
insert into storage.buckets (id, name, public) values ('product-images','product-images', true)
  on conflict (id) do nothing;
-- Anyone can view (public bucket + public read policy); only the authenticated
-- uploader can add/replace/delete their own files. Objects are uploaded under
-- a path prefixed with the uploader's own auth.uid() (see uploadItemPhoto() in
-- the app), which is what these policies check against - no join to
-- businesses needed.
create policy "public read product images" on storage.objects for select
  using (bucket_id = 'product-images');
create policy "owner upload product images" on storage.objects for insert to authenticated
  with check (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "owner update product images" on storage.objects for update to authenticated
  using (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);
create policy "owner delete product images" on storage.objects for delete to authenticated
  using (bucket_id = 'product-images' and (storage.foldername(name))[1] = auth.uid()::text);

-- Auction listings: a business chooses "Auction" instead of "Buy Now" when
-- listing an item (see items.listing_type above). There's no background job
-- runner in this app, so closing an ended auction and settling its winner
-- both happen lazily from the client whenever anyone views/interacts with the
-- listing (see checkAndSettleAuction()/settleAuctionWin()) rather than on a
-- timer - the "signed-in update auction" policy below is what makes that
-- safe to do from any authenticated visitor's browser.
create table auction_listings (
  id text primary key,
  item_id text references items(id) on delete cascade not null,
  business_id text references businesses(id) not null,
  starting_price numeric not null check (starting_price > 0),
  bid_increment numeric not null check (bid_increment > 0),
  start_time timestamptz not null default now(),
  end_time timestamptz not null,
  current_highest_bid numeric,
  current_highest_bidder uuid references auth.users(id),
  bid_count int not null default 0,
  status text not null default 'active' check (status in ('active','ended','settled')),
  order_id text references orders(id),
  created_at timestamptz default now()
);
alter table auction_listings enable row level security;
create policy "public read auctions" on auction_listings for select using (true);
create policy "owner insert own auction" on auction_listings for insert
  with check (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
-- Deliberately permissive (any authenticated visitor, not just the seller or
-- winning bidder) since the lazy active->ended transition needs to happen
-- from whoever's browser next views an expired listing. Blocked once
-- 'settled' - a won auction's order has already been created and shouldn't
-- be touched again. This governs status/order_id only - current_highest_bid
-- and current_highest_bidder are locked down further below, once place_bid()
-- exists to be the only way those two actually get written.
create policy "signed-in update auction" on auction_listings for update to authenticated
  using (status in ('active','ended'))
  with check (true);

-- Full bid history - kept even after the winning bid is cached on
-- auction_listings above, for an auditable record of every bid placed.
create table auction_bids (
  id text primary key,
  auction_id text references auction_listings(id) on delete cascade not null,
  bidder_id uuid references auth.users(id) not null,
  bid_amount numeric not null check (bid_amount > 0),
  created_at timestamptz default now()
);
alter table auction_bids enable row level security;
create policy "public read bids" on auction_bids for select using (true);
-- Kept as a defense-in-depth backstop against a raw insert bypassing
-- place_bid() below (e.g. a hand-crafted API call) - place_bid() itself runs
-- as SECURITY DEFINER and doesn't go through this policy at all, so it isn't
-- what closes the race (the atomic UPDATE inside place_bid() does that); this
-- just stops a bypass attempt from writing a bid the way the old
-- insert-then-update flow used to.
create policy "customer valid bid" on auction_bids for insert
  with check (
    bidder_id = auth.uid()
    and exists (
      select 1 from auction_listings al
      where al.id = auction_id
        and al.status = 'active'
        and al.end_time > now()
        and bid_amount >= coalesce(al.current_highest_bid + al.bid_increment, al.starting_price)
        and not exists (select 1 from businesses b where b.id = al.business_id and b.owner_id = auth.uid())
    )
  );

-- Places a bid atomically. The UPDATE below is a single SQL statement whose
-- WHERE clause re-checks the increment rule against the row's CURRENT values
-- at write time, so Postgres serializes concurrent calls to this function
-- against the same row - two bids landing within milliseconds of each other
-- can no longer both pass validation against the same stale highest-bid
-- value the way the old separate insert-then-update from the client could.
-- No SELECT ... FOR UPDATE or other explicit locking needed; the atomicity
-- of one UPDATE statement is what does it. The auction_bids insert only
-- happens (via the `ins` CTE selecting `from updated`) once the UPDATE has
-- actually matched a row, so a rejected bid never gets recorded as history.
-- SECURITY DEFINER so it can write current_highest_bid/current_highest_bidder
-- despite the revoke just below locking those two columns down for everyone
-- else - this function is now the only way a bid actually moves the price.
create or replace function place_bid(p_auction_id text, p_bid_amount numeric)
returns setof auction_listings
language sql
security definer
set search_path = public
as $$
  with updated as (
    update auction_listings
    set current_highest_bid = p_bid_amount, current_highest_bidder = auth.uid(), bid_count = coalesce(bid_count,0) + 1
    where id = p_auction_id
      and status = 'active'
      and end_time > now()
      and auth.uid() is not null
      and not exists (select 1 from businesses b where b.id = auction_listings.business_id and b.owner_id = auth.uid())
      and (
        (current_highest_bid is null and p_bid_amount >= starting_price)
        or (current_highest_bid is not null and p_bid_amount >= current_highest_bid + bid_increment)
      )
    returning *
  ),
  ins as (
    insert into auction_bids (id, auction_id, bidder_id, bid_amount)
    select 'bid_' || replace(gen_random_uuid()::text, '-', ''), p_auction_id, auth.uid(), p_bid_amount
    from updated
    returning 1
  )
  select * from updated;
$$;
grant execute on function place_bid(text, numeric) to authenticated;

-- Bidding now only happens through place_bid() above - lock the two
-- price-affecting columns down so no authenticated client can set them
-- directly via a raw REST update, which would otherwise bypass the atomic
-- check entirely and reopen the exact race place_bid() exists to close.
-- status/order_id (used by the lazy close/settle flow) are untouched by
-- this and remain updatable per the "signed-in update auction" policy above.
revoke update (current_highest_bid, current_highest_bidder, bid_count) on auction_listings from authenticated;
-- Existing deployments: add the column and backfill it from the real bid
-- history rather than leaving pre-existing auctions at a misleading 0.
alter table auction_listings add column if not exists bid_count int not null default 0;
update auction_listings al set bid_count = (select count(*) from auction_bids ab where ab.auction_id = al.id) where bid_count = 0;

-- Pro-tier upgrade requests: bank transfer (needs manual admin
-- approval) or Swipe (auto-approved by the payment webhook, no admin
-- action needed — logged here for visibility).
create table pro_upgrade_requests (
  id text primary key,
  business_id text references businesses(id) on delete cascade,
  payment_method text not null check (payment_method in ('bank_transfer','swipe')),
  status text not null default 'pending' check (status in ('pending','approved','rejected')),
  amount numeric not null default 500,
  slip_url text,
  swipe_reference text,

alter table pro_upgrade_requests enable row level security;
create policy "owner insert own upgrade request" on pro_upgrade_requests for insert

create policy "owner read own upgrade requests" on pro_upgrade_requests for select
  using (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
-- Lets create-swipe-payment roll back its own just-inserted row if

create policy "owner delete own upgrade request" on pro_upgrade_requests for delete

create policy "admin update upgrade requests" on pro_upgrade_requests for update using (is_admin());

-- A business picking "Other" on the category checklist names their own
-- category here; super admin reviews it and can approve it into

-- category everywhere alongside the built-in list) or dismiss it.
create table category_requests (

  resolved_at timestamptz,
  resolved_by uuid references auth.users(id)

alter table category_requests enable row level security;
create policy "owner insert own category request" on category_requests for insert
  with check (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "owner read own category requests" on category_requests for select
  using (exists (select 1 from businesses b where b.id = business_id and b.owner_id = auth.uid()));
create policy "admin read all category requests" on category_requests for select using (is_admin());
create policy "admin update category requests" on category_requests for update using (is_admin());

-- Category names an admin has approved from a category_requests row - merged
-- into the app's built-in MARKETPLACE_CATEGORIES list on load (see
-- mergeCustomCategories()), so an approved category becomes pickable
-- everywhere a category is chosen, not just remembered on that one business.
create table custom_categories (
  name text primary key,
  added_at timestamptz default now()
);
alter table custom_categories enable row level security;
create policy "public read custom categories" on custom_categories for select using (true);
create policy "admin manage custom categories" on custom_categories for all using (is_admin());

-- Per-listing delivery: a business now just checks/unchecks "Free delivery for
-- buyer" on each item (checked by default). It no longer changes HOW delivery
-- works - the buyer always picks a zone at checkout, same as always, and the
-- zone's flat fee is always what the delivery partner is paid. The checkbox
-- only controls whether that fee is ALSO charged to the buyer.
alter table items add column if not exists free_delivery boolean not null default true;
-- Superseded by free_delivery above - drop if the short-lived previous version
-- of this feature was ever run against this database.
alter table items drop column if exists delivery_type;
alter table items drop column if exists delivery_payout;

-- Extra delivery fee: a seller-set surcharge (eg. for a bulky/fragile item),
-- separate from the fixed zone fee - always charged to the buyer when set
-- (regardless of free_delivery), and goes to the business, not the delivery
-- partner. Snapshotted onto the order at placement time (or, for auctions, at
-- win time) so a later item edit never changes an already-placed order's total.
alter table items add column if not exists extra_delivery_fee numeric not null default 0;
alter table orders add column if not exists extra_delivery_fee numeric not null default 0;

-- Orders: delivery_partner_payout is always the zone's flat fee (the delivery
-- partner is paid the same amount regardless of who's charged for it) -
-- delivery_type on the order records whether the buyer's total included that
-- fee ('zone') or not ('free'), decided by whether every item in the cart had
-- free_delivery checked (a cart is one business; if even one item requires
-- the buyer to pay, the fee is charged for the whole order).
-- Cash orders: 'zone' orders are unchanged (rider collects the fee inside
-- `total`, keeps it as their cut, remits `total - delivery_partner_payout`).
-- 'free' orders collect no fee at all, so the rider remits the FULL `total`
-- to the business and is paid their delivery_partner_payout separately.
-- Transfer orders: 'zone' orders are unchanged (buyer's transfer already
-- covers the fee - no payout tracking needed, same as the original app).
-- 'free' orders only collect the item price, so payout_status tracks the
-- business's separate obligation to pay the rider the fee once delivered -
-- for BOTH payment methods now, since a 'free' cash order also leaves that
-- fee uncollected from the buyer.
alter table orders add column if not exists delivery_type text not null default 'zone' check (delivery_type in ('zone','free'));
alter table orders add column if not exists delivery_partner_payout numeric;
alter table orders add column if not exists payout_status text check (payout_status is null or payout_status in ('pending','settled'));

-- Who the order is actually handed to, collected at checkout - distinct from the
-- old dropped delivery_address/boat_* columns above (those drove pricing; these
-- are just contact/handoff details on top of the normal zone-fee flow, always
-- required regardless of type).
alter table orders add column if not exists delivery_target_type text not null default 'person' check (delivery_target_type in ('person','boat'));
alter table orders add column if not exists receiver_name text;
alter table orders add column if not exists receiver_phone text;
alter table orders add column if not exists receiver_address text;

-- Superseded columns from the short-lived previous version of this feature -
-- the custom per-item payout amount and the manual address/boat-info fields
-- are gone now that delivery always goes through the normal zone flow.
alter table orders drop column if exists delivery_address;
alter table orders drop column if exists boat_type;
alter table orders drop column if exists boat_name;
alter table orders drop column if exists boat_detail;

-- Backfill: every order placed before this feature (or its previous version)
-- is a zone-delivery order, so its delivery_partner_payout is exactly the fee
-- already on the row.
update orders set delivery_partner_payout = delivery_fee where delivery_partner_payout is null;

-- Rentals never involve the delivery-partner network: the renter (the store
-- listing the item) is paid the full rental amount directly, and decides per
-- item whether the customer picks it up (in which case the customer never
-- sees the deliver-to fields - they see the pickup location the renter set
-- instead) or the renter delivers it themselves to a person. Either way, no
-- zone fee is charged and no delivery_partner_payout is ever created for
-- these orders - see submitRentItem()/sheetRentItem() in the JS.
alter table items add column if not exists rental_fulfillment text check (rental_fulfillment is null or rental_fulfillment in ('pickup','deliver'));
alter table items add column if not exists pickup_location text;
alter table orders add column if not exists rental_item_id text;
alter table orders add column if not exists rental_days int;
alter table orders add column if not exists rental_fulfillment text check (rental_fulfillment is null or rental_fulfillment in ('pickup','deliver'));
alter table orders add column if not exists pickup_location text;
-- A "deliver"-fulfillment rental order the store has opted to hand off to a
-- delivery partner (for the fee already sitting in delivery_partner_payout,
-- once needs_delivery_partner is set) instead of delivering it themselves.
alter table orders add column if not exists needs_delivery_partner boolean not null default false;
alter table orders add column if not exists rental_payout_timing text check (rental_payout_timing is null or rental_payout_timing in ('upfront','after'));
-- Widen delivery_target_type to allow 'pickup' alongside the existing
-- 'person'/'boat' values (Postgres's default name for a column check added via
-- ALTER TABLE ADD COLUMN is "<table>_<column>_check").
alter table orders drop constraint if exists orders_delivery_target_type_check;
alter table orders add constraint orders_delivery_target_type_check check (delivery_target_type in ('person','boat','pickup'));

-- A rental item can be listed as available right now ('now', the default) or
-- 'soon' with a known available_from date - a "coming soon" rental still shows
-- up (in its own section) so customers can request it ahead of time instead of
-- only finding out once it's actually ready.
alter table items add column if not exists rental_availability text not null default 'now' check (rental_availability in ('now','soon'));
alter table items add column if not exists available_from date;

-- Store rating shown on hover on any item card and inside the item detail sheet
-- (see ratingBadgeHTML()) - a simple numeric average for now, not backed by a
-- real review system yet, so existing rows get a plausible default rather than
-- null (which would render as "no rating" instead of a number).
alter table businesses add column if not exists rating numeric(2,1) default 4.5;
update businesses set rating = 4.5 where rating is null;

-- A booking request against a 'soon' rental item - separate from orders because
-- it's a request the renter (the business) has to accept or decline before any
-- money changes hands, and only gets a charge amount once accepted. No delivery
-- partner, payout, or zone-fee columns at all - same reasoning as rentals
-- themselves (see the rental_item_id block above): the renter deals with the
-- customer directly.
create table rental_bookings (
  id text primary key,
  item_id text references items(id) on delete cascade,
  item_name text,
  business_id text references businesses(id),
  business_name text,
  customer_id uuid references auth.users(id),
  customer_email text,
  customer_name text,
  customer_phone text,
  requested_date date not null,
  days int not null default 1,
  note text,
  status text not null default 'pending' check (status in ('pending','accepted','declined')),
  booking_charge numeric,
  charge_status text check (charge_status is null or charge_status in ('pending','collected')),
  created_at timestamptz default now(),
  decided_at timestamptz
);
alter table rental_bookings enable row level security;
create policy "customer insert own booking" on rental_bookings for insert
  with check (auth.uid() = customer_id);
create policy "customer read own bookings" on rental_bookings for select
  using (auth.uid() = customer_id);
create policy "business read own bookings" on rental_bookings for select
  using (exists (select 1 from businesses b where b.id = rental_bookings.business_id and b.owner_id = auth.uid()));
-- The business decides status/booking_charge/charge_status - no separate
-- SECURITY DEFINER function needed here (unlike orders' payment/payout columns)
-- since there's only one other party's money involved (the customer's, held
-- outside the app until the business marks it collected) and no delivery
-- partner whose column-level lockdown this would need to defend against.
create policy "business update own bookings" on rental_bookings for update
  using (exists (select 1 from businesses b where b.id = rental_bookings.business_id and b.owner_id = auth.uid()));
--------------------------------------------------- */

/* =================== DATA LAYER =================== */
const TABLES = { businesses:'businesses', items:'items', orders:'orders', delivery:'delivery_persons', proRequests:'pro_upgrade_requests', auctions:'auction_listings', bookings:'rental_bookings', bids:'auction_bids', categoryRequests:'category_requests' };
let DB = { businesses:[], items:[], orders:[], delivery:[], proRequests:[], auctions:[], bookings:[], bids:[], categoryRequests:[], customCategories:[] };
let storageReady = false;

async function loadDB(){
  if(!sb){
    toast('Add your Supabase URL & key in the script to connect a real backend', 'bad');
    storageReady = true;
    return;
  }
  try{
    const [b,i,o,d,pr,au,bk,bd,cr,cc] = await Promise.all([
      sb.from('businesses').select('*'),
      sb.from('items').select('*'),
      sb.from('orders').select('*'),
      sb.from('delivery_persons').select('*'),
      sb.from('pro_upgrade_requests').select('*'),
      sb.from('auction_listings').select('*'),
      sb.from('rental_bookings').select('*'),
      sb.from('auction_bids').select('*'),
      sb.from('category_requests').select('*'),
      sb.from('custom_categories').select('*')
    ]);
    // Promise.all only rejects on a thrown/network-level failure - a query that
    // completes but fails server-side (e.g. an RLS policy error) resolves normally
    // with a populated .error field instead, which was previously never checked,
    // so a broken policy on just one table silently looked like "this store has no
    // items" rather than surfacing anything was wrong.
    const failed = [['businesses',b],['items',i],['orders',o],['delivery',d],['pro upgrade requests',pr],['auctions',au],['rental bookings',bk],['auction bids',bd],['category requests',cr],['custom categories',cc]]
      .filter(([,res])=>res.error);
    if(failed.length){
      failed.forEach(([label,res])=>console.error(`loadDB: ${label} query failed:`, res.error));
      toast(`Could not load ${failed.map(([label])=>label).join(', ')} — some data may be missing`, 'bad');
    }
    DB.businesses = (b.data||[]).map(r=>fromDbRow('businesses',r));
    DB.items = (i.data||[]).map(r=>fromDbRow('items',r));
    DB.orders = (o.data||[]).map(r=>fromDbRow('orders',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.delivery = (d.data||[]).map(r=>fromDbRow('delivery',r));
    DB.proRequests = (pr.data||[]).map(r=>fromDbRow('proRequests',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.auctions = (au.data||[]).map(r=>fromDbRow('auctions',r));
    DB.bookings = (bk.data||[]).map(r=>fromDbRow('bookings',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.bids = (bd.data||[]).map(r=>fromDbRow('bids',r));
    DB.categoryRequests = (cr.data||[]).map(r=>fromDbRow('categoryRequests',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.customCategories = (cc.data||[]).map(r=>r.name).filter(Boolean);
    mergeCustomCategories();
  }catch(e){ console.error(e); toast('Could not reach Supabase — check your config', 'bad'); }
  storageReady = true;
}
async function saveDB(part, only){
  if(!sb) return;
  try{
    // `only`, when given, limits the upsert to specific rows rather than the
    // whole DB[part] array. Needed for 'items': DB.items holds every
    // business's items (loaded via the public-read policy for customer
    // browsing), but the owner-only RLS check on writes rejects the entire
    // upsert if the batch includes even one row this session doesn't own.
    const rows = (only || DB[part]).map(o=>toDbRow(part,o));
    const { error } = await sb.from(TABLES[part]).upsert(rows);
    if(error){ console.error(error); toast('Save failed: '+error.message, 'bad'); }
  }catch(e){ console.error(e); toast('Save failed — check connection', 'bad'); }
}
// Every order mutation that touches a payment/payout column now goes through one of
// the eight SECURITY DEFINER functions below instead of a client-side field write +
// saveDB('orders') upsert - the function's own WHERE clause (ownership, status
// preconditions) is the real gate, so a RETURNS SETOF orders with zero rows means the
// precondition wasn't met (wrong owner, stale status, etc.), not a network failure.
// On success the row Postgres actually wrote is applied back to DB.orders, rather than
// trusting whatever the client optimistically computed beforehand.
async function callOrderRpc(rpcName, args, orderId, failMsg){
  const { data, error } = await sb.rpc(rpcName, args);
  if(error){ toast('Could not update order: '+error.message, 'bad'); return null; }
  if(!data || !data.length){ toast(failMsg || "Couldn't update this order — it may have changed, or you may not have permission", 'bad'); return null; }
  const updated = fromDbRow('orders', data[0]);
  const idx = DB.orders.findIndex(o=>o.id===orderId);
  if(idx>=0) DB.orders[idx] = updated; else DB.orders.unshift(updated);
  return updated;
}

function fmtDateShort(dateStr){

/* ---- Rental booking date-window helpers - a booking blocks the item for its
   whole [requestedDate, requestedDate + days - 1] span, not just its start day,
   so both "is this item booked right now" (blocks instant renting) and "does a
   new booking request clash with one already accepted" reuse the same range
   math instead of comparing single dates. ---- */
function bookingDateRange(bk){
  const [y,m,d] = bk.requestedDate.split('-').map(Number);
  const start = new Date(y, m-1, d);
  const end = new Date(y, m-1, d + (Number(bk.days)||1) - 1);
  return { start, end };
}
function itemBookingWindows(itemId){
  return DB.bookings.filter(bk=>bk.itemId===itemId && bk.status==='accepted')
    .map(bk=>({ bk, ...bookingDateRange(bk) }))
    .sort((a,b)=>a.start-b.start);
}
function currentBookingBlock(itemId){
  const now = new Date(); now.setHours(0,0,0,0);
  return itemBookingWindows(itemId).find(w=>w.start<=now && now<=w.end) || null;
}
function bookingOverlapsExisting(itemId, dateStr, days, excludeId=null){
  const [y,m,d] = dateStr.split('-').map(Number);
  const start = new Date(y, m-1, d);
  const end = new Date(y, m-1, d + (Number(days)||1) - 1);
  return itemBookingWindows(itemId).some(w=>w.bk.id!==excludeId && start<=w.end && w.start<=end);
}

function auctionForItem(itemId){ return DB.auctions.find(a=>a.itemId===itemId); }
// Called from every screen that renders a list of auction items, so an auction
// that's already past its end_time gets closed/settled the moment anyone views
// it - not only one that was seen actively counting down (an auction opened for
// the first time after it already ended would otherwise render as "ended" purely
// from the client-side time comparison, with no data-auction-end element for
// ensureCountdownTimer() to ever notice and act on).
function settleExpiredAuctions(itemList){
  itemList.filter(i=>i.listingType==='auction').forEach(i=>{
    const a = auctionForItem(i.id);
    if(a && a.status==='active' && Date.now()>=a.endTime) checkAndSettleAuction(a.id);
  });
}

function fmtCountdown(ms){
  if(ms<=0) return 'Ended';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if(d>0) return `${d}d ${h}h left`;
  if(h>0) return `${h}h ${m}m left`;
  if(m>0) return `${m}m ${sec}s left`;
  return `${sec}s left`;
}
// One shared interval, (re)started after any render that includes an auction

// navigating away) - render() fully replaces #app on every screen change, so
// there's nothing else to explicitly tear this down when it's no longer needed.
let _countdownTimer = null;
// Auction ids currently mid-settlement via checkAndSettleAuction() below - guards
// against renderCustOrders() (which re-triggers settlement on every render while
// an ended win sits unsettled) firing a second overlapping call for the same
// auction before the first one's async work (and the render() it ends with)
// finishes, which could otherwise create two orders for the same win.
let _settlingAuctionIds = new Set();
function ensureCountdownTimer(){
  if(_countdownTimer) return;
  _countdownTimer = setInterval(()=>{
    const els = document.querySelectorAll('[data-auction-end]');
    if(!els.length){ clearInterval(_countdownTimer); _countdownTimer=null; return; }
    els.forEach(el=>{
      const end = Number(el.getAttribute('data-auction-end'));
      const ms = end - Date.now();
      el.textContent = fmtCountdown(ms);
      if(ms<=0 && !el.dataset.settling){
        el.dataset.settling = '1';
        checkAndSettleAuction(el.getAttribute('data-auction-id'));
      }
    });
  }, 1000);

// Live listings refresh: businesses/items/auctions are only ever loaded into DB
// once, at page load (see loadDB()) - so a buyer's tab that's been open for a
// while has no way to know a seller (in another tab/session) just listed a new
// item, short of a manual page reload. This polls those three tables in the
// background and, if we're actually looking at a screen that renders from them,
// re-renders so new listings/price changes/stock just show up. Orders/delivery/
// proRequests aren't included - only the customer home feed and store screen
// consume this data, so those are the only tables worth the extra reads.
const LIVE_REFRESH_MS = 8000;
let _liveRefreshTimer = null;
async function refreshLiveListings(){
  if(!sb) return;
  try{
    const [i, b, au] = await Promise.all([
      sb.from('items').select('*'),
      sb.from('businesses').select('*'),
      sb.from('auction_listings').select('*')
    ]);
    if(i.error || b.error || au.error) return; // silent - background refresh, not a user action
    DB.items = (i.data||[]).map(r=>fromDbRow('items',r));
    DB.businesses = (b.data||[]).map(r=>fromDbRow('businesses',r));
    DB.auctions = (au.data||[]).map(r=>fromDbRow('auctions',r));
    // Only auto-render on the two screens that actually read this data, and never
    // while a sheet is open or the person is mid-typing (a search box, a sign-in/
    // checkout field) - a surprise full re-render would otherwise blow away focus
    // and half-typed input.
    const onLiveScreen = state.role==='customer' && (state.screen==='custHome' || state.screen==='custStore');
    const typing = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
    if(onLiveScreen && !state.sheet && !typing) render();
  }catch(e){ /* silent - background refresh */ }
}
function ensureLiveRefresh(){
  if(_liveRefreshTimer || !sb) return;
  _liveRefreshTimer = setInterval(refreshLiveListings, LIVE_REFRESH_MS);
}
// Lazy close-on-view: there's no background job runner in this app, so an
// auction past its end_time is only actually transitioned out of 'active'
// when someone's browser happens to check it here - whenever the listing is
// rendered or interacted with (see ensureCountdownTimer() and placeBid()).
// The DB update is guarded by .eq('status','active') so concurrent viewers
// racing this don't matter - only the first to land actually changes anything.
async function checkAndSettleAuction(auctionId){
  const a = DB.auctions.find(x=>x.id===auctionId);
  if(!a) return;
  if(a.status==='active' && Date.now()>=a.endTime){
    if(sb){
      const { error } = await sb.from('auction_listings').update({ status:'ended' }).eq('id', a.id).eq('status','active');
      if(error){ console.error('Failed to close auction:', error); }
    }
    a.status = 'ended';
  }
  // Only the winning bidder's own session can create their winning order (orders
  // RLS requires customer_id = auth.uid()), so this only fires anything when the
  // person currently viewing is the auction's winner.
  if(a.status==='ended' && a.currentHighestBidder && state.authed && state.customerId===a.currentHighestBidder){
    await settleAuctionWin(a);
  }
  render();
}
// Converts a won auction into a real order so it flows into the existing

// UI until the winner picks a zone and payment method via
// sheetCompleteAuctionOrder()/submitCompleteAuctionOrder() - same zone
// selection every other order goes through, just deferred since there's no
// checkout sheet to run for a win.
async function settleAuctionWin(auction){
  if(auction.orderId || auction.status==='settled') return;

    // that picks the zone) - see sheetCompleteAuctionOrder()/submitCompleteAuctionOrder().

    items: [{itemId:item.id, name:item.name, price:auction.currentHighestBid, qty:1}],

    // Whether the buyer pays the zone fee is fixed by the item's own listing-time

async function submitCompleteAuctionOrder(orderId){
  const o = DB.orders.find(x=>x.id===orderId);
  if(!o) return;
  const deliveryTarget = readDeliveryTargetFields();
  if(!deliveryTarget) return;
  // Zone fee, total, and delivery_partner_payout are all computed inside
  // complete_auction_order() itself now - the RPC's own preconditions (still
  // awaiting_completion, caller is the auction's winning bidder) are the real guard.
  const updated = await callOrderRpc('complete_auction_order',
    { p_order_id: orderId, p_delivery_zone: _selectedZone, p_payment_method: _selectedPay,
      p_delivery_target_type: deliveryTarget.deliveryTargetType, p_receiver_name: deliveryTarget.receiverName,
      p_receiver_phone: deliveryTarget.receiverPhone, p_receiver_address: deliveryTarget.receiverAddress }, orderId);
  if(!updated) return;
  closeSheet();
  toast('Order confirmed!');
  render();

async function placeBid(auctionId){
  if(sb && !state.authed){ openSheet('signIn'); return; }
  const auction = DB.auctions.find(a=>a.id===auctionId);
  if(!auction) return;
  const biz = DB.businesses.find(b=>b.id===auction.businessId);
  if(biz && biz.ownerId===state.customerId){ toast("You can't bid on your own store's auction",'bad'); return; }
  const inputEl = document.getElementById(`bidInput_${auctionId}`);
  const amount = Number(inputEl ? inputEl.value : NaN);
  if(sb){
    // Refresh from the server first purely so the client-side checks below (and
    // their error messages) are accurate - e.g. telling the user the auction
    // already ended rather than a generic rejection. This read is NOT the
    // correctness gate; place_bid()'s single atomic UPDATE is, so a stale read
    // here can't actually let an invalid bid through.
    const { data: fresh, error: fetchErr } = await sb.from('auction_listings').select('*').eq('id', auctionId).single();
    if(fetchErr || !fresh){ toast('Could not load the latest auction state — try again','bad'); return; }
    Object.assign(auction, fromDbRow('auctions', fresh));
  }
  if(Date.now()>=auction.endTime || auction.status!=='active'){
    toast('This auction has already ended','bad');
    await checkAndSettleAuction(auctionId);
    return;
  }
  const minBid = auctionMinNextBid(auction);
  if(!amount || amount < minBid){ toast(`Bid must be at least ${money(minBid)}`,'bad'); return; }
  if(sb){
    // place_bid() does the real, atomic check-and-write (see the SQL comment
    // near the top of this file) - Postgres serializes concurrent calls to it
    // against the same row, so an empty result here means someone else's bid
    // genuinely landed first, not a bug.
    const { data, error } = await sb.rpc('place_bid', { p_auction_id: auctionId, p_bid_amount: amount });
    if(error){ console.error('place_bid failed:', error); toast('Could not place your bid — try again','bad'); return; }
    const updatedRow = Array.isArray(data) ? data[0] : data;
    if(!updatedRow){
      toast('Someone else just placed a higher bid — check the current price and try again','bad');
      await checkAndSettleAuction(auctionId); // in case it was really the auction ending, not a race
      return;
    }
    Object.assign(auction, fromDbRow('auctions', updatedRow));
  } else {
    auction.currentHighestBid = amount; auction.currentHighestBidder = state.customerId;
  }
  toast('Bid placed!');
  render();
}

// Remembers which screen/role/store a viewer was on, in localStorage, so a page
// reload - including one triggered automatically by publishing a new version of
// this Artifact - doesn't silently drop everyone back to the guest home screen.
// Deliberately narrow: only navigation-shape fields. Never authed/customerId/etc -
// those always come fresh from the real Supabase session (see applySession()),
// never from a locally cached guess. sheet/sheetData/drawerOpen are left out too -
// they're transient overlays (and sheetData sometimes holds a whole order object,
// not just an id), so a reload always starts with everything closed, which is the
// right default for a login-flow sheet especially.
const NAV_STORAGE_KEY = 'maldexpress_nav_v1';
function loadNavState(){
  try{
    const raw = localStorage.getItem(NAV_STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; } // private-browsing/storage-disabled - just skip restoring
}
function saveNavState(){
  try{
    const { role, screen, activeBizId, activeDelId, browseBizId, storeTab, cart, favourites, homeListingType, homeCategory, homeSearch, fontSize } = state;
    localStorage.setItem(NAV_STORAGE_KEY, JSON.stringify({ role, screen, activeBizId, activeDelId, browseBizId, storeTab, cart, favourites, homeListingType, homeCategory, homeSearch, fontSize }));
  }catch(e){ /* storage may be unavailable - navigation just won't persist this session */ }
}
// Applied immediately (before the very first render()) so that first render already
// reflects the restored screen instead of flashing the default customer home first.
(function restoreNavState(){
  const saved = loadNavState();
  if(saved) Object.assign(state, saved);
})();

function applySession(session){
  if(session && session.user){
    state.authed = true;
    state.customerId = session.user.id;
    state.customerEmail = session.user.email;
    const fullName = session.user.user_metadata && session.user.user_metadata.full_name;
    state.customerName = fullName || session.user.email.split('@')[0];
  } else {
    state.authed = false;
    state.customerId = null;
    state.customerEmail = null;
    state.customerName = 'Guest';
    state.customerPhone = '';
  }
}
