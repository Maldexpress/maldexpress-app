async function loadDB(){
  if(!sb){
    // Unconfigured copy (local preview): runs on sample data. Setup steps are
    // in the README, so nothing is shown to the person using it.
    storageReady = true;
    return;
  }
  try{
    const [b,i,o,d,pr,au,bk,bd,cr,cc,ad,fr,ps] = await Promise.all([
      sb.from('businesses').select('*'),
      sb.from('items').select('*'),
      sb.from('orders').select('*'),
      sb.from('delivery_persons').select('*'),
      sb.from('pro_upgrade_requests').select('*'),
      sb.from('auction_listings').select('*'),
      sb.from('rental_bookings').select('*'),
      sb.from('auction_bids').select('*'),
      sb.from('category_requests').select('*'),
      sb.from('custom_categories').select('*'),
      sb.from('customer_addresses').select('*'),
      sb.from('featured_requests').select('*'),
      sb.from('platform_settings').select('*').eq('id',1).maybeSingle()
    ]);
    // Promise.all only rejects on a thrown/network-level failure - a query that
    // completes but fails server-side (e.g. an RLS policy error) resolves normally
    // with a populated .error field instead, which was previously never checked,
    // so a broken policy on just one table silently looked like "this store has no
    // items" rather than surfacing anything was wrong.
    const failed = [['businesses',b],['items',i],['orders',o],['delivery',d],['pro upgrade requests',pr],['auctions',au],['rental bookings',bk],['auction bids',bd],['category requests',cr],['custom categories',cc],['addresses',ad]]
      .filter(([,res])=>res.error);
    if(failed.length){
      failed.forEach(([label,res])=>console.error(`loadDB: ${label} query failed:`, res.error));
      toast(`Could not load ${failed.map(([label])=>label).join(', ')} — some data may be missing`, 'bad');
    }
    DB.businesses = (b.data||[]).map(r=>fromDbRow('businesses',r));
    DB.items = (i.data||[]).map(r=>fromDbRow('items',r));
    DB.orders = await Promise.all((o.data||[]).map(async r=>{ const ord=fromDbRow('orders',r); await decryptOrderRow(ord, r); return ord; }));
    DB.orders.sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.delivery = (d.data||[]).map(r=>fromDbRow('delivery',r));
    DB.proRequests = (pr.data||[]).map(r=>fromDbRow('proRequests',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.auctions = (au.data||[]).map(r=>fromDbRow('auctions',r));
    DB.bookings = await Promise.all((bk.data||[]).map(async r=>{ const bkg=fromDbRow('bookings',r); await decryptBookingRow(bkg, r); return bkg; }));
DB.bookings.sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.bids = (bd.data||[]).map(r=>fromDbRow('bids',r));
    DB.categoryRequests = (cr.data||[]).map(r=>fromDbRow('categoryRequests',r)).sort((a,b2)=>b2.createdAt-a.createdAt);
    DB.customCategories = (cc.data||[]).map(r=>r.name).filter(Boolean);
    DB.addresses = (ad.data||[]).map(r=>fromDbRow('addresses',r));
    DB.featuredRequests = (fr.data||[]).map(featReqFromRow).sort((a,b2)=>b2.createdAt-a.createdAt);
    if(ps.data) DB.settings = settingsFromRow(ps.data);
    await loadRiderBanks();
    await loadItemSales();
    mergeCustomCategories();
    // Ids only - credentials never leave the server (see business_swipe_accounts).
    const { data: swipeIds, error: swipeErr } = await sb.rpc('swipe_connected_business_ids');
    if(swipeErr) console.error('loadDB: swipe_connected_business_ids failed:', swipeErr);
    const connected = new Set((swipeIds||[]).map(r=>typeof r==='string'?r:(r.swipe_connected_business_ids||r.business_id)));
    DB.businesses.forEach(b=>{ b.swipeConnected = connected.has(b.id); });
  }catch(e){ console.error(e); toast('Could not reach Supabase — check your config', 'bad'); }
  storageReady = true;
}
async function saveDB(part, only){
  if(!sb) return;
  try{
    // `only`, when given, limits the upsert to specific rows rather than the
    // whole DB[part] array. Needed for 'items': DB.items holds every
    // business's items (loaded via the public-read policy for customer
    // browsing), but the owner-only RLS check on writes rejects the entire
    // upsert if the batch includes even one row this session doesn't own.
    const rows = (only || DB[part]).map(o=>toDbRow(part,o));
    const { error } = await sb.from(TABLES[part]).upsert(rows);
    if(error){ console.error(error); toast(/item_limit_reached/.test(error.message) ? `Your store has reached the ${STORE_ITEM_LIMIT}-item limit` : /photo_in_use/.test(error.message) ? `A photo is already used for “${(error.message.split('photo_in_use:')[1]||'another item').trim()}”. Each item needs its own photo` : /store_bank_required/.test(error.message) ? 'Add your store bank account in Settings first' : 'Save failed: '+error.message, 'bad'); return false; }
    return true;
  }catch(e){ console.error(e); toast('Save failed — check connection', 'bad'); return false; }
}
// Every order mutation that touches a payment/payout column now goes through one of
// the eight SECURITY DEFINER functions below instead of a client-side field write +
// saveDB('orders') upsert - the function's own WHERE clause (ownership, status
// preconditions) is the real gate, so a RETURNS SETOF orders with zero rows means the
// precondition wasn't met (wrong owner, stale status, etc.), not a network failure.
// On success the row Postgres actually wrote is applied back to DB.orders, rather than
// trusting whatever the client optimistically computed beforehand.
async function callOrderRpc(rpcName, args, orderId, failMsg){
  // Without a server connection (offline sample-data mode) there's nothing to
  // call; this used to throw on sb being null.
  if(!sb){ toast("You're offline, so this can't be saved. Reconnect and try again", 'bad'); return null; }
  const { data, error } = await sb.rpc(rpcName, args);
  if(error){ toast('Could not update order: '+bankErrText(error.message), 'bad'); return null; }
  if(!data || !data.length){ toast(failMsg || "Couldn't update this order — it may have changed, or you may not have permission", 'bad'); return null; }
  const updated = fromDbRow('orders', data[0]);
  await decryptOrderRow(updated, data[0]);
  const idx = DB.orders.findIndex(o=>o.id===orderId);
  if(idx>=0) DB.orders[idx] = updated; else DB.orders.unshift(updated);
  return updated;
}

    <div class="contact-btns">
      <a class="contact-btn" href="tel:+${intl}" aria-label="Call ${who}">Call</a>
      <a class="contact-btn" href="https://wa.me/${intl}" target="_blank" rel="noopener" aria-label="WhatsApp ${who}">WhatsApp</a>
      <a class="contact-btn" href="viber://chat?number=%2B${intl}" aria-label="Viber ${who}">Viber</a>
    </div>

// ---------- Swipe order payments (Buy now orders) ----------
// Flow: placed (awaiting_approval) -> store approves (awaiting_swipe) or
// declines -> customer pays on the store's own Swipe link -> paid (set by
// the swipe-order-webhook edge function, which also records the fees).
// Fees: Maldexpress takes 5% of the total; Swipe's 1% charge is split 1:1
// between the store and Maldexpress. Keep in sync with swipe-order-webhook.
const SWIPE_FEES = { platformRate: 0.05, swipeRate: 0.01 };
const round2 = n => Math.round(n*100)/100;
function swipeFeeBreakdown(o){
  const total = Number(o.total)||0;
  const swipeFee = o.swipeFee!=null ? o.swipeFee : round2(total*SWIPE_FEES.swipeRate);
  const platformFee = o.platformFee!=null ? o.platformFee : round2(total*SWIPE_FEES.platformRate);
  const due = o.platformFeeDue!=null ? o.platformFeeDue : round2(platformFee - swipeFee/2);
  return { total, swipeFee, platformFee, due, keep: round2(total - swipeFee - due) };
}
// The local preview (no Supabase configured) simulates the server steps so
// the whole flow can be tried; a configured app that's offline refuses.
const SWIPE_PREVIEW = !SB_CONFIGURED;
function swipeOrderNeedsPayment(o){ return o && o.paymentMethod==='swipe' && o.paymentStatus!=='paid' && o.paymentStatus!=='settled'; }
// Buy now orders can be paid by Swipe (if the store connected it) or by bank
// transfer to the store's account. Either way the store approves the order
// first, and it goes to a rider only once it's paid.
function isBuyNowOrder(o){ return o && !o.rentalItemId && !DB.auctions.some(a=>a.orderId===o.id); }
function buyNowNeedsPayment(o){ return swipeOrderNeedsPayment(o) || (o && o.paymentMethod==='transfer' && isBuyNowOrder(o) && o.paymentStatus!=='paid' && o.paymentStatus!=='settled'); }
function bizHasBankAccount(biz){ return !!(biz && String(biz.accountNumber||'').trim()); }
// Swipe is offered only once the admin has switched it on (Admin -> Settings,
// after the Swipe server keys are added) and the store has connected it.
function swipeLive(){ return SWIPE_PREVIEW || !!(DB.settings && DB.settings.swipeEnabled); }
function bizTakesSwipe(biz){ return !!(biz && biz.swipeConnected && swipeLive()); }
function bizCanTakeOrders(biz){ return !!(biz && (bizTakesSwipe(biz) || bizHasBankAccount(biz))); }
const TRANSFER_FEE_RATE = 0.05;   // Maldexpress fee on Buy now bank-transfer orders (no Swipe charge to split)
let _ckPay = {};                  // checkout: chosen payment per store id
function ckPayFor(biz){ if(!bizTakesSwipe(biz)) return 'transfer'; if(!bizHasBankAccount(biz)) return 'swipe'; return _ckPay[biz.id] || 'swipe'; }
function setCkPay(bizId, m){ _ckPay[bizId] = m; refreshCheckoutCards(); }

function islandKey(atollCode, island){ return atollCode==='Malé' ? island : `${atollCode}. ${island}`; }
function isGreaterMale(key){ return !key || GREATER_MALE.includes(key); }   // no island set = legacy Malé store

  if(isGreaterMale(key)) return ATOLLS[0];
  const code = String(key).split('. ')[0];
  return ATOLLS.find(a=>a.code===code) || null;
}
function islandPlain(key){ return isGreaterMale(key) ? (key||'Malé') : String(key).split('. ').slice(1).join('. '); }

  const fromMale = isGreaterMale(originKey), toMale = isGreaterMale(destKey);
  if(fromMale && toMale) return 'male_zone';
  if(fromMale) return 'boat_to_island';
  if(toMale) return 'boat_to_male';

// ---------- Nearby riders (GPS) ----------
// A rider sees a store's open jobs if they're registered on the store's
// island (any Greater Malé island counts as one area), or if they're online
// with a fresh location within NEARBY_KM of the store's saved location.
const NEARBY_KM = 20;
const LOCATION_FRESH_MS = 30*60*1000;
function kmBetween(aLat, aLng, bLat, bLng){
  const R = 6371, toRad = d=>d*Math.PI/180;
  const dLat = toRad(bLat-aLat), dLng = toRad(bLng-aLng);
  const h = Math.sin(dLat/2)**2 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function riderIsLive(d){ return !!(d && d.online && d.lat!=null && d.lng!=null && d.locationUpdatedAt && Date.now()-d.locationUpdatedAt < LOCATION_FRESH_MS); }
function jobVisibleToRider(o, d){
  if(!d) return false;
  const biz = DB.businesses.find(b=>b.id===o.businessId);
  const from = o.originIsland || bizIsland(biz);
  const riderIsland = d.island || 'Malé';   // same rule as the server (rider_can_see_open_order)
  const sameArea = isGreaterMale(from) ? isGreaterMale(riderIsland) : from===riderIsland;
  return sameArea;   // own island only (Greater Malé is one area), no nearby exception: same as rider_fits_business() on the server
}
function riderDistanceText(o, d){
  const biz = DB.businesses.find(b=>b.id===o.businessId);
  if(!riderIsLive(d) || !biz || biz.lat==null) return '';
  return `${kmBetween(d.lat, d.lng, biz.lat, biz.lng).toFixed(1)} km away`;
}

function fmtBoatDeparture(ts){

/* ---- Rental booking date-window helpers - a booking blocks the item for its
   whole [requestedDate, requestedDate + days - 1] span, not just its start day,
   so both "is this item booked right now" (blocks instant renting) and "does a
   new booking request clash with one already accepted" reuse the same range
   math instead of comparing single dates. ---- */
function bookingDateRange(bk){
  const [y,m,d] = bk.requestedDate.split('-').map(Number);
  const start = new Date(y, m-1, d);
  const end = new Date(y, m-1, d + (Number(bk.days)||1) - 1);
  return { start, end };
}
function itemBookingWindows(itemId){
  return DB.bookings.filter(bk=>bk.itemId===itemId && bk.status==='accepted')
    .map(bk=>({ bk, ...bookingDateRange(bk) }))
    .sort((a,b)=>a.start-b.start);
}
function currentBookingBlock(itemId){
  const now = new Date(); now.setHours(0,0,0,0);
  return itemBookingWindows(itemId).find(w=>w.start<=now && now<=w.end) || null;
}
function bookingOverlapsExisting(itemId, dateStr, days, excludeId=null){
  const [y,m,d] = dateStr.split('-').map(Number);
  const start = new Date(y, m-1, d);
  const end = new Date(y, m-1, d + (Number(days)||1) - 1);
  return itemBookingWindows(itemId).some(w=>w.bk.id!==excludeId && start<=w.end && w.start<=end);
}

function auctionForItem(itemId){ return DB.auctions.find(a=>a.itemId===itemId); }
// Called from every screen that renders a list of auction items, so an auction
// that's already past its end_time gets closed/settled the moment anyone views
// it - not only one that was seen actively counting down (an auction opened for
// the first time after it already ended would otherwise render as "ended" purely
// from the client-side time comparison, with no data-auction-end element for
// ensureCountdownTimer() to ever notice and act on).
function settleExpiredAuctions(itemList){
  itemList.filter(i=>i.listingType==='auction').forEach(i=>{
    const a = auctionForItem(i.id);
    if(a && a.status==='active' && Date.now()>=a.endTime) checkAndSettleAuction(a.id);
  });
}
function auctionMinNextBid(auction){
  return auction.currentHighestBid!=null ? auction.currentHighestBid + auction.bidIncrement : auction.startingPrice;
}
function fmtCountdown(ms){
  if(ms<=0) return 'Ended';
  const s = Math.floor(ms/1000);
  const d = Math.floor(s/86400), h = Math.floor((s%86400)/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if(d>0) return `${d}d ${h}h left`;
  if(h>0) return `${h}h ${m}m left`;
  if(m>0) return `${m}m ${sec}s left`;
  return `${sec}s left`;
}
// One shared interval, (re)started after any render that includes an auction
// countdown, and self-clearing once none remain in the DOM (e.g. after
// navigating away) - render() fully replaces #app on every screen change, so
// there's nothing else to explicitly tear this down when it's no longer needed.
let _countdownTimer = null;
// Auction ids currently mid-settlement via checkAndSettleAuction() below - guards
// against renderCustOrders() (which re-triggers settlement on every render while
// an ended win sits unsettled) firing a second overlapping call for the same
// auction before the first one's async work (and the render() it ends with)
// finishes, which could otherwise create two orders for the same win.
let _settlingAuctionIds = new Set();
function ensureCountdownTimer(){
  if(_countdownTimer) return;
  _countdownTimer = setInterval(()=>{
    const els = document.querySelectorAll('[data-auction-end]');
    if(!els.length){ clearInterval(_countdownTimer); _countdownTimer=null; return; }
    els.forEach(el=>{
      const end = Number(el.getAttribute('data-auction-end'));
      const ms = end - Date.now();
      el.textContent = fmtCountdown(ms);
      if(ms<=0 && !el.dataset.settling){
        el.dataset.settling = '1';
        checkAndSettleAuction(el.getAttribute('data-auction-id'));
      }
    });
  }, 1000);
}
// Live listings refresh: businesses/items/auctions are only ever loaded into DB
// once, at page load (see loadDB()) - so a buyer's tab that's been open for a
// while has no way to know a seller (in another tab/session) just listed a new
// item, short of a manual page reload. This polls those three tables in the
// background and, if we're actually looking at a screen that renders from them,
// re-renders so new listings/price changes/stock just show up. Orders/delivery/
// proRequests aren't included - only the customer home feed and store screen
// consume this data, so those are the only tables worth the extra reads.
const LIVE_REFRESH_MS = 8000;
let _liveRefreshTimer = null;
async function refreshLiveListings(){
  if(!sb || !state.authed) return;
  try{
    // orders included so a delivery partner sees a newly-posted job (see
    // markOrderReadyForPickup()) show up on delHome without a manual refresh -
    // RLS already scopes the rows back to exactly what this account can see
    // (their own orders, their own store's, and/or open + assigned delivery
    // jobs), same as every other fetch in this app.
    const [i, b, au, o] = await Promise.all([
      sb.from('items').select('*'),
      sb.from('businesses').select('*'),
      sb.from('auction_listings').select('*'),
      sb.from('orders').select('*')
    ]);
    if(i.error || b.error || au.error || o.error) return; // silent - background refresh, not a user action
    DB.items = (i.data||[]).map(r=>fromDbRow('items',r));
    DB.businesses = (b.data||[]).map(r=>fromDbRow('businesses',r));
    DB.auctions = (au.data||[]).map(r=>fromDbRow('auctions',r));
    DB.orders = await Promise.all((o.data||[]).map(async r=>{ const ord=fromDbRow('orders',r); await decryptOrderRow(ord, r); return ord; }));
    // Only auto-render on the screens that actually read this data, and never
    // while a sheet is open or the person is mid-typing (a search box, a sign-in/
    // checkout field) - a surprise full re-render would otherwise blow away focus
    // and half-typed input.
    checkNewRiderJobs();
    const onLiveScreen = (state.role==='customer' && (state.screen==='custHome' || state.screen==='custStore'))
      || (state.role==='delivery' && state.screen==='delHome');
    const typing = document.activeElement && ['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName);
    if(onLiveScreen && !state.sheet && !typing) render();
  }catch(e){ /* silent - background refresh */ }
}
function ensureLiveRefresh(){
  if(_liveRefreshTimer || !sb) return;
  _liveRefreshTimer = setInterval(refreshLiveListings, LIVE_REFRESH_MS);
}
// Lazy close-on-view: there's no background job runner in this app, so an
// auction past its end_time is only actually transitioned out of 'active'
// when someone's browser happens to check it here - whenever the listing is
// rendered or interacted with (see ensureCountdownTimer() and placeBid()).
// The DB update is guarded by .eq('status','active') so concurrent viewers
// racing this don't matter - only the first to land actually changes anything.
async function checkAndSettleAuction(auctionId){
  const a = DB.auctions.find(x=>x.id===auctionId);
  if(!a) return;
  if(a.status==='active' && Date.now()>=a.endTime){
    if(sb){
      const { error } = await sb.from('auction_listings').update({ status:'ended' }).eq('id', a.id).eq('status','active');
      if(error){ console.error('Failed to close auction:', error); }
    }
    a.status = 'ended';
  }
  // Only the winning bidder's own session can create their winning order (orders
  // RLS requires customer_id = auth.uid()), so this only fires anything when the
  // person currently viewing is the auction's winner.
  if(a.status==='ended' && a.currentHighestBidder && state.authed && state.customerId===a.currentHighestBidder){
    await settleAuctionWin(a);
  }
  render();
}
// Converts a won auction into a real order so it flows into the existing
// order/payment process instead of being a dead end. paymentStatus
// 'awaiting_completion' is what every other order card/detail view checks
// for to show a "Complete your order" prompt instead of the normal payment
// UI until the winner picks a zone and payment method via
// sheetCompleteAuctionOrder()/submitCompleteAuctionOrder() - same zone
// selection every other order goes through, just deferred since there's no
// checkout sheet to run for a win.
async function settleAuctionWin(auction){
  if(auction.orderId || auction.status==='settled') return;
  const item = DB.items.find(i=>i.id===auction.itemId);
  const biz = DB.businesses.find(b=>b.id===auction.businessId);
  if(!item || !biz) return;
  const order = {
    id: uid('ord'), businessId: biz.id, businessName: biz.name,
    customerId: state.customerId, customerEmail: state.customerEmail,
    customerName: state.customerName, customerPhone: '',
    // Receiver info is collected once the winner completes the order (same screen
    // that picks the zone) - see sheetCompleteAuctionOrder()/submitCompleteAuctionOrder().
    deliveryTargetType: 'person', receiverName: null, receiverPhone: null, receiverAddress: null,
    items: [{itemId:item.id, name:item.name, price:auction.currentHighestBid, qty:1}],
    itemsTotal: auction.currentHighestBid, deliveryFee: 0, extraDeliveryFee: item.extraDeliveryFee||0, total: auction.currentHighestBid,
    // Whether the buyer pays the zone fee is fixed by the item's own listing-time
    // checkbox; the zone itself (and so the fee amount and delivery_partner_payout)
    // isn't known until the winner picks one in sheetCompleteAuctionOrder(). The
    // seller's extra delivery fee, if any, is snapshotted now since it's known
    // regardless of zone, and added into the total once completed.
    zone: null, deliveryType: item.freeDelivery ? 'free' : 'zone',
    deliveryPartnerPayout: null, payoutStatus: null,
    deliveryPersonId:null, deliveryPersonName:null,
    paymentMethod:null, paymentStatus:'awaiting_completion', status:'placed',
    createdAt: Date.now(), slipDataUrl:null
  };
  if(sb){
    const dbRow = toDbRow('orders', order);
    await encryptOrderRow(dbRow, order);
    const { error } = await sb.from('orders').insert(dbRow);
    if(error){ console.error('Failed to create winning order:', error); toast("You won the auction, but creating your order failed — contact the seller.",'bad'); return; }
    const { error: settleErr } = await sb.from('auction_listings').update({ status:'settled', order_id: order.id }).eq('id', auction.id).eq('status','ended');
    if(settleErr) console.error('Failed to mark auction settled:', settleErr);
  }
  DB.orders.unshift(order);
  auction.status = 'settled'; auction.orderId = order.id;
  toast(`🎉 You won the auction for ${money(auction.currentHighestBid)}! Complete your order to finish.`);
  openSheet('completeAuctionOrder', order.id);
}

async function submitCompleteAuctionOrder(orderId){
  const o = DB.orders.find(x=>x.id===orderId);
  if(!o) return;
  const deliveryTarget = readDeliveryTargetFields();
  if(!deliveryTarget) return;
  // Shipping info is envelope-encrypted client-side (same helper placeStoreOrder uses)
  // before it ever reaches the RPC - the RPC only accepts ciphertext now.
  const dbRow = { receiver_name: deliveryTarget.receiverName, receiver_phone: deliveryTarget.receiverPhone, receiver_address: deliveryTarget.receiverAddress };
  await encryptOrderRow(dbRow, o);
  const payingBySwipe = _selectedPay==='swipe';
  // Cash for an auction win is paid to the store, never the rider.
  const method = _selectedPay==='cash_to_delivery' ? 'cash_on_pickup' : _selectedPay;
  const updated = await callOrderRpc('complete_auction_order',
    { p_order_id: orderId, p_delivery_zone: _selectedZone, p_payment_method: method,
      p_delivery_target_type: deliveryTarget.deliveryTargetType, p_shipping_enc: dbRow.shipping_enc,
      p_shipping_iv: dbRow.shipping_iv, p_shipping_keys: dbRow.shipping_keys }, orderId);
  if(!updated) return;
  await rememberDeliveryAddress(deliveryTarget);
  // Swipe: complete_auction_order already set awaiting_swipe, so go straight to Swipe.
  if(payingBySwipe){ closeSheet(); render(); payOrderWithSwipe(orderId); return; }
  closeSheet();
  toast('Order confirmed!');
  render();
}
async function placeBid(auctionId){
  if(sb && !state.authed){ openSheet('signIn'); return; }
  const auction = DB.auctions.find(a=>a.id===auctionId);
  if(!auction) return;
  const biz = DB.businesses.find(b=>b.id===auction.businessId);
  if(biz && biz.ownerId===state.customerId){ toast("You can't bid on your own store's auction",'bad'); return; }
  const inputEl = document.getElementById(`bidInput_${auctionId}`);
  const amount = Number(inputEl ? inputEl.value : NaN);
  if(sb){
    // Refresh from the server first purely so the client-side checks below (and
    // their error messages) are accurate - e.g. telling the user the auction
    // already ended rather than a generic rejection. This read is NOT the
    // correctness gate; place_bid()'s single atomic UPDATE is, so a stale read
    // here can't actually let an invalid bid through.
    const { data: fresh, error: fetchErr } = await sb.from('auction_listings').select('*').eq('id', auctionId).single();
    if(fetchErr || !fresh){ toast('Could not load the latest auction state — try again','bad'); return; }
    Object.assign(auction, fromDbRow('auctions', fresh));
  }
  if(Date.now()>=auction.endTime || auction.status!=='active'){
    toast('This auction has already ended','bad');
    await checkAndSettleAuction(auctionId);
    return;
  }
  const minBid = auctionMinNextBid(auction);
  if(!amount || amount < minBid){ toast(`Bid must be at least ${money(minBid)}`,'bad'); return; }
  if(sb){
    // place_bid() does the real, atomic check-and-write (see the SQL comment
    // near the top of this file) - Postgres serializes concurrent calls to it
    // against the same row, so an empty result here means someone else's bid
    // genuinely landed first, not a bug.
    const { data, error } = await sb.rpc('place_bid', { p_auction_id: auctionId, p_bid_amount: amount });
    if(error){ console.error('place_bid failed:', error); toast('Could not place your bid — try again','bad'); return; }
    const updatedRow = Array.isArray(data) ? data[0] : data;
    if(!updatedRow){
      toast('Someone else just placed a higher bid — check the current price and try again','bad');
      await checkAndSettleAuction(auctionId); // in case it was really the auction ending, not a race
      return;
    }
    Object.assign(auction, fromDbRow('auctions', updatedRow));
  } else {
    auction.currentHighestBid = amount; auction.currentHighestBidder = state.customerId;
  }
  toast('Bid placed!');
  render();
}

// Catches a user who verified/signed in but never finished (or skipped, or had their
// browser closed during) the mobile-number step - without this there was no way to
// ever be re-prompted, since submitVerifyCode() only opens setupMobile once, inline,
// during the signup flow itself.
async function checkMobileProfile(){
  if(!sb || !state.authed) return;
  const { data, error } = await sb.from('user_profiles').select('user_id, phone').eq('user_id', state.customerId).maybeSingle();
  if(error){
    // A transient failure here must NOT be treated the same as "no profile row
    // exists" - that would force setupMobile open on an already-set-up user just
    // because of a flaky connection.
    console.error('checkMobileProfile failed:', error);

// Resumes a business/delivery signup intent, an item a guest tried to add to
// cart, or a Rent/Book/Checkout sheet a guest tried to open, once auth (and any
// forced setupMobile step) has finished — see enterRole() for the business/
// delivery routing. A pending cart item takes priority and just adds it
// (addToCart() itself now runs with state.authed already true, so it goes
// straight through, closes the sign-in sheet, and toasts); a pending item
// action re-opens the exact same sheet the guest was trying to reach (openRentItem/
// openBookRentalItem/goCheckout all re-check auth themselves and now pass) rather
// than silently dropping them back wherever they started.
function resolvePendingIntent(isFreshSignIn=false){
  const cartItemId = state.pendingCartItemId;
  state.pendingCartItemId = null;
  if(cartItemId && DB.items.some(i=>i.id===cartItemId)){ addToCart(cartItemId); return; }
  const favItemId = state.pendingFavItemId;
  state.pendingFavItemId = null;
  if(favItemId && DB.items.some(i=>i.id===favItemId)){ toggleFavourite(favItemId); return; }
  const itemAction = state.pendingItemAction;
  state.pendingItemAction = null;
  if(itemAction){
    if(itemAction.type==='rent' && DB.items.some(i=>i.id===itemAction.itemId)){ openRentItem(itemAction.itemId); return; }
    if(itemAction.type==='book' && DB.items.some(i=>i.id===itemAction.itemId)){ openBookRentalItem(itemAction.itemId); return; }
    if(itemAction.type==='checkout'){ goCheckout(); return; }
  }
  const intent = state.pendingIntent;
  state.pendingIntent = null;
  if(intent==='business' || intent==='delivery'){ enterRole(intent); return; }
  // A freshly-signed-in user (an actual sign-in just happened - see
  // handlePostAuth() - not merely an already-open session being restored on
  // page load) who's registered a business lands straight on its dashboard
  // instead of the customer view every time they log in, since running their
  // store is presumably why they're here - see goToOwnedBusiness(). Scoped to
  // isFreshSignIn so reloading the app while already signed in never yanks
  // someone back to their business mid-session after they deliberately chose
  // "Back to shopping".
  if(isFreshSignIn && state.role==='customer' && goToOwnedBusiness()) return;
  render();
}

// Normally sits just above the bottom nav (see .toast-wrap's CSS bottom), but the
// cart screen's fixed Total/Checkout bar (.cart-checkout-bar) sits in that exact
// spot with a higher z-index - without this, a toast fired while on the cart
// screen would render hidden behind that bar instead of being seen. When it's on
// screen, this measures its actual top edge and floats the toast just above it.
function toast(msg, kind='good'){
  const el = document.getElementById('toast');
  const wrap = document.getElementById('toastWrap');
  el.textContent = (kind==='good'?'✓ ':'⚠ ') + msg;
  el.className = 'toast show ' + kind;
  const checkoutBar = document.querySelector('.cart-checkout-bar');
  if(wrap){
    if(checkoutBar){
      const rect = checkoutBar.getBoundingClientRect();
      wrap.style.bottom = Math.round(window.innerHeight - rect.top + 10) + 'px';
    } else {
      wrap.style.bottom = '';
    }
  }
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(()=> el.classList.remove('show'), 2400);
}

// Screens visited so far in the current role - lets a swipe-right ("back")
// gesture step back through them (see goBack()/handleSwipeEnd() below).
// Cleared on every role change (switchRole()/enterRole()) and on sign-out, so
// "back" never crosses into a different role's screens or a signed-out
// state - there's simply nothing further back than an empty stack, which is
// exactly what keeps it from ever reaching past Home into a log-out.
let _screenHistory = [];
function go(screen, extra={}){
  if(state.screen && state.screen !== screen){
    _screenHistory.push({ role:state.role, screen:state.screen, activeBizId:state.activeBizId, activeDelId:state.activeDelId, browseBizId:state.browseBizId, storeTab:state.storeTab, homeListingType:state.homeListingType, homeCategory:state.homeCategory, homeSearch:state.homeSearch, viewItemId:state.viewItemId });
  }
  Object.assign(state, extra);
  state.screen = screen;
  state.drawerOpen = false;
  state.notifOpen = false;
  render();
  window.scrollTo(0,0);
}
// Closes whatever's on top - an open sheet, then the notification dropdown,
// then the drawer - without touching screen history. Split out from goBack()
// so the anywhere-on-screen swipe (handleSwipeEnd() below) can dismiss an
// overlay from any starting point, while the edge-swipe-back gesture
// (handleEdgeSwipeEnd()) only ever steps back a screen, never doubles up on
// closing something the anywhere-swipe already handled.
function closeTopmostOverlay(){
  if(state.sheet){ closeSheet(); return true; }
  if(state.notifOpen){ closeNotifDropdown(); render(); return true; }
  if(state.drawerOpen){ toggleDrawer(false); return true; }
  return false;
}
// Steps back to the previous screen in _screenHistory. With an empty history
// (e.g. already at Home) it simply does nothing, rather than continuing on
// to sign anyone out.
function goBackScreen(){
  if(_screenHistory.length){
    const prev = _screenHistory.pop();
    Object.assign(state, prev);
    render();
    window.scrollTo(0,0);
  }
}
function goBack(){
  if(closeTopmostOverlay()) return;
  goBackScreen();
}

/* =================== RENDER ROOT =================== */
// Home shuffles its items and categories every time it's opened (a new view):
// arriving on Home, or changing its listing type / category / search. Plain
// re-renders (live refresh, tapping a heart) keep the same order so nothing
// jumps while you look.
let _homeSeed = (Math.random()*4294967296)>>>0, _lastViewKey = '';
function viewShuffle(list, salt){ const seed = (_homeSeed ^ (salt||0))>>>0; return list.slice().sort((a,b)=>seededRank(String(a.id||a),seed)-seededRank(String(b.id||b),seed)); }
function render(){
  const app = document.getElementById('app');
  { const vk = state.adminMode ? 'admin' : [state.role, state.screen, state.screen==='custHome' ? [state.homeListingType, state.homeCategory, state.homeSearch].join('|') : ''].join(':');
    if(vk !== _lastViewKey){ if(state.role==='customer' && state.screen==='custHome' && !state.adminMode) _homeSeed = (Math.random()*4294967296)>>>0; _lastViewKey = vk; } }
  if(!storageReady){ app.innerHTML = `<div class="empty" style="padding-top:40vh;">Loading Maldexpress…</div>`; return; }
  if(state.adminMode) renderAdmin();
  else if(state.role==='business') renderBusiness();
  else if(state.role==='delivery') renderDelivery();
  else if(state.role==='customer') renderCustomer();
  // Custom confirm popup for confirmSwitchRole() below - native window.confirm()
  // doesn't fire inside this sandboxed preview, so a real overlay stands in for
  // it. Appended here (rather than baked into each render*() above) since "Back
  // to shopping" is reachable from several different screens/sheets at once.
  if(_confirmSwitchOpen) app.insertAdjacentHTML('beforeend', confirmSwitchOverlayHTML());
  // Same reasoning, same pattern - see planCompareOverlayHTML() for why this
  // is an overlay rather than a sheet.
  if(_planCompareOpen) app.insertAdjacentHTML('beforeend', planCompareOverlayHTML());
  const _scrKey = [state.adminMode?'admin':state.role, state.screen, state.viewItemId||''].join(':');
  if(_scrKey !== render._last && !REDUCED_MOTION){ const first = app.querySelector('.shell, .admin, .landing, .wrap') || app.firstElementChild; if(first){ first.classList.remove('screen-in'); void first.offsetWidth; first.classList.add('screen-in'); } }
  render._last = _scrKey;
  requestAnimationFrame(()=>{ restoreGalleries(); applyReveal(); });
  if(SB_LIB_MISSING || FB_LIB_MISSING) app.insertAdjacentHTML('afterbegin', `<div class="offline-banner" role="status">Can't reach the Maldexpress server, so you're seeing sample stores and nothing you do will be saved. Check your connection, then <button class="link-btn" style="padding:0; font-size:1em; color:inherit;" onclick="location.reload()">reload</button>.</div>`);
}


/* =================== MOTION: scroll reveal, image fade, parallax =================== */
// Cards and sections slide + fade in as they scroll into view and fade out as
// they leave (both directions, also in side-scrolling rows). Things already on
// screen when the same screen re-renders (typing in search, a +/- in the
// cart) don't replay. Nothing moves for people who ask for reduced motion.
const REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const REVEAL_SEL = '.pf-card, .pf-stats, .top-card, .ip-card, .glass.card, .item-card, .feat-panel, .section-head, .desk-tile, .ticket-card, .owe-tile, .admin-stat, .bulk-cta, .rev-item, .rev-sum, .addr-card';
let _rvIO = null, _rvScreen = '', _rvSeen = new Set();
function rvKey(el){ return (el.className.split(' ')[0]||'') + '|' + (el.getAttribute('onclick') || (el.textContent||'').trim().slice(0,48)); }
function applyReveal(){
  if(REDUCED_MOTION || !('IntersectionObserver' in window)) return;
  if(!_rvIO){
    _rvIO = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        const el = en.target;
        if(en.isIntersecting){ el.classList.add('rv-in'); _rvSeen.add(el._rvKey); }
        else if(el.classList.contains('rv-in')) el.classList.remove('rv-in','rv-now');
      });
    }, { threshold:0.08, rootMargin:'0px 0px -4% 0px' });
  }
  const screenKey = [state.adminMode?'admin':state.role, state.screen, state.viewItemId||'', state.adminTab||''].join(':');
  const same = screenKey === _rvScreen; _rvScreen = screenKey;
  if(!same) _rvSeen = new Set();
  const vh = window.innerHeight;
  document.querySelectorAll('#app ' + REVEAL_SEL.split(', ').join(', #app ')).forEach((el, i)=>{
    if(el.closest('.sheet, .home-mini, .drawer, .open-ad, .topbar') || el._rvOn) return;
    el._rvOn = true; el._rvKey = rvKey(el);
    const r = el.getBoundingClientRect();
    // A card taller than the screen (e.g. a store's long list of items to
    // approve) could never reach the 8% threshold while only its top shows,
    // so it would stay invisible: show such cards as they are.
    if(r.height > vh * 0.7) return;
    const onScreen = r.top < vh && r.bottom > 0 && r.left < window.innerWidth && r.right > 0;
    el.classList.add('rv');
    if(onScreen && same && _rvSeen.has(el._rvKey)) el.classList.add('rv-in','rv-now');   // re-render: no replay
    else el.style.setProperty('--rv-d', (onScreen ? Math.min(i % 8, 7) * 45 : 0) + 'ms');
    _rvIO.observe(el);
  });
  // Photos fade in once loaded, with a soft shimmer until then.
  document.querySelectorAll('#app .img-wrap img, #app .ip-photo img, #app .gal-thumb img').forEach(img=>{
    if(img._fd) return; img._fd = true;
    if(img.complete && img.naturalWidth) return;
    const wrap = img.closest('.img-wrap, .ip-photo'); img.classList.add('img-fade'); if(wrap) wrap.classList.add('img-loading');
    const done = ()=>{ img.classList.add('ok'); if(wrap) wrap.classList.remove('img-loading'); };
    img.addEventListener('load', done, { once:true }); img.addEventListener('error', done, { once:true });
  });
  heroParallax();
}
// The header picture drifts up slower than the page and fades as it goes.
function heroParallax(){
  if(REDUCED_MOTION) return;
  const sc = document.querySelector('.home-hero .hero-scene'); const hero = document.querySelector('.home-hero');
  if(!sc || !hero) return;
  const y = Math.max(0, document.body.scrollTop || document.documentElement.scrollTop || window.scrollY || 0);
  const k = Math.min(y, 300);
  sc.style.transform = `translate3d(0, ${k*0.35}px, 0)`; sc.style.opacity = String(1 - Math.min(k/260, 1)*0.85);
  hero.style.setProperty('--hero-shift', (k*0.25)+'px');
}
document.body.addEventListener('scroll', heroParallax, { passive:true });
window.addEventListener('scroll', heroParallax, { passive:true });

async function adminResolveCategoryRequest(reqId, approve){
  if(!requireOnline()) return;
  const req = DB.categoryRequests.find(r=>r.id===reqId);
  if(!req) return;
  const status = approve ? 'approved' : 'dismissed';
  const nowIso = new Date().toISOString();
  const { error } = await sb.from('category_requests').update({ status, resolved_at: nowIso, resolved_by: state.customerId }).eq('id', reqId);
  if(error){ toast('Failed: '+error.message,'bad'); return; }
  req.status = status; req.resolvedAt = Date.now(); req.resolvedBy = state.customerId;
  if(approve){
    const { error: ccErr } = await sb.from('custom_categories').insert({ name: req.categoryName });
    if(ccErr){ toast('Marked approved but failed to add the category: '+ccErr.message,'bad'); return; }
    if(!DB.customCategories.includes(req.categoryName)) DB.customCategories.push(req.categoryName);
    mergeCustomCategories();
    await graduateApprovedCategory(req);
  }
  toast(approve ? `"${req.categoryName}" added as a category` : 'Dismissed');
  render();
}
// Once a suggested name is approved, the store that asked for it - and
// everything on their profile that was filed under the placeholder "Other"
// while the request was pending - graduates to the real category name, so
// buyers see it under its proper name from here on instead of the generic
// "Other" bucket. Scoped to just that one business, so an unrelated store
// that separately picked the plain "Other" bucket (with no matching name of
// their own) is left alone.
async function graduateApprovedCategory(req){
  const biz = DB.businesses.find(b=>b.id===req.businessId);
  if(!biz) return;
  const bizCats = String(biz.category||'').split(',').map(s=>s.trim()).filter(Boolean);
  const idx = bizCats.indexOf('Other');
  if(idx!==-1 && String(biz.categoryOtherName||'').toLowerCase()===req.categoryName.toLowerCase()){
    if(!bizCats.includes(req.categoryName)) bizCats[idx] = req.categoryName; else bizCats.splice(idx,1);
    biz.category = bizCats.join(', ');
    biz.categoryOtherName = '';
    await sb.from('businesses').update({ category: biz.category, category_other_name: null }).eq('id', biz.id);
  }
  const affectedItems = DB.items.filter(i=>i.businessId===biz.id && i.category==='Other' && String(i.categoryOtherName||'').toLowerCase()===req.categoryName.toLowerCase());
  for(const it of affectedItems){
    it.category = req.categoryName;
    await sb.from('items').update({ category: it.category }).eq('id', it.id);
  }
}

const DEFAULT_SETTINGS = { swipeEnabled:false, featuredSlots:12, featuredPrice:50, featuredDays:3, bankAccountName:'', bankAccountNumber:'', adEnabled:false, adMediaUrl:'', adMediaType:'image', adLink:'', adSeconds:10, adSkipAfter:5, heroImageUrl:'' };

function featReqFromRow(r){ return { id:r.id, itemId:r.item_id, businessId:r.business_id, amount:Number(r.amount), days:r.days, paymentMethod:r.payment_method, status:r.status, slipUrl:r.slip_url||null, note:r.note||'', createdAt:new Date(r.created_at).getTime(), resolvedAt:r.resolved_at?new Date(r.resolved_at).getTime():null, startsAt:r.starts_at?new Date(r.starts_at).getTime():null, endsAt:r.ends_at?new Date(r.ends_at).getTime():null }; }

// Same order for everyone within an hour, a new random order each hour.
function hourSeed(){ return Math.floor(Date.now()/3600000); }
function seededRank(id, seed){ let h = 2166136261 ^ seed; for(let k=0;k<id.length;k++){ h ^= id.charCodeAt(k); h = Math.imul(h, 16777619); } h ^= h>>>16; h = Math.imul(h, 0x85ebca6b); h ^= h>>>13; h = Math.imul(h, 0xc2b2ae35); h ^= h>>>16; return (h>>>0); }   // FNV-1a + final mix so similar ids spread out
function featuredItemsNow(type){
  const seed = hourSeed();
  return DB.items.filter(i=>isFeaturedNow(i) && (!type || (i.listingType||'buy_now')===type))
    .filter(i=>!(i.listingType==='auction' && (()=>{ const a = auctionForItem(i.id); return !a || a.status!=='active' || Date.now()>=a.endTime; })()))
    .sort((a,b)=>seededRank(a.id,seed)-seededRank(b.id,seed));
}

  const item = DB.items.find(i=>i.id===itemId); if(!item) return;
  if(!_slipData){ toast('Choose your transfer slip first','bad'); return; }
  const req = { id:uid('feat'), item_id:item.id, business_id:item.businessId, amount:DB.settings.featuredPrice, days:DB.settings.featuredDays, payment_method:'bank_transfer', slip_url:_slipData };
  if(!sb){ DB.featuredRequests.unshift(featReqFromRow({ ...req, status:'pending', created_at:new Date().toISOString() })); _slipData=null; closeSheet(); toast('Sent. Maldexpress will check your payment'); render(); return; }
  if(!requireOnline()) return;
  const { data, error } = await sb.from('featured_requests').insert(req).select().single();
  if(error){ toast(/featured_request_pending/.test(error.message) ? 'This item already has a request waiting' : 'Could not send: '+error.message,'bad'); return; }

}

function adminApplyItems(rows){ (rows||[]).forEach(r=>{ const k = DB.items.findIndex(i=>i.id===r.id); const it = fromDbRow('items', r); if(k>=0) DB.items[k] = { ...DB.items[k], ...it }; else DB.items.push(it); }); }
function adminErr(e){ const m = (e && e.message) || ''; return /featured_full/.test(m) ? 'All featured spots are taken. Remove one or add spots in Settings' : /item_not_approved/.test(m) ? 'Approve the item first' : /not_admin/.test(m) ? 'Only the super admin can do this' : m; }
async function adminRpc(fn, args){
  if(!sb){ toast('Offline preview: nothing is saved','bad'); return null; }
  const { data, error } = await sb.rpc(fn, args);
  if(error){ toast(adminErr(error),'bad'); return null; }
  return data || [];
}

async function adminApproveFeatured(id){

async function onAdFile(e){
  const f = (e.target.files||[])[0]; e.target.value = ''; if(!f) return;
  const isVideo = /^video\//.test(f.type) || /\.(mp4|webm|mov)$/i.test(f.name);
  if(isVideo && f.size > 25*1024*1024){ toast('The video is over 25 MB. Use a shorter or smaller video','bad'); return; }
  if(!isVideo && f.size > 20*1024*1024){ toast('The picture is over 20 MB','bad'); return; }
  toast(isVideo ? 'Uploading video…' : 'Uploading picture…');
  const url = sb ? await uploadItemPhoto(f) : URL.createObjectURL(f);
  if(!url) return;
  _adDraft.url = url; _adDraft.type = isVideo ? 'video' : 'image';
  const box = document.getElementById('adAdminPrev'); if(box) box.innerHTML = adAdminPreviewHTML();
  toast('Uploaded. Press Save settings to use it');

async function adminSetTier(bizId, tier){
  if(!requireOnline()) return;
  const biz = DB.businesses.find(b=>b.id===bizId);
  if(!biz) return;
  const paidAt = tier==='pro' ? Date.now() : null;
  const { error } = await sb.from('businesses').update({ tier, paid_at: paidAt?new Date(paidAt).toISOString():null }).eq('id', bizId);
  if(error){ toast('Failed: '+error.message,'bad'); return; }
  biz.tier = tier; biz.paidAt = paidAt;
  toast(tier==='pro' ? 'Pro granted' : 'Pro revoked');
  render();
}
async function adminResolveRequest(reqId, approve){
  if(!requireOnline()) return;
  const req = DB.proRequests.find(r=>r.id===reqId);
  if(!req) return;
  const status = approve ? 'approved' : 'rejected';
  const nowIso = new Date().toISOString();
  const { error } = await sb.from('pro_upgrade_requests').update({ status, resolved_at: nowIso, resolved_by: state.customerId }).eq('id', reqId);
  if(error){ toast('Failed: '+error.message,'bad'); return; }
  req.status = status; req.resolvedAt = Date.now(); req.resolvedBy = state.customerId;
  if(approve){
    const { error: bizErr } = await sb.from('businesses').update({ tier:'pro', paid_at: nowIso }).eq('id', req.businessId);
    if(bizErr){ toast('Approved request but failed to grant Pro: '+bizErr.message,'bad'); return; }
    const biz = DB.businesses.find(b=>b.id===req.businessId);
    if(biz){ biz.tier='pro'; biz.paidAt=Date.now(); }
  }
  toast(approve ? 'Approved — Pro granted' : 'Rejected');
  render();
}

    if(sb && !state.authed){ openSheet('signIn', {intent:'delivery'}); return; }
    state.role='delivery';
    const mine = sb ? DB.delivery.filter(d=>d.userId===state.customerId) : DB.delivery;
    if(mine.length){ go('delPicker'); }
    else openSheet('delSignup');
  }
}
// Jumps a signed-in user straight into a business/delivery profile they
// already own, skipping the picker screen when there's only one (the common
// case) - used both for the drawer's cross-role shortcuts (a business owner
// who's also signed in as a delivery partner, or vice versa - see
// drawerHTML()) and for landing a business owner on their dashboard the
// moment they sign in (see resolvePendingIntent()). Someone with several
// stores/profiles still picks one, same as tapping "List your business" from
// the drawer would show (enterRole()) - there's no single obvious one to
// land them on. Returns false (does nothing) if they don't have one at all.
function goToOwnedBusiness(){
  const mine = DB.businesses.filter(b=>b.ownerId===state.customerId);
  if(!mine.length) return false;
  _screenHistory = [];
  state.role = 'business';
  if(mine.length===1) go('bizHome', {activeBizId:mine[0].id});
  else go('bizPicker');
  return true;
}
function goToOwnedDelivery(){
  const mine = DB.delivery.filter(d=>d.userId===state.customerId);
  if(!mine.length) return false;
  _screenHistory = [];
  state.role = 'delivery';
  if(mine.length===1) go('delHome', {activeDelId:mine[0].id});
  else go('delPicker');
  return true;
}
// ---- Work modes: a store owner / rider can switch from Home, and opens the app in their work mode ----
function myStores(){ return state.authed && state.customerId ? DB.businesses.filter(b=>b.ownerId===state.customerId) : []; }
function myRiderProfiles(){ return state.authed && state.customerId ? DB.delivery.filter(d=>d.userId===state.customerId) : []; }
// Which work mode was used last on this phone (only a convenience for people who
// have both a store and a rider profile; nothing depends on it being there).
function rememberWorkMode(m){ try{ localStorage.setItem('mx_work_mode', m); }catch(_){} }
function lastWorkMode(){ try{ return localStorage.getItem('mx_work_mode'); }catch(_){ return null; } }
function switchToStoreMode(){ rememberWorkMode('business'); state.drawerOpen = false; goToOwnedBusiness(); }
function switchToRiderMode(){ rememberWorkMode('delivery'); state.drawerOpen = false; goToOwnedDelivery(); }
// On opening the app: a store owner lands on their store, a rider on their jobs
// (both: whichever they used last, else the store). Customers stay on Home.
function openWorkModeOnStart(){
  if(state.adminMode || !state.authed) return false;
  const hasStore = myStores().length > 0, hasRider = myRiderProfiles().length > 0;
  if(!hasStore && !hasRider) return false;
  const pick = hasStore && hasRider ? (lastWorkMode()==='delivery' ? 'delivery' : 'business') : (hasStore ? 'business' : 'delivery');
  return pick==='business' ? goToOwnedBusiness() : goToOwnedDelivery();
}
function workModeButtonsHTML(){
  const st = myStores().length, rd = myRiderProfiles().length;
  if(!st && !rd) return '';
  return `${st ? `<button class="mode-pill" onclick="switchToStoreMode()" aria-label="Switch to my store">${'🏪'}<span>My store</span></button>` : ''}${rd ? `<button class="mode-pill" onclick="switchToRiderMode()" aria-label="Switch to my deliveries">${'🛵'}<span>Deliveries</span></button>` : ''}`;
}

/* =================== BUSINESS / DELIVERY PICKER (scoped to the signed-in account) === */
function renderPicker(list, kind){
  const app = document.getElementById('app');
  const items = list.map(b => `
    <button class="glass role-card" onclick="${kind==='biz'?`chooseBiz('${b.id}')`:`chooseDel('${b.id}')`}">
      <div class="ic">${kind==='biz'?'🏪':'🛵'}</div>
      <div class="txt"><h3>${b.name}</h3><small>${kind==='biz'?b.ownerName:b.phone}</small></div>
      <div class="arrow">→</div>
    </button>`).join('');
  app.innerHTML = `
    <div class="landing" style="justify-content:flex-start; padding-top:60px;">
      <div class="landing-mark"><h1>${kind==='biz'?'Your stores':'Your delivery profile'}</h1><p>${state.customerEmail ? `Signed in as ${state.customerEmail}` : 'Demo mode: sample stores, nothing is saved'}</p></div>
      ${items}
      <button class="btn btn-outline" style="margin-top:8px;" onclick="${kind==='biz'?"openSheet('bizSignup')":"openSheet('delSignup')"}">+ ${kind==='biz'?'Register another store':'Add delivery profile'}</button>
      <button class="link-btn" style="margin-top:16px;" onclick="confirmSwitchRole()">← Back to shopping</button>
    </div>
    ${sheetHTML()}`;
}
function chooseBiz(id){ state.role='business'; go('bizHome', {activeBizId:id}); }
function chooseDel(id){ state.role='delivery'; go('delHome', {activeDelId:id}); }

function drawerHTML(role){
  const nameMap = {business:'Store owner', delivery:'Delivery partner', customer:'Customer'};
  let bizName = '';
  if(role==='business'){ const b = DB.businesses.find(x=>x.id===state.activeBizId); bizName = b?b.name:''; }
  if(role==='delivery'){ const d = DB.delivery.find(x=>x.id===state.activeDelId); bizName = d?d.name:''; }
  if(role==='customer'){ bizName = state.authed ? state.customerEmail : 'Guest browsing'; }
  let items = '';
  if(role==='business'){
    items = `
      <button class="drawer-item" onclick="go('bizHome')"><span class="ic">🏠</span> Dashboard</button>
      <button class="drawer-item" onclick="go('bizItems')"><span class="ic">📦</span> My items</button>

    items = `

    `;
  } else {
    items = `
      <button class="drawer-item" onclick="go('custHome')"><span class="ic">🏠</span> Home</button>
      <button class="drawer-item" onclick="go('custFavourites')"><span class="ic">❤️</span> Favourites</button>

      <button class="drawer-item" onclick="toggleDrawer(false); openMyAddresses()"><span class="ic">📍</span> My addresses</button>

      <div class="divider"></div>
      <button class="drawer-item" onclick="toggleDrawer(false); enterRole('business')"><span class="ic">🏪</span> List your business</button>
      <button class="drawer-item" onclick="toggleDrawer(false); enterRole('delivery')"><span class="ic">🛵</span> Deliver with us</button>
      <div class="divider"></div>
      ${state.authed
        ? `<button class="drawer-item" onclick="signOutCustomer()"><span class="ic">🚪</span> Sign out</button>`
        : `<button class="drawer-item" onclick="toggleDrawer(false); openSheet('signIn')"><span class="ic">✉️</span> Sign in</button>`}
    `;
  }
  // A person can be both a business owner and a delivery partner on the same
  // account - these let them jump straight from one to the other without
  // detouring back through the customer drawer's "List your business"/
  // "Deliver with us" (which would otherwise be the only way there, even
  // though they already have one). Only shown when they actually have the
  // other profile to jump to.
  const myBiz = sb ? DB.businesses.filter(b=>b.ownerId===state.customerId) : DB.businesses;
  const myDel = sb ? DB.delivery.filter(d=>d.userId===state.customerId) : DB.delivery;

    ? `<button class="drawer-item" onclick="toggleDrawer(false); goToOwnedBusiness()"><span class="ic">🏪</span> Go to your business</button>`

    ? `<button class="drawer-item" onclick="toggleDrawer(false); goToOwnedDelivery()"><span class="ic">🛵</span> Go to your delivery jobs</button>`

      <div class="muted" style="font-size:.8em;">${nameMap[role]}</div>
      <span class="who-profile">Profile ›</span>
    </button>
    ${items}
    ${trailing}
  </div>`;
}

// sends that as a suggestion for the super admin to review (see
// adminCategoryRequestsTab()) - and, if approved, it becomes a normal,
// pickable category everywhere (see mergeCustomCategories()). Does nothing
// if "Other" wasn't marked, nothing was typed, or this business already has
// a pending request on file for that same name.
async function maybeSubmitCategoryRequest(idPrefix, biz){
  const cats = getCatChecklistValue(idPrefix).split(',').map(s=>s.trim());
  const otherName = getCatOtherName(idPrefix);
  if(!cats.includes('Other') || !otherName) return;
  await submitCategoryRequest(biz, otherName);

// Shared by the business-level "Other" checklist (see maybeSubmitCategoryRequest()
// above) and the per-item "Other" category field on Add/Edit item - either way
// it's the same suggestion queued for the super admin to review
// (adminCategoryRequestsTab()), deduped per business+name so re-saving a form
// that still has the same pending name on it doesn't pile up duplicates.
async function submitCategoryRequest(biz, otherName){
  if(!requireOnline()) return;
  if(!biz || !otherName) return;
  const already = DB.categoryRequests.some(r=>r.businessId===biz.id && r.status==='pending' && r.categoryName.toLowerCase()===otherName.toLowerCase());
  if(already) return;
  const req = { id:uid('catreq'), businessId:biz.id, businessName:biz.name, categoryName:otherName, status:'pending', createdAt:Date.now(), resolvedAt:null, resolvedBy:null };
  const { error } = await sb.from('category_requests').insert(toDbRow('categoryRequests', req));
  if(error){ console.error('category request failed:', error); return; }
  DB.categoryRequests.unshift(req);
}
// Renders a business's category as a "markable list" - checkbox pills instead
// of a single-select dropdown, since a store can genuinely fit more than one

// - the category-checklist circles below and every plain .chk-row checkbox
// (see the CSS comment above .chk-row) - so a mark looks the same wherever

function checkmarkSvg(){
  return `<svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 4.8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
// A plain single checkbox styled as the same thin-line circle used
// throughout the app (see .chk-row) instead of the browser's native box -

function chkRowHTML(id, checked, labelHtml, extra=''){
  return `<label class="chk-row" for="${id}">
    <input type="checkbox" id="${id}" ${checked?'checked':''} ${extra}>

function catChecklistHTML(idPrefix, selectedCats){
  const sel = new Set(String(selectedCats||'').split(',').map(s=>s.trim()).filter(Boolean));

      const checkedNow = sel.has(c);
      return `<label class="cat-check-item${checkedNow?' checked':''}" for="${cid}">
        <input type="checkbox" id="${cid}" value="${c}" ${checkedNow?'checked':''} onchange="toggleCatCheck(this)">
        <span class="cat-check-circle">${checkmarkSvg()}</span>
        <span>${categoryIcon(c)} ${c}</span>
      </label>`;
    }).join('')}
  </div>
  <div class="field" id="${idPrefix}_otherWrap" style="margin-top:8px;${otherChecked?'':' display:none;'}">

  </div>`;
}
function toggleCatCheck(el){
  const item = el.closest('.cat-check-item');
  if(item) item.classList.toggle('checked', el.checked);
  // "Other" reveals a free-text field right below the list for what kind of
  // business it actually is - captured at save time and sent to the super
  // admin as a category request (see submitBizSignup()/saveBizSettings() and
  // adminCategoryRequestsTab()) for them to consider adding as a real,
  // pickable category.
  if(el.value === 'Other'){
    const wrap = el.closest('.cat-check-list');
    const idPrefix = wrap ? wrap.id.replace(/_wrap$/,'') : null;
    const otherWrap = idPrefix ? document.getElementById(idPrefix+'_otherWrap') : null;
    if(otherWrap) otherWrap.style.display = el.checked ? '' : 'none';
  }
}
function getCatChecklistValue(idPrefix){

async function loadSupport(){
  if(!sb){ _support.loaded = true; return; }
  if(_support.loading) return; _support.loading = true;
  try{
    const { data, error } = await sb.from('support_tickets').select('*').order('updated_at', { ascending:false }).limit(200);
    if(!error){ const seen = Object.fromEntries(_support.tickets.map(t=>[t.id, t._seen])); _support.tickets = (data||[]).map(supRow); _support.tickets.forEach(t=>{ t._seen = seen[t.id]; }); }
    _support.loaded = true;
  } finally { _support.loading = false; }
}
async function loadTicketMsgs(id){
  if(!sb) return;
  const { data, error } = await sb.from('support_messages').select('*').eq('ticket_id', id).order('created_at');
  if(!error) _support.msgs[id] = (data||[]).map(supMsgRow);
}
function needSignInForSupport(){ if(sb && !state.authed){ toast('Sign in to contact support'); openSheet('signIn'); return true; } return false; }
async function openSupport(){
  if(needSignInForSupport()) return;
  openSheet('support'); await loadSupport(); if(state.sheet==='support') render();
}
let _supportDraft = null;   // { topic, orderId, bookingId }
function openNewTicket(draft){
  if(needSignInForSupport()) return;
  _supportDraft = draft || {}; openSheet('supportNew');
}
async function openTicket(id){
  const t = _support.tickets.find(x=>x.id===id); if(t) t._seen = true;
  openSheet('supportTicket', id); await loadTicketMsgs(id); if(state.sheet==='supportTicket') { render(); scrollTicketToEnd(); }
  clearInterval(_supportPoll);
  _supportPoll = setInterval(async ()=>{
    if(state.sheet!=='supportTicket' || state.sheetData!==id || document.hidden){ if(state.sheet!=='supportTicket') clearInterval(_supportPoll); return; }
    const before = (_support.msgs[id]||[]).length;
    await loadTicketMsgs(id);
    if((_support.msgs[id]||[]).length !== before) redrawTicketThread(id);
  }, 10000);
}
function ticketStatusPill(t){ return t.status==='answered' ? `<span class="status-pill ok">Replied</span>` : t.status==='closed' ? `<span class="status-pill">Closed</span>` : `<span class="status-pill wait">Open</span>`; }
function ticketRefLabel(t){ return t.orderId ? `Order #${String(t.orderId).slice(-6).toUpperCase()}` : t.bookingId ? `Booking #${String(t.bookingId).slice(-6).toUpperCase()}` : ''; }
function sheetSupport(){
  const list = _support.tickets.filter(t=>isAdminView() || t.userId===state.customerId || !sb);
  return `<h2>Live support</h2>
  <p class="muted" style="margin-bottom:12px;">Ask Maldexpress anything about an order, a payment, a delivery or your account. We reply here.</p>
  <button class="btn btn-primary" onclick="openNewTicket()">＋ New ticket</button>
  <h3 style="margin:18px 0 8px;">Your tickets</h3>

    <button class="card tight ticket-card" onclick="openTicket('${t.id}')">
      <div class="row between" style="gap:8px;"><strong>${escapeAttr(t.subject)}</strong>${ticketStatusPill(t)}</div>
      <p class="muted" style="font-size:.82em; margin-top:4px;">${SUPPORT_TOPICS[t.topic]||'Support'}${ticketRefLabel(t)?' · '+ticketRefLabel(t):''} · ${fmtDateShort(new Date(t.updatedAt).toISOString().slice(0,10))}</p>
    </button>`).join('') : `<div class="empty"><span class="ic">🎧</span>No tickets yet.</div>`}`;
}
function supportOrderChoices(){

  if(state.role==='delivery') return DB.orders.filter(o=>o.deliveryPersonId===state.activeDelId);
  return DB.orders.filter(o=>!sb || o.customerId===state.customerId);
}

  <button class="btn btn-primary" onclick="submitTicket()">Send to support</button>`;

async function submitTicket(){
  const topic = val('st_topic') || 'other', subject = val('st_subject').trim(), body = val('st_body').trim();
  const orderId = val('st_order') || null, bookingId = val('st_booking') || null;
  if(!subject){ toast('Add a subject','bad'); return; }
  if(!body){ toast('Write a message','bad'); return; }
  const id = uid('tk');
  const row = { id, user_email: state.customerEmail||null, role: state.role==='business'?'business':state.role==='delivery'?'delivery':'customer',
    business_id: state.role==='business' ? (state.activeBizId||null) : null, order_id: orderId, booking_id: bookingId, topic, subject };
  if(sb){
    const { error } = await sb.from('support_tickets').insert(row);
    if(error){ toast('Could not send: '+error.message,'bad'); return; }
    const m = await sb.from('support_messages').insert({ id: uid('sm'), ticket_id: id, body });
    if(m.error){ toast('Ticket made, but the message failed: '+m.error.message,'bad'); }
    await loadSupport();
  } else {
    _support.tickets.unshift(supRow({ ...row, user_id: state.customerId||'demo', status:'open', created_at:new Date().toISOString(), updated_at:new Date().toISOString() }));
    _support.msgs[id] = [supMsgRow({ id: uid('sm'), ticket_id:id, sender_id: state.customerId||'demo', from_admin:false, body, created_at:new Date().toISOString() })];
    _support.loaded = true;
  }
  toast('Sent. Support will reply here');
  openTicket(id);
}
async function attachmentHTML(att){
  if(!att) return '';
  let url = att.slip_url || null;
  if(!url && att.slip_enc){ try{ const out = await decryptForMe(att.slip_enc, att.slip_iv, att.slip_keys); url = out && out.url; }catch(e){} }
  if(!url) return `<p class="muted" style="font-size:.8em; margin-top:6px;">🔒 Bank slip attached. Only the store and the customer of this order can open it.</p>`;
  return `<a href="${escapeAttr(url)}" download="slip-${escapeAttr(String(att.ref||'').slice(-6))}" class="sup-slip"><img src="${escapeAttr(url)}" alt="Bank transfer slip"></a><p class="muted" style="font-size:.76em;">Tap and hold the slip to save it.</p>`;
}
function ticketThreadHTML(id){
  const msgs = _support.msgs[id];
  const t = _support.tickets.find(x=>x.id===id) || {};
  const them = ({business:'Store',delivery:'Rider',customer:'Customer'}[t.role]) || 'Customer';
  if(!msgs) return `<p class="muted">Loading…</p>`;
  return msgs.map(m=>`<div class="sup-msg ${m.fromAdmin?'them':'me'}">
      <div class="sup-who">${m.fromAdmin?'Maldexpress support':(isAdminView()?them:'You')} · ${new Date(m.createdAt).toLocaleString([], { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' })}</div>
      ${m.body ? `<div class="sup-body">${escapeAttr(m.body).replace(/\n/g,'<br>')}</div>` : ''}
      ${m.attachment ? `<div class="sup-att" data-att="${m.id}"><p class="muted" style="font-size:.8em;">Opening slip…</p></div>` : ''}
    </div>`).join('') || `<p class="muted">No messages yet.</p>`;
}
async function fillAttachments(id){
  for(const m of (_support.msgs[id]||[]).filter(m=>m.attachment)){
    const el = document.querySelector(`.sup-att[data-att="${m.id}"]`); if(el) el.innerHTML = await attachmentHTML(m.attachment);

}
function redrawTicketThread(id){ const el = document.getElementById('supThread'); if(el){ el.innerHTML = ticketThreadHTML(id); fillAttachments(id); scrollTicketToEnd(); } }
function scrollTicketToEnd(){ const el = document.getElementById('supThread'); if(el){ el.scrollTop = el.scrollHeight; } fillAttachments(state.sheetData); }
function sheetSupportTicket(){
  const id = state.sheetData; const t = _support.tickets.find(x=>x.id===id);
  if(!t) return `<h2>Ticket</h2><p class="muted">Not found.</p>`;
  const admin = isAdminView();

  <p class="muted" style="font-size:.82em; margin:4px 0 10px;">${SUPPORT_TOPICS[t.topic]||'Support'}${ticketRefLabel(t)?' · '+ticketRefLabel(t):''}${admin && t.userEmail?' · '+escapeAttr(t.userEmail):''}${admin?' · '+({business:'Store',delivery:'Rider',customer:'Customer'}[t.role]||''):''}</p>
  <div class="sup-thread" id="supThread">${ticketThreadHTML(id)}</div>
  ${t.status==='closed' ? `<p class="muted" style="margin-top:10px;">This ticket is closed.${admin?'':' Open a new one if you still need help.'}</p>` : `
  <div class="sup-reply"><textarea id="sup_reply" rows="2" maxlength="4000" placeholder="Write a reply" aria-label="Reply"></textarea><button class="btn btn-primary btn-sm" onclick="sendTicketReply('${id}')">Send</button></div>
  <div class="row" style="gap:8px; margin-top:8px; flex-wrap:wrap;">
    ${canSendSlip ? `<button class="btn btn-ghost btn-sm" onclick="supportSendSlip('${id}')">📎 Send the slip</button>` : ''}
    <button class="btn btn-ghost btn-sm" onclick="closeTicket('${id}')">${admin?'Close ticket':'Mark as solved'}</button>
  </div>`}`;
}
async function sendTicketReply(id){
  const body = val('sup_reply').trim(); if(!body) return;
  if(sb){
    const { error } = await sb.from('support_messages').insert({ id: uid('sm'), ticket_id: id, body });
    if(error){ toast('Could not send: '+error.message,'bad'); return; }
    await loadTicketMsgs(id); await loadSupport();
  } else {
    (_support.msgs[id] = _support.msgs[id]||[]).push(supMsgRow({ id: uid('sm'), ticket_id:id, sender_id:'demo', from_admin:isAdminView(), body, created_at:new Date().toISOString() }));
    const t = _support.tickets.find(x=>x.id===id); if(t){ t.status = isAdminView() ? 'answered' : 'open'; t.updatedAt = Date.now(); }
  }
  const inp = document.getElementById('sup_reply'); if(inp) inp.value = '';
  redrawTicketThread(id);
}
async function closeTicket(id){
  if(sb){ const { error } = await sb.from('support_tickets').update({ status:'closed' }).eq('id', id); if(error){ toast('Could not close: '+error.message,'bad'); return; } await loadSupport(); }
  else { const t = _support.tickets.find(x=>x.id===id); if(t) t.status = 'closed'; }
  toast('Ticket closed'); render();
}
async function supportSendSlip(id){
  if(!sb){ toast('Needs the live server'); return; }
  toast('Sending the slip…');
  try{
    const { data, error } = await sb.functions.invoke('support-send-slip', { body:{ ticket_id:id } });
    let msg = error ? error.message : (data && data.error);
    if(error){ try{ const b = error.context && await error.context.json(); if(b && b.error) msg = b.error; }catch(e){} }
    if(msg){ toast(msg,'bad'); return; }
  }catch(e){ toast('Could not send: '+(e.message||e),'bad'); return; }
  await loadTicketMsgs(id); await loadSupport(); redrawTicketThread(id); toast('Slip sent to the ticket');
}
function isAdminView(){ return !!(typeof isAdminMode === 'function' ? isAdminMode() : state.adminMode); }


/* =================== BANK ACCOUNTS (stores + riders) =================== */
// Stores and riders must give a bank account before doing anything on the app,
// so payments to each other go straight to an account: the store pays riders'
// delivery fees to the rider's account and Maldexpress's fees to Maldexpress.
// Riders never collect cash, so they never owe a store anything.
// Riders' accounts are in rider_bank_accounts (readable by the rider, admins,
// and stores the rider has delivered for), not on the public rider row.
DB.riderBanks = DB.riderBanks || {};
async function loadRiderBanks(){
  if(!sb) return;
  const { data, error } = await sb.from('rider_bank_accounts').select('*');
  if(!error) DB.riderBanks = Object.fromEntries((data||[]).map(r=>[r.rider_id, { accountName:r.account_name, accountNumber:r.account_number, bankName:r.bank_name||'' }]));
}
function bizHasBank(b){ return !!(b && String(b.accountNumber||'').trim() && String(b.accountName||'').trim()); }
function riderHasBank(d){ const a = d && (DB.riderBanks||{})[d.id]; return !!(a && String(a.accountNumber||'').trim() && String(a.accountName||'').trim()); }
function bankFieldsHTML(prefix, acc){
  acc = acc || {};
  return `<div class="field"><label for="${prefix}_accname">Account name</label><input id="${prefix}_accname" value="${escapeAttr(acc.accountName||'')}" placeholder="Name on the bank account" autocomplete="name"></div>
  <div class="field"><label for="${prefix}_acc">Account number</label><input id="${prefix}_acc" inputmode="numeric" value="${escapeAttr(acc.accountNumber||'')}" placeholder="e.g. 7730000123456"></div>
  <div class="field"><label for="${prefix}_bank">Bank</label><select id="${prefix}_bank">${['Bank of Maldives','Maldives Islamic Bank','State Bank of India','Commercial Bank of Maldives','HSBC','Mauritius Commercial Bank','Habib Bank','Other'].map(b=>`<option ${acc.bankName===b?'selected':''}>${b}</option>`).join('')}</select></div>`;
}
function readBankFields(prefix){
  const accountName = val(prefix+'_accname').trim(), accountNumber = val(prefix+'_acc').replace(/\s+/g,'').trim(), bankName = val(prefix+'_bank');
  if(accountName.length < 2){ toast('Enter the name on the bank account','bad'); return null; }
  if(!/^[0-9-]{6,30}$/.test(accountNumber)){ toast('Enter a valid account number (digits only)','bad'); return null; }
  return { accountName, accountNumber, bankName };
}
async function saveRiderBank(d, acc){
  if(sb){
    const { error } = await sb.from('rider_bank_accounts').upsert({ rider_id:d.id, account_name:acc.accountName, account_number:acc.accountNumber, bank_name:acc.bankName||null });
    if(error){ toast('Could not save the bank account: '+error.message,'bad'); return false; }
  }
  (DB.riderBanks = DB.riderBanks || {})[d.id] = { ...acc }; return true;
}
function bankNeededCardHTML(who){

    <p class="muted" style="font-size:.85em; margin-top:4px;">${who==='rider' ? 'Stores pay your delivery fees straight to this account. You can take jobs once it is added.' : 'Customers pay you and you pay riders using bank accounts. You can add items and take orders once it is added.'}</p>
    <button class="btn btn-primary btn-sm" style="margin-top:10px;" onclick="openSheet('${who==='rider'?'delSettings':'bizSettings'}')">Add bank account</button></div></div></div>`;

function requireRiderBank(){ const d = currentDel(); if(riderHasBank(d) || !sb) return true; toast('Add your bank account first','bad'); openSheet('delSettings'); return false; }

/* =================== OPENING AD =================== */
// Full-screen picture or video shown to everyone each time the app opens
// (Admin -> Settings -> Opening ad): adSeconds long (10), skippable after
// adSkipAfter (5). It lives outside #app so render() never touches it, and
// it's never shown in the admin portal.
let _adShown = false;
async function maybeShowOpeningAd(){
  if(_adShown || state.adminMode || !sb) return;
  try{
    const { data } = await sb.from('platform_settings').select('ad_enabled,ad_media_url,ad_media_type,ad_link,ad_seconds,ad_skip_after').eq('id',1).maybeSingle();
    if(!data || !data.ad_enabled || !data.ad_media_url) return;
    Object.assign(DB.settings, { adEnabled:true, adMediaUrl:data.ad_media_url, adMediaType:data.ad_media_type==='video'?'video':'image', adLink:data.ad_link||'', adSeconds:data.ad_seconds||10, adSkipAfter:data.ad_skip_after!=null?data.ad_skip_after:5 });
    showOpeningAd(false);
  }catch(e){ /* no ad if it can't load */ }
}
function showOpeningAd(preview){
  const st = DB.settings; const url = preview ? _adDraft.url : st.adMediaUrl; const type = preview ? _adDraft.type : st.adMediaType;
  if(!url) return;
  _adShown = true;
  const total = st.adSeconds||10, skipAt = st.adSkipAfter!=null ? st.adSkipAfter : 5;
  const link = preview ? (val('set_ad_link')||'').trim() : st.adLink;
  const el = document.createElement('div'); el.className = 'open-ad'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Advertisement');
  el.innerHTML = `${type==='video' ? `<video class="open-ad-media" src="${escapeAttr(url)}" autoplay muted playsinline loop></video>` : `<img class="open-ad-media" src="${escapeAttr(url)}" alt="Advertisement">`}
    <div class="open-ad-bar"><span class="open-ad-tag">Ad</span><button class="open-ad-skip" disabled>Skip in ${skipAt}</button></div>
    <div class="open-ad-progress"><span></span></div>
    ${link ? `<a class="open-ad-cta" href="${escapeAttr(link)}" target="_blank" rel="noopener">Learn more ›</a>` : ''}`;
  document.body.appendChild(el);
  const skip = el.querySelector('.open-ad-skip'), bar = el.querySelector('.open-ad-progress span'), media = el.querySelector('.open-ad-media');
  let started = false, t0 = 0, timer = null;
  const close = ()=>{ clearInterval(timer); el.classList.add('out'); setTimeout(()=>el.remove(), 250); };
  const tick = ()=>{
    const s = (Date.now()-t0)/1000;
    bar.style.width = Math.min(100, s/total*100)+'%';
    const left = Math.ceil(skipAt - s);
    if(left > 0){ skip.textContent = `Skip in ${left}`; skip.disabled = true; } else { skip.textContent = 'Skip ✕'; skip.disabled = false; }
    if(s >= total) close();
  };
  const start = ()=>{ if(started) return; started = true; t0 = Date.now(); tick(); timer = setInterval(tick, 200); };
  skip.onclick = ()=>{ if(!skip.disabled) close(); };
  media.addEventListener(type==='video' ? 'playing' : 'load', start, { once:true });
  media.addEventListener('error', close, { once:true });
  setTimeout(start, 3000);   // slow network: start the clock anyway
  if(media.complete) start();
}



/* =================== SHARING =================== */
// Every item and store has its own link: <app>/?item=<id> or ?store=<id>.
// Opening it goes straight to that page (applyDeepLink() on startup). The Share
// panel offers the phone's own share menu (Instagram, Snapchat, … whatever is
// installed) plus direct WhatsApp / Viber / Telegram / Facebook / Messenger /
// X / Email buttons and Copy link.
const APP_URL = location.origin + location.pathname;
function shareLink(kind, id){ return `${APP_URL}?${kind}=${encodeURIComponent(id)}`; }
function applyDeepLink(){
  if(state.adminMode) return;
  const q = new URLSearchParams(location.search);
  const itemId = q.get('item'), storeId = q.get('store');
  if(!itemId && !storeId) return;
  history.replaceState(null, '', APP_URL);   // don't reopen it on every reload
  if(itemId){
    const it = DB.items.find(i=>i.id===itemId && isApprovedItem(i));
    if(it){ state.role = 'customer'; state.screen = 'custHome'; openItemDetail(it.id); return; }
    toast('That item is no longer listed','bad');
  }
  if(storeId){
    const b = DB.businesses.find(x=>x.id===storeId);
    if(b){ state.role = 'customer'; go('custStore', { browseBizId:b.id, storeTab:'buyNow' }); return; }
    toast('That store is no longer on Maldexpress','bad');
  }
}
function shareData(kind, id){
  if(kind==='item'){
    const it = DB.items.find(i=>i.id===id); if(!it) return null;
    const biz = DB.businesses.find(b=>b.id===it.businessId);
    const price = it.listingType==='auction' ? 'Auction' : it.listingType==='rental' ? itemPriceLine(it) : money(effectivePrice(it));
    return { title: it.name, text: `${it.name} · ${price}${biz?` at ${biz.name}`:''} on Maldexpress`, url: shareLink('item', id), image: itemImages(it)[0] || '' };
  }
  const b = DB.businesses.find(x=>x.id===id); if(!b) return null;
  const n = DB.items.filter(i=>i.businessId===b.id && isApprovedItem(i)).length;
  return { title: b.name, text: `Shop ${b.name} on Maldexpress${n?` · ${n} item${n===1?'':'s'}`:''}${b.island?` · ${bizIsland(b)}`:''}`, url: shareLink('store', id), image: '' };
}
let _shareTarget = null;
function openShare(kind, id){ _shareTarget = { kind, id }; openSheet('share'); }
function sheetShare(){
  const d = _shareTarget && shareData(_shareTarget.kind, _shareTarget.id);
  if(!d) return `<h2>Share</h2><p class="muted">Nothing to share.</p>`;
  const u = encodeURIComponent(d.url), t = encodeURIComponent(d.text), both = encodeURIComponent(d.text + ' ' + d.url);
  const opts = [
    ['WhatsApp','#25D366','https://wa.me/?text='+both,brandIcon('whatsapp')],
    ['Viber','#7360F2','viber://forward?text='+both,brandIcon('viber')],
    ['Telegram','#229ED9',`https://t.me/share/url?url=${u}&text=${t}`,brandIcon('telegram')],
    ['Facebook','#1877F2','https://www.facebook.com/sharer/sharer.php?u='+u,brandIcon('facebook')],
    ['Messenger','#0A7CFF','fb-messenger://share/?link='+u,brandIcon('messenger')],
    ['X','#111111',`https://twitter.com/intent/tweet?text=${t}&url=${u}`,brandIcon('x')],
    ['Email','#0E7C86',`mailto:?subject=${encodeURIComponent(d.title)}&body=${both}`,ICON_MAIL],
  ];
  return `<h2>Share ${_shareTarget.kind==='item'?'this item':'this store'}</h2>

  ${navigator.share ? `<button class="btn btn-primary" style="margin-bottom:12px;" onclick="nativeShare()">📤 Share to any app (Instagram, Snapchat, …)</button>` : ''}
